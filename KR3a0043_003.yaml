body:
  text: 近思録集注卷三歸安茅星來撰格物窮理自此以後則細論條日工夫而此一篇乃大學致知格物也自首卷所論隂陽性命以至末卷聖賢氣象皆物也皆其所當格未者也而此卷則其格之之法漢唐諸儒惟於此明曉所以修己治人多不得其道韓文公原道引大學之言獨不及致知格物歷漢唐宋明賢君良相時有而二帝三王之道未嘗一日行於天地之間以此故也此篇乃明善之要四卷五卷則誠身之本朱子于大學章句所謂在初學尤為當務之急而不可以其近而忽之者也葉氏曰自首條至二十二條總論致知之方致知莫大于讀書二十三條至三十三條總論讀書之法三十四條以後乃分論讀書之法而以書之先後為序凡七十八條伊川先生答朱長文書曰心通乎道然後能辨是非如持權衡以較輕重孟子所謂知言是也通道如所謂豁然貫通全體大用無不明是也格物然後有以通乎道而辨是非心不通乎道而較古人之是非猶不持權衡而酌輕重竭其目力勞其心智雖使時中亦古人所謂億則屢中君子不貴也乎吕本作於中並去聲文集下同云此申明上節之意時中謂有時而中也按長文來書上能捰古先之陳迹綜羣言之是非欲其心通默識固未能也故伊川以通與不通之得失告之伊川先生答門人曰孔孟之門豈皆賢哲固多衆人以衆人觀聖賢弗識者多矣惟其不敢信己而信其師是故求而後得今諸君於頥言才不合則置不復思所以終異也不可便放下更且思之致知之方也復扶又反諸曰門人者非一人之詞也觀下言君可見朱子曰學者未能有得當謹守聖賢訓戒以為根基如程子所謂不敢信己而信其師者始有寄足之地不然則飄搖沒溺終不能有以自立也愚按學者不得聖賢為師則程朱所言具在潛思靜玩久自有得伊川先生答橫渠先生曰所論大槩有苦心極力之象而無寬裕溫厚之氣非明睿所照而考索至此故意屢偏而言多窒小出入時有之本注明所照者如目所睹纎微盡識之矣考索至者如揣料於物約見髣佛耳能無差乎厚一作和本注下葉本有云夫二字川朱子曰如正蒙所論道體覺得源頭有未是處故伊云過處在正蒙如云由氣化有道之名説得是好終是生受辛苦又如太和太虛云者止是説氣説聚散處其流乃是箇大輪回蓋其思慮考索所至非性分自然之知更願完養思慮涵泳義理他日自當條暢完養思慮則明睿自生涵泳義理則非考索所至上言不思所以不合此下兩條又言思貴優遊涵泳使之自得不可強探力索以自苦也欲知得與不得於心氣上驗之思慮有得中心悅豫沛然有裕者實得也思慮有得心氣勞耗者實未得也強揣度耳強區兩反度待洛反實得者深造以道自然而得之于己也強揣度者乃其強探力索而得之者也蓋不免正助之病嘗有人言比因學道思慮心虛曰人之血氣固有虛實疾病之來聖賢所不免然未聞自古聖賢因學而致心疾者比音祕同遺書下嘗此因上言心氣有寬裕勞耗之不同而類記之也蓋有人言于程子而程子語之如此比近也心五臟之一也與他處解作神明主宰者不同學道思慮心虛者言因學道而思慮以至心虛也血氣平和則無疾虛是不足之疾實是有餘之疾心疾即心虛也心過用則虛虛則成疾故曰心疾今日雜信鬼怪異説者只是不先燭理若於事上一一理會則有甚盡期須只於學上理會事即指鬼怪異説而言蓋若於鬼怪異説一一理會則其事變幻百出而未有窮惟學則理明而鬼怪異説自不足以惑之矣朱子曰神怪之説學者未能遽明惟當以正自守而窮理之有無久久當自見得為朱子曰如玄武北方之宿避聖祖諱改作真今乃以真聖而作真龜蛇子下又增天蓬天猷及翊聖真君作四聖世之所謂鬼神載在祀典者皆此類也顧氏曰鬼神之説半是文士寓言以資諧謔而後人往往附會成真甚有如小孤山訛為小姑杜拾遺訛為十姨諸如此類不可枚舉唐宋時但言靈應即加封號而今且必求其人以實之也荒唐不經甚矣學原於思不思則雖欲為學無所從入故曰學原于思一朱子曰學者于敬上未有用力處且自思入思之字于學者最有力伊川先生曰所謂日月至焉與久而不息者所見規模雖略相似其意味氣象逈别須潛心默識玩索久之庶幾自得迥戶頂反俗作􅒯非象迥説文逺也意味以中之所蘊者言氣以外之所見者言學者不學聖人則己欲學之須熟玩味聖人之氣象不可只於名上理會如此只是講論文字上意味氣象並言而此只言氣象者蓋意味只于氣象上見故不别言只于名上理會者如訓詁之學是已問忠信進德之事固可勉強然致知甚難伊川先生曰學者固當勉強然須是知了方行得若不知只是覻却堯學他行事無堯許多聰明睿知怎生得如他動容周旋中禮強並區兩反下同覻音娶理問動容周旋未能中禮於應事接物之間未免有礙處如何朱子曰只此便是學但能于應酬之頃一一點檢使合于禮久之自能中禮也如子所言是篤信而固守之非固有之也未致知便欲誠意是躐等也勉強行者安能持久此就問者之言而辨之也誠意即忠信未能致知而欲勉強忠信以進其德則非有以實見其為必然而不容已故不能以持久雖朱子曰非謂未致知時意不用誠但知未至欲誠意其道無由耳除非燭理明自然樂循理性本善循理而行是順理事本亦不難但為人不知旋安排著便道難也樂音洛為去聲正除非反決辭若言之如云惟有如此也性本善以下申明燭理明自然樂循理之意不知者未致知也安排者勉強行也雞則不能持久矣獵朱子曰學者不向自己分上精思熟察而徒務為涉書史通曉世故之學又程子所謂玩物喪志者不可以不知也知有多少般數煞有深淺學者須是真知才知得是便泰然行將去也般班通用宋廣韻以煞為殺字之俗人語録中時用之似又借以為極至之義蓋亦如這字之誤耳真知謂知之深也泰然從容自在之貌朱子曰大學知至之至舊作盡字説今見得當作切至之至知之者切然後貫通得誠意意如程子所謂真知是也又曰所以未能真知者緣於道理上只就外靣理會得許多却未嘗于裏靣十分理會故也某年二十時解釋經義與今無異然思今日覺得意味與少時自别少去聲不稱某者以出門人紀録敢名其師也後倣此凡一物上有一理須是窮致其理窮理亦多端或讀書講明義理或論古今人物别其是非或應接事物而處其當皆窮理也别彼列反處上聲當去聲則陳氏曰初學窮理工夫須先就聖賢言語實處為準隨章逐句虛心詳玩果實有得則是非邪正大分已明而胸中權度稍定然後次而及于論古今人物以相參質最其後乃及于應接事物更相證訂方不至差謬程子之言其有序矣或問格物須物物格之還只格一物而萬理皆知曰怎得便會貫通若只格一物便通衆理雖顔子亦不敢如此道須是今日格一件明日又格一件積習既多然後脫然自有貫通處本注又曰所務於窮理者非道盡窮了天下萬物之理又不道是窮得一理便到只要積纍多後自然見去又曰所務下葉木大字無本注字朱子曰一日一件者格物工夫次第也脫然貫通者知至效驗極致也又曰積習多使是學之博貫通處便是約不是貫通後又去裏靣尋討約今人務博者却要盡窮天下之理務約者又謂反身而誠則天下之理無不在我皆非也惟程子積纍貫通之説為妙為朱子曰古人自小學中涵養成就所以大學以格物先今學者從前無此工夫而但欲於思慮知識求之更不于操存處用力縱使窮理到極處亦無實地可據蓋敬字徹上徹下格物致知乃其間節次進步處耳思曰睿思慮久後睿自然生若於一事上思未得且别換一事思之不可專守著這一事蓋人之知識於這裏蔽著雖強思亦不通也問延平遇一事當就此事反覆推尋以究其理待此一事融釋脫落然後再窮一事之説與伊川説如何朱子曰程子之意誠善然窮一事未透又便别窮一事不得彼謂有甚不通者不得已而如此耳不可便執此説容易改換却致工夫不専一也問人有志於學然知識蔽固力量不至則如之何曰只是致知若智識明則力量自進問觀物察己還因見物反求諸身否曰不必如此説物我一理才明彼即曉此此合內外之道也朱子曰于此一物上窮得一分之理即我之知亦致得一分于物之理窮二分即我之知亦致得二分于物之理窮得愈多則我之知愈廣其實只是一理才明彼即曉此故大學曰致知在格物而不曰欲致其知者先格其物蓋致知便在格物中非格之外别有致處也張氏曰或謂以吾心之理推之事事物物則是事物與吾心有二理非合內外之道矣又問致知先求之四端如何曰求之情性固是切於身然一草一木皆有理須是察本注又曰自一身之中以至萬物之理但理會得多相次自然豁然有覺處又曰自一身之中下葉本大字無本注字相次葉本作胸次誤夏相次者漸次之意朱子曰草木皆有理者如周禮仲斬陽木仲冬斬隂木知得此理處之而各得其當便是又如鳥獸之情莫不好生而惡殺便須見生不忍見死聞聲不忍食肉非其時不伐一木不殺一獸胎不夭不覆巢推此類可見又曰此亦程子因人専欲求之四端故教以一草一木亦皆有理然亦須有緩急先後之序若不窮天理明人倫講聖言通世故乃兀然存心一草木一器用之間此是何學問如此而望有所得是炊沙而欲成飯也思曰睿睿作聖致思如掘井初有渾水久後稍引動得清者出來人思慮始皆溷濁久自明快睿旨鋭溷呼困反曰思曰睿二語見周書洪範篇渾溷皆濁也薜氏思索太苦而無節則心反為之動而神氣不清故凡讀書思索之久覺有倦意當斂襟正坐澄定此心少時再加思索則心清而義理自見伊以上並川語問如何是近思此鄭亨仲問也曰以類而推近思説見論語朱子曰以類而推者如修身推之而齊家齊家推之而治國親親推之而仁民仁民推之而愛物之類只是從易曉者推將去一步又一步若逺去尋討則不切於己又曰自無穿窬之心推之以至于不言餂之類自無欲害人之心推之以至于一夫不得其所若撻于市之類至如一飯以奉親至于保四海通神明皆此心也又曰程子説得推字極好學者先要會疑朱子曰讀書逐句逐字要見著實若用工粗鹵不務精思只道無可疑處非無可疑理會未到不知有疑耳又曰書始讀未知有疑其次漸有疑又其次節節有疑過此一畨後疑漸漸釋以至融會貫通都無可疑方始是學又曰聖人之不憤不啓須是教之疑到無可解釋處方始與説彼便通透并從前所疑慮處亦每因此觸發蓋工夫都在許多思慮不透處也按此條見外書時氏本拾遺列遺書誤橫渠先生答范巽之曰所訪物怪神姦此非難語顧語未必信耳物怪如石言于晉之類神姦如伯有為厲之類孟子所謂知性知天學至於知天則物所從出當源源自見知所從出則物之當有當無莫不心諭亦不待語而後知謂吕葉本並作論諸公所論但守之不失不為異端所劫進進不已則物怪不須辨異端不必攻不逾期年吾道勝矣期音基生諸公所論如孔孟之言是也子問橫渠此書先提出守之不失一句何也朱曰且當守此定者如孔子言精氣為物遊魂為變與非其鬼而祭之諂也敬鬼神而逺之等語皆是定者其他如伯有為厲之類則其變也若欲委之無窮付之以不可知則學為疑撓智為物昏交來無間卒無以自存而溺於怪妄必矣間去聲怪文集下同疑疑謂為異端之説所惑也物即指物神姦而言撓物昏謂為疑所撓物所昏也子貢謂夫子之言性與天道不可得而聞既言夫子之言則是居常語之矣聖門學者以仁為己任不以苟知為得必以了悟為聞因有是説説見論語此引子貢之言而釋之以見其所謂不可得聞者如此如夫子一貫之言門人皆與聞也而唯曽子能以忠恕明之則曾子得聞他人不可得而聞矣又如孔門問仁者多矣而唯顔淵仲弓請事斯語則二子得聞他人不可得而聞矣推此類觀之可見以仁為己仕者非有以知之明而信之篤者不能也故必了悟而後可以為聞不然則口耳之末而已濟得甚事按此條今見語録義理之學亦須深沈方有造非淺易輕浮之可得也沈一本作玩易音異看朱子曰聖人言語一重又一重須入深處方有得若只見皮膚便有差錯李氏曰學問須深潛縝密然後蹊徑不差釋氏所謂一超直入如來地其失處正坐此不可不辨學不能推究事理只是心粗至如顔子未至於聖人處猶是心粗粗經傳通作粗便朱子曰顔子比之衆人純粹比之孔子粗如有不善未嘗不知知之未嘗復行是他細膩如此然猶有此不善處便是粗伊川説未能不勉而中不思而得便是過一段甚好又曰聖人言語磨稜合縫滴水不漏如言以德報怨一言興邦之類無不子細孟子説得便粗如今之樂猶古之樂公劉太王好貨好色之類故橫渠説孟子比聖人自是粗博學於文者只要得習坎心亨蓋人經歷險阻艱難然後其心亨通下上坎為習坎卦當重險而彖辭曰維心亨朱子曰文如應事接物之類皆是但以事理切磨講究自是心亨如讀書每思索不通處處窒礙而其間須有一路可通只此便是許多艱難險阻習之可以求通通處便是亨也又曰理會道理到衆説紛然處却好定著精神看義理有疑則濯去舊見以來新意舊見凡舊人之見與自己舊時之所見皆是學者于舊見有未安安若更苦用思索費力愈多而于本文之意轉加蒙晦故當一切濯而去之但就經文虛心涵泳令其本意了然心目之間無少差誤然後回視舊所見處自有以見其得失之所在而豁然無復窒礙矣知按葉氏謂此條及焞到問為學之方一條乃總論致泉州本繫卷末為非是因定從舊本而添入心中有所開數語然則此條惟有此二語心中有所開以下則葉氏所添入也今據宋本及楊氏本正之朱子曰學者觀書病在只要向前不肯退步看愈向前愈看得不分曉不若退步却看得審大槩病在執著不肯放下一是主私意一是舊有先入之説雖欲擺脫亦被他自來相尋橫渠謂濯去舊見以來新意甚好凡致思到説不得處始復審思明辨乃為善學也若告子則到説不得處遂己更不復求復扶又反求孟子説者葉氏曰以上總論致知之方以下乃專論之于書愚按橫渠學問于苦心極力中得來故往往于難著力處不肯放過如所云到峭峻之處要剛決果敢以進經歷險阻艱難然後其心亨通此又云到説不得處始復審思明辨皆是如此蓋此關一過乃可深造自得耳以上並橫渠語伊川先生曰凡看文字先須曉其文義然後可求其意未有文義不曉而見意者也遺書下同也文義文之義學者要自得六經浩渺乍來難盡曉且見得路徑後各自立得一箇門庭歸而求之可矣立得下别本無一字此周伯溫見程子而程子語之以問門庭豈容各立朱子曰此説讀六經只要從師講問識得如何下工夫便是立得門庭却歸去依此實下工夫便是歸而求之凡解文字但易其心自見理理只是人理甚分明如一條平坦砥道路詩曰周道如砥其直如矢此之謂也易音異砥諸氏反孟子引詩作底明理只是人理言只是人人所共具之理也甚分言易見也詩小雅大東之篇句朱子曰學者讀書只除却自己私意逐字逐平心體會久久自然有得或曰聖人之言恐不可以淺近看他按遺書程子因上文所言而及隨象君子嚮晦入宴息之説以謂解者多作遵養時晦之晦或問作甚晦字曰此只是隨時之大者嚮晦則宴息也更别有甚義故或人疑以為淺近也曰聖人之言自有近處自有深逺處如近處怎生強要鑿教深逺得強如字教平聲鑿穿鑿也揚子曰聖人之言逺如天賢人之言近如地頥與改之曰聖人之言其逺如天其近如地揚子名雄字子雲為漢光祿卿聖人之言逺如天二語見法言五百篇此又以見聖人之言雖極淺近處却自包含無窮固不必鑿之教深逺也如夫子告子路修己以敬而極其至堯舜有所不能盡語樊遲以愛人知人而極其至舜與湯治天下之道有所不能外程子所謂他人之語語近則遺逺語逺則不知近惟聖人之言則逺近皆盡推此類可見學者不泥文義者又全背却逺去理會文義者又滯泥不通泥文義上宋本有必字遺書無如子濯孺子為將之事孟子只取其不背師之意人須就上靣理會事君之道如何也又如萬章問舜完廪浚井事孟子只答他大意人須要理會浚井如何出得來完廪又怎生下得來將去聲萬上楊本無如字者二段皆以申明上文理會文義又滯泥不通之意若此之學徒費心力朱子曰讀書専留意小處失其本領所在最不可凡觀書不可以相類泥其義不爾則字字相梗當觀其文勢上下之意如充實之謂美與詩之美不同葉氏曰充實之美在己詩之美在人故曰不同仁朱子曰如楊子于仁也柔于義也剛到易又以剛配以柔配義孟子學不厭知也教不倦仁也到中庸又以成己為仁成物為知此等須各隨本文意看便自不相礙薛敬軒曰古人文字以數十年傳寫豈無一字磨錯必欲字字釋其義難矣朱子謂釋其可通者闕其不可通者又不可以不知也美按此條橫渠易説語録中並有之但詩之上多一言字美下多輕重二字問瑩中嘗愛文中子或問學易子曰終日乾乾可也此語最盡文王所以聖亦只是箇不已瑩中陳氏名瓘宋南劍州沙縣人神宗朝進士為諫官後諡忠肅文中子王氏名通字仲淹隋末不仕教授于河汾其弟凝子福郊福時敘其議論增益為書名曰中説終日乾乾易乾卦九三爻辭文中子以為學易之道無過于此而以之答繁師玄之問者也見中説周公篇此語最盡以下乃瑩中贊文中子之言先生曰凡説經義如只管節節推上去可知是盡夫終日乾乾未盡得易據此一句只做得九三使若謂乾乾是不已不已又是道漸漸推去自然是盡只是理不如此自然上宋本有則字楊同以乾乾是不已至自然是盡所申明節節推上去可知是盡之意只是理不如此所以結終日乾乾未盡得易數句之意朱子曰嘗見學者説詩問他關雎篇于其訓詁名物都未曉便説樂而不淫哀而不傷因言此八字更添思無邪三字便了却一部毛詩其他三百篇皆成渣滓矣沈元用問和靖易傳何處切要尹氏舉體用一源顯微無間八字李先生曰尹説固好然須看得六十四卦三百八十四爻都有下落方始説得此語若學者未曾仔細理會便與他如此説豈不誤他愚聞之竦然自此讀書愈加詳細子在川上曰逝者如斯夫言道之體如此這裏須是自見得道之體體字猶云體質與體用體字别能自見得則無時無處而非道體之所在也下朱子曰道本無體但因此可以見道之體耳又曰天之物皆道之體只是水上較親切易見張繹曰此便是無窮先生曰固是道無窮然怎生一箇無窮便道了得他道並去聲無道言也朱子曰固是窮須見得所以無窮處始得又曰只為張氏道得不親切故云然今人不會讀書如誦詩三百授之以政不達使於四方不能専對雖多亦奚以為須是未讀詩時不達於政不能専對既讀詩後便達於政能專對四方始是讀詩人而不為周南召南其猶正牆面須是未讀詩時如面牆到讀了後便不靣牆方是有驗説並見論語書馮厚齋曰讀書必明其理明理必達之用讀不明其理記誦之末學也明理不達之用章句之腐儒也大抵讀書只此便是法如讀論語舊時未讀是這箇人及讀了後來又只是這箇人便是不曾讀也朱子曰讀了依舊是這箇人蓋因不曾得他裡靣意思書自是書與自已身心無干又曰如口裏讀思無邪心裏却胡思亂想此便是不曾讀又如書説九德禮説九容處皆是凡看文字如七年一世百年之事皆當思其如何作為乃有益以上並伊川語語或以善人教民七年亦可以即戎為間而先生以此之也葉氏曰凡觀聖賢治效遲速淺深之殊要必究其規模之略施為之方乃于已有益此看文字之法也朱子曰如古人謂三十年制國用則有九年之食至孔疏則推測那三十年果可以有九年食處料得七年一世百年之類亦如此凡解經不同無害但緊要處不可不同耳外書下同道緊要處如道體之大求之方學術之邪正得失係焉故不可不同焞初到問為學之方先生曰公要知為學須是讀書書不必多看要知其約多看而不知其約書肆耳焞他昆反不焞尹和靖先生名也楊子法言云好書而要諸仲尼書肆也朱子曰如今日看得一板且看半板將那精力來更看前半板直須看得古人意思出方為知其約也頥緣少時讀書貪多如今多忘了須是將聖人言語玩味入心記著然後力去行之自有所得少去聲去玩味聖人言語不能力行之雖讀盡古人之書入心記著終身不忘總與自家身心無干然不能玩味聖人言語入心記著則雖有所為亦私意苟且而已胡敬齋曰讀書一邊讀一邊便要去做做得一兩處到身上來然後諸處亦漸湊得來久則盡湊得到身上來始為不枉用功耳黃朱子曰古人書皆用竹簡除非大段有力人方做得霸在獄中從夏侯勝受尚書凡再踰冬而後傳蓋古人無本子除非首尾熟背得方得東坡作李氏藏書記其時書猶自難得朝以道嘗欲得公榖傳遍求無之後得一本方傳寫得今書皆有印本寫亦厭煩所以讀書苟簡葉氏曰以上總論讀書之法以下乃分論讀書之法愚按今本外書無此條初學入德之門無如大學其他莫如語孟遺書下同答唐棣初見先生問初學如何而先生之以此朱子曰先讀大學可見古人為學首末次第就此立定架子然後以他書填補教著實蓋他書皆雜説在裏許通得大學後方見得此是格物致知事此是正心誠意事此是修身事此是齊家治國平天下事又曰不先乎大學無以提挈綱領而盡語孟之精微不參之語孟無以融會貫通而極中庸之歸趣愚按後來如西山真氏大學衍義便是朱子所謂就大學立定架子以他書填補教著實者也其所以不及治國平天下者以前此致知格物中于治平實政已都講明故此只須舉而措之不消更出也又人君所患在無修身齊家以上工夫如果能窮理正心以齊其家不患不行先王之道也故真氏獨詳齊家以上者以此學者須先讀語孟窮得語孟自有要約處以此觀他經甚省力語孟如丈尺權衡相似以此去量度事物自然見得長短輕重須先遺書作先須省所井反度待洛反朱此因門人問聖人之經旨如何窮得而以此告之也子曰先讀語孟然後觀他書則如明鏡在此而妍媸不可逃不然則胸中無一箇權衡多為所惑讀論語者但將諸弟子問處便作已問將聖人答處便作今日耳聞自然有得若能於論孟中深求玩味將來涵養成甚生氣質周伯溫問學者如何可以有所得而程子告之以此甚生猶怎生也洛中語陳定宇曰謂愚者明柔者強生出好氣質也亦通却朱子曰孔門問答曾子聞得底話顔子未必與聞今合在論語一書後世學者豈不幸事但患自家不去用心凡看語孟且須熟玩味將聖人之言語切己不可只作一場話説人只看得此二書切己終身儘多也儘子忍反古通用盡猶玩味方得聖人意思切己則於身心有益儘極也足也朱子曰切己就日用常行中著衣吃飯事親從兄盡是學問做輔慶源曰切己體察則一日當有一日之功若欲只一場詁説則是口耳之學矣王伯厚曰吕成公讀論語躬自厚而薄責於人遂終身無暴怒袁潔齋見象山讀康誥有感悟反已切責若無所容前輩切已省察如此論語有讀了後全無事者有讀了後其中得一兩句喜者有讀了後知好之者有讀了後不知手之舞之足之蹈之者好去聲二朱子曰有得一句喜者此一二句喜處便是入頭處從此著實理會去將久自解倐然悟時聖賢格言自是句句好學者當以論語孟子為本論語孟子既治則六經可不治而明矣陳定宇曰語孟既治學正識精由是而治六經根本正而易為力矣非謂真可不必治而自明也讀書者當觀聖人所以作經之意與聖人所以用心與聖人所以至聖人而吾之所以未至者所以未得者未至以行言未得以知言求朱子曰此段程子説讀書最為親切今人只因不曾聖賢之意才拈得些小便把自己意硬放入裏靣所以愈求而愈逺也句句而求之晝誦而味之中夜而思之平其心易其氣闕其疑則聖人之意見矣朱子曰平其心只是放教虛平易其氣只是放教寬慢闕其疑只是莫去穿鑿今人多要硬捉教住如何得以上並伊川語讀論語孟子而不知道所謂雖多亦奚以為朱子曰知道是方理會得為人之道從此實下工夫更有多少事但到此地所見不差真有廣居可居正位可立大道可行向上自然有進步處耳論語孟子只剩讀著便自意足學者須是玩味若以語言解著意便不足某始作此二書文字既而思之又似剩只有些先儒錯會處却待與整理過剩時正反些思計反讀外書下同則吳氏曰剩餘也猶言多也虛心涵泳多而玩味之覺得聖賢言語意味深長若只以語言解著恐于聖賢言外之意不能包括無遺也所以意便不足問且將語孟緊要處看如何伊川曰固是好然若有得終不浹洽蓋吾道非如釋氏一見了便從空寂去朱子曰此程子答吕晉伯問後來晉伯終身坐此病説得孤單入禪學去學者讀書須逐一去理會使周匝通貫無些窒礙方有進益輔慶源曰人才只將二書緊要處看便只是要求近功速效與天理已不相似所謂固是好者蓋姑取其向學求道之意耳正使其有近功速效亦必至于偏枯蹇澀豈復有優遊厭飫貫通浹洽之意興於詩者吟咏性情涵暢道德之中而歆動之有吾與點之氣象本注又曰興於詩是興起人善意汪洋浩大皆是此意性情宋本作情性點下一本有也字又曰興於詩下葉水大字無本注字朱子曰善可為法惡可為戒則他經皆然獨以為興於詩者以詩自有感發人處故也今讀之無所感發者正是為諸儒注解局定興起人善意不得遊氏曰興起善意如觀天保之詩則君臣之義修矣觀棠棣之詩則兄弟之愛篤矣觀伐木之詩則朋友之交親矣觀關雎鵲巢之詩則夫婦之經正矣晉王裒有至性而弟子至於廢講蓼莪則詩之興發善心於此可見矣髙鄭漁仲曰詩自齊魯毛韓四家各為序訓而以説相漢又立之學宫以義理相授遂使聲歌之學日微曹操平劉表得漢雅樂郎杜夔夔老矣久不肄習所得於三百篇者惟鹿鳴騶虞伐檀文王四篇而已餘聲不傳太和末又失其三左延年所得惟鹿鳴一笙每正旦大會太尉奉璧羣臣行禮東廂雅樂常作者是也至晉而鹿鳴一篇又無傳矣又曰得詩而得聲者三百篇則繫于風雅頌得詩而不得聲者置之謂之逸詩如河水祈招之類無所繫也朱子曰古人作詩只是説他心下所存事説出來人便將他詩來歌其聲之清濁長短各依他詩之語言却將律來調和其聲今人却先安排下腔調然後作語言去合那腔子却是永依聲也豈不是倒了古人是以樂去就他詩後世是以詩去就他樂如何解興起得人謝顯道云明道先生善言詩他又渾不曾章解句釋但優遊玩味吟哦上下便使人有得處瞻彼日月悠悠我思道之云逺曷云能來思之切矣終曰百爾君子不知德行不忮不求何用不臧歸於正也曾音層行去聲之瞻彼日月八句詩衛風雄雉篇辭蓋明道嘗誦之以教學者而謝氏特引之以見明道善言詩之意思之切者發乎情也歸于正者止乎禮義也慶源輔氏曰思之切而不歸於正便入哀傷淫佚去也何氏子恭曰讀詩之法須歸蕩胸次淨盡然後吟哦上下諷咏從容使人感發方為有益又曰伯淳常談詩並不下一字訓詁有時只轉却一兩字點掇地念過便教人省悟又曰古人所以貴親炙之也此條宋本及楊本與上分為二但按此以又云字起恐不得另作一條今姑從近本併之點平聲末句又曰之又諸本及外書並作石今據上蔡語録改正然按謝録中曾怙天隱所記有石問孟子盡心知性一條疑石係人名不書姓或即謝氏之子歟而遊定夫撰謝氏墓志巳亡不可考矣點掇地宋時方言點點綴掇拈取地俗語助也陳氏曰蒸民詩四句孔子只就中添四字滄浪之歌只换兩斯字曾不辭費而意味無窮明道説詩正得此意薛敬軒曰觀朱子詩傳只轉一兩字點掇念過蓋得明道言詩意也王伯厚曰魏太子擊好晨風而慈父感悟周磐誦汝墳卒章而為親從仕王裒讀蓼莪而三復流涕裴安祖講鹿鳴而兄弟同食可謂興於詩矣李聃和伯自言吾于詩甫舊悟進學衡門識處世此可為學詩之法故偹録之明道先生曰學者不可以不看詩看詩便使人長一格價長張丈反格下近本或無價字不朱子曰讀詩必如三復白圭方始有味明敏人如此看亦無所補至鈍人能如此看亦隨淺深而有所見也不以文害辭文文字之文舉一字則是文成句是辭詩為解一字不行却遷就他説如有周不顯自是作文當如此為去聲周詩大雅文王篇曰有不顯葉氏曰言周家豈不顯乎苟直謂之不顯則是以文害辭伊川先生曰看書須要見二帝三王之道如二典即求堯所以治民舜所以事君遺書下同人朱子曰唐虞三代事浩大濶逺何處測度不若求聖之心如湯誓湯曰豫畏上帝不敢不正熟讀豈不見湯之心中庸之書是孔門傳授成於子思孟子其書雖是雜記更不分精粗一衮説了今人語道多説髙便遺却卑説本便遺却末真西山曰中庸始言天命之性終言無聲無臭宜若高妙矣然曰戒愼曰恐懼曰謹獨曰篤恭則皆示人以用力之方蓋必戒懼謹獨而後能全夫性之善必能篤恭而後造無聲無臭之妙未嘗使人馳心窈冥而不盡其實者也伊川先生易傳序曰易變易也隨時變易以從道也傳直戀反下此傳所傳同易乾鑿度孔子曰易者變易也不易也鄭玄曰易一言而函三義簡易一也變易二也不易三也朱子曰易有交易有變易交易是陽交于隂隂交于陽是卦上砥如天地定位山澤隂通氣云云者是也變易是陽變隂隂變陽老陽變為少老隂變為少陽此是占筮之法如晝夜寒暑屈伸往來者是也或問易即道也何以言變易以從道朱子曰易之所以變易固皆理之當然聖人作易因象明理教人以變易從道之方耳如乾初則潛二則見之類是也又曰程子以易為人事之書故云然其為書也廣大悉備將以順性命之理通幽明之故盡事物之情而示開物成務之道也聖人之憂患後世可謂至矣此一節言聖人作易之大旨也去古雖逺遺經尚存然而前儒失意以傳言後學誦言而忘味自秦而下蓋無傳矣子生千載之後悼斯文之湮晦將俾後人沿流而求源此傳所以作也而忘之而宋本作以湮伊真反沿夷然反此一節言後人失易之旨而傳之所以不可不作也沿循也流即下文所謂辭也源即下文所謂意也易有聖人之道四焉以言者尚其辭以動者尚其變以制器者尚其象以卜筮者尚其占吉凶消長之理進退存亡之道備於辭推辭考卦可以知變象與占在其中矣長張丈反所易有聖人之道五句見易繫辭上傳張南軒曰指其之者易之辭也以言者尚之則言無不當矣化而裁之者易之變也以動者尚之則動無不時矣象其物宜者易之象也制器者尚之則可以盡創物之智極數知來者易之占也卜筮者尚之則可以窮先知之神間辭占是一類變象是一類所以下文至精合辭占説至變合變象説朱子曰然占與辭是一類者曉得辭方能知得占變是事之始象是事之已形者故亦是一類也辭此以下言學易者當於其求之而其意可得也君子居則觀其象而玩其辭動則觀其變而玩其占得於辭不達其意者有矣未有不得於辭而能通其意者也居則觀其象二句見易繫辭上傳蔡節齋曰觀象玩辭學易也觀變玩占用易也學易則無所不盡其理用易則惟盡乎一爻之用至微者理也至著者象也體用一源顯微無間觀會通以行其典禮則辭無所不備間去聲而朱子曰自理而觀則理為體象為用理中有象是一源也自象而觀則象為顯理為微而象中有理是無間也言理則先體而後用蓋舉體而用之理已具言事則先顯而後微蓋即事而理之體可見觀會通句見易繫辭上傳會以理之所聚而言通以事之所宜而言衆理會處便有許多難易窒礙必于其中得其通處乃可行耳典禮者典常之禮按尹和靖受易傳序歸伏讀數日後見伊川伊川問所見和靖曰體用一源顯微無間二語似太泄露天機也伊川曰汝看得如此甚善某亦不得已而言之耳蓋伊川易傳只就用之顯然者言之而其本體之精微處即在其中顧恐學者之習而不察也故著此二語程子示人之意可謂深且切矣然延平李氏以為須看得六十四卦三百八十四爻都有下落方始見得此語之切要學者又不可以不知也故善學者求言必自近易於近者非知言者也豫所傳者辭也由辭以得意則在乎人焉易音異處文某下同此朱子曰求言必自近乃程子吃緊為人學者深味意就眼前切近處潛思默契皆自有高深逺大而不可窮者矣疏王伯厚曰馮當可謂王輔嗣蔽於虛無而易與人事伊川專于治亂而易與天道逺又謂近有伊川然後易與世故通而王氏之説為可廢然伊川往往捨畫求易故時有不合又不會通一卦之體以觀其全每求之文辭離散之間故其誤十猶五六伊川先生答張閎中書曰易傳未傳自量精力未衰尚覬有少進耳來書云易之義本起於數謂義起於數則非也有理而後有象有象而後有數易因象以明理由象而知數得其義則象數在其中矣本注理無形也故因象以明理理既見乎辭矣則可由辭以觀象故曰得其義則象數在其中矣易傳之傳直戀反覬音兾則非上葉本無謂義起於數五字今從文集及諸本增而知之而葉本作以見音現已張閎中見伊洛淵源録云不詳其名字時易傳成書久學者莫得傳授張閎中以書問先生且曰易之義本起于數故程子以此答之其後先生寢疾始以授尹焞張繹云然按史又謂焞至閬得程氏易傳十卦於其門人吕稽中又得全本于其壻邢純拜而受之則又似非程子親授者又按楊中立易傳跋云伊川先生著易傳方草具未及成書而先生得疾將啓手足以其書授門人張繹未幾繹卒故其書散亡學者所傳無善本政和初豫友謝顯道得其書于京師示豫錯亂重復幾不可讀東歸待次毗陵乃始校定去其重復踰年而始完據此則程子臨終時但以授繹未嘗授尹氏與史傳之言頗合則淵源録所言或傳聞之誤朱子曰程子説易得其理則象數在其中固是如此然泝流以觀却須先見象數的當下落方説得理不走作不然事無實證則虛理易差也必欲窮象之隱微盡數之毫忽乃尋流逐末術家之所尚非儒者之所務也隱微象之難見者也毫忽數之難知者也孫子算術蠶所吐絲為忽十忽為秒十秒為毫言細微之至也術家如京房郭璞之類是也知時識勢學易之大方也易傳下同乾夬九二象傳方猶術也朱子曰如卦雖云大通然初九潛龍勿用上九亢龍有悔此等處最是易之大義易大抵於盛滿時致戒蓋陽氣正長必有消退之漸自是時勢如此錢純老曰下繫謂六爻相雜惟其時物言惟其時之不同而其事物亦異如乾之取龍一物也或潛或見或躍或飛之不同者時也如漸之取鴻亦一物也而于干於磐于陸于木之不同者亦時也朱子曰下繫謂乾至健而知險坤至順而知阻險是上視下見下之險故不敢行阻是下視上為上所阻故不敢進蓋易要人知進退存亡之道若有險阻而冒昧前進是知進而不知退知存而不知亡豈易之道耶他卦皆然如需卦之類可見愚謂自卦言否泰剝復之類自爻言潛見飛躍之類大畜初二乾體剛健而不足以進四五隂柔而能止時之盛衰勢之強弱學易者所宜深識也大畜九二象傳葉氏曰乾下艮上為大畜初與二雖剛健而不足以進者以畜之時不利于進又俱位乎下勢自不能進也四與五雖隂柔而能止者以畜之時在子止又位據乎上勢自足以為止也可吕氏曰康節謂孟子雖不言易然如説可以仕則仕以止則止及禹稷顔子易地皆然之類非精於易道者未可與語子此諸卦二五雖不當位多以中為美三四雖當位或以不中為過中常重於正也蓋中則不違於正正不必中也天下之理莫善於中於九二六五可見當並去聲正震六五傳朱子曰程子謂中重于正固也然須以為先如人為一事必先剖決是非邪正而後就是與正處斟酌一無過不及之理所謂中也若不能先見正處又何中之可言乎又曰如君子而時中則是中無不正若君子有時而不中却正未必中蓋正是骨子好了而所作事未有恰好處故正未必中也又如飢渴飲食是正若過了些便非中節中處乃中也責善正也然父子之間不責善則是正不必中也蔡虛齋曰宋敷文閣直學士李椿有云易以九居五六居二為當位而辭多艱六居五九居二為不當位而辭多吉者蓋君以剛健為體而虛中為用臣以柔順為體而剛中為用君誠以虛中行其剛健臣誠以剛中守其柔順則上下交而其志同矣實易爻之通例楊泳齋曰九居二六居五雖非正也而各得其中剛為剛柔之相濟故多得其吉焉然訟之九二而患至掇井之九二而甕敝漏豫之六五而貞疾離之六五而出涕是又當以其時而言之胡敬齋曰卦爻固以中正為善又必有正應方可有為蓋中正則才德不偏有正應則君臣相遇方可以成天下之治問胡先生解九四作太子恐不是卦義先生云亦不妨只看如何用當儲二則做儲二使九四近君便作儲二亦不害但不要拘一若執一事則三百八十四爻只作得三百八十四件事便休也也近本俱作了遺書下同朱子曰伊川此説極好然其所作易傳却不免是三百八十四爻止作得三百八十四件事用也又曰天下之理若正言之則止作一事用唯以象言則當卜筮時隨他甚事都應得如泰之初九若正説引賢進用便只是引賢進用惟以拔茅茹之象言之則其他類此者皆可應也按宋志胡氏有易解十卷又口義十卷繫辭説卦三卷今唯口義存看易且要知時凡六爻人人有用聖人自有聖人用賢人自有賢人用衆人自有衆人用學者自有學者用君有君用臣有臣用無所不通因問坤卦是臣之事人君有用處否先生曰是何無用如厚德載物人君安可不用以上並伊川語問厚德載物坤彖傳本文作坤厚載物程傳將三百八十四爻作人説恐道未盡否朱子曰也得但不可執定作人説有以事言者有以時言者有以位言者以吉凶言之則為事以初終言之則為時以髙下言之則為位隨所值而看皆通所謂易不可為典要也又曰太祖一日問王昭素曰乾九五飛龍在天利見大人常人何可占得此卦昭素曰何害若臣等占得則陛下是飛龍在天臣等利見大人此説得最好此易之用所以不窮也蔡虛齋曰乾卦卦辭只是要人如乾坤卦卦辭只是要人如坤至如蒙蠱等卦則又須反其義此有隨時而順之者有隨時而制之者易道只是時時則有此二義在學者細察之易中只是言反覆往來上下明道語內外卦曰上曰往卦曰下曰來故泰曰小往大來否曰大往小來咸曰柔上而剛下恆曰剛上而柔下睽曰火動而上澤動而下又卦變亦有自某卦來之説如朱子本義泰自歸妹來六往居四九來居三否自漸來九往居四六來居三蠱自賁來者初上二下自井來者五上上下之類反覆者即往來上下之反覆也如乾下坤上小往大來而為泰坤下乾上大往小來而為否之類是也然則六十四卦無一卦無往來上下即無一卦非往來上下之反覆也但其中如乾坤坎離大過頥中孚小過八卦反覆觀之止成一卦餘五十六卦反覆觀之遂成兩卦耳朱子曰乾坤坎離大過順中孚小過八卦為正對其餘五十六卦皆反對正對不變故反覆觀之止成八卦反對者皆變故反覆觀之共二十八卦作易自天地幽明至於昆蟲草木微物無不合昆公魂反又如字凡外書下同生昆同蜫蟲總名鄭康成曰昆明也蟲得陽而得隂而藏故謂之昆蟲髙氏曰亘古亘今塞天塞地只是一生機流行所謂易也又曰知易者一草一木一禽一獸皆卦也靜觀真有趣耳今時人看易皆不識得易是何物只就上穿鑿若念得不熟與就上添一德亦不覺多就上減一德亦不覺少譬如不識此兀子若減一隻腳亦不知是少若添一隻亦不知是多若識則自添減不得也遊定夫問伊川隂陽不測之謂神伊川曰賢是疑了問是揀難底問揀通作簡子隂陽不測句見易繫辭上傳揀選擇也朱曰揀難砥問自當不答且使之熟讀聖賢明白切實之言就已分上依次第做工夫方有益又曰亦有泛然之問略不經思索答之未竟而遽己更端者若隨其所問率然答之非惟於彼無益而答之者亦不中語默之節矣伊川以易傳示門人曰只説得七分後人更須自體究程子恐學者拘守傳説不復體究故云然非謂于此外别有要妙而欲學者自得之也尹氏曰先生自涪陵歸易傳已成未嘗示人門弟子請益有及易書者方命小奴取書篋以出身自發之以示門弟子非所請不敢多閲門弟子請問易傳事雖有一字之疑先生必再三喻之蓋其潛心甚久未嘗容易下一字伊川先生春秋傳序曰天之生民必有出類之才起而君長之治之而爭奪息道之而生養遂教之而倫理明然後人道立天道成地道平劉質夫傳春秋程子以為不盡本意故欲更為之而書未及竟莊公後解釋多殘缺今見經説中序文則崇寧二年作也或問伊川春秋傳朱子曰中間有説得極好處如説滕子來朝以為膝本侯爵服屬於魯自貶降而以子禮見魯則貢賦少力易供程沙隨之説亦然如難理會處他亦不為決然之論二帝而上賢聖世出隨時有作順乎風氣之宜不先天以開人各因時而立政上上聲作隨時有作謂隨其時而有所制也天謂氣化也朱子曰先天謂天時未至而妄以私意先之如耕穫災畬之類與文言傳之先天不同暨乎三王迭興三重既備子丑寅之建正忠質文之更尚人道備矣天運周矣三重説見中庸程子本鄭氏説謂三重為三王之禮與朱子章句不同人道備承忠質文更尚而言天運周承子丑寅建正而言皆朱子曰三重諸説不同踓程子亦因鄭注然于文義不通唯吕氏之説為得今中庸章句因之聖王既不復作有天下者雖欲倣古之迹亦私意妄為而已事之謬秦至以建亥為正道之悖漢專以智力持世豈復知先王之道也秦以亥月為正自謂水德欲以勝周也漢専以智力持世故禮文制度悉襲秦舊無復三代之遺風也夫子當周之末以聖人不復作也順天應時之治不復有也於是作春秋為百王不易之大法所謂考諸三王而不謬建諸天地而不悖質諸鬼神而無疑百世以俟聖人而不惑者也胡敬齋曰春秋乃孔子因當世之事一一處置從天理上去堯舜三代之道具見于此又曰讀春秋便見得君是君臣是臣父是父子是子長是長幼是幼夫婦朋友中國夷狄截然分明而各止其所其于天道人事無不明備故曰為百王大法先儒之傳曰遊夏不能贊一辭辭不待贊也言不能與於斯耳斯道也惟顔子嘗聞之矣行夏之時乘殷之輅服周之冕樂則韶舞此其準的也與音預能遊夏不贊一辭見史記孔子世家問此謂顔淵嘗聞春秋大法何也朱子曰不是孔子將春秋大法向顔子説蓋三代制作極備矣不可復作告以四代禮樂只是集百王之大法其作春秋善者則取之惡者則誅之要亦明聖王之大法而已故伊川引以為據又曰四代之禮樂經世之大法也春秋之書亦經世之大法也然四代之禮樂是以善者為法春秋之書是以惡者為戒後世以史視春秋謂褒善貶惡而已至於經世之大法則不知也吕氏曰春秋固是褒善貶惡然中如朝聘郊禘搜狩卒葬包舉許多典章制度在則所謂經世之大法也春秋大義數十其義雖大炳如日星乃易見也惟其微辭隱義時措從宜者為難知也或抑或縱或與或奪或進或退或微或顯而得乎義理之安文質之中寬猛之宜是非之公乃制事之權衡揆道之模範也易音異盟朱子曰所謂大義易見者如書會侵伐不過見諸侯擅興自肆耳書郊禘不過見魯僣禮耳至如三卜四卜牛傷牛死是失禮之中又失禮也不郊猶三望是不必望而猶望也書仲遂卒猶繹是不必繹而猶繹也如此等義却自分明又曰如書即位者是魯君行即位之禮不書即位者是不行即位之禮若桓公之書即位則是桓公自正其即位之禮耳又如王人子哭救衛自是衛當救當時有子哭救之孔子因存他名字今諸公解王人本不書字因其救衛故書字聖人之意不解恁細碎又曰蘇子由解春秋謂其從赴告亦是既書鄭伯哭又書鄭世子忽據史文而書耳定哀之時聖人親見據實而書隱桓之世時既逺史册亦有簡略處夫子但據史册寫出耳問孔子豫五霸豈非時措從宜曰是但其豫之中便有奪砥意思夫觀百物然後識化工之神聚衆材然後知作室之用於一事一義而欲窺聖人之用心非上智不能也故學春秋者必優遊涵泳默識心通然後能造其微也夫音扶觀優遊涵泳二句見須於逐事逐義而求之正所謂百物而識化工之神聚衆材而知作室之用者也後王知春秋之義則雖德非禹湯尚可以法三代之治自秦而下其學不傳豫悼夫聖人之志不明於後世也故作傳以明之俾後之人通其文而求其義得其意而法其用則三代可復也是傳也雖未能極聖人之藴奧庶幾學者得其門而入矣夫音扶禹文集可朱子曰德非湯亦以法三王之治如是則無本者亦可以措之治乎語有欠詩書載道之文春秋聖人之用詩書如藥方春秋如用藥治病聖人之用全在此書所謂不如載之行事深切著明者也下五經之有春秋一條遺書在春秋聖人之用下分注細書有一本此下云五字史記自序聞之董生曰子曰我欲載之空言不如見之豫行事之深切著明者也索隱云見春秋緯王伯厚曰緯書起哀平間董生時未有之蓋為緯書者述此語耳有重疊言者如征伐盟會之類蓋欲成書勢須如此不可事事各求異義但一字有異或上下文異則義須别遺書下同襄事事各求異義者如胡氏謂書晉侯為以常情待晉書秦人為以王事責秦穆之類朱子曰當時史書掌于史官想人不得見夫子取而筆削之欲使人見得當時治亂興衰非是于一字定褒貶蓋初間王政不行天下都無統屬及五霸出而扶持方有統屬到後來五霸又衰如澳梁之盟大夫亦出與諸侯之會自是差異不好孔子據事直書好惡自易見若云去其爵與其爵賞其功罰其罪孔子亦與奪賞罰不得春秋所書本據魯史舊文筆削而成若欲如此推説須是得魯史舊文參較筆削異同然後可見而亦豈復可得也五經之有春秋猶法律之有斷例也律令惟言其法至於斷例則始見其法之用也此條遺書載在前條聖人之用下細字上有一本此下云五字決斷例者按周禮士師掌士之八成鄭司農謂若今時事此蓋取其行事之成者以為品式即今之斷例也范蜀公曰律之例有八以準皆各其及即若若春秋之凡愚按今律亦然或論春秋多有變例所以前後書法不同朱子曰聖人作春秋欲褒善貶惡示萬世不易之法今同此一字而於此用以誅人於彼又忽用以賞人使天下後世求之而莫識其意則是後世舞文㺯法者之所為也曾謂大中至正之道而如此乎伊川先生曰學春秋亦善一句是一事是非便見於此此亦窮理之要然他經豈不可以窮理但他經論其義春秋因其行事是非較著故窮理為要見音現但上宋本無理字遺書同較著猶漢書孔光傳所謂較然甚明也顔師古曰較音角明貌嘗語學者且先讀論語孟子更讀一經然後看春秋先識得箇義理方可看春秋所以先讀語孟更讀一經者欲使之識義理也春秋以何為準無如中庸欲知中庸無如權須是時而為中若以手足胼胝閉户不出二者之間取中便不是中若當手足胼胝則於此為中當閉户不出則於此為中胼蒲眠反胝章移反此承上文先識得箇義理之意而言其所以識之道也胼胝皮堅也史記禹手足胼胝閉户見孟子問閉户不出如有親戚兄弟在其中豈可一例不救朱子曰事亦須量大小若小有鬪毆救之不妨如兵戈殺人之事亦只得閉門不管而已權之為言稱錘之義也何物為權義也時也只是説得到義義以上更難説在人自看如何稱丑正反古通用稱錘直追反時字遺書本作然連下也只是作一句讀語類時舉述此以問與遺書同今當從之此節承上權字之意而申明之稱衡俗名錘權俗名義者謂事物之所當然義以上者則其所以當然之故也在人自有如何謂學者功深力到反求之身而自得之非可以言語形容也問權便是義否朱子曰權是用此義者問中便是時措之宜否曰以義權之而後得中義似稱權是以此稱去稱量中是物得其平處又曰權是于精微曲折處曲盡其宜所以説中之所貴者權春秋傳為案經為斷本注程子又云某年二十時看春秋黃聱隅問某如何看某答曰以傳考經之事迹以經别傳之真偽黃聱隅名晞字景微建安人少通經聚書數千卷學者多從之自號聱隅子樞密使韓魏公薦以為太學助教某年二十以下乃唐棣問春秋如何看而先生答之也榖朱子曰左氏曽見國史考事頗精只是不知義理公不曽見國史考事甚疏然義理却精凡讀史不徒要記事迹須要識其治亂安危興廢存亡之理且如讀髙帝一紀便須識得漢家四百年終始治亂當如何是亦學也要識下宋本無其字帝下葉吕本無一字理謂治亂安危興廢存亡之所以然也如要識得須先講明道義所在庶不流為功利之學愚按全史資鈍者不能盡看如司馬公通鑑馬氏文獻通考二書千百年治亂興衰典章制度之得失其在其中宋以前散見諸史中究心甚難今彼二公編輯條理分明如此不看何名為讀書人士不通今古而冇足用者未之前聞也先生每讀史到一半便掩卷思量料其成敗然後却看有不合處又更精思其間多有幸而成不幸而敗今人只見成者便以為是敗者便以為非不知成者煞有不是敗者煞有是砥朱子曰讀史亦易見作史者意思後面成敗處他都説得意在前面如陳蕃殺宦官但讀前面許多疏脫都可見也草露事亦然讀史須見聖賢所存治亂之機賢人君子出處進退便是格物元祐中客有見伊川者几案間無他書惟印行唐鑑一部先生曰近方見此書三代以後無此議論外書鑑范祖禹字淳夫為溫公通局編修官分掌唐史以其所自得者著成此書按外書又曰范淳夫嘗與伊川論唐事及為唐鑑盡用先生之説先生謂門人曰淳夫乃能相信如此炎朱子曰唐鑑亦有緩而不精確處如言租庸調及楊二稅法説得都無收煞只云在于得人不在於法法亦豈可苟者蓋范氏見熙寧間變更故有激而言要之只那有激便不平正又一段論太宗本原亦未盡太宗行處儘好只為本領不是與三代更别張氏曰唐鑑視胡氏春秋傳更覺簡要學者能讀唐鑑方可以治史本按此條朝氏客語時氏本拾遺並有之但時氏少元祐中三字以上並伊川語橫渠先生曰序卦不可謂非聖人之藴今欲安置一物猶求審處况聖人之於易其間雖無極至精義大槩皆有意思觀聖人之書須遍布細密如是大匠豈以一斧可知哉橫渠易説之序卦易十傳之一也以韓康伯注有序卦非易藴之説故特辨之朱子曰以序卦為非聖人之精則可謂非易之藴則不可周子分精與藴字甚分明序卦却事事夾雜都有在內正是易之藴須是自一箇生出來以至於無窮方是精如易有太極是生兩儀兩儀生四象四象生八卦是也天官之職須襟懷洪大方看得蓋其規模至大若不得此心欲事事上致曲窮究湊合此心如是之大必不能得也釋氏錙銖天地可謂至大然不嘗為大則為事不得若畀之一錢則必亂矣畀音袐也不得此心謂不得襟懷之洪大釋氏之所謂大者只是言論曠蕩未嘗身自為之所以為事不得大朱子曰冡宰內自王之飲食衣服外至五官庶事自至小自本至末千頭萬緒若不是大其心者區處應副事到面前便且區處不下况於先事揩置思患預防是著多少精神所以記得此復忘彼佛氏將此心置在無用處才動步便踈脫所以吾儒貴窮理須事事物物理會過也陳君舉曰冡宰一職惟制御天子身畔之人一則環衛之人二則供奉飲膳酒漿之人三則出納財賄之人四則宫中使令之人蓋以此等與天子褻狎或用內官或用女奚他卿不能誰何所以冡宰盡制御之秦漢以環衛之人分入光祿勳衛尉以供奉之人分入少府以出納財用之人分入司農而宫中出入侍奉使令之人分與大長秋是冡宰之職分為三四矣又曰太宰之職難看蓋無許大心胸包羅記得此復忘彼其混混天下之事當如捕龍蛇摶虎豹用心力看方可其他五官便易看止一職也復扶又反易音異亦語録下同者朱子曰五官止一職易看固然然其中有難理會如主客行人之官當屬春官却掌於司冦土地疆域之事當屬司徒却掌于司馬蓋以諸侯朝覲會同之禮既畢則降而肉袒請刑司冦主刑所以賔客屬之有威懷諸侯之意諸侯有罪則六師移之所以土地封疆屬之夏官陳君舉乃謂互相檢制之道過矣又曰周禮一書廣大精微周家法度在焉後人皆以周禮非聖人之書其間細碎處雖可疑其大體直是非聖人做不得胡五峯以為天官冡宰不當治宫闈燕私事蓋彼但見後世宰相請託宫闈交結近習以為不可殊不知此正人君治國平天下之本豈可以後世之弊而并廢聖人之良法美意耶李泰伯周禮論甚好如説宰相掌人主飲食男女事與某意正合至若所謂女祝掌凡內禱祀襘禳之事使後世有此官則巫蠱之事安從有哉王伯厚曰嬪御奄侍飲食酒漿衣服次舍器用貨賄皆領于冡宰冕辨車旗宗祝巫史卜筮瞽侑皆領於宗伯此周公相成王格心輔德之法周之興也滕侯為卜正吕伋為虎賁氏侍御僕從罔非正人左右攜僕庶常吉士及其衰也昏椓靡共婦寺階亂膳夫內史趣馬師氏締交於嬖寵瑣瑣姻婭私人之子竊位於王朝至秦而大臣不得議近臣矣至漢而中朝得以絀外朝矣至唐而北司是信南司無用矣由周公之典廢也間有詰責幸臣如申屠嘉奏劾常侍如楊秉宫中府中為一體如諸葛武侯可謂知宰相之職者唐太宗責房玄齡以北門營繕何預君事豈善讀周禮者哉我朝趙普於一薰籠之造亦制以有司之法李沆於後宫之立奏以臣沆不可趙鼎於內苑移竹責宦者罷其役庶幾古大臣之風矣五峰乃謂周公不當治成王燕私之事殆未之思也又曰李太伯云內宰用大夫士世婦每宫卿二人皆分命賢臣以參檢內事漢世皇后詹事以二千石為之猶有成周遺意古人能知詩者惟孟子為其以意逆志也夫詩人之志至平易不必為艱嶮求之今以艱嶮求詩則已喪其本心何由見詩人之志本注詩人之情性溫厚平易老成本平地上道著言語今須以﨑嶇求之先其心已狹隘了則無由見得詩人之情本樂易只為時事拂著他樂易之性故以詩道其志為其只為之為並去聲易並音異嶮虛檢反通作險喪去聲崎音竒嶇豈俱反樂音洛詩人之情性下葉本大字無本注字逆迎也方言自關而東曰逆自關而西曰迎溫厚平易老成皆言詩人之情性也平地上道著言語見其非有﨑嶇也道言也時事或美或惡有所感動而詩作焉拂動也朱子曰以意逆志者逆如迎待之意若未得其志只得待之如需於酒食之義後人讀書便要去捉將志來以至束縳之又曰某所著詩傳蓋推尋其脈理以平易求之不敢用一毫私意輔氏曰溫厚平易老成説盡詩人情性溫厚謂和而不流怨而不怒平易謂所言皆眼前事老成謂憂深思逺達於人情事物之變此等意思惟平心易氣以迎之則有可得尚書難看蓋難得胸臆如此之大只欲解義則無難也問他書亦須大心胸方讀得如何張子只説尚書朱子曰他書却有次第且如大學自格物致知以至平天下有多少節次尚書只合下便大如堯典自克明峻德以親九族至黎民於變時雍展是大小大分命羲和定四時成嵗便是心中包一箇三百六十五度四分度之一底天方見得恁地若不得一箇大底心胸如何看得讀書少則無由考校得義精蓋書以維持此心一時放下則一時德性有懈讀書則此心常在不讀書則終看義理不見此以見讀書非徒窮理之事實亦養心之要也朱子曰讀書固收心之一助然只讀書時收得心而不讀書時便為事所動則是心之存時常少放時常多也學者當移此讀書工夫向不讀書處用力使動靜兩得而此心庶幾無時不存矣書須成誦精思多在夜中或靜坐得之不記則思不起但通貫得大原後書亦易記易音異言承上文讀書而其所以讀之法也朱子曰讀書須反復研究直待不思索時此意常在心胸之間驅遣不去方為有功又曰李先生常言道理須是日中理會夜間却去靜處坐地思量方始有得所以觀書者釋已之疑明已之未達每見每知新益則學進矣於不疑處有疑方是進矣此又以其驗處言之據按葉呂本自書須成誦以下别為一條今原書及宋本併之六經須循環理會義理儘無窮待自家長得一格則又見得别長張丈反别皮裂反會此即論語溫故知新之意然必于一經理已到然後再理會一經若徒循環泛涉非根柢務實之學也如中庸文字輩直須句句理會過使其言互相發明中庸文字輩凡詩書論孟之文皆是必言中庸者蓋古聖賢之書無非發明中庸之道故必於此見之明而後於事事物物之宜無往不當其可以之讀他書亦易為力如前程子所言讀春秋以中庸為凖是也句句理會過則觸處洞然無所疑滯自有以見夫不偏不易之道隨在具足無少欠缺融會貫通不拘所讀何書而無往非中庸之道之所在矣遊定夫讀西銘渙然不逆於心曰此中庸之理亦此意也春秋之書在古無有乃仲尼所自作惟孟子能知之非理明義精殆未可學先儒未及此而治之故其説多鑿治平聲經鄭漁仲曰有未經夫子筆削之春秋有已夫子筆削之春秋孔潁逹曰春秋之名無所經見惟昭公二年晉韓起來聘見魯春秋晉語司馬侯對悼公曰羊舌肸習於春秋悼公使傳其太子楚語申叔時論傅太子之法亦云教之以春秋由此觀之是周之典禮不存惟魯春秋為列國所重皆在夫子未修之前舊有春秋之目乃周公伯禽以來上自天子下至列國無不備載皆周之盛時為先王之典章此杜預所謂周之舊典禮經是也今汲冢瑣語亦有魯春秋記魯獻公十七年事諸如此類皆夫子未生之前未經筆削之春秋惟孟子所謂詩亡然後春秋作此魯史記東遷以後事已經筆削之春秋也然則是書乃從來所有夫子特取而筆削之耳此言在古無有者亦就其修後言之見其取義精奧非他人所得與也朱子曰後儒學未至各以己意揣測正橫渠所謂非理明義精而治之故其説多鑿是也惟伊川以為經世之大法得其旨矣然其間極有難體會處不若存取胡文定本與後來看縱未能盡得之然不中不逺矣心中有所開即便劄記不思則還塞之矣更須得朋友之助一日間朋友論著則一日間意思差别須日日如此講論久則自覺進也劄竹洽反著直酌反差初賣反别皮列反劄箋劄也劄記謂以箋劄記之也差較也較略也本按葉本此條在前第二十一條以來新意下今從宋及楊本正之心中下一本有苟字朋友之助下葉本無一日問朋友論著則八字以上並橫渠語近思録集注卷三欽定四庫全書近思録集注卷三婺源江永撰朱子曰此卷格物窮理伊川先生答朱長文書曰心通乎道然後能辨是非如持權衡以較輕重孟子所謂知言是也心不通於道而較古人之是非猶不持權衡而酌輕重竭其目力勞其心智雖使時中亦古人所謂億則屢中君子不貴也永按此言心未通道未可輕論古人是非也欲通乎道窮理而已後言窮理者或論古今人物而辨其是非又即以此為窮理意與此異蓋彼欲究其是非之實而此則億度較量理未明而強辨論也亦因長文之失而告之文集下同伊川先生答門人曰孔孟之門豈皆賢哲固多衆人以衆人觀聖賢弗識者多矣惟其不敢信己而信其師是故求而後得今諸君於頤言才不合則置不復思所以終異也不可便放下更且思之致知之方也朱子曰伊川云不信其師乃知當時有不信者伊川先生答橫渠先生曰所論大槩有苦心極力之象而無寬裕溫厚之氣非明睿所照而考索至此故意屢偏而言多窒小出入時有之本注明所照者如目所覩纎微盡識之矣考索至者如揣料於物約言倣佛爾能無差乎更願完養思慮涵泳義理他日自當條暢朱子曰橫渠只是一向苦思求將向前去却欠涵泳以待其義理自形見處如云由氣化有道之名説得是好終是生受辛苦如以太虛太和為道體却只是説得形而下者欲知得與不得於心氣上驗之思慮有得中心恱豫沛然有裕者實得也思慮有得心氣勞耗者實未得也強揣度耳嘗有人言比因學道思慮心虛曰人之血氣固有虛實疾病之來聖賢所不免然未聞自古聖賢因學而致心疾者永按此條本欲人致思慮但其自得與否心氣上亦可驗之學者致思當由勞苦而後得恱豫若慮其致心疾而曰因學道思慮心虛則憚勞者之辭耳惟思慮過苦者當如上條完養之説遺書下同今日雜信鬼怪異説者只是不先燭理若於事上一一理會則有甚盡期須只於學上理會永按燭理明則鬼怪之事皆可以理斷之理有常變怪者亦不足為異也學原於思朱子曰學原於思思所以起發其聰明所謂日月至焉與久而不息者所見規模雖略相似其意味氣象迥别須潛心默識玩索久之庶幾自得學者不學聖人則己欲學之須熟玩味聖人之氣象不可只於名上理會如此只是講論文字問日月至焉與不息者全别此言略相似何也朱子曰若論到至處却與久而不息底一般只是日月至者至得不長久不息者純然無間斷之永按玩味聖人氣象亦窮理事也問忠信進德之事固可勉強然致知甚難伊川先生曰學者固當勉強然須是知了方行得若不知只是覷却堯學他行事無堯許多聰明睿智怎生得如他動容周旋中禮如子所言是篤信而固守之非固有之也葉氏曰固守者勉強堅持固有者從容自得永按非固有者未嘗真知故也未致知便欲誠意是躐等也勉強行者安能持久永按此言未致知亦不能誠意耳非謂誠意功夫有等待也故朱子嘗云為學次第雖有先後然須用一齊做去如格物致知而后誠意不成説物未格知未至且未要誠意安有此理聖人亦只説大綱自然次序如此非謂做一件無餘方做一件也除非燭理明自然樂循理性本善循理而行是順理事本亦不難但為人不知旋安排著便道難也知有多少般數煞有深淺學者須是真知才知得是便泰然行將去也朱子曰程子論知之淺深從前未有人説到此人果見得分曉如鳥喙之不可食水火之不可蹈見善如飢之欲食寒之欲衣則意自實矣某年二十時解釋經義與今無異然思今日覺得意味與少時自别朱子曰程子睌而自言如此此溫故知新之大者學者當以是為的而深求之葉氏曰此可見先生致知之功進德之實而聖經之旨要必玩味積久乃能真知亦不徒在於解釋文義而已凡一物上有一理須是窮致其理窮理亦多端或讀書講明義理或論古今人物别其是非或應接事物而處其當皆窮理也朱子曰物理無窮故他説得來亦自多端如讀書以講明道義則是理存於書如論古今人物以别其是非邪正則是理存於古今人物如應接事物而處其當否則是理存於應接事物或問格物須物物格之還只格一物而萬理皆知曰怎得便會貫通若只格一物便通衆理雖顔子亦不敢如此道須是今日格一件明日又格一件積習既多然後脫然自有貫通處本注乂曰所務於窮理者非道盡窮了天下萬物之理又不道是窮得一理便到只要積纍多後自然見去顔問一理通則萬理通其説如何朱子曰伊川嘗云雖子亦未到此天下豈有一理通便解萬理皆通也須積纍將去如顔子高明不過聞一知十亦是大段聰明了學問却有漸無急迫之理一日一件者格物工夫次第也脫然貫通者知致效驗極致也不循其序而遽責其全則為自罔但求粗曉而不期貫通則為自畫會程子此語便是真實做工夫來也不説格一件後便通也不説盡格天下物理後方始通只云積習既多然後脫然有箇貫通處日問今日格一件明日格一件工夫如何曰如讀書今看一段明日看一段又如今日理會一事明日理會一事積習多後自然貫通問今日格一件明日格一件莫太執著否曰人日用間自是不察耳若體察當格之物一日之間儘有之積習既多自當脫然有貫通處乃是零零碎碎湊合將來不知不覺自然醒悟其始固須用力及其得之也又却不假用力此箇事不可欲速欲速則不達須是慢慢做將去子積纍多後便是學之博脫然有貫通處便是約程此言該內外寬緩不迫有涵泳從容之意一所謂不必盡窮天下之物者如十事已窮得八九其二雖未窮得將來湊會都自見得問知至若論極盡處則聖賢亦未可謂之知至曰然如何要一切知得然理會得已極多萬一有插生一件差異底事來也都識得他破只是貫通便不知底亦通將去某舊來亦如此疑後來看程子説格物非謂盡窮天下之物云云方理會得思曰睿思慮久後睿自然生若於一事上思未得且别換一事思之不可専守著這一事蓋人之知識於這裏蔽著雖強思亦不通也問於窮不得處正當努力豈可遷延逃避别窮一事耶朱子曰這是言隨人之量非曰遷延逃避也蓋於此處既理會不得若専一守在這裏却轉昏了須著别窮一事又或可以因此而明彼也一問程子此説與中庸弗得弗措相發明否曰看來有樣底若弗得弗措一向思量這箇少間便會擔閣了若謂窮一事不得便掉了也不得程子為見學者有恁地底不得已説此話得程子之言誠善然窮一事未透又便於窮一事亦不彼謂有甚不通者不得已而如此耳不可便執此説容易改換却致工夫不専一也窮問伊川此説與延平之説如何曰這説自有一項難底事如造化禮樂度數等事是卒急難曉只得且放住延平説是窮理之要若平常遇事一件理會未透又理會第二件第二件理會未透又理會第三件恁地終身不長進問人有志於學然知識蔽固力量不至則如之何曰只是致知若智識明則力量自進葉氏曰真知事理之當然則自有不容已者問觀物察已還因見物反求諸身否曰不必如此説物我一理才明彼即曉此此合內外之道也又問致知先求之四端如何曰求之性情固是切於身然一草一木皆有理須是察本注又曰自一身之中以至萬物之理但理會得多相次自然豁然有覺處問觀物察已還因見物反求諸己此説亦是程子非之何也朱子曰這理是天下公共之理人人都一般初無物我之分不可道我是一般道理人又是一般道理將來相比以知得事物上是非分明便是自家心下是非分明所説才明彼即曉此於這一物窮得一分之理即我之知亦知得一分其實只是一理才明彼即曉此所以大學説致知在格物蓋致知便在格物中非格之外别有致處也其窮理者欲知事物之所以然與其所當然者而已知所以然故志不惑知其所當然故行不謬非謂取彼之理而歸諸此也程子所謂物我一理才明彼即曉此問草木當如何格曰此推而言之雖草木亦有理存如麻麥稻粱甚時種甚時收地之厚薄不同宜植某物亦皆有理格物之論伊川意雖謂眼前無非是物然其格之也亦須有先後緩急之序豈遽以為存心於一草木器用之間而忽然懸悟也哉今為學而不窮天理明人倫講聖言通世故乃兀然存心於草木器用之間此是何學問如此而望有所得是炊沙而欲其成飯也箇自一身之中以至萬物之理理會得多自當豁然有覺處此一段尤要切學者所當深究所一身之中是仁義禮智惻隱四端與夫視聽言動皆當理會至若萬物之榮悴與夫動植小大這底可以如何使那底可以如何用皆所當理會秩問自一身以至萬物之理所謂由中而外自近而逺然有序而不迫切者曰然到得豁然處是非人力勉強而至者也思曰睿睿作聖致思如掘井初有渾水久後稍引動得清者出來人思慮始皆溷濁久自明快朱子曰思索如穿井不解便得清水先亦須是濁漸漸刮將去却自清或問如何是近思曰以類而推朱子曰程子説得推字極好問以類莫是比這箇意思推去否曰固是如為子當止於孝為臣當止於忠自此節節推去然只一愛字雖出於孝畢竟千頭萬緒皆當推去始得近此語道得好不要跳越望逺亦不是縱橫陡頓只是傍那曉得處挨將去如這一件理會得透了又因這件推去只管挨將去次第都能理會得今人不曽以類而推不曽先理會得一件却便理會那一件須是劈初頭要理會教分曉透徹則從已理會得處推將去如此便不隔越若逺去尋討不切於己近問程伯子云學只要鞭辟近裏著己而已故切問而思則仁在其中矣叔子云近思以類而推兩程子所謂近思其義似不同曰伯子之意蓋曰思之以不逺乎已耳叔子則以思之有序為近也伯子之言因得其本旨然不參以類推之説則將有捐事棄物専以反思默造為功而不自知其陷於異端者故二子之説不可以偏廢也學者先要會疑朱子曰書始讀不知有疑其次漸有疑又其次節節有疑過此一番後疑漸漸釋以至融會貫通都無可疑方始是學橫渠先生答范巽之曰所訪物怪神姦此非難語顧語未必信耳孟子所謂知性知天學至於知天則物所從出當源源自見知所從出則物之當有當無莫不心諭亦不待語而後知諸公所論但守之不失不為異端所劫進進不已則物怪不須辨異端不必攻不逾期年吾道勝矣若欲委之無窮付之以不可知則學為疑撓智為物昏交來無間卒無以自存而溺於怪妄必矣問橫渠物怪神姦書先生提出守之不失一句朱子曰且要守那定底如精氣為物遊魂為變此是鬼神定説又如孔子説非其鬼而祭之諂也敬鬼神而逺之等語皆是定底其他變處如未曉得且當守此定底為如精氣為物遊魂為變此理之常守之勿失者以此正且恁地去他日當自見也若委之無窮求之不可知此又溺於茫昧不能以常理為主者也伯有為厲别是一種道理此言其變如世之妖妄者也與文集意同子貢謂夫子之言性與天道不可得而聞既言夫子之言則是居常語之矣聖門學者以仁為己任不以苟知為得必以了悟為聞因有是説葉氏曰苟知者徒聞其説了悟者深達其理義理之學亦須深沉方有造非淺易輕浮之可得也朱子曰子張謂執德不𢎞𢎞字有深沉重厚之意橫渠謂義理深沉方有造非淺易輕浮所可得此語最佳皮聖人言語一重又一重須入深處看方有得若只見膚便有差錯學不能推究事理只是心粗至如顔子未至於聖人處猶是心粗問顔子心粗之説恐太過否朱子曰顔子比之衆人純粹比之孔子便粗如有不善未嘗不知知之未嘗復行是他細膩如此然猶有這不善便是粗伊川説未能不勉而中不思而得便是過説得好之顔子尚心粗人有一毫不是便是心粗心粗學者通病顔子未至聖人猶是心粗一息不存即為粗病要在精思明辨使理明義精而操存涵養無須臾離無毫髮間則天理常存人欲消去其庶矣乎博學於文者只要得習坎心亨蓋人經歷險阻艱難然後其心亨通朱子曰難處見得事理透便處斷無疑行之又果決便是習坎心亨凡事皆如此且如看文字見這説好見那説又好如此説有礙如彼説又有礙便是險阻處到這裏須討一路去方透便是習坎心亨文傅學於文又要得習坎心亨如應事接物之類皆是但以事理切磨講究自是心亨且如讀書每思索不通處則翻來覆去處處窒塞然其間須有一路可通只此便是許多艱難險阻習之可以求通通處便是亨也義理有疑則濯去舊見以來新意心中有所開即便劄記不思則還塞之矣更須得朋友之助一日間朋友論著則一日間意思差别須日日如此講論久則自覺進也朱子曰橫渠云濯去舊見以來新意此説甚當若不濯去舊見何處得新意來今學者有二病一是主私意一是舊有先入之説雖欲擺脫亦被他自來相尋學者不可只管守從前所見須除了方見新意如去了濁水然後清者出焉本到理會不得處便當濯去舊見以來新意仍且只就文看之人致思到説不得處始復審思明辨乃為善學也若告子則到説不得處便已更不復求葉氏曰思之其説似窮然後更加審思明辨之功則其窮者通而所得者深橫渠孟子説伊川先生曰凡解文字先須曉其文義然後可求其意未有文義不曉而見意者也遺書下同學者要自得六經浩渺乍來難盡曉且見得路徑後各自立得一箇門庭歸而求之可矣問門庭豈容各立耶朱子曰此是説讀六經只要從師講問且識得如何下工夫便是立得門庭却歸去依此實下工夫便是歸而求之書問如何是門庭曰是讀書之法如讀此一書須知此當如何讀伊川教人看易以王輔嗣胡翼之王介甫三人易解看此便是讀書之門庭緣當時諸經都未有成説學者乍難捉摸故教人如此問如詩是吟咏性情讀詩者便當以此求之否曰然凡解文字但易其心自見理理只是人理甚分明如一條平坦底道路詩曰周道如砥其直如矢此之謂也或曰聖人之言恐不可以淺近看他曰聖人之言自有近處自有深逺處如近處怎生通要鑿教深逺得揚子曰聖人之言逺如天賢人之言近如地頤與改之曰聖人之言其逺如天其近如地揚子揚雄法言中語高朱子曰今之談經者往往有四病本卑也而抗之使本淺也而鑿之使深本近也而推之使逺本明也而必使至於晦學者不泥文義者又全背却逺去理會文義者又滯泥不通如子濯孺子為將之事孟子只取其不背師之意人須就上面理會事君之道如何也又如萬章問舜完廩浚井事孟子只答他大意人須要理會浚井如何出得來完廩又怎生下得來若此之學徒費心力凡觀書不可以相類泥其義不爾則字字相梗當觀其文勢上下之意如充實之謂美與詩之美不同朱子曰凡讀書須看上下文意是如何不可泥著一字如揚子於仁也柔於義也剛到易中又將剛來配仁柔來配義孟子學不厭知也教不倦仁也到中庸又謂成已仁也成物知也此等須是各隨本文意看便不相礙問瑩中嘗愛文中子或問學易子曰終日乾乾可也此語最盡文王所以聖亦只是箇不己先生曰凡説經義如只管節節推上去可知是盡夫終日乾乾未盡得易據此一句只做得九三使若謂乾乾是不已不已又是道漸漸推去自然是盡只是理不如此瑩中程子門人子曰者王通答或人之語不永按此言道理各有地頭經義各有指歸可抗之使高也子在川上曰逝者如斯夫言道之體如此這裏須是自見張繹曰此便是無窮先生曰固是道無窮然怎生一箇無窮便道了得他朱子曰無窮之言固是但為渠道出不親切故以為不可永按終日乾乾不可以盡易無窮不可以了逝者皆欲學者親切觀書毋以高逺浮泛之言儱侗説過也今人不會讀書如誦詩三百授之以政不達使於四方不能専對雖多亦奚以為須是未讀詩時不達於政不能専對既讀詩後便達於政能専對四方始是讀書人而不為周南召南其猶正牆面須是未讀詩時如面牆到讀了後便不面牆方是有驗大抵讀書只此便是法如讀論語舊時未讀是這箇人及讀了後來又只是這箇人便是不曽讀也葉氏曰讀書之法但反諸己驗其實得致其實用變化氣質必有日新之功凡看文字如七年一世百年之事皆當思其如何作為乃有益葉氏曰治效遲速淺深當究其規模之略施為之方凡解經不同無害但緊要處不可不同爾永按緊要對緩慢者言之謂有關繫處外書下同焞初到問為學之方先生曰公要知為學須是讀書書不必多看要知其約多看而不知其約書肆耳頤緣少時讀書貪多如今多忘了須是將聖人言語玩味入心記著然後力去行之自有所得永按尹子之學要約而篤實蓋終身守此言者初學入德之門無如大學其他莫如語孟問初學當讀何書朱子曰六經語孟皆當讀但須知緩急大學語孟最是聖賢為人切要處然語孟隨事答問難見要領惟大學是説古人為學之大方體統都具玩味此書知得古人為學所鄉讀語孟便易入後面工夫雖多而大體已立矣某要人先讀大學以定其規模次讀論語以立其根本次讀孟子以觀其發越次讀中庸以求古人之微妙處大學有等級次第總作一處易曉宜先看論語却實但言語散見初看亦難孟子有感激興發人心處中庸亦難讀看三書後方宜讀之是今且須熟究大學作間架却以他書填補去大學修身治人底規模如人起屋相似須先打箇地盤今大學如一部行程厯皆有節次今人看了須是行去日行到何處明日行到何處方可漸到那田地鶻伊川舊日教人先看大學那時未有解説想也看得突而今著注解覺大段分曉了只在仔細去看乃佳論孟中庸待大覺貫通浹洽無可得看後方看論孟都是大學中肉菜先後淺深參差互見若不把大學做箇匡殼子卒有未易看得故論孟要冷看孟子要熟讀論語逐文逐章各是一義用仔細靜觀孟子成大段首尾通貫熟讀文義自見不可逐一句一字上理會也遺書下同學者先須讀論孟窮得語孟自有要約處以此觀他經甚省力論孟如丈尺權衡相似以此去量度事物自然見得長短輕重朱子曰學者若先讀得語孟十分透徹其他書都不費力觸處便見讀論語者但將諸弟子問處便作已問將聖人答處便作今日耳聞自然有得若能於論孟中深求玩味將來涵養成甚生氣質朱子曰孔門問答曽子聞得底顔子未必聞顔子聞得底子貢未必聞今却合在論語一書後世學者豈非大幸但患自家不去用心葉氏曰甚生猶言非常也凡看語孟且須熟玩味將聖人之言語切己不可只作一場話説人只看得此二書切己終身儘多也朱子曰且如學而時習之切己看時曽時習與否句句如此求之則有益矣體如克己復禮與出門如見大賓等事須就自家身上看我實能克己與主敬行恕否件件如此方有益論語有讀了後全無事者有讀了後其中得一兩句喜者有讀了後知好之者有讀了後不知手之舞之足之蹈之者朱子曰有得一二句喜者到這一二句喜處便是入頭處如此讀將去將久自解學者當以論語孟子為本論語孟子既治則六經可不治而明矣永按此猶前條以此觀他經甚省力之意其實治六經自有功夫朱子云語孟功夫少得效多六經功夫多得效少讀書者當觀聖人所以作經之意與聖人所以用心與聖人所以至聖人而吾之所以未至者所以未得者句句而求之晝誦而味之中夜而思之平其心易其氣闕其疑則聖人之意見矣朱子曰此條程先生説讀書最為親切今人不會讀書是如何只緣不曽求聖人之意才拈得些小便把己意放裏面胡亂説故教他就聖人意上求問易其氣是如何曰只是放教寬慢今人多要硬把捉住如有箇難理會處便要刻畫百端討出來只説得自底那裏見聖之人之意又舉闕其疑一句歎美讀論語孟子而不知道所謂雖多亦奚以為論語孟子只剩讀著便自意足學者須是玩味若以語言解著意便不足某始作此二書文字既而思之又似剩只有些先儒錯會處却待與整理過朱子曰論孟須是熟讀一一記放心下時時將來玩味久久自然貫通外書下同問且將語孟緊要處看如何伊川曰固是好然若有得終不浹洽蓋吾道非如釋氏一見了便從空寂去朱子曰此程子答吕晉伯問後來晉伯終身坐此病説得孤單入禪學去學者讀書須逐一去理會使通貫浹洽論語有緊要底有泛説底今要著力緊要底便是揀别若如此則孟子中可刪者多矣聖賢言語粗説細説皆著理會教透徹蓋道體至廣大故有説得易處説得難處説得大處説得小處若不盡見必定有窒礙處興於詩者吟詠性情涵暢道德之中而歆動之有吾與點之氣象本注又曰興於詩是興起人善意汪洋浩大皆是此意朱子曰詩本性情有邪有正其為言既易知而吟詠之間抑揚反復其感人又易入故學者之初所以興起其好善惡惡之心而不能自己者必於此而得之者善可為法惡可為戒他書皆然古人獨以為興於詩詩便有感發人底意思今讀之無所感發者正是被諸儒解殺了興起人善意不得今且先置小序及舊説只將元詩虛心熟讀徐徐玩味倣佛見詩人本意却從此推尋將去方有感發以讀詩正在於吟咏諷誦觀其委曲折旋之意自足感發善心謝顯道云明道先生善言詩他又渾不曽章解句釋但優遊玩味吟哦上下便使人有得處瞻彼日月悠悠我思道之云逺曷云能來思之切矣終曰百爾君子不知德行不收不求何用不臧歸於正也又云伯淳嘗談詩並不下一字訓詁有時只轉却一兩字點掇地念過便教人省悟又曰古人所以貴親炙之也朱子曰讀詩之法只是熟讀涵泳自然和氣從胸中流出其妙處不可得而言不待安排立説只平讀著意自足外書下同明道先生曰學者不可以不看詩看詩便使人長一格價朱子曰讀詩便使人長一格今人讀詩何緣會長一格詩之興最不緊要然興起人意處正在興會得詩人之興便有一格長不以文害辭文文字之文舉一字則是文成句是辭詩為解一字不行却遷就他説如有周不顯自是作文當如此葉氏曰詩言周家豈不顯乎言其顯也苟直謂之不顯則是以文害辭看書須要見二帝三王之道如二典即求堯所以治民舜所以事君朱子曰此大槩説讀書之法而已若論堯所以治民舜所以事君是事事做得盡堯典都是治民事舜典都是事君事然亦是治民事或曰若論堯舜治民事君二典亦不足以盡之曰也大槩可見遺書下同中庸之書是孔門傳授成於子思孟子其書雖是雜記更不分精粗一衮説了今人語道多説髙便遺却卑説本便遺却末永按中庸語道髙卑本末皆兼之伊川先生易傳序曰易變易也隨時變易以從道也其為書也廣大悉備將以順性命之理通幽明之故盡事物之情而示開物成務之道也聖人之憂患後世可謂至矣去古雖逺遺經尚存然而前儒失意以傳言後學誦言而忘味自秦而下蓋無傳矣豫生千載之後悼斯文之湮晦將俾後人沿流而求源此傳所以作也易有聖人之道四焉以言者尚其辭以動者尚其變以制器者尚其象以卜筮者尚其占吉凶消長之理進退存亡之道備於辭推辭考卦可以知變象與占在其中矣君子居則觀其象而玩其辭動則觀其變而玩其占得於辭不達其意者有矣未有不得於辭而能通其意者也至微者理也至著者象也體用一源顯微無間觀會通以行其典禮則辭無所不備故善學者求言必自近易於近者非知言者也豫所傳者辭也由辭以得意則存乎人焉朱子曰隂陽有相對而言者有錯綜而言者伊川言易變易也只説得相對之隂陽流轉而已不説錯綜之隂陽交互之理言易須兼此二意固問易即道也何以言變易以從道曰易之所以變易皆理之當然聖人作易因象明理教人以變易從道之方耳如乾初則潛二則見之類是也隨時變易以從道主卦爻而言然天理人事皆在其中今且以乾卦潛見飛躍觀之其流行而至此者易也其定理之當然者道也故明道亦曰其體則謂之易其理則謂之道易中無一卦一爻不具此理所以沿流而可以求其源也易變易也隨時變易以從道正謂伊川這般説話難説蓋他把這書硬定做人事之書他説聖人做這書只為世間人事本有許多變樣所以做這書出來也此序無一字無下落無一語無次序其曰至微者理至著者象也體用一源顯微無間蓋自理而言則即體而用在其中所謂一源也自象而言則即顯而微不能外所謂無間也自理而觀則理為體象為用而理中有象是一源也自象而觀則象為顯理為微而象中有理是無間也體用一源者以至微之理言之則沖漠無朕而萬象照然已具也曰顯微無間者以至著之象言之則即事即物而此理無乎不在也言理則先體而後用蓋舉體而用之理已具是所以為一源也言事則先顯而後微蓋即事而理之體可見是所以為無間也便體用一源者體雖無迹中已有用顯微無間者顯中具微天地未有萬物已具此是體中有用天地既立此理亦存此是顯中有微伊體用是物物而不相離故可言一源有問尹和靖川易傳何處是切要尹云體用一源顯微無間此是最切要處後舉似李延平延平曰尹説固好然須是看得六十四卦三百八十四爻都有下落方始説得此話礙會謂理之所聚而不可遺處通謂理之可行而無所處觀會通是就事上看理之所聚與其所當行處辭謂卦爻之辭欲理會理與象又須辭上理會辭上所載皆觀會通以行其典禮之事凡於事物須就其聚處理會尋得一箇通路行去若不尋得一箇通路只驀地行去則必有礙典禮只是常事會是事之合聚交加難分别處今學者却於辭上看觀其會通以行典禮也問易傳序以行典禮曰如堯舜必自近易於近者非知言者也此伊川喫緊為人處文集下同伊川先生答張閎中書曰易傳未傳自量精力未衰尚覬有少進爾永按程子云易傳已成書但逐旋修補期以七十其書可出來書云易之義本起於數則非也有理而後有象有象而後有數易因象以明理由象以知數得其義則象數在其中矣本注理無形也故因象以明理理既見乎辭矣則可由辭以觀象故曰得其義則象數在其中矣朱子曰伊川晚年文字直是盛得水住易晚年所見甚實觀易傳可見何嘗有一句不著實得其理則象數在中固是如此然泝流以觀却須先見象數的當下落方説得理不走作不然事無實證則虛理易差也必欲窮象之隱微盡數之毫忽乃尋流逐末術家之所尚非儒者之所務也朱子曰已前解易多只説象數自程門以後人方都作道理説易傳言理甚備象數却欠伊川説象只似譬喻看來須有箇象如此只是如今曉他不出王輔嗣伊川皆不信象今却不敢如此説只可説道不及見這箇了且從象以下説免得穿鑿所以有象底意思不可見却只就象上推求道理不可為求象不得便唤做無如潛龍便須有潛龍之象之伊川易傳亦有未盡處當時康節傳得數甚佳却輕不問似此處却間過了知時識勢學易之大方也夬象傳同易傳下大畜初二乾體剛健而不足以進四五隂柔而能止時之盛衰勢之強弱學易者所宜深識也葉氏曰畜之時不利於進初二俱位乎下勢弱不能進也畜之時在於止四五位據乎上勢又足以為止也諸卦二五雖不當位多以中為美三四雖當位或以不中為過中常重於正也蓋中則不違於正正不必中也天下之理莫善於中於九二六五可見震六五傳能朱子曰中重於正正不必中中度量而正在其中如君子而時中則是中無不正若君子有時不中即正未必中蓋正是骨子好了而所作事有未恰好處故未必中也正事之斟酌得宜合理處是中則未有不正者若事雖而處之不合時宜於理無所當則雖正而不合乎中正言中則正在其中矣蓋無正則做中不出來而單言則未必能中也如夷惠諸子其正與夫子同而夫子之中則非諸子所及也也如飢渴飲食是正若過些子便非中節中節處乃中責善正也父子之間則不中欲中須以正為先若不能先見正處又何中之可言如行賞罰須是先看當賞與不當賞然後量賞之輕重若不當賞又何輕重之云乎問胡先生解九四作太子恐不是卦義先生云亦不妨只看如何用當儲二則做儲二使九四近君便作儲二亦不害但不要拘一若執一事則三百八十四爻只作得三百八十四件事便休了胡瑗字翼之號安定先生易問胡安定將乾九四為儲君朱子曰易不可恁地看只是卜筮之書如五雖主君位然亦有不可専主君位言者若只將乾九四為儲位説則古人未立太子者不成是虛却此一爻如一爻只主一事則三百八十四爻乃止三百八十四事之六爻不必限定是説人君如潛龍勿用若是庶人得自當不用人君得之也當退避見龍在田若是衆人得亦可用事易不是限定底物伊川亦自説一爻當一事則三百八十四爻只當得三百八十四事説得自好不知如何到他解卻恁地説問程易説理太多曰伊川求之太深當説三百八十四爻云云其説也好似他解時依舊只作三百八十四般用程子解乾九三云在下之人若德已著此語亦是拘了程子笑胡安定以九四為太子云云此説極是及到他解易却又拘了要之此是通上下而言君臣父子以至事物莫不皆然遺書下同看易且要知時凡六爻人人有用聖人自有聖人用賢人自有賢人用衆人自有衆人用學者自有學者用君有君用臣有臣用無所不通因問坤卦是臣之事人君有用處否先生曰是何無用如厚德載物人君安可不用問讀易貴知時今觀爻辭皆是隨時取義然非聖人見識卓絶盡得義理之正則所謂隨時取義安得不差朱子曰古人作易只是為卜筮今説易者乃是硬去安排聖人隨時取義只事到面前審驗箇是非難為如此安排下也伊川有一段云君有君用臣有臣用説得好及到逐卦解釋却分作聖人之卦賢人之卦更有分作守令之卦者古何嘗有此易中只是言反復往來上下朱子曰程子言易中只是言反復往來上下這只是一箇道理隂陽之道一進一退一長一消反復往來上下於此見之邊易是互相博易之義觀先天圖東邉一畫隂便對西一畫陽東本是陽西本是隂東邉隂畫皆是自西邉來西邉陽畫皆是自東邉來輔廣云程子所謂易中只説反復往來上下者是指此否曰看來程子之意又别邵子易程子多理會他底不得蓋他只據理説都不曽去問他類葉氏曰反復如復姤之類往來如賁無妄之上下如咸恆之類皆隂陽變易之道作易自天地幽明至於昆蟲草木微物無不合葉氏曰易無不該無不合者理之根極本一原也外書下同今時人看易皆不識得易是何物只就上穿鑿若念得不熟與就上添一德亦不覺多就上減一德亦不覺少譬如不識此兀子若減一隻腳亦不知是少若添一隻亦不知是多若識則自添減不得也葉氏曰學者當體此意使於卦象辭義皆的然見其不可易而後為得也遊定夫問伊川隂陽不測之謂神伊川曰賢是疑了問是揀難底問有問盡性至命者朱子不答云不要如此看文字遊定夫問隂陽不測之謂神伊川云云後來人便道遊將難底問大意且要將聖賢言語次第看得分曉自然知得葉氏曰遊氏或未之深思特以此語艱深而率爾請問故伊川不答直攻其心欲使反己而致思也伊川以易傳示門人曰只説得七分後人更須自體究永按此程子不自足之意然義理無窮非可以言盡故朱子又有本義以補程傳之所未備伊川先生春秋傳序曰天之生民必有出類之才起而君長之治之而爭奪息導之而生養遂教之而倫理明然後人道立天道成地道平二帝而上聖賢世出隨時有作順乎風氣之宜不先天以開人各因時而立政暨乎三王迭興三重既備子丑寅之建正忠質文之更尚人道備矣天運周矣聖王既不復作有天下者雖欲倣古之迹亦私意妄為而已事之繆秦至以建亥為正道之悖漢専以智力持世豈復知先王之道也夫子當周之末以聖人不復作也順天應時之治不復有也於是作春秋為百王不易之大法所謂考諸三王而不繆建諸天地而不悖質諸鬼神而無疑百世以俟聖人而不惑者也先儒之傳曰遊夏不能贊一辭辭不待贊也言不能與於斯耳斯道也惟顔子嘗聞之矣行夏之時乘殷之輅服周之冕樂則韶舞此其準的也後世以史視春秋謂褒善貶惡而已至於經世之大法則不知也問伊川謂顔子嘗聞春秋大法何也朱子曰此不是孔子將春秋大法向顔子説蓋三代制作極備矣孔子更不可復作故告以四代禮樂只是百王不易之大法其作春秋善者則取之惡者則誅之意亦只是如此故引以為據耳法四代之禮樂是經世之大法春秋之書亦經世之大然四代之禮樂是以善者為法春秋是以不善者為戒春秋大義數十其義雖大炳如日星乃易見也惟其微辭隱義時措從宜者為難知也或抑或縱或與或奪或進或退或微或顯而得乎義理之安文質之中寬猛之宜是非之公乃制事之權衡揆道之模範也朱子曰春秋大旨其可見者誅亂臣討賊子內中國外夷狄貴王賤伯而已未必如先儒所言字字有義也想孔子當時只是要備二百餘年之事故取史文寫在這裏何嘗云某事用某法某事用某例耶且如書會盟侵伐大意不過見諸侯擅興自肆耳書郊禘大意不過見魯僭禮耳如三卜四卜牛傷牛死是失禮中又失禮也如不郊猶三望是不必望而猶望也如書仲遂卒猶繹是不必繹而猶繹也如此等義却自分明故程子謂春秋大義數十炳如日星者如成宋亂宋災之類乃是聖人直著誅貶自是分明如胡氏謂書晉侯為以常情待晉襄書秦人為以王事責秦穆處却恐未必如此須是己之心果與聖人之心神交心契始可斷他所書之旨不然則未易言也程子所謂微辭隱義時措從宜者為難知耳問孔子有取乎五霸豈非時措從宜曰是又曰觀其豫五霸其中便有一箇奪底意思夫觀百物然後識化工之神聚衆材然後知作室之用於一事一義而欲窺聖人之用心非上智不能也故學春秋者必優遊涵泳默識心通然後能造其微也後王知春秋之義則雖德非禹湯尚可以法三代之治朱子曰春秋序云雖德非禹湯亦可以法三代之治如是則無本者亦可以措之治乎語有欠自秦而下其學不傳豫悼夫聖人之志不明於後世也故作傳以明之俾後之人通其文而求其義得其意而法其用則三代可復也是傳也雖未能極聖人之藴奧庶幾學者得其門而入矣文集詩書載道之文春秋聖人之用詩書如藥方春秋如用藥治病聖人之用全在此書所謂不如載之行事深切著明者也有重疊言者如征伐盟會之類皆欲成書勢須如此不可事事各求異義但一字有異或上下文異則義須别遺書下同五經之有春秋猶法律之有斷例也律令唯言其法至於斷例則始見其法之用也學春秋亦善一句是一事是非便見於此此亦窮理之要然他經豈不可以窮理但他經論其義春秋因其行事是非較著故窮理為要嘗語學者且先讀論語孟子更讀一經然後看春秋先識得箇義理方可看春秋春秋以何為凖無如中庸欲知中庸無如權須是時而為中若以手足胼胝閉戶不出二者之間取中便不是中若當手足胼胝則於此為中當閉戶不出則於此為中權之為言稱錘之義也何物為權義也時也只是説得到義義以上更難説在人自看如何問何物為權義是也朱子曰如人犯一罪性剛者以為可誅性寬者以為可恕槩之以義皆是未合宜此則全在權量之精審須是他平日涵養本原此心虛明純一自然權量精密春秋傳為案經為斷本注程子又云某年二十時看春秋黃聱隅問某如何看某答曰以傳考經之事迹以經别傳之真偽問春秋當如何看朱子曰只如看史樣看問程子以傳考經之事迹以經别傳之真偽如何曰便是亦有不可考處曰其間不知是聖人果有褒貶否曰也見不得見看春秋且須看得一部左傳首尾意思貫通方能略聖人筆削與當時事之大意問讀左傳法曰也只是平心看那事理事情事勢此伊川論春秋傳為案經為斷尹和靖謂伊川無此言兩句即以傳考經之事迹以經别傳之真偽之意非伊川之言而何凡讀史不徒要記事迹須要識其治亂安危興廢存亡之理且如讀高帝紀便須識得漢家四百年終始治亂當如何是亦學也葉氏曰觀髙祖寬大長者能用三傑則知漢所以得天下觀其入關除秦苛法則知漢所以立四百年基業觀偽遊雲夢則知諸侯王以次而叛觀繫蕭相國獄則知漢之大臣多不保終先生每讀史到一半便掩卷思量料其成敗然後却看有不合處又更精思其間多有幸而成不幸而敗今人只見成者便以為是敗者便以為非不知成者煞有不是敗者煞有是底讀史須見聖賢所存治亂之機賢人君子出處進退便是格物元祐中客有見伊川者几案間無他書惟印行唐鑑一部先生曰近方見此書三代以後無此議論范祖禹字淳夫著唐鑑照問范太史文字朱子曰如唐鑑雖是好文字然多管不及評論總意不盡只是文字本體好然無精神所以有照管不到處無氣力到後面便多脫了胡致堂讀史管見方是議論唐鑑議論弱又有不相應處前面説一項事末又説别處去外書橫渠先生曰序卦不可謂非聖人之藴今欲安置一物猶求審處況聖人之於易其間雖無極至精義大槩皆有意思觀聖人之書須遍布細密如是大匠豈以一斧可知哉朱子曰序卦先儒以為非聖人之藴某以為非聖人之精則可謂非易之藴則不可周子分精與藴字甚分明序卦却正是易之藴事事夾雜都有在裏面問如何謂易之精曰太極生兩儀自一箇生出來以至無窮便是精永按謂序卦非聖人之藴韓康伯説橫渠易説天官之職須襟懷洪大方看得蓋其規模至大若不得此心欲事事上致曲窮究湊合此心如是之大必不能得也釋氏錙銖天地可謂至大然不嘗為大則為事不得若畀之一錢則必亂矣又曰太宰之職難看蓋無許大心胸包羅記得此復忘彼其混混天下之事當如捕龍蛇搏虎豹用心力看方可其他五官便易看止一職也朱子曰天官之職是總五官者若其心不大如何包得許多事且冢宰內自王之飲食衣服外至五官庶事自大至小自本至末千頭萬緒若不是大其心者區處應副事到面前便且區處不下況於先事措置思患豫防是著多少精神所以記得此復忘彼佛氏只合下將心頓在無用處才動少便疏脫所以吾儒貴窮理致知便須事事物物理會過今文字在面前尚且看不得況許多事到面前如何奈得他須襟懷大底人始得語録下同古人能知詩者惟孟子為其以意逆志也夫詩人之志至平易不必為艱嶮求之今以艱嶮求詩則已喪其本心何由見詩人之志本注詩人之性情溫厚平易老成本平地上道著言語今須以﨑嶇求之先其心已狹隘了則無由見得詩人之情本樂易只為時事拂著他樂易之性故以詩道其志將朱子曰以意逆志此句最好逆是前去追迎之意是自家意思去等候詩人之志來等得來自然相合此是教人讀書之法自家虛心在這裏看他道理如何來自家便迎接將來今人讀書都是去捉他不是逆志尚書難看蓋難得胸臆如此之大只欲解義則無難也問他書亦須大心胸方讀得如何只説尚書朱子曰他書却有次第尚書只合下便大如堯典自克明俊德以親九族至黎民於變時雍展開是大小大分命四時成嵗便是心中包一箇三百六十五度四分度之一底天方見得恁地若不得一箇大底心胸如何了得讀書少則無由考校得義精蓋書以維持此心一時放下則一時德性有懈讀書則此心常在不讀書則終看義理不見朱子曰張子説得維持字好蓋不讀書則此心便無用處人常讀書庶幾可以管攝此心使之常存書須成誦精思多在夜中或靜坐得之不記則思不起但通貫得大原後書亦易記所以觀書者釋已之疑明已之未達每見每知新益則學進矣於不疑處有疑方是進矣朱子曰讀書須是成誦方精熟今人所以記不得説不去心下若存若亡皆是不精不熟之患橫渠説讀書須是成誦今人所以不如古人處只爭這些子古人記得故曉得今人鹵莽記不得故曉不得緊要處慢處皆須成誦自然曉得也論近與學者講論尤覺橫渠成誦之説最為徑捷蓋未看得義理如何且是收得此心有歸著處不至走作然亦須是専一精研使一書通透爛熟都無記不起處方可别換一書乃為有益若但輪流通念而核之不精則亦未免枉費工夫也須是都通透後又却如此溫習乃為佳耳却讀書無疑者須教有疑有疑者要無疑到這裏方是長進六經須循環理會義理儘無窮待自家長得一格則又見得别如中庸文字輩直須句句理會過使其言互相發明朱子曰橫渠謂讀中庸如此今讀大學亦然某年十七八時讀中庸大學每早起須誦十遍春秋之書在古無有乃仲尼所自作惟孟子能知之非理明義精殆未可學先儒未及此而治之故其説多鑿問先生於春秋未有説朱子曰春秋是當時實事孔子書在册子上後世諸儒學未至而各以己意猜誤正橫渠所謂非理明義精而治之故其説多鑿是也唯伊川以為經世之大法得其旨矣然其間極有無定當難處置處今不若且存取胡文定本子與後來看縱未能盡得之然不中不逺矣近思録集注卷三
