body:
  text: 近思録集注卷四歸安茅星來撰存養存養謂存心養性也此與第五卷皆大學誠意正心修身功夫也而此卷則以涵養於平日者言之凡七十條西山真氏曰大舜十六字開萬世心學之源後之聖賢更相授受雖若不同然大扺教人守道心之正而遏人心之流耳孟子於仁義之心則欲其存而不放本心欲其勿喪赤子之心欲其不失凡此皆所謂守道心之正也易言懲忿窒欲孔子言克己大學言好樂憂患則不得其正孟子言寡欲以小體之養為戒以飢渴之害為喻凡此皆所謂遏人心之流也愚謂近思録此卷所以守道心之正第五卷所以遏人心之流或問聖可學乎濓溪先生曰可有要乎曰有請問焉曰一為要一者無欲也無欲則靜虛動直靜虛則明明則通動直則公公則溥明通公溥庶矣乎通書所朱子曰一即謂太極靜虛明通即圖之隂靜動直公溥即圖之陽動又曰心才虛便明明則道理透徹故通通者明之極也心才直便公公則自無物我之間故溥溥者公之極也靜虛明通精義入神也動直公漙利用安身也又曰靜虛動直便是隂陽明通公溥便是五行則朱子曰此章之旨最為要切學者能深玩而力行之有以知無極之真兩儀四象之本皆不外乎此心而日用間自無别用力處矣又曰學者如何得無欲故伊川只説敬字庶幾執捉得定有下手處伊川先生曰陽始生甚微安靜而後能長故復之象曰先王以至日閉關易傳下同司至日冬至之日也關周禮關注界上之門朱子曰一陽初復陽氣甚微不可勞動故當安靜以養微陽如人善端方萌正欲靜以養之方能盛大饒雙峯曰動者天地生物之心而安靜者聖人裁成之道則政事云為之間凡可以扶陽抑隂而贊參化育者必將無所不用其至矣之愚按上章言純一為學之要此又以善端發動處言所以示學者操存省察之要而不可以其微而忽之者也蓋上章以統體言此則又就其切要處言耳動息節宣以養生也飲食衣服以養形也威儀行義以養德也推己及物以養人也頥卦傳上章言安靜以養微陽此又歷示以養之之道見無時無處而不可以養亦無時無處而可以不養也慎言語以養其德節飲食以養其體事之至近而所繫至大者莫過於言語飲食也頥象傳慎言語節飲食象傳語也真氏曰天地養萬物聖人養賢以及萬民功用至博大也而象傳獨以言語飲食為言者蓋必已得其養而後可推以及人故也俞氏曰頥乃口頰之象故取其切於頥者言之充此言語之類則凡號令政教之出於己者皆所當慎而不可悖出充此飲食之類則凡財賦貨稅之入於上者皆所當節而不可悖入此又就上條中舉其至切要者言之震驚百里不喪匕鬯臨大震懼能安而不自失者惟誠而已此處震之道也震驚百里二句震卦彖傳文也下乃解其意匕以載鼎實升之於俎其形似畢而不兩岐以棘木為之長二尺刋柄與末祭祀之禮先烹牢於鑊既納之鼎而加冪焉將薦乃舉冪而以匕出之升於俎上鬯秬鬯之酒所以灌地而降神鄭康成鬱人注云鬱鬯者築鬱金煮之以和鬯酒鬯人注云秬鬯不和鬱者則是鬱者草名不和以鬱者則直謂之鬯言其氣調鬯也鄭司農及孔穎達則云鬯是香草愚謂後鄭為是楊氏曰震雷能驚百里而不能失匕鬯於主祭之手者蓋執匕鬯以祭則一敬之外無餘念一鬯之外無餘物當是之時白刃前臨猛虎後迫皆莫之覺故震雷驚百里亦莫之聞誠敬所至而懼有所忘也之上二條就處常言此則又就處變時言人之所以不能安其止者動於欲也欲牽於前而求其止不可得也故艮之道當艮其背所見者在前而背乃背之是所不見也止於所不見則無欲以亂其心而止乃安艮彖辭朱子曰人之四肢百骸皆能動作惟背不能動止其背是止於所當止之所據彖傳艮其止止其所也自解得分曉程子謂止於所不見恐如此説費力愚按王弼謂背者無見之物無見則自然靜止程子之説蓋本於此不獲其身不見其身也謂忘我也無我則止矣不能無我無可止之道行其庭不見其人庭除之間至近也在背則雖至近不見謂不交於物也除階除也凡門屏之間曰除朱子曰程子所謂止於所不見者只是非禮勿視聽言動不見其身者蓋外既無非禮之視聽言動則內自不見有私己之欲也不交於物者便是姦聲亂色不留聰明淫樂慝禮不接心術惰慢邪僻之氣不設於身體之意又曰艮其背不獲其身為靜之止行其庭不見其人為動之止總只見道理當如此不見有己亦不見有人也易意本是如此今從伊川説至不獲其身處便説不來行其庭不見其人愈難通明道答橫渠定性書引其語却不差周子通書之説與伊川同外物不接內欲不萌如是而止乃得止之道於止為旡咎也外物不接謂不見其人也內欲不萌謂不見其身也按語類或以外物不接數語為只説得靜時之止而朱子然之蓋接物而當於理欲之動而不失其正固無害其為止也觀彖傳時止則止時行則行動靜不失其時數語可見明道先生曰若不能存養只是説話遺書下同身此為讀書講論者言之蓋古聖賢言語無非心切實之學若不能操存涵養則無以有之於己而所以講論者亦只古人之説話而已謂於身心無干也聖賢千言萬語只是欲人將已放之心約之使反復入身來自能尋向上去下學而上達也約約束也朱子曰反復入身來非謂將已縱出者收拾轉來只是知求則心便在也又曰亦非謂只收放心便了蓋收斂得箇根基方可以做工夫若但知收放心不做工夫則如近日江西所説只是守那死物事放朱子曰昔陳烈先生苦無記性一日讀孟子至求其心句忽悟曰我心不曾收得如何記得遂閉門靜坐不讀書百餘日以收放心却去讀書遂一覽無遺李籲問每常遇事即能知操存之意無事時如何存養得熟曰古之人耳之於樂目之於禮左右起居盤盂几杖有銘有戒動息皆有所養曰上葉本有明道字元李籲字端伯緱氏人舉進士第祐中為祕書省校書郎卒嘗記二先生語一編號師説伊川稱之盤沐浴之盤盂飲器文中子禮樂篇刻於盤盂勒於几杖是也息謂靜時也有銘有戒統承左右起居二句而言此一節言古人所以存養之道見無時無處而不用其力也事陸氏曰朱子白鹿洞學規無誠意正心之目而以處接物易之其發明大學之意最為深切蓋所謂誠意正心者亦就處事接物之際而誠之正之焉耳明乎此而凡陽儒隂釋之學可不待辨而明夫子告顔子克己復禮而以視聽言動實之亦此意今皆廢此獨有理義之養心耳但存此涵養意久則自熟矣敬以直內是涵養意此教以無事時存養之法吕與叔嘗言患思慮多不能驅除朱子曰李先生嘗言心中惡念却易制伏惟間雜思慮乍往乍來相續不斷難為驅除耳曰此正如破屋中禦冦東面一人來未逐得西面又一人至矣左右前後驅逐不暇蓋其四面空疏盜固易入無緣作得主定又如虛器入水水自然入若以一器實之以水置之水中水何能入來蓋中有主則實實則外患不能入自然無事曰上葉本有明道二字毫朱子曰實指理而言蓋以理為主則此心虛明一私意著不得如一泓清水有少許沙土便見邢和叔言吾曹常須愛養精力精力稍不足則倦所以臨事皆勉強而無誠意接賔客語言尚可見況臨大事乎所下諸本並無以字今從遺書增強上聲邢和叔名恕鄭州陽武人此程子述邢恕之言如此亦不以人廢言也倦以氣而言無誠意以心而言接賔客就其事之最近者言之言語言之間尚可見其倦與無誠意也明道先生曰學者全體此心學雖未盡若事物之來不可不應但隨分限應之雖不中不逺矣分音問中去聲而朱子曰全體此心謂此心不為私欲汩沒便是全體之非更有一心能體此心也此等當以意會又曰此亦只為初學言其大概更須下工夫方到得細密的當止於至善處如龜山却是隨力量恁地下梢便都衰塌也又曰明道所謂全體此心者蓋謂涵養本源以為致知力行之地而已未可説得太深亦不是教人止於此而已也如云聖人千言萬語只要人求其放心自能尋向上去下學而上達亦此意居處恭執事敬與人忠此是徹上徹下語聖人元無二語明道語強徹上徹下言自始學以至成德皆不外此但有勉自然之異耳元無二語見無别下工夫處也朱子曰自誠身而言則恭較緊自行事而言則敬為切朱子曰學者讀書須從自己日用躬行處著力體驗不可有少虧父處伊川先生曰學者須敬守此心不可急迫當栽培深厚涵泳於其間然後可以自得但急迫求之只是私己終不足以達道朱子曰栽如種得一物在此但涵養持守之功繼繼不已是謂栽培深厚如此而優遊涵泳於其間則浹洽而有以自得矣苟急迫求之則此心已自躁迫紛亂只是私己而已終不能優遊涵泳以達於道也事胡敬齋曰心不可放縱亦不可逼迫故程子以必有焉而勿正心勿忘勿助長為存心之法雖借孟子之言其義甚精明道先生曰思無邪毋不敬只此二句循而行之安得有差有差者皆由不敬不正也差初加反無朱子曰毋不敬是用功處所謂正心誠意也思邪思至此自然無邪乃功深力到處所謂心正意誠也又曰學者求無邪思當於正心誠意處著力然不先致知則正心誠意之功無所施而所謂敬者亦不得其道所以應事接物處皆顛倒也故聖人教人必先自致知始愚按明道所言思無邪當與毋不敬一例看皆在用功處説觀下循而行之諸語可見不必如朱子所分也今學者敬而不見得又不安者只是心生亦是太以敬來做事得重此恭而無禮則勞也見近本俱作自今從遺書及宋本此言敬而不和之病敬則此心常存必有所得不見得者謂不見有所得也若作自字便與下不安犯復矣恭者私為恭之恭也禮者非體之禮是自然底道理也只恭而不為自然底道理故不自在也須是恭而安此明所以恭而無禮則勞之故私為恭者言恭乃人之私自為之而非其本然者也非體之禮言禮無形體可求故人為之恭以明禮之意然必循自然之禮以出之則自在也不為自然便是私為恭之恭今容貌必端言語必正者非是道獨善其身要人道如何只是天理合如此本無私意只是箇循理而已此又明所以能恭而安之故如朱子曰學者初要持敬身心何便得安須先有些勉強始得又曰著意把捉不得須是先理會箇道理今志於義理而心不安樂者何也此則正是剩一箇助之長雖則心操之則存舍之則亡然而持之太甚便是必有事焉而正之也亦須且恁去樂音洛長張丈反恁女禁反以恁如此也指上持字而言言不可持之太甚便放下手亦須且如此持守去也當朱子曰整頓收斂固不無操持太甚之患然學者且就整頓收斂處著力但不可用意安排等候即成病耳如此者只是德孤德不孤必有鄰到德盛後自無窒礙左右逢其原也此條語類以為明道語如此者指上恁字而言孤謂所得孤單别無所有也德盛則不孤矣至於左右逢原則有鄰矣與論語本文意别敬而無失便是喜怒哀樂未發謂之中敬不可謂中但敬而無失即所以中也樂音洛之此因學者每欲求中於未發時故言此以見不必别求也敬則此心常渾然在中作主宰自不為事物所擾亂故云即所以中伊川先生曰司馬子微嘗作坐忘論是所謂坐馳也微遺書注一作綦司馬子微名承禎唐洛州溫人開元中被召至都玄宗詔於王屋山置壇室以居卒年八十九贈銀青光祿大夫諡貞一先生坐忘見莊子大宗師篇按程子又曰有忘之心乃是馳也葉少藴曰子微作坐忘論七篇一敬信二斷緣三收心四簡事五真觀六泰定七得道又為樞一篇以總其要而别為三戒曰簡緣無欲靜心且謂得道者心有五時身有七候一動多靜少二動靜相半三靜多動少四無事則靜事觸還動五心與道合觸而不動謂之五時一舉動順時容色和悅二宿疾益消心身輕爽三填補夭傷還元復命四延數千歲名曰仙人五煉形為氣名曰天人六煉氣為神名曰神人七煉神合道名曰至人謂之七候道釋二氏本相矛盾而子微之學乃全本於釋氏大扺以戒定慧為宗觀七篇序可見伯淳昔在長安倉中間坐見長廊柱以意數之已尚不疑再數之不合不免令人一一聲言數之乃與初數者無差則知越著心把捉越不定數並上聲差初加反西伊川語長安縣名今𨽻安府人心作主不定正如一個翻車流轉動搖無須臾停所感萬端若不作一箇主怎生奈何葉本章首有明道先生曰五字若不做上遺書有心字翻車今農家所用以引水溉田者也按後漢書靈帝使掖庭令畢嵐作翻車渴烏施於橋西用灑南北郊路以為可省百姓灑道之費又魚豢魏略明帝時博士扶風馬鈞為園以無水灌溉乃作翻車令兒童轉之引水蓋今水車所自始也又爾雅釋器篇繴謂之罿罬也罬謂之罦覆車也郭璞云今之翻車也有兩轅中施罥以捕烏然則翻車固有二今觀所言流轉動搖無須臾停云云則是謂水車也此極言作主不定之病張天祺昔嘗言自約數年自上著牀便不得思量事不思量事須強把他這心來制縳亦須寄寓在一箇形象皆非自然君實自謂吾得術矣只管念箇中字此又為中所繫縳且中字亦何形象強如字須強上遺書有後字繫縳上遺書無所字且中下近本俱無字字此又引張與司馬二公之事以明上文之意強把這心以下乃程子窮極其弊病以見天祺不思量事之非自然也為中所繫縳以下亦程子推言其弊如此也愚按天祺欲制其外來者使不以動吾之心溫公欲守其在中者使不為外物所動朱子所謂硬截死守是也久朱子曰如釋氏云如何是佛教人專在此行思坐想後忽然有悟意正如此譬如人有箇家不自作主却倩别人來作主所以伊川云持其志且教人就裏面理會也有人胸中常若有兩人焉欲為善如有惡以為之間欲為不善又若有羞惡之心者本無二人此正交戰之驗也持其志使氣不能亂此大可驗要之聖賢必不害心疾間去聲羞惡之惡去聲使遺書作便字此因人心有善惡交戰之驗而示以定之法也兩此並指胸中若有兩人四句而言交戰者見其不能自安於不善也戰勝則為善矣戰不勝則為不善矣此正要緊關頭持其志二語所以豫以自勝之道也大可驗言大可驗其志之能持與否也心疾亦指首四句言也某寫字時甚敬非是要字好只此是學明道語寫説文謄移禮書也儀禮特牲饋食卒筮寫卦漢書藝文志置寫書之官寫字之寫始此薛氏曰事有大小理無大小若於事之小者稍有忽略則天理即有欠缺間斷故寫字事雖小而必敬者所以存天理也伊川先生曰聖人不記事所以常記得今人忘事以其記事不能記事處事不精皆出於養之不完固不記事者心之虛也常記得者心之明也朱子曰常人記事忘事只是著意之故明道先生在澶州日修橋少一長梁曾博求之民間後因出入見林木之佳者必起計度之心因語以戒學者心不可有一事澶呈延反度音鐸軍澶州於石晉為鎮寧節度先生差簽書判官故在澶州或問凡事須思而後通安可謂心不可有一事朱子曰事如何不思但事過則不留於心可也一問佛氏但願空諸所有固不是然明道謂心不可有事如在試院推算康節數明日問之則已忘矣恐亦空諸所有意朱子曰此出上蔡語録只録得他自己意顔子得一善則拳拳弗失與孟子必有事而弗忘何嘗要人如此入道莫如敬未有能致知而不在敬者朱子曰未知者非敬無以知己知者非敬無以守今人主心不定視心如冦賊而不可制不是事纍心乃是心纍事當知天下無一物是合少得者不可惡也惡去聲心此節申明不可不敬之意主所以為心之主宰者也纍繫纍也物即事也無一物是合少得者則當即物以窮其理而順其理之所當然以應之不可惡其為心之纍而欲一切屏棄之也惡字應上視心如冦賊而不可制之意而言人只有一箇天理却不能存得更做甚人也按遺書或問人與禽獸甚懸絶矣孟子言人之所以異於禽獸者幾希莫是只在去之存之上有不同處伊川答以固是而因語之以此也人多思慮不能自寧只是做他心主不定要作得心主定惟是止於事為人君主於仁之類如舜之誅四凶四凶已作惡舜從而誅之舜何與焉已當讀作人已之已或因以誤遺書注一作他與音預止於事者謂各隨其事之所當止而止之也止則不為他事所惑故心主自定已作惡者言四凶自己作惡也人不止於事只是攬他事不能使物各付物物各付物則是役物為物所役則是役於物有物必有則須是止於事此節反覆申明當止於事之意不止於事則中無主宰而事物雜投如見他人之事而為之兜攬者言其不切己也不切己則必不能盡其事之所當然之道故不能使物各付物物即事也則猶道也問有事則止於事無事時何所止曰止於敬而已朱子謂靜時能存養則應接處始得力又不可以不知也以上並伊川語不能動人只是誠不至於事厭倦皆是無誠處誠以待人則人無不感凡事上接下皆然誠以處事則事無不成凡在已在人一也靜後見萬物自然皆有春意心王於敬則無復思慮紛擾自靜靜後而此心至虛至明與天地生意常相接故見萬物自然皆有春意萬物之生意無時間斷獨言春者以春則物生之初生意尤易見也詳見首卷萬物之生意條下可張氏曰明道書窗前有草木覆砌或勸之芟明道不云欲常見造物生意又置盆池畜小魚數尾時時觀之云欲觀萬物自得意草之與魚人所共見惟明道見草則知生意見魚則知自得意此豈流俗之見可同日而語孔子言仁只説出門如見大賔使民如承大祭看其氣象便須心廣體胖動容周旋中禮自然惟慎獨便是守之之法胖音盤中去聲事問孔子告仲弓方是持敬之程子如此説豈不有自然勉強之異乎朱子曰程子之言舉敬之極致而言也陳定宇曰程子恐人認見賔承祭作勉強拘束之敬故云然蓋欲如所謂禮之用和為貴也又曰謹獨便是守之之法又恐人外貌如此而中心不如此必於一念萌動已所獨知之地而致謹焉便是持守此敬之法聖人修己以敬以安百姓篤恭而天下平惟上下一於恭敬則天地自位萬物自育氣無不和四靈何有不至此體信達順之道禮運曰鳯凰麒麟皆在郊藪龜龍在宫沼所謂四靈畢至也又曰體信而達順朱子曰體信是實體此道於身達順是發而皆中節推之天下而無所不通也體信是忠無一毫之偽達順是恕無一物不得其所又曰體信是致中意達順是致和意聰明睿知皆由此出以此事天饗帝人惟惰慢故身心放逸而昏昧蔽塞敬則虛靜而自然通達矣葉氏曰天以理言故曰事動靜語默無非事也帝以主宰言故曰饗如郊祀之類朱子曰聰明睿智皆由此出此便是自誠而明存養熟後泰然行將去便有進不愧屋漏則心安而體舒心要在腔子裏腔子猶今言軀殼也朱子曰但於應事接物時一一中理便是在也若只兀然守此心則是釋氏入定坐禪一旦有事至於吾前此心便已放失問於未應接時如何曰只是戒謹恐懼而已只外面有些隙便走了隙下近本並有罅字遺書同今遵宋本邪陳氏曰非是裏面本體走出外去只為念感物逐他去而本然之正體遂為所昏蔽此所以要操存涵養而不使有些罅隙以至走出之患也人心常要活則周流無窮而不滯於一隅朱子曰天理便是活人欲便是死如大學之有所憂患好樂皆滯於一隅也或疑主一則滯於一隅曰不主一則方理會此事而心留於彼此正是滯於一隅明道先生曰天地設位而易行乎其中只是敬也敬則無間斷間去聲子天地設位句見易繫辭上傳朱曰天地亦是有主宰方始如此變易無窮便是天地之敬問恐是説天地間實理如此曰就天地之間言之是實理如此就人身上言之惟敬然後見得理之實處流行不息敬才間斷便不誠不誠便無物是息也王伯厚曰易立乎其中體也易行乎其中用也朱子謂行以造化言立以卦位言人朱子曰聖人本意言自然造化流行程子却借來就身上而言敬則此理流行不敬則間斷前輩引經文多是如此如必有事焉孟子本謂做工夫處程子却引來説自然道理毋不敬可以對越上帝毋不敬説見記曲禮篇朱子曰只是內無妄思外無妄動也愚按不妄思則心之所存無非天理不妄動則外之所為無非天理故可以對越上帝敬勝百邪朱子曰學者常提醒此心使如日之升則羣邪自息不要苦著力著力則反不是朱子曰自秦漢以來儒者皆不識敬字至程子説得如此親切程沙隨猶非之以為孔孟無單説敬字者如敬親敬長之類不知修己以敬敬而無失聖敬日躋何嘗不單獨説來若有親長時用敬則無親長時便不敬乎亦弗思甚矣敬以直內義以方外仁也當理而無私心為仁敬以直內則心無所容其私義以方外則事又各當於理故曰仁也若以敬直內則便不直矣必有事焉而勿正則直也以敬直內便有正助之病故不直言敬而義可見故不别言以上並明道語涵養吾一伊川語涵一不二不雜指心之本體言也有以養之而此心湛然虛明不至有昏昧放逸之患矣子在川上曰逝者如斯夫不舍晝夜自漢以來儒者皆不識此義此見聖人之心純亦不已也純亦不已天德也有天德便可語王道其要只在慎獨明道語則朱子曰能慎獨則無間斷而其理不窮若少有不謹人欲乘之而此心不能無間斷矣又曰川流不息天運也純亦不已聖人之心也謹獨所以為不已學者之事也不有躬無攸利不立已後雖向好事猶為化物不得以天下萬物撓己巳立後自能了當得天下萬物語類以為伊川語爻不有躬無攸利蒙卦六三辭也撓撓亂也了當猶言了辦也己未能自立則心無所主雖為善事亦不過見事之善勉強行之終是為物所化是不免以天下萬物撓亂已也若能自立則應酬在我物皆聽命何撓之有朱子曰學者平日講究治國平天下之道却於自己身心全未曾理會得則是明德未明而欲民之有以新也無是理也伊川先生曰學者患心慮紛亂不能寧靜此則天下公病學者只要立箇心此上頭儘有商量立箇心者謂敬謹操持不為事物所搖奪則自無紛亂不能寧靜之患矣此上頭儘有商量者言可為學以進於道也朱子曰學者求放心正為要立基址得此心有存主處為學便有歸著可以用功間邪則誠自存不是外面捉一箇將來存著今人外面役役於不善於不善中尋箇善來存著如此則豈有入善之理只是間邪則誠自存此節總以明間邪則誠自存之意故孟子言性善皆由內出只為誠便存間邪更著甚工夫但惟是動容貌整思慮則自然生敬上言間邪則誠自存此節見誠為人心之自然不假外求誠存則邪自無從入更無所用其間之之功也孟子言性善如所謂乍見孺子入井而有怵惕惻隱之心孩提知愛親稍長知敬兄之類是也皆由內出便是誠也性善則自無有邪也動容貌以外言整思慮以內言敬勝百邪正見間邪不必著甚工夫也敬只是主一也主一則既不之東又不之西如是則只是中既不之此又不之彼如是則只是內存此則自然天理明學者須是將敬以直內涵養此意直內是本承上文敬字而言其義不之東不之西則不偏於一隅故云只是中不之此不之彼則不為外物所動故云只是內總以明主一之義朱子曰主一則所講底義理方始為我有不然便無安著處本注尹彥明曰敬有甚形影只收斂身心便是主一且如人到神祠致敬時其心收斂更著不得毫髮事非主一而何按和靖自言初見伊川時教看敬字焞請益伊川曰主一則是敬當時雖領此語然不若近時看得更親切祁寬因問如何是主一而尹氏語之以此之魏鶴山曰孔門説仁處大抵都有敬意如四勿二如類是也左傳敬德之聚能敬必有德此意極精自聖學不明率往往以擎跽曲拳正坐拱默之類為敬至周程以後如誠字敬字仁字方得聖賢本指其所謂主一無適之謂敬最為親切間邪則固一矣然主一則不消言間邪間邪使邪不能入則心自一矣然心一則邪自無從可入更無所事於間也有以一為難見不可下工夫如何一者無他只是整齊嚴肅則心便一一則自是無非僻之姦此意但涵養久之則天理自然明姦近本作千古字通用疑有以一為難見不可下工夫程子因門人有此故教之以整齊嚴肅使有下工夫處也整齊嚴肅如正衣冠尊瞻視之類一專一也朱子曰主一如持其志間邪如無暴其氣間邪使邪不得入主一則守之於內二者不可有偏此內外交相養之道也有言未感時知何所寓知指心之知覺而言與他處知字不同曰操則存舍則亡出入無時莫知其鄉更怎生尋所寓只是有操而已操之之道敬以直內也朱子曰若未感時更尋所寓便是有兩箇物事所以道只有操而已只操便是主宰在這裏敬則自虛靜不可把虛靜喚作敬朱子曰周子説主靜正是要人靜定其心自作主宰程子又恐只管求靜遂與事物不交涉故説敬字又曰若把虛靜喚作敬則恐入釋老去學者先務固在心志然有謂欲屏去聞見知思則是絶聖棄知有欲屏去思慮患其紛亂則須坐禪入定如眀鑑在此萬物畢照是鑑之常難為使之不照人心不能不交感萬物難為使之不思慮此一節總以見思慮不能無之意絶聖棄知見老子道德經上篇坐禪入定見佛書若欲免此惟是心有主如何為主敬而已矣有主則虛虛謂邪不能入無主則實實謂物來奪之此一節所以示學者以有思慮而不至於紛亂之道也或問程子言有主則實此又言有主則虛何也朱子曰此只是有主於中外邪不能入自其有主於中言之則謂之實自其外邪不入言之則謂之虛又曰有主則實指理而言無主則實指私欲而言大凡人心不可二用用於一事則他事更不能入者事為之主也事為之主尚無思慮紛擾之患若主於敬又焉有此患乎焉於虔反言此又以常情之見心之不可無主以明上文有主則虛邪不能入之意心用於一事他事更不能入凡人類然但若心在此事或為此不審耳所牽擾便無復湛然虛明之體此又不可以朱子曰或謂主一主事不同恐亦未然蓋無事則湛然安靜而不騖於動有事則隨事應變而不及乎他是所謂主事者乃所以為主一者也若有所係戀則必有事已過而心未忘身在此而心在彼者與主一無適非但不同直是相反愚按朱子謂主事即所以為主一與程子説小異蓋程子從常情之主事言之則主事與主一有别朱子直就主事之正理言之則主事即所以為主一二説雖異而其實相發明也所謂敬者主一之謂敬所謂一者無適之謂一且欲涵泳主一之義不一則二三矣至於不敢欺不敢慢尚不愧於屋漏皆是敬之事也此節釋敬字之義以及其事也不敢欺以內而言不敢慢以外而言不愧屋漏又兼內外而言之也朱子曰無適者持守得定不馳騖走作之意耳無適即是主一主一即是敬非無適之外别有主一主一之外又别有敬也問應此事未畢復有一事至則當何如曰須是一事畢又理會一事亦無雜然而應之理但甚不得已則權其輕重可也陳北溪曰無事時心常在這裏不走作固是主一有事時心主著這箇事更不把别箇事來參插也是主一真西山曰周子主靜之言程子主一之訓皆其為人最切者也而朱子又丁寧反覆之學者誠於是而知勉焉戒於思慮之未萌謹於事物之既接無少間斷則德全而欲泯矣嚴威儼恪非敬之道但致敬須自此入朱子曰整齊嚴肅亦是如此舜孳孳為善若未接物如何為善只是主於敬便是為善也以此觀之聖人之道不是但默然無言主於敬則惡念無從而入故曰便是為善朱子曰程子未接物時之論尤能發明孟子言外之意學者所當深念也然程子又嘗言不獨財利之利凡有利心便不可如作一事須求自家穩便處皆利心也如此則善利之間相去毫髮苟辨之不明其不反以利為善者鮮矣此大學之道所以雖以誠意正心為重而必以致知格物為先也問人之燕居形體怠惰心不慢者可否遺書慢下無者字曰安有箕踞而心不慢者昔吕與叔六月中來緱氏間居中某嘗窺之必見其儼然危坐可謂敦篤矣學者須恭敬但不可令拘迫拘迫則難久也踞居御反緱居侯反間音間敦下楊本無篤字久下一本無也字也遺書作矣箕踞申兩足以手據膝形如箕也漢書張耳傳作箕倨曲禮坐母箕緱氏宋縣名屬河南府熙寧五年省偃師入緱氏八年復置偃師縣省緱氏為鎮尹和靖曰嘗親聞此乃謂劉質夫也薛敬軒曰古人衣冠偉博皆所以莊其外而肅其內也後人服一切簡便短窄之衣起居動靜惟務安適所以流為輕佻浮薄不可救藥也思慮雖多果出於正亦無害否伊川曰且如在宗廟則主敬朝廷主莊軍旅主嚴此是也如發不以時紛然無度雖正亦邪吕與叔患思慮紛擾程子告以主於敬則自然不紛擾因又以此為問而程子語之如此敬以事言莊以容言嚴以法言三者亦非截然分屬蓋程子特各就其重者言之耳蘇季明問喜怒哀樂未發之前求中可否蘇季明名昞武功人亦橫渠門人而卒業於程氏者元祐末吕進伯薦其德性純茂強學篤志自布衣召為博士後坐上書邪黨竄鄱陽曰不可既思於喜怒哀樂未發之前求之又却是思也既思即是已發本注思與喜怒哀樂一般才發便謂之和不可謂之中也樂音洛言朱子曰程子才思即是已發一語能發明子思外之意蓋言不待喜怒哀樂之發但有所思即是已發此意已極精微説到未發界至十分盡頭不可以有加矣又問吕學士言當求於喜怒哀樂未發之前如何吕學士謂與叔但按與叔於元祐中為太學博士祕書省正字未嘗為學士疑學字乃博字之訛今中庸輯略作博士曰若言存養於喜怒哀樂未發之前則可若言求中於喜怒哀樂未發之前則不可胡敬齋曰學者做工夫不可太過太過反成助長如與叔所謂求見未發之中執而弗失亦是太過處雖橫渠不免此病如曰不舍其虛明善應之體之類是也羅豫章令李延平靜坐中看喜怒哀樂未發時作何氣象李先生謂此意不惟於進學有力亦是養心之要陸氏曰朱子言敬每云略綽提撕蓋惟恐學者下手過重不免急迫之病故於延平觀喜怒哀樂未發一語雖悔其始之辜負而服膺之然於觀之一字則到底不敢徇見於答劉淳叟諸書至觀心説一篇極言觀之病雖指佛氏而言而延平之言不能無病亦在其中此用力於敬者所不可不知也又問學者於喜怒哀樂發時固當勉強裁抑於未發之前當如何用功曰於喜怒哀樂未發之前更怎生求只平日涵養便是涵養久則喜怒哀樂發自中節強區兩反中去聲時問未發時當以理義涵養朱子曰未發著理義不得才知有理有義便是已發當此時有理義之原未有義理條件只一箇主宰嚴肅便是涵養工夫曰當中之時耳無聞目無見否曰雖耳無聞目無見然見聞之理在始得朱子曰程子耳無聞目無見之答以下文若無事時須見須聞之説參之其誤必矣蓋未發之時但為未有喜怒哀樂之偏耳若其目之有見耳之有聞則當愈益精明而不可亂豈若心不在焉而遂廢耳目之用哉賢且説靜時如何曰謂之無物則不可然自有知覺處朱子曰無物字恐當作有物字愚按粹言作有物曰既有知覺却是動也怎生言靜朱子曰此語恐説得太過若云知寒覺暖便是知覺已動今未曾著於事物但有知覺在何妨其為靜不成靜坐便只是瞌睡也人説復其見天地之心皆以謂至靜能見天地之心非也復之卦下面一畫便是動也安得謂之靜此承上既有知覺怎生言靜之意而言非以徴喜怒哀樂未發至靜之時也朱子乃謂於易卦當為純坤不為無陽之象而不得以復之一陽已動為比蓋誤以此為言喜怒哀樂之未發故耳或曰莫是於動上求靜否曰固是然最難釋氏多言定聖人便言止所謂止如為人君止於仁為人臣止於敬之類是也易之艮言止之義曰艮其止止其所也人多不能止蓋人萬物皆偹遇事時各因其心之所重者更互而出才見得這事重便有這事出若能物各付物便自不出來也便言止下近本無所謂止三字今照遺書及宋本增釋氏為釋迦之教者定即前所謂坐禪入定是也萬物如喜怒哀樂之類皆是更互而出如或喜或怒或哀或樂是也蓋人萬物皆備無所偏倚隨感而應各當其可便是止其所也若心有偏重則因物而遷所以人多不能止也朱子曰止於仁敬者靜也欲止於仁與敬者便是動一動一靜循環無端或曰先生於喜怒哀樂未發之前下動字下靜字曰謂之靜則可然靜中須有物始得這裏便是難處學者莫若且先理會得敬能敬則知此矣問靜中有物者何朱子曰只太極也又曰此即坤中不能無陽到動處却是復只將十二卦排便見復朱子曰未發之時必有事焉是乃所謂靜中之知覺之所以見天地之心也及其已發隨事觀省是則所謂動上求靜艮之所以止其所也持敬之功則貫乎動靜之間而學者不可有須臾之間斷者也或曰敬何以用功曰莫若主一季明曰昞嘗患思慮不定或思一事未了他事如麻又生如何曰不可此不誠之本也須是習習能專一時便好不拘思慮與應事皆要求一昞同炳亦作昺必井反在麻謂苧麻也陸璣草木疏云苧一科數十莖宿根土中至春自生不須栽種一歲三刈故以為心亂之喻其餘如苘麻大麻之類則須種乃生又一科一莖一歲一刈便不得為心亂之喻矣無朱子曰修養家無者硬想成有參禪家有者硬想成亦是專一方有功然彼所為却難今以人所固有之理而自求之却甚順而易答朱子曰此條是聽他人之問而從旁竊記非惟未了者之意亦未悉問者之情故其謬誤最多讀者詳之人於夢寐間亦可以卜自家所學之淺深如夢寐顚倒即是心志不定操存不固此下二條皆答劉安節之問也問人心所繫著之事果善夜夢見之莫不害否曰雖是善事心亦是動凡事有眹兆入夢者却無害舍此皆是妄動按周禮春官占夢一正夢二噩夢三思夢四寤夢五喜夢六懼夢心所繫著而夢周禮噩夢以下皆是即樂廣所謂想也惟有眹兆入夢者周禮所謂正夢樂廣所謂因也程子特從而論其得失如此可朱子曰聖人無所不用其敬觀周禮夢亦有官掌之見愚每夢見故舊親戚次日若不見其人亦必接其書信或人説及如此等便是正夢又曰吾不復夢見周公自是箇徴兆如此蓋聖人志慮未衰天意猶有運轉故遂夢見周公非以思慮也要之聖人精神血氣與時運相為流通楊泳齋曰如髙宗夢得傳説則自信而不疑營求於野而果得之常人心志不定雖有夢而不敢自信也人心須要定使他思時方思乃是今人都由心曰心誰使之曰以心使心則可人心自由便放去也今人都由心謂心無所主宰也方以心使心句所以明使他思時思之意人心自由以下所以明今人都由心之意問以心使心句有病否朱子曰無病其意只欲此心有所主宰陳安卿曰上心字即是道心專以理義言之也下心字即是人心而以形氣言之也以心使心則是道心為一身之主而人心其聽命也亦通持其志無暴其氣內外交相養也説見孟子心之所之謂之志心有所之當敬謹操持不可妄有向往無暴其氣者如一語言一步趨安詳和緩以至喜怒有節之類皆是志不持則無以養其氣而氣不養則雖欲持其志不可得也故曰內外文相養也愚按敬以直內則志自持矣義以方外則氣無暴矣問出辭氣莫是於言語上用功夫否曰須是養乎中自然言語順理若是慎言語不妄發此却可著力論語曾子曰出辭氣斯逺鄙倍矣却可著力言猶可勉強也惟養乎中使自然順理乃為難耳先生謂繹曰吾受氣甚薄三十而浸盛四十五十而後完今生七十二年矣挍其筋骨於盛年無損也繹曰先生豈以受氣之薄而厚為保生耶夫子默然曰吾以忘生徇欲為深恥挍校通生張南軒曰若他人養要康強只是利伊川説出來純是天理以上並伊川語大率把捉不定皆是不仁外書下同湛皆是不仁原所以把捉不定之故也朱子曰人心本然虛定私欲奪之而動搖紛擾矣然則把捉得定其惟篤於持敬乎伊川先生曰致知在所養養知莫過於寡欲二字朱子曰欲寡則無紛擾之雜而知愈以明無變遷之患而得愈以固故欲養其知者當思有以寡其欲也問既致知後如此養否曰此不分先後未知而不養固無以致知既知而失其所養則知亦不能以無失矣心定者其言重以舒不定者其言輕以疾朱子曰言發於心心定則言必審故的確而舒遲不定則內必紛擾有不待思而發故淺易而急迫此亦氣動志之一驗也明道先生曰人有四百四病皆不由自家只是心須教由自家四百四病者地水火風四者各有一百一病合之為四百四病也説見佛書要看須教二字言當操而存之不可聽其出入也謝顯道從明道先生於扶溝明道一日謂之曰爾輩在此相從只是學皓言語故其學心口不相應盍若行之請問焉曰且靜坐伊川每見人靜坐便歎其善學扶溝縣名宋屬開封府時明道知扶溝縣故其門人多於此相從也朱子曰亦是程子見人多間雜思慮故教之收拾此心耳然終是小偏蓋道理自有動時有靜時學者不可不專於靜處求伊川謂只用敬不用靜便説得平亦是伊川經歷多故見得如此又曰方無事時敬於自持及應事時敬於應事讀書時敬於讀書便自然該貫動靜心無時不存橫渠先生曰始學之要當知三月不違與日月至焉內外賔主之辨使心意勉勉循循而不能已過此幾非在我者文集勉説見論語勉工夫不間斷也循循有次序貌朱子曰三月不違者心常在內雖間或有出時然終是在外不穩才出便入蓋心安於內所以為主日月至焉者心常在外雖間或有入時然終是在內不安才入便出蓋心安於外所以為賔此無他知有致未致意有誠未誠也問過此幾非在我者得曰此只説循循勉勉自然住不得但此關難過才過則所謂欲罷不能如水漲船行更無著力處心清時少亂時常多其清時視明聽聰四體不待羈束而自然恭謹其亂時反是如此何也蓋用心未熟客慮多而常心少也習俗之心未去而實心未完也宋本與下分作二條但按下文人又要得剛句則此與下本是相承説自不得分為二今從近本併之勝朱子曰客慮是泛泛思慮習俗之心是從來習染偏之心實心是義理之心乂曰橫渠大段用功夫來説得更精切學者固未免有散緩時但才覺便收斂漸漸做去但得收斂時多散緩時少便是長進處人又要得剛太柔則入於不立亦有人生無喜怒者則又要得剛剛則守得定不回進道勇敢載則比他人自是勇處多語録下同要此承上節而言雖用心漸熟必剛而後可以有為也不立如為外物所動皆是而喜怒為甚故下接言亦有無喜怒者如劉寬牛𢎞之類終身不見其有喜愠之色而卒不能有所作為故曰又要得剛蓋入於不立則守不定而回惟剛則守得定而不回矣無喜怒者或苦於進道之不勇而剛則進道勇敢矣末句勇即剛也兼不回勇敢而言變文言勇者固張子不敢以剛自居之意亦以發用處言也過朱子曰剛雖未必中道然終是有筋骨孔門曾子便於剛與孟子相似世衰道微人欲橫流若非剛介有筋骨人定立不住又曰橫渠作正蒙時或夜裏默坐徹曉他直是如此勇方做得戲謔不惟害事志亦為氣所流不戲謔亦是持氣之一端朱子曰橫渠學力絶人尤勇於改過獨以戲謔為無傷一日忽曰凡人之過猶有出於不知而為之者至戲謔則皆有心為之其為害尤甚遂作東銘正心之始當以己心為嚴師凡所動作則知所懼如此一二年守得牢固則自然心正矣朱子曰持守之要固貴此心常自整頓然學未講理未明亦有錯認人欲作天理者又不可以不察也定然後始有光明若常移易不定何求光明易大抵以艮為止止乃光明故大學定而至於能慮人心多則無由光明易説下同次大畜彖曰能止健大正也朱子曰凡人胸煩擾則愈見昏昧中有定止則自然光明莊子所謂泰宇定而天光發也愚按學者見理不明則不知所止故無以有定而光明此大學言止於至善所以必以知止為先也動靜不失其時其道光明學者必時其動靜則其道乃不蔽昧而明白動靜不失其時二句艮彖傳文也學者以下乃張子所以釋彖傳之意今人從學之久不見進長正以莫識動靜見他人擾擾非關己事而所修亦廢由聖學觀之冥冥悠悠以是終身謂之光明可乎長張丈反者此一節言今之學不能時其動靜之病從學謂人之從已為學者也見他人擾擾初非關已之事也而已亦為其所動不能存誠養志以至於光明故曰所修亦廢此所以必行其庭不見其人而後可以止也朱子曰學問臨事不得力固是靜中欠却工夫然欲舍動求靜又無此理蓋人之身心動靜二者循環反覆無時不然但常存此心勿令放失則隨動隨靜無時不是用力處矣敦篤虛靜者仁之本仁之本言是乃為仁之本也不輕妄則是敦厚也無所繫閡昏塞則是虛靜也此難以頓悟苟知之須久於道實體之方知其味夫仁亦在乎熟之而已閡礙同篤孟子説字閡隔礙也不輕妄四句明敦虛靜四之意此難以頓悟以下乃申明敦篤虛靜所以為為仁之本也蓋不輕妄無所繫閡昏塞之為敦篤虛靜人猶或知之而敦篤虛靜之所以為為仁之本則非久於其道實有以體驗之於心不能知也張子引而不發亦欲學者深思而自得之耳橫以上並渠語近思録集注卷四欽定四庫全書近思録集注卷四婺源江永撰朱子曰此卷存養或問聖可學乎濓溪先生曰可有要乎曰有請問焉曰一為要一者無欲也無欲則靜虛動直靜虛則明明則通動直則公公則溥明通公溥庶矣乎朱子曰此章之旨最為要切然其辭義明白不煩訓解學者能深玩而力行之則有以知無極之真兩儀四象之本皆不外乎此心而日用間自無别用力處矣通書伊川先生曰陽始生甚微安靜而後能長故復之象曰先王以至日閉關朱子曰一陽初復陽氣甚微不可勞動故當安靜以養微陽如人善端方萌正欲靜以養之方能盛大易傳下同動靜節宣以養生也飲食衣服以養形也威儀行義以養德也推己及物以養人也頤卦傳慎言語以養其德節飲食以養其體事之至近而所繫至大者莫過於言語飲食也頤象傳德朱子曰二者養養身之切務震驚百里不喪匕鬯臨大震懼能安而不自失者惟誠敬而已此處震之道也震彖傳匕葉氏曰所以載鼎實鬯秬酒也誠敬盡於祀事則雖震而不為驚君子當大恐懼中有所主則威震不足以動之矣人之所以不能安其止者動於欲也欲牽於前而求其止不可得也故艮之道當艮其背所見者在前而背乃背之是所不見也止於所不見則無欲以亂其心而止乃安不獲其身不見其身也謂忘我也無我則止矣不能無我無可止之道行其庭不見其人庭除之間至近也在背則雖至近不見謂不交於物也外物不接內欲不萌如是而止乃得止之道於止為無咎也艮彖傳朱子曰易傳云能使天下順治非能為物作則也惟止之各於其所而已此説甚當至謂艮其背為止於所不見竊恐未然據彖辭自解得分曉艮其止止其所也上句止字便是背字止是當止之處下句止字是解艮字所字是解背字蓋云止於所當止也所即至善之地不獲其身是無與於己不見其人是亦不見人無己無人但見此道理各止其所也定人之一身惟背不能動止於背是止得其所明道若性書舉其語是此意伊川説却不同他解艮其止止其所也又説得分曉解艮其背又自有異想是照顧不到問易傳説艮其背是止於所不見曰伊川之意如説間邪存誠如所謂制之於外以安其內如所謂姦聲亂色不留聰明此意亦自好但易之本意未必是如此動外物不接內欲不萌伊川之説只是非禮勿視聽言底意思問外物無有絶而不接之理曰此一段亦有可疑外物豈能不接但當於非禮勿視聽言動四者用力外既無非禮之視聽言動則內自不見有私己之欲矣明道先生曰若不能存養只是説話遺書下同聖賢千言萬語只是欲人將己放之心約之使反復入身來自能尋向上去下學而上達也朱子曰學問之道無他求其放心而已矣此孟子開示切要之言程子又發明之曲盡其指學者宜服膺而勿失也明道只是大槩説如此若己放之心如何會收得轉來只是莫令此心逐物去則此心便在這裏只是知求則心便在此便是反復入身來是問明道聖賢千言萬語只是收放心曰講學讀書固然要知所以講學讀書所以致知力行以至習禮習樂事親從兄無非只是要收放心事學問之道皆所以求放心不是學問只有求放心一程先生説是如此不看自能尋向上去下學而上達二句必至空守此心無所用也李籲問每常遇事即能知操存之意無事時如何存養得熟曰古之人耳之於樂目之於禮左右起居盤盂几杖有銘有戒動息皆有所養今皆廢此獨有理義之養心耳但存此涵養意久則自熟矣敬以直內是涵養意籲字端伯程子門人吕與叔嘗言患思慮多不能驅除曰此正如破屋中禦寇東面一人來未逐得西面又一人至矣左右前後驅逐不暇蓋其四面空疏盜固易入無緣作得主定又如虛器入水水自然入若以一器實之以水置之水中水何能入來蓋中有主則實實則外患不能入自然無事朱子曰有主則實既言有主便已是實了卻似多了一實字看來這箇實字謂中有主則外物不能入永按與後條有主則虛參看邢和叔言吾曹常須愛養精力精力稍不足則倦所臨事皆勉強而無誠意接賓客語言尚可見況臨大事乎邢恕字和叔明道先生曰學者全體此心學雖未盡若事物之來不可不應但隨分限應之雖不中不逺矣朱子曰此亦是言其大槩且存得此心在這裏若事物之來且隨自家力量應之更須下工夫方到得細密的當止於至善處此亦且是為初學言全體此心只是全得此心不為私欲汩沒非是更有一心能體此心也此等當以意會居處恭執事敬與人忠此是徹上徹下語聖人元無二語朱子曰告樊遲三語便與告顔淵仲弓都無異故云此是徹上徹下語伊川先生曰學者須敬守此心不可急迫當栽培深厚涵泳於其間然後可以自得但急迫求之只是私己終不足以達道朱子曰栽只如種得一物在此但涵養持守之功繼繼不已是謂栽培深厚如此而優遊涵泳於其間則浹洽而有以自得矣苟急迫求之則此心已自躁迫紛亂只是私己而已終不能優遊涵泳以達於道熟道理本自廣大只是潛心積慮緩緩養將去自然透若急迫求之則是起意去趕趁他只是私意而已安足以入道明道先生曰思無邪毋不敬只此二句循而行之安得有差有差者皆由不敬不正也朱子曰思無邪是心正意誠毋不敬是正心誠意白永按思未能無邪者亦當勉強禁止如古人以黑豆記起念善惡久之而黑者漸少漸無是也毋不敬亦兼正容言之今學者敬而不自得又不安者只是心生亦是太以敬來做事得重此恭而無禮則勞也恭者私為恭之恭也禮者非體之禮是自然底道理也只恭而不為自然底道理故不自在也須是恭而安今容貌必端言語必正者非是道獨善其身要人道如何只是天理合如此本無私意只是箇循理而已朱子曰只是心生言只是敬心不熟也恭者私為之恭言恭只是人為禮者非體之禮言只是禮無可捉摸故人為之恭必循自然底道理則自在也今志於義理而心不安樂者何也此則正是剩一箇助之長雖則心操之則存舍之則亡然而持之太甚便是必有事焉而正之也亦須且恁去如此者只是德孤德不孤必有鄰到德盛後自無窒礙左右逢其原也朱子曰正預期也是亦須且恁去其説蓋曰雖必有事焉而勿正亦須且恁地把捉操持不可説道持之太甚便放下了德孤只是單丁有這些道理所以不可靠易為外物侵奪若是處多不是處少便不為外物侵奪猶助長固是不好然合下未能到從容處亦須且恁去愈於不能執捉者又答吕伯恭曰承喻整頓收斂則入於著力從容遊泳墮於悠悠此正學者之通患然程子嘗曰亦須且自此去到德盛後自然左右逢其原今亦當且就整頓收斂處著力但不可用意安排等候即成病耳敬而無失便是喜怒哀樂未發謂之中敬不可謂中但敬而無失即所以中也朱子曰未發之中本體自然不須窮索但當此之時敬以持之使此氣象常存而不失則自此而發者必中節矣故程子於此每以敬而無失為言吳伯豐説敬而無失則不偏不倚斯能中矣曰説得慢了只敬而無失便不偏不倚只此便是中只是常敬敬即所以中象敬而無失本不是中只是敬而無失便見得中底氣此如公不是仁然公而無私則仁又曰中是本來底須是做工夫此理方著偏此言持敬而無間斷則喜怒哀樂渾然在中而無所倚子夏之言本不為此程子取其有會於吾心耳司馬子微嘗作坐忘論是所謂坐馳也朱子曰他只管要恁地虛靜都無事但只管要得忘便忘是馳也葉氏曰司馬承貞字子微唐天寶中隱居天台之赤城嘗著論八篇言清淨無為坐忘遺照之道伯淳昔在長安倉中間坐見長廊柱以意數之已尚不疑再數之不合不免令人一一聲言數之乃與初數者無差則知越著心把捉越不定朱子曰人心至靈主宰萬變而非物所能宰故才有執持之意即是此心先自動了此程子所以每言坐忘即是坐馳又因默數倉柱發明其説而其指示學者操存之道則必曰敬以直內而又有以敬直內便不直矣之云也人心作主不定正如一箇翻車流轉動搖無須臾停所感萬端若不做一箇主怎生奈何張天祺昔嘗言自約數年自上著牀便不得思量事不思量事後須強把他這心來制縛亦須寄寓在一箇形象皆非自然君實自謂吾得術矣只管念箇中字此又為中所繫縛且中亦何形象有人胸中常若有兩人焉欲為善如有惡以為之間欲為不善又若有羞惡之心者本無二人此正交戰之驗也持其志使氣不能亂此大可驗要之聖賢必不害心疾張戩字天祺橫渠先生之弟司馬溫公字君實朱子曰天祺雖是硬捉且把定得一箇物事在這裏溫公又管念箇中字又更生出頭緒多他所以説終夜睡不得天祺是硬截溫公是死守旋旋去尋討箇中伊川則曰持其志所以教人且就裏面理會譬如人有箇家不自作主却倩别人來作主處程子謂一心之中如有兩人正是言意不誠心不實大凡意不誠分明是吾之賊我要上他牽下來我要前他拖教後此最學者所宜察明道先生曰某寫字時甚敬非是要字好只此是學問作字忽忽則不成字是忘也或作意令好則愈不好是助也以此知持敬者正勿忘勿助之間朱子曰若如此説則只是要字好矣非明道先生之意也伊川先生曰聖人不記事所以常記得今人忘事以其記事不能記事處事不精皆出於養之不完固朱子曰聖人之心虛明故能如此常人記事忘事只是著意之故明道先生在澶州日修橋少一長梁曽博求之民間後因出入見林木之佳者必起計度之心因語以戒學者心不可有一事問凡事須思而後通安可謂心不可有一事朱子曰事如何不思但事過則不留於心可也明道肚裏有一條梁不知今人有幾條梁在肚裏伊川先生曰入道莫如敬未有能致知而不在敬者今人主心不定視心如寇賊而不可制不是事纍心乃是心纍事當知天下無一物是合少得者不可惡也朱子曰敬則心存心存則理具於此而得失可驗故曰未有致知而不在敬者問未有致知而不在敬者曰心若走作不定何緣見得道理如理會這一件事未了又要去理會那事少間都成無理會須是理會這事了方去理會那事須是主一意未有致知而不在敬者此是大綱説要窮理須是著不著意如何理會得分曉問未有致知而不在敬者蓋敬則胸次虛明然後能格物而判其是非曰雖是如此然亦須格物不使一毫私欲得以為之蔽然後胸次方得處明先答胡廣仲曰敬之一字真聖學始終之要向來謂必致知然後有以用力於此疑若未安蓋古人由小學進於大學其於灑掃應對進退之間持守堅定涵養純熟固已久矣是以大學之序特因小學已成之功而以格物致知為始今人未嘗一日從事於小學而曰必先致知然後敬有所施則未知以何為主而格物以致其知也故程子曰入道莫如敬未有能致知而不在敬者又論敬云但存此久之則天理明推而上之古昔聖賢之言亦莫不如此者葉氏曰事至當應初何為纍顧心無主應則反纍事耳少永按天下事皆不可不可有厭事之心人只有一箇天理却不能存得更做甚人也人多思慮不能自寧只是做他心主不定要作得心主定惟是止於事為人君止於仁之類如舜之誅四凶四凶已作惡舜從而誅之舜何與焉人不止於事只是攬他事不能使物各付物物各付物則是役物為物所役則是役於物有物必有則須是止於事葉氏曰應事而不止其所當止是以己之私智攬他事而不能物各付物者也物各付物者物來而應不過其則物往而化不滯其迹是則役物而不為物所役以上並伊川語不能動人只是誠不至於事厭倦皆是無誠處靜後見萬物自然皆有春意問此還是指聖賢而言否潛室陳氏曰觀物會心靜者能之固是聖賢如此吾人胸次豈可不見此境界靜却不分聖賢孔子言仁只説出門如見大賓使民如承大祭看其氣象便須心廣體胖動容周旋中禮自然惟慎獨便是守之之法聖人修己以敬以安百姓篤恭而天下平惟上下一於恭敬則天地自位萬物自育氣無不和四靈何有不至此體信達順之道聰明睿智皆由此出以此事天饗帝問孔子告仲弓方是持敬底事程子如此説豈不有自然勉強之異朱子曰程子之言舉敬之極致而言也這般處要寬看識得他意不可迫切求之亦須見得箇意思方謹獨以守之非問心廣體胖動容周旋中禮是平日功夫方能如此一旦出門如見大賓使民如承大祭便能如此曰自這裏做去方能如此只是常能存得此心便能如此惟上下一於恭敬這却是上之人有以感發興起之體信是忠達順是恕體信是無一毫之偽達順是發而皆中節無一物不得其所聰明睿智皆由此出這是自誠而明人問上下一於恭敬上之人下之人也同寅協恭曰聖之敬熏天炙地不是獨修於九重而天下之人侮慢自若也如漢廣之詩可見而體信是實體此道於身達順是發而中節推之天下無所不通也和信是實理順是和氣體信是致中底意思達順是致底意思此禮記中語言能恭敬則能體信逹順下體信是盡這至誠道理順即自此發出所謂和者天之達道聰明睿智皆由是出者皆由敬出以此事天饗帝此即敬也聰問聰明睿智如何皆由此出曰且看敬則如何不會明人之所以不聰不明只緣身心惰慢便昏塞了敬則虛靜自然通達進且以一國之君看之此心才不専靜則姦聲佞辭雜而不察何以為聰亂色諛説之容交蔽而莫辨何以為明睿智皆出於心心既無主則應事接物何以思慮而得其宜所以此心常要肅然虛明然後物不能蔽問敬中有誠立明通道理曰然存養熟後泰然行將去便有進不愧屋漏則心安而體舒葉氏曰此謹獨之效心要在腔子裏問心要在腔子裏莫只是不放却否朱子曰得之人心終日放在那裏去得幾時在這裏孟子所以只管教人求放心應問心要在腔子裏若慮事應物時心當如何曰思慮接不可廢但身在此則心合在此曰然則方其應接時則心在事上事去則此心亦不管著曰固是要如此問心如何得在腔子裏曰敬便在腔子裏只外面有些隙罅便走了問外面有些隙罅便走了莫是功夫間斷便外馳否朱子曰此心才向外便走了人心常要活則周流無窮而不滯於一隅問心如何是活朱子曰心無私便可推行活者不死之謂人心活則周流無偏係即活憂患樂好皆偏係也周活是生活之活對著死説天理存則活人欲用則死流無窮活便能如此明道先生曰天地設位而易行乎其中只是敬也敬則無間斷朱子曰易是自然造化聖人本意只説自然造化流行程子是將來就人身上説敬則這道理流行不敬便間斷了前輩引經文多是借來説己意問不知易何以言敬曰程子説得闊使人難曉就天地之間言之是實理就人身言之惟敬然後見得心之實處流行不息敬才間斷是不誠不誠便無物是息也天天地也似有箇主宰方始恁地變易便是天地底敬理只是直上去更無四邉滲漏更無走作問子在川上章也是這意思曰固是天地與聖人一般但明道説得寬一念不存也是間斷一事有差也是間斷毋不敬可以對越上帝敬勝百邪朱子曰學者常提醒此心如日之升羣邪自息敬以直內義以方外仁也若以敬直內則便不直矣必有事焉而勿正則直也問敬以直內義以方外如何便謂之仁朱子曰亦是仁也若能到私欲淨盡天理流行處皆可謂之仁但從一路入做到極處皆是仁此亦言敬以直內義以方外則無一毫私意而仁自在其中爾這般處要寬看問以敬直內則不直何也曰此是解直方三字從上説下來方順以敬則不順矣只問必有事而勿正二程多主於敬曰孟子本無敬字有義字程子是移將去敬字上説非孟子本意涵養吾一葉氏曰心存則不二子在川上曰逝者如斯夫不舍晝夜自漢以來儒者皆不識此義此見聖人之心純亦不己也純亦不已天德也有天德便可語王道其要只在慎獨問程子謂自漢以來儒者皆不識此義朱子曰是不曽識得佛氏却略窺得上面些影子自漢以來儒者如仲舒語只約度有這物事韓退之雖知有這物事又説得太闊疏了天聖人見川流之不息嘆逝者之如斯原其所以然乃命流行不息之體惟聖人之心默契乎此故有感焉於此可見聖人純亦不己之心為川流不息天運也純亦不已聖人之心也謹獨所以不已學者之事也乎問川上之歎程子所謂純亦不已者果聖人之本意曰程子非以聖人之意本如此也亦曰非其心之如是則無以見天理之如是耳其曰其要只在慎獨者言人欲體此道當如此也蓋道無時而不然惟慎獨則可以無所間斷而不虧真體計有天德則便是天理便做得王道無天德則是私意是較後人多無天德便做王道不成處謹獨與這裏何相關若不謹獨便去隱微間斷了如何得與天地相似不有躬無攸利不立已後雖向好事猶為化物不得以天下萬物撓己巳立後自能了當得天下萬物朱子曰此程子解易二句後二句又是復解此意在乎以立己為先應事為後今人平日講究所以治國平天下之道而自家身已全未曽理會得若能理會自家身已雖無外事若不相接然明德在這裏了新民只見成推將去己不立則在我無主宰雖向好事亦只是見那事物好隨那事物去便是為物所化伊川先生曰學者患心慮紛亂不能寧靜此則天下公病學者只要立箇心此上頭儘有商量朱子曰學者不先立箇心便似作事無基址求此心正為要立基址得此心有箇存主處為學便有歸著可以用功間邪則誠自存不是外面捉一箇誠將來存著今人外面役役於不善於不善中尋箇善來存著如此則豈有入善之理只是間邪則誠自存故孟子言性善皆由內出只為誠便存永按人性本善故人心本誠其有邪者妄也去妄則無妄矣故誠非外鑠間邪更著甚工夫但惟是動容貌整思慮則自然生敬敬只是主一也主一則既不之東又不之西如是則只是中既不之此又不之彼如是則只是內存此則自然天理明學者須是將敬以直內涵養此意直內是本本注尹彥明曰敬有甚形影只收斂身心便是主一且如人到神祠中致敬時其心收斂更著不得毫髮事非主一而何做問主一朱子曰做這一事且做一事做了這一事却那一事今人做這一事未了又要做那一事心下千頭萬緒問動而無二三之雜者主此一也靜而無邪妄之念者亦主此一也主一兼動靜而言曰是日或謂主一不是主一事如一日萬幾須要並應曰一萬幾也無並應底道理須還他逐一件理會然問或人専守主一曰主一亦是然程子論主一却不又要有用豈是守塊然之主一敬聖人言語當初未曽關聚如説見賓承祭之類皆是之目到程子始關聚説出一箇敬來教人然敬有甚物只如畏字相似不是塊然兀坐只收斂身心整齊純一不恁地放縱便是敬程先生所以有功於後學者最是敬之一字有力言敬字只著一畏字形容亦得故和靖只以收斂身心之這心都不著一物便收斂他説入神祠云云最親切今人若能専一此心便收斂緊密無些子空罅若這事思量未了又走作那邉去心便成兩路此心主這一事不為他事所亂便是不容一物問只是説靜時氣象否曰然間邪則固一矣然主一則不消言間邪有以一為難見不可下工夫如何一者無他只是整齊嚴肅則心便一一則自是無非僻之干此意但涵養久之則天理自然明朱子曰只是覺見邪在這裏要去間他則這心便一了既一則邪自不能入更不消説又去間邪恰如知得外面有賊今夜須防他則便惺了不須更説防賊天整齊嚴肅此心便存便能惺惺才整頓起處便是理無别天理但常常整頓起思慮自一容持敬之説不必多言但熟味整齊嚴肅嚴威儼恪動貌整思慮正衣冠尊瞻視此等數語而實加工焉則所謂直內所謂主一自然不費安排而身心肅然表裏如一矣永按朱子又有一條主一似持其志間邪似無暴其氣與程子意異故不録有言未感時知何所寓曰操則存舍則亡出入無時莫知其鄉更怎生尋所寓只是有操而已操之之道敬以直內也朱子曰這處難説只爭這些子只是看來看去待自見得若未應時又更操這所寓便是有兩箇物事所以道只有操而已只操便是主宰在這裏敬則自虛靜不可把虛靜喚做敬朱子曰周子説主靜正是要人靜定其心自作主宰程子又恐人只管求靜遂與事物不交涉却説箇敬云敬則自虛靜學者先務固在心志然有謂欲屏去聞見知思則是絶聖棄智有欲屏去思慮患其紛亂則須坐禪入定如明鑑在此萬物畢照是鑑之常難為使之不照人心不能不交感萬物難為使之不思慮若欲免此惟是心有主如何為主敬而已矣有主則虛虛謂邪不能入無主則實實謂物來奪之大凡人心不可二用用於一事則他事更不能入者事為之主也事為之主尚無思慮紛擾之患若主於敬又焉有此患乎所謂敬者主一之謂敬所謂一者無適之謂一且欲涵泳主一之義不一則二三矣至於不敢欺不敢慢尚不愧於屋漏皆是敬之事也問程子謂有主則虛又謂有主則實朱子曰有主於中外邪不能入便是虛有主於中義理甚實便是實心虛則理實心實則理虛有主則實此實字是好字指理而言無主則實此實字是不好字指私欲而言以理為主則此心虛明一毫私意著不得而有主則實者自家心裏有主外患所不能入此非實何無主則實者自家心裏既無以為之主則外邪却入來實其中安得不謂之實中有主則實此重在主字上有主則虛重在敬字上言敬則自虛靜故邪不得而姦之也看程子既言有主則實又言有主則虛此不可泥看須大意各有不同始得適主一無適此等語須力行之方見得真實意味無只是持守得定不馳騖走作之意持守得定而不馳騖走作即是主一主一即是敬只是輾轉相解非無適之外别有主一主一之外又别有敬也敬主於一做這件事更不做别事無適是不走作問思其所當思如何曰却不妨但不可胡思如思此一事又别思一件事便不可問方應此事未畢而復有一事至則當如何曰也須是做一件了又理會一件亦無雜然而應之理但甚不得已則權其輕重可也而問伊川言主一無適又謂人心常要活則周流無窮不滯於一隅或疑主一則滯不能周流竊謂主一則此心便存心存則物來順應何有乎滯曰固是然所謂主一者何嘗滯於一事不主一則方理會此事而心留於彼這却是滯於一隅嚴威儼恪非敬之道但致敬須自此入永按嚴威儼恪外面勉強把捉而已然致敬却須自此始舜孶孶為善若未接物如何為善只是主於敬便是為善也以此觀之聖人之道不是但默然無言朱子曰程子未接物之論尤能發明言外之意學者所當深念失主於敬是存養此心在這裏照管勿差問人之燕居形體怠惰心不慢可否曰安有箕踞而心不慢者昔吕與叔六月中來緱氏間居中某嘗窺之必見其儼然危坐可謂敦篤矣學者須恭敬但不可令拘迫拘迫則難久朱子曰近世學者之病只是合下欠却持敬工夫所以事事滅裂其言敬者又只説能存此心自然中理至於容貌詞氣往往全不加工又況心慮荒忽未必真能存得耶程子言敬必須整齊嚴肅正衣冠尊瞻視為先又言未有箕踞而心不慢者如此乃是至論四心無不敬則四體自然收斂不待十分著意安排而體自然舒適著意安排則難久而生病矣思慮雖多果出於正亦無害否曰且如在宗廟則主敬朝廷主莊軍旅主嚴此是也如發不以時紛然無度雖正亦邪蘇季明問喜怒哀樂未發之前求中可否曰不可既思於喜怒哀樂未發之前求之又却是思也既思即是已發本注思與喜怒哀樂一般才發便謂之和不可謂之中也又問吕學士言當求於喜怒哀樂未發之前則可若言求中於喜怒哀樂未發之前則不可又問學者於喜怒哀樂發時固當勉強裁抑於未發之前當如何用功曰於喜怒哀樂未發之前更怎生求只平日涵養便是涵養久則喜怒哀樂發自中節曰當中之時耳無聞目無見否曰雖耳無聞目無見然見聞之理在始得賢且説靜時如何曰謂之無物則不可然自有知覺處曰既有知覺却是動也怎生言靜人説復其見天地之心皆以謂至靜能見天地之心非也復之卦下面一畫便是動也安得謂之靜或曰莫是於動上求靜否曰固是然最難釋氏多言定聖人便言止如為人君止於仁為人臣止於敬之類是也易之艮言止之義曰艮其止止其所也人多不能止蓋人萬物皆備遇事時各因其心之所重者更互而出才見得這事重便有這事出若能物各付物便自不出來也或曰先生於喜怒哀樂未發之前下動字下靜字曰謂之靜則可然靜中須有物始得這裏便是難處學者莫若且先理會能敬能敬則知此矣或曰敬何以用功曰莫若主一季明曰昞嘗患思慮不定或思一事未了他事如麻又生如何曰不可此不誠之本也須是習習能専一時便好不拘思慮與應事皆要求一蘇昞字季明張程門人吕學士與叔也朱子曰才思即是已發一句能發明子思言外之意蓋言不待喜怒哀樂之發但有所思即是已發此意已極精微説到未發界至十分盡頭不可以有加矣生問伊川云求中於喜怒哀樂之前却是已發延平先謂驗喜怒哀樂未發之前為如何此説又似與季明同曰但欲見其如此耳然亦有病若不得其道則流於空故程子云今只道敬慎此條記得極好涵養於喜怒哀樂未發之前只是戒乎其所不睹恐懼乎其所不聞且未有一箇動綻大綱且約住執持在這裏到謹獨處便是發了當中時雖耳無聞目無見然須是常有箇主宰執持底在這裏始得不是一向放倒又不是一向空寂了下面説復卦便是説靜中有動不是如瞌睡底靜中問常自有箇主宰執持後又説艮卦又是説動中要靜復卦便是一箇大翻轉底艮卦艮卦便是兩箇翻轉底復卦無但操存得在時少間喜怒哀樂自有一箇則在説耳聞目無見之答以下文若無事時須見須聞之參之其誤必矣蓋未發時但為未有喜怒哀樂之偏耳若其目之有見耳之有聞則當愈益精明而不可亂豈若心不在焉而遂廢耳目之用哉愈子思只説喜怒哀樂今却轉回見聞上去所以説得多愈見支離紛冗都無交涉此程門請問記録者之罪中問心本動物不審未發之前全是寂然而靜還是靜有動意曰不是靜中有動意周子謂靜無而動有不是無以其未形而謂之無非因動而後有以其可見而謂之有耳方其靜時動之理只在伊川謂當中時耳無聞目無見但見聞之理在始得及動時又只是這靜底謂之無物則不可無物恐當作有物伊問未發之前當戒謹恐懼提撕警覺則亦是知覺而川謂既有知覺却是動何也曰未發之前須常恁底醒不是瞑然不省若瞑然不省則道理何在成甚大本曰常醒便是知覺知覺須是動何以謂之未發曰知覺雖是動不害其為未動若喜怒哀樂則又别也問知覺雖是動而喜怒哀樂却未發否曰是下面説復見天地之心説得好復一陽生豈不是動問一陽雖動然未發生萬物便是喜怒哀樂未發否曰是心其言靜時既有知覺豈可言靜而引復以見天地之為説亦不可曉蓋當至靜之時但有能知覺者而未有所知覺也故以為靜中有物則可而便以才思即是已發為比則未可以為坤卦純隂而不為無陽則可而便以復之一陽已動為比則未可也復問靜中有知覺曰此是坤中不能無陽到動處却是只將十二卦排便見乃問靜中有物莫是含喜怒哀樂之理否曰喜怒哀樂是感物而有猶鏡中之影鏡本照物安得有影曰然則靜中有物乃鏡中之光明曰此却説得近似所謂靜中有物者只是知覺便是伊川云才知覺便是動此恐説得太過若云知得寒覺得暖便是知覺一箇物事今未曽知覺甚事但有知覺在何妨其為靜不成靜坐便是瞌睡其問某作事時多不能主一曰只是心不定人須是定心問非不欲主一然竟不能曰這箇須是習程子也教人習問莫是氣質薄不曰然亦須涵養本原則自然别無事時固是敬有事時敬便在事上所以程子説到専一時方好蓋専一則有事無事皆是如此程子答或人問末梢這一句是緊要處人於夢寐間亦可以卜自家所學之淺深如夢寐顛倒即是心志不定操存不固朱子曰魂與魄交而成寐心在其間依舊能思慮所以做出夢來若心神安定夢寐亦不至顛倒之胡氏説夢亦有可取者胡氏曰心為萬物之至靈人所以有夢夢之所以多變也然聖人誠存賢人存誠則夢治若夫思慮紛擾精神不定則所夢雜亂或正或邪亦與旦晝之所為等耳善學者既謹其言動而又必驗諸夢寐之間問人心所繫著之事果善夜夢見之莫不害否曰雖是善事心亦是動凡事有朕兆入夢者却無害捨此皆是妄動人心須要定使他思時方思乃是今人都由心曰心誰使之曰以心使心則可人心自由便放去也問孔子夢周公恐涉於心動否朱子曰心本是箇動物怎教他不動夜之夢猶寢之思也思亦是心之動處但無邪思可矣夢得其正何害心存這事便夢這事常人便胡夢了問以心使心上心字是道心下心字是人心以心使心則是道心為一身之主而人心聽命也曰亦是如此然觀程先生之意只是説自作主宰耳所問以心使心此句有病否曰無病其意只要此心有主宰只是一箇心被他説得來却似有兩箇子細看來只是這一箇心持其志無暴其氣內外交相養也朱子曰持志所以直其內也無暴其氣所以防於外也兩者各致其功而無所偏廢焉則志正而氣自完氣完而志益正其於存養之功且將無一息之不存矣以志一則動氣氣一則動志觀之則見內外交相養之理矣問出辭氣莫是於言語上用工夫否曰須是養乎中自然言語順理若是慎言語不妄發此却可著力先生謂繹曰吾受氣甚薄三十而浸盛四十五十而後完今生七十二年矣校其筋骨於盛年無損也繹曰先生豈以受氣之薄而厚為保生邪夫子默然曰吾以忘生徇欲為深恥南軒張氏曰若他人養生要康強只是利伊川説出來純是天理大率把捉不定皆是不仁朱子曰人心湛然虛定者仁之本體把捉不定者私欲奪之而動靜紛擾矣然則把捉得定其惟篤於持敬乎問心之本體湛然虛明無一毫私欲之纍則心德存把捉不定則為私欲所亂是心外馳而其德亡矣曰如此則是把捉不定故謂之不仁今此但曰皆是不仁乃是言惟其不仁所以致把捉不定也外書下同伊川先生曰致知在所養養知莫過於寡欲二字朱子曰致知者必先有以養其知有以養之則所見益明所得益固欲養其知者惟寡欲而已欲寡則無紛擾之雜而知益明矣無變遷之患而得益固矣問養知莫過於寡欲是既知後便如此養否曰此不分先後未知之前若不養之此知如何發得既知之後若不養則又差了為二者自是兩箇話頭本若無相干但得其道則交相養失其道則交相為害問養知莫過於寡欲此句最緊切曰便是這話難説又須是格物方得若一向靠著寡欲又不得心定者其言重以舒不定者其言輕以疾朱子曰言發於心心定則言必審故的確而舒遲不定則內必紛擾有不待思而發故淺易而急迫此亦志動氣之驗也明道先生曰人有四百四病皆不由自家則是心須教由自家永按四百四病佛家之説謂人身為四大之合各有百一病也氣體之病非人所能為心則操之在我而已謝顯道從明道先生於扶溝一日謂之曰爾輩在此相從只是學皓言語故其學心口不相應盍若行之請問焉曰且靜坐伊川每見人靜坐便嘆其善學問程子嘗教人靜坐如何朱子曰亦是他見人要多慮且教人收拾此心耳初學亦當如此明道云無可行時且去靜坐蓋靜坐便涵養得本原稍定雖是不免逐物及自覺而收斂歸來也有箇著落若不曽存養得本原茫茫然逐物在外便要收斂歸來也無箇著身處也道明道教人靜坐李先生亦教人靜坐蓋精神不定則理無湊泊處又云須是靜坐方能收斂故明道教人靜坐蓋為是時諸人相從學中無甚外事教之如此今若無事固是只得靜坐若特地將靜坐做一件工夫則是釋子坐禪矣但只著一敬字通貫動靜則於二者之間自無間斷處問伊川見人靜坐如何便嘆其善學曰這却是一箇總要處橫渠先生曰始學之要當知三月不違與日月至焉內外賓主之辨使心意勉勉循循而不能已過此幾非在我者朱子曰內外賓主之辨在內之日多即是為主在內之日少即是為客終以屋喻之三月不違者心常在內雖間或有出時然是在外不穩便才出即便入蓋心安於內所以為主日月至焉者心常在外雖間或有入時然終是在內不安才入即便出蓋心安於外所以為賓日至者一日一至此月至者一月一至此不違者心常存日月至者有時而存此無他知有至未至意有誠未誠故貴於見得透則心意勉勉循循自不能己矣過此幾非在我者猶言過此以往未之或知言過此則自家著力不得待他自長進去仁問三月不違者是仁常在內常為主日月至焉者是常在外常為賓否曰此倒説了心常在內常為主心常在外常為客問如此則心不違仁者是心在仁內否曰不可言心在仁內略略是恁地意思方勉勉循循之説猶是真箇到那田地實知得那滋味自不能已要住不得過此幾非在我言不由我了如推車相似才推動了自然不停永按或問謂不違者仁在內而我為主日月至焉者仁在外而我為客蓋朱子未定之説文集心清時少亂時常多其清時視明聽聰四體不待羈束而自然恭謹其亂時反是如此何也蓋用心未熟客慮多而常心少也習俗之心未去而實心未完也朱子曰客慮是泛泛底思慮習俗之心是從來習染偏勝之心實心是義理之心説橫渠大段用功夫來得更精切人又要得剛太柔則入於不立亦有人主無喜怒者則又要得剛剛則守得定不回進道勇敢載則比他人自是勇處多朱子曰看來這道理須是剛硬立得腳住方能有所成曽子子思孟子都是如此剛果決烈方能傳這道理若慈善柔弱底終不濟事語録下同戲謔不惟害事志亦為氣所流不戲謔亦是持氣之一端末子答劉子澄曰戲謔亦是自家有此玩侮之意以為之根而日用間流轉運用機械活熟致得臨事不覺出來又自以為情信辭巧主於愛人可以無害於義理故不復更加防遏以至於此蓋不惟害事而所以害於心術者尤深昔橫渠先生嘗言之矣此當痛改不可緩也永按張子作東銘亦以戲言戲動為戒戲謔之害事納侮啓釁招尤致侮是也人之有口才多機智而好狎侮者尤易犯此病當深戒之正心之始當以己心為嚴師凡所動作則知所懼如此一二年守得牢固則自然心正矣葉氏曰視心如嚴師則知所敬畏而邪僻之念不作定然後始有光明若常移易不定何求光明易大抵以艮為止止乃光明故大學定而至於能慮人心多則無由光明問艮何以光明朱子曰定則明凡人胸次煩擾則愈見昏昧中有定止則自然光明莊子所謂泰宇定而天光發是也也葉氏曰止水可鑑而流水不可鑑亦此理易説下同動靜不失其時其道光明學者必時其動靜則其道乃不蔽昧而明白今人從學之久不見進長正以莫識動靜見他人擾擾非關己事而所修亦廢由聖學觀之冥冥悠悠以是終身謂之光明可乎艮彖傳學葉氏曰動靜各有其時然者多失於不當動而動因循廢學終何光明之有敦篤虛靜者仁之本不輕妄則是敦厚也無所繫閡昏塞則是虛靜也此難以頓悟苟知之須久於道實體之方知其味夫仁亦在乎熟之而已朱子曰張子敦篤虛靜之説於學者為有功為敦厚虛靜是為仁之本李孝述問仁為動之始禮動之極義為靜之始智為靜之極智無所作為又所以為動之本而仁禮之所由發也曰橫渠先生曰虛靜者仁之本亦此意所葉氏曰言動輕妄而不純篤則此心外馳非仁也有繫閡昏塞而不虛靜則此心罔覺非仁也然必存心之久實體於己然後能深知其味孟子説近思録集注卷四
