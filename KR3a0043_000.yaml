body:
  text: 近思録集注儒家類提要臣等謹案近思録集注十四卷國朝茅星來撰朱子近思録宋以來注者數家惟葉采集解至今盛行星來病其粗率膚淺解所不必解而稍費擬議者則闕又多彼此錯亂字句訛舛因取周張二程全書及宋元近思録刋本參校同異凡近刻舛錯者悉從朱子考正錯簡之例各注本條之下又薈稡衆説參以己見為之支分節解於名物訓詁考證尤詳更以伊洛淵源録所載四子事迹具為箋釋冠於簡端謂之附説書成於康熙辛丑有星來自序又有後序一篇作於乾隆丙辰去書成時十五年蓋殫一生之精力為之也其後序有曰自宋史分道學儒林為二而言程朱之學者但求之身心性命之間不復以通經學古為事蓋嘗竊論之馬鄭賈孔之説經譬則百貨之所聚也程朱諸先生之説經譬則操權度以平百貨之輕重長短者也微權度則貨之輕重長短不見而非百貨所聚則雖有權度亦無所用之故欲求程朱之學者其必自馬鄭諸傳疏始愚於是編著漢唐諸家之説以見程朱諸先生學之有本俾彼空踈寡學者無得以藉口云云其持論光明洞逹無黨同伐異爭名求勝之私可謂能正其心術矣乾隆四十六年七月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書子部一近思録集注儒家類提要臣等謹案近思録集注十四卷國朝江永撰永有周禮疑義舉要已著録案朱子年譜近思録成於淳熙二年其後又數經刪補然各卷之中惟以所引之書為先後而不及標立篇名至淳祐間葉采纂為集解表進於朝雖闡發不免少略尚無所竄亂於其間明代有周公恕者始妄加分析各立細目移置篇章或漏落正文或淆混注語謬誤幾不可讀永以其貽誤後學因仍原本次第為之集注凡朱子文集或問語類中其言有相發明者悉行採入分注或朱子説有未備始取葉采及他家之説以補之間亦附以已意引據頗為詳洽蓋永邃於經學究心古義穿穴於典籍者深雖以餘力為此書亦具有實徴與講學之家空談尊朱者異也乾隆四十六年十一月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀近思録集注原序子朱子纂輯周程張四先生之書以為近思録蓋古聖賢窮理正心修己治人之要實具於此而與大學一書相發明者也故其書篇目要不外三綱領八條目之間而子朱子亦往往以小學並稱意可見矣先君子默存先生嘗手録是書俾不肖星來受而卒業謂曰此聖道階梯也星來反覆尋繹久而稍覺有得頗思博求注解以資參討顧今坊間所行者惟建安葉氏集解而已楊氏泳齋衍注則藏書家僅有存者星來嘗取讀之粗率膚淺於是書了無發明又都解所不必解其有稍費擬議處則闕焉至於中間彼此錯亂字句舛訛以二子親承朱子緒論而其為書乃如此其他又何論乎然則彼窮鄉晚進無明師良友以先後之者雖使有志於學得是書而玩心焉亦恐終無以得其門而入矣星來用是不揣固陋輒購取四先生全書及宋元來近思録本為之校正其異同得失其先後次第悉仍其舊本舛錯仿朱氏論孟重出錯簡之例注明其下不敢擅自更易也本既定然後乃敢會萃衆説參以愚見支分節解不留疑竇其名物訓詁雖非是書所重亦必詳其本末庶幾為學者多識之一助又仿朱氏論孟附史記世家列傳例取伊洛淵源録中四先生事狀刪其繁復為之注釋以附簡端孟是二書相為表裏且以見録中所言實可見諸施行四先生固己小用之而小效也其與朱子有未盡合處亦以愚見斟酌從違使會歸於一也蓋星來悉心探討隨得隨記亦己有年期於是書粗有所補弆之篋衍以為後之有志於學者取焉康熙辛丑七月七日歸安茅星來序欽定四庫全書近思録集注附説歸安茅星來撰濂溪先生太極通書取十條外又遺文一條附録一條張敬夫曰朱子以太極圖列於篇首而題之曰太極通書朱子曰潘清逸墓志敘所著書以太極圖為稱首則此圖當為書首無疑也然諸本皆附通書後讀者遂誤以為書之卒章使先生立象盡意之本旨暗而不明而讀通書者亦不知綱領之在是也長沙通書本因胡氏所定章次先後移易又刋去章目而别以周子曰加之皆非先生之舊如理性命之類則一去其目而遂不可曉故今特據潘志置圗篇端而書之次序章目亦皆復其舊又曰漢上朱震子發言陳摶以太極圖傳种放放傳穆修修傳先生衡山胡宏仁仲則以种穆之傳特先生所學之一師而非其至者武當祁寬居之又謂圖象乃先生指畫以語二程而未嘗有所為書此蓋皆未見潘志而言若胡氏之説則又未考先生之學之奧始卒不外乎此圖也劉靜修曰朱子發謂周子太極圖得於穆伯長而胡仁仲因之陸子靜亦因之其實則穆死於明道元年而周子年僅十四嵗安有親相授受之理子發蓋未之考耳朱子見潘志知圖為周子所自作於乾道己丑已敘於通書之後矣其後八年為江州濂溪書堂記則亦曰不由師傅默契道體又十年因見張詠事有公事陰陽語與圖説意合以詠學於希夷者故謂是説之傳固有端緒至先生然後得之於心無所不貫於是始為此圖以發其祕又八年為通書後記則又云莫或知其師傳之所自蓋朱子亦於此未之考故其為説前後不一也或又謂周子與胡宿邵古同事潤州一浮屠此與謂康節因其母舊為某氏妾藏其亡夫遺書以歸卲氏者同為淺薄不根之説也吳草廬曰周子之學乃其自得而無所師授朱子發進易傳表蓋踵訛而失其實也周在南穆在北足迹不相及也何由相授受哉明道先生文集取四條又附録三條哀詞一條伊川先生文集取二十二條外又手帖一條見今按內除首卷喜怒哀樂未發一條遺書而九卷卜其宅兆一條舊誤入遺書當歸正仍為二十二條周易程氏傳取百六條辭按朝昭德讀書志十卷宋志傳九卷繫解一卷今刻上下經各分上下為四卷陳氏曰伊川止解上下經其文言上象下象上彖下彖傳分附於各卦之中而以序卦分置諸卦之首唐李鼎祚集解亦然元符二年正月易傳成而序之程氏經説易説一條書説二條詩説三條春秋説一條論語説九條共取十六條按陳氏謹謂伊川經説其目見近思録其書見時氏本特易説止繫辭上傳春秋傳止魯桓九年書解止舜格於文祖詩解止四方以無拂論語解止吾從下臨川談善心元之既刻取遺書文集復欲取諸經説别求善本讐校鋟木而易繫吕氏精義所編春秋傳取尹氏纂集所補審校先刋其餘俟續刻云云明萬厯間嘉興徐必逹始取經説易傳粹言與遺書外書文集合刻為二程全書禦兒吕氏取而重刋蓋即談氏所定本也但按易説僅增入下繫乾坤易之門一條春秋傳增至哀公八年齊人歸歡及關止豈談氏本皆全增而今本或有脫落耶其餘三經則未有增益然愚按近思録所取論語説有古之學者為己欲得之於己一條則止吾從下之説亦未必然朝昭德讀書志稱論語説十卷然則陳氏所見時氏本蓋已非全書也又第三卷焞到問為學之方一條今本外書無之則此書久非復朱子所訂之舊矣程氏遺書取二百九十六條一凡程氏門人所記二先生言行朱子彚為編凡二十五篇題曰遺書云一今按內除第三卷學者先要會疑一條九卷聖人無事不順天時一條十二卷邢恕一日三點檢一條並見外書九卷卜其宅兆一條見文集而首卷喜怒哀樂一條舊誤入文集又第二卷敬義何别一條葉吕本與上條分為二今並正之又第三卷如登山麓一條歸入橫渠語録共取二百九十一條程氏外書取五十條子其有雜收廣取或不能審其所自來者朱彚為一編凡一十五篇題曰外書云一今按學者先要會疑聖人無一事不順天時及邢恕日三點檢三條舊誤入遺書今正之共為五十三條橫渠先生正蒙取二十八條集今按第二卷將修己一條舊誤入文當歸正為二十九條愚按張子書未經朱子手定故今自正蒙文集易説語録外所傳寥寥嘗以朝昭德讀書志及宋史經籍志考之朝志惟孟子解十四卷易説十卷春秋説一卷信聞紀一卷經學理窟一卷宋志則易説十卷詩説一卷經學理窟三卷祭禮一卷餘無聞焉豈當時相去未逺其書已多散逸不著耶今俗所傳理窟一書蓋明儒因朝宋二志中曽有是書而雜取正蒙文集諸篇以附會成之者非其􅐩也橫渠先生文集取十九條又行狀四條其黃瑞節曰張子文集諸經説語録皆門人所記朱子取以入近思録凡八十條惟正蒙乃其手所撰著云今按內除第二卷將修己一條見正蒙使學者先學禮一條第三卷子貢謂夫子之言性與天道一條並見語録又義理有疑一條葉本并心中有所開為一今照宋本及楊本另繫卷末為十七條橫渠先生易説取八條實楊時喬曰今本止六十四卦無繫辭未全之書然按朝志謂其解甚略繫辭差詳與楊説不同蓋朝氏時猶為全書至明始闕也橫渠先生詩説取二條諸按朱氏經義考云一卷今存但葉呂目無詩説今增入下樂説禮記説仿此橫渠先生禮樂説取一條橫渠先生樂説取一條橫渠先生禮記説取二條山按朱氏經義考云三卷未見魏鶴序云是編雖非全解而四十九篇之目大略固具且又以儀禮之説附焉但其説多出正蒙理窟信聞録諸書亦有二程先生之説參錯其間云橫渠先生論語説取二條橫渠先生孟子説取七條見今按內除第二卷為學大益一條語録橫渠先生語録取三十六條外又雜説一條子今取第二卷如登山麓一條歸入張語録恰合黃氏八十條之數又學者先學禮及性與天道二條舊誤入文集為學大益一條舊誤入孟子説又第三卷讀書少一條葉吕本與下分為二第四卷心清時少一條宋本與下分為二今俱并之又五卷末照宋本增入凡所當為一條共四十條濓溪先生周氏名惇實字茂叔後避英宗舊名改惇頥英宗舊名宗實後立為太子賜名曙世家道州營道縣濓溪之上道州本永州地唐平蕭銑置營州貞觀六年改道州宋隸荆湖南路紹興元年改屬東路今隸湖廣永州府營道縣省入州濓溪村落名按今道州學西有愛蓮池在濓溪書院之北父輔成大中祥符八年賜進士終賀州桂嶺令賀州宋隸廣南東路南渡後改屬廣西路今為縣隸廣西平樂府桂嶺本漢臨賀縣地隋置桂嶺縣今廢裴氏廣州記曰大庾始安臨賀桂陽揭陽為五嶺蓋桂嶺一名臨賀嶺即五嶺之一也又一書云輔成作桂陽令多善政疑即桂嶺之訛贈諫議大夫治平四年神宗登極遷朝奉郎尚書駕部員外郎加贈父諫議大夫葬道州營道縣營樂鄉鍾貴里樓田母鄭氏封仙居縣太君仙居宋淮西光州浙東台州並有之五品母妻封縣君母則加太字魏陳羣謂禮典婦因夫爵無婦人封土命爵之制秦違古法漢氏因之非先王之令典也輔成先娶唐氏生礪唐早卒侍禁鄭燦有女先適盧郎中盧卒歸輔成生周子先生生於真宗天禧元年丁巳之嵗月日仁宗天聖九年辛未先生年十五同母仙居縣太君依舅氏龍圖閣直學士鄭向於京師向一作珦奉龍圖閣在會慶殿西偏北連禁中真宗景德元年建太宗御製文集及典籍圖畫寶瑞之物與宗正所進屬籍并置待制學士官自是每一帝崩則置一閣鄭向字公明開封陳留人舉進士甲科以龍圖閣直學士知杭州卒以先生有逺器愛之如子龍圖公名子皆用惇字因以惇名先生按盧郎中子亦名惇文景祐三年丙子奏補試將作監主簿按史宋制除授職事官並以寄祿官品髙下為法凡高一品以上者為行下一品者為守二品以下者為試品同者不用行守試明年母鄭氏卒葬於潤州丹徒縣龍圖公之墓側隋置潤州取州東潤浦為名開寶八年改鎮江軍節度政和三年升為府今因之按班志丹徒即春秋之朱方徐州記秦使赭衣鑿其處因名康定元年庚辰服除授洪州分寧縣主簿洪州今江西南昌府有獄久不決先生至一訊立辨衆口交稱之慶厯四年甲申先生年二十八部使者薦以為南安軍司理參軍部統也屬也轉運使各部一路故曰部使者猶漢書稱部刺史也南安軍淳化元年以虔州大庾縣建屬江南西路今江西南安府司理掌獄訟勘鞠之事不兼他職五代以來諸州皆有馬步獄以牙校充宋太祖慮其任私高下其手開寶六年始置諸州司寇參軍以新進士及選人為之後改為司理獄有囚法不當死轉運使王逵欲深治之王逵字仲達濮陽人天禧三年進士為江南西路轉運按察使逵苛刻吏無敢與相可否先生獨力爭之不聽則置手板歸取告身委之而去手板即笏也劉熙釋名云笏忽也君有命則書其上備忽忘也禮玉藻云度二尺有六寸中博三寸其殺六分去一晉宋以來謂之手板宋制文散五品以上則用象九品以上則用木武臣內職並用象朱子曰古者笏只插在腰間不執在手中今官員執笏最無義理王伯厚曰執笏始於宇文周保定四年告身潘志作誥敕唐選舉志親品及流外判補皆給以符謂之告身其中有褒貶訓戒之辭蓋即今之誥敕也曰殺人以媚人吾不為也逵感悟囚得不死六年丙戌先生年三十程太中公攝通守事攝猶兼也通守即通判也太中公以大理寺丞知虔州興國縣故得攝南安軍通判事也視其氣貌非常人與語知其為學知道也因與為友且使其二子往受學焉及為郎官故事當舉代郎官者尚書省曹二十四司郎官並用知府資序以上人充未及者為員外郎二十四司者吏部司封司勳考功户部度支金部倉部禮部祠部主客膳部兵部職方駕部庫部刑部都官比部司門工部屯田虞部水部也咸平間祕書丞陳彭年請用唐故事舉官自代詔祕書直學士馮拯陳堯叟參詳之拯等請令兩省御史臺尚書省六品以上諸司四品以上授訖具表讓一人自代於閣門投下方得入謝在外者授訖三月內具表附驛以聞遂著為令蓋亦欲如唐制每官闕以見舉多者量而授之也每一遷授輒以先生名聞八年戊子以轉運使王逵薦移郴州郴縣令郴丑林反於郴州宋隸荆湖南路今隸湖廣縣廢愚按逵屬官守正不以為忤又能薦之則其賢於人也逺矣知州事職方員外郎李初平知其賢與之語而歎曰吾欲讀書何如先生曰公老無及矣某請得為公言之於是初平日聽先生語二年果有得而初平旋卒子幼護其葬歸葬之又往來經紀其家始終不懈皇祐二年庚寅遷桂陽令桂陽縣亦屬郴州有愛蓮池相傳先生為令時所鑿在郴桂皆有治績至和元年甲午用薦者言以大理寺丞知洪州南昌縣大理寺丞者帶職以寄祿也元豐正官制以宣德郎換之自此凡省寺監官領空名者一切罷去而易之以階因以寄祿後倣此于慎行筆麈曰宋時大縣四千户以上選朝官知小縣三千户以下選京官知蓋以京朝官之銜知某縣事非外吏也與縣令不同愚按前為郴與桂陽者縣令也此則以京官知縣事也後倣此縣人迎喜曰是能辨分寧獄者吾屬得所訴矣於是更相告語莫違教命蓋不惟以抵罪為憂實以汚善政為恥也嘉祐元年丙申先生年四十以太子中舍僉書合州判官事尋轉殿中丞中舍潘延之墓志作中書朱子行實作中書舍人愚按文獻通考唐東宫官屬有上舍人中舍人或謂之中書舍人孝和實録王友貞為太子中書舍人則稱謂雖殊於義皆通合州宋隸潼川府路今屬四川重慶府簽判掌禆贊郡政總理諸案文移斟酌可否以白於其長而罷行之宋太宗以諸州戎幕缺官選朝士補之俾分理事選人則為判官京官則為簽判事不經先生手吏不敢決苟下之民不肯從五年庚子先生年四十四解職東歸明年遷國子監博士通判虔州虔州宋隸江南西路紹興初改為贛州取章貢二水以名州也今因之隸江西先是先生在合州趙清獻公時為使者趙清獻公名忭字閲道其先京兆奉天人自祖湘始家於衢遂為西安人中景祐元年進士乙科仁宗末公充梓州路轉運使或譛先生趙公臨之甚威而先生處之超然然趙公疑終不釋及是趙公適來為守宋庠為樞密使選用武臣多不如舊法趙公陳其不可陳升之除樞密副使趙公與唐介吕誨范師道同言升之交結宦官進不以道章二十餘上不省乃乞補外出知虔州熟視先生所為執其手曰今日乃知周茂叔也八年癸卯英宗登極遷尚書虞部員外郎尋移判永州永州宋隸荆湖南路今升為府屬湖廣四年權發遣卲州事馬氏通考熙寧二年詔轉運使用本資序人即充資序下一等為權二等為權發遣然按此則神宗前己有權發遣之例不始熙寧二年也卲州宋隸荆湖南路寶慶元年以理宗潛藩升府改名寶慶今因之屬湖廣新學校以教其人先是卲之學在牙城中左獄右庾卑陋弗稱先生至遷於城之東南神宗熙寧元年戊申先生年五十二用清獻公及吕正獻公薦擢授廣南東路轉運判官清獻公時參知政事呂正獻公名公著字晦叔河南人夷簡子也中仁宗慶厯二年進士官至司徒贈申國公宋太祖以藩臣擅有財賦不歸王府乾德後僣偽略平始置諸道轉運使以總利權開寶六年廣南平除徐澤為判官轉運判官始此三年轉虞部郎中提點本路刑獄先生不憚出入之勤瘴毒之侵瘴知亮反雖荒崖絶島人迹所不至之處亦必緩視徐按務以洗寃澤物為任會有疾又水齧仙居縣太君墓因請知南康軍以歸南康軍太平興國七年以江州星子縣建宋隸江南西路今江西南康府府治後有愛蓮池相傳周子鑿池種蓮於其中而改葬太君於江州德化縣清泉社江州今江西九江府葬畢曰強起而來者為葬耳今猶欲以病汚麾紱耶強區兩反紱印組也上南康印分司南京真宗景德三年二月以太祖舊藩宋州歸德軍改為應天府大中祥符七年二月建為南京作鴻慶宫以奉太祖太宗聖像先生自少信古好義以名節自砥礪奉己甚約俸祿盡以周宗族奉賔友比歸妻子餰粥或不給曠然不以為意少好並去聲比必二反餰同饘諸延反力不能反故鄉廬山之麓有溪焉廬山在九江府城南距南康府城北十五里麓山足發源於蓮花峯下峯在九江府城北晉董奉常隱於此清潔紺寒下合於湓江湓音盆浦湓江即湓在九江府城外接於大江故謂之湓江晉志作湓浦先生濯纓而樂之因寓以濓溪之號而築書堂於其上焉今九江府城南有濓溪六年清獻公再尹成都英宗時清獻公以龍圖閣直學士知成都熙寧五年成都以戍卒為憂朝廷擇遣大臣為蜀人所愛信者特命公以大學士知成都是再尹也聞先生之去拜章乞留朝命及門而先生卒矣熙寧六年六月七日也年五十有七葬仙居縣太君墓左二子夀燾時皆太廟齋郎所著書有太極圖易説易通數十篇詩十卷朱子曰易説世無傳本易通疑即通書蓋易説既依經以解義易通則通論其大旨而不係於經者也特不知其去易字而為今名始於何時耳寧宗嘉定十三年六月二十二日賜諡曰元諡法主善行德曰元理宗淳祐元年追封汝南伯明道先生程氏名皓字伯淳其先曰喬伯為周大司馬封於程遂氏國語觀射父語昭王曰重黎氏世敘天地周程伯休父其後也宣王時失其官守而為司馬氏太史公自敘亦云喬伯疑即休父字然未詳其出何書也顧氏曰左傳襄二十三年程鄭嬖於公注鄭亦荀氏宗可見晉之程氏乃苟氏之别不與休父同出今既祖休父又祖程嬰則誤矣朱子注論孟如太公薑姓吕氏名尚别姓氏甚明至子夏姓卜子禽姓陳之類皆以氏為姓齊宣王姓田氏則并姓氏而為一矣自鄭漁仲始著氏族略前人多未講此愚按朱子語類謂姓是總腦處氏是後來次第分别處如魯本姬姓後有孟氏季氏同為姬姓而氏不同然則朱子於此未嘗不明特以無關義理不暇致詳耳世居中山之博野中山春秋之鮮虞也戰國時為中山國中山記曰城中有山因名漢高帝置中山郡後魏道武帝改為定州後周以深州博野屬焉唐因之太平興國初改定州為定武軍節度慶厯八年始置定州路安撫使統定保深祁廣信安肅順安永寧八州永寧即博野也政和三年升為府賜名中山屬河北西路博野漢涿郡蠡吾縣地後漢分置博陵縣後魏改為博野宋雍熙四年置寧邉軍景德元年改永定軍天聖七年改永寧軍屬河北道宣和十年廢為博野縣靖康後陷於金按今定州屬北直真定府博野屬北直保定府博野有二程先生祠定州至洛陽一千二百里高祖贈太子少師諱羽太宗朝以輔翊功顯賜第於京師居再世葬河南遂為河南人先生生於仁宗明道元年壬申之嵗月日先生生而神氣秀爽異於常兒未能言叔祖母任氏太君抱之行不覺叉墜任平聲叉初皆反集任氏贈大理寺丞諱道之妻封長夀縣太君明道有程殿丞墓志銘殿丞諱瑜字叔寶即其子也叉婦人岐笄後數日方求之先生以手指示隨其所指而往果得叉人皆驚異數嵗強記過人強區兩反十嵗能為詩賦十二三時羣居庠序中如老成人見者無不愛重故户部侍郎彭公思永謝客至學舍一見異之許妻以女妻音娶致彭思永字季長廬陵人熙寧三年以户部侍郎仕卒按明道集有彭公墓志按思永為中丞時因歐陽公有帷簿不修之謗遂以告蔣之竒上章劾之帝詰問辭窮坐貶則思永之為人可見特其能識明道於髫齔中為不可及耳嘉祐二年丁酉先生年二十五中進士第是年歐陽文忠公知貢舉御試及第出身者凡七百七十七人是科程張二先生外如二蘇曽子固朱公掞乙科吕和叔其最著也先是貢士張吳二人以殿試黜落積忿降元昊大為中國之患自此殿試遂免黜落調京兆府鄠縣主簿調去聲鄠侯古反或作扈府調選也京兆府今陜西西安唐玄宗開元元年十二月以雍州為京兆府宋初為永興軍宣和二年詔復稱京兆府按朱子詩傳則鄠即古崇國之地而文王滅之以作邑於豐者也令以其年少未知之民有借兄宅居者發地中藏錢兄之子訴曰父所藏也令以無證佐不能決先生曰此易辨耳問兄之子曰爾父藏錢幾何時矣曰四十年矣彼借宅居幾何時矣曰二十年矣即遣吏取錢十千視之謂借宅者曰今官所鑄錢不五六年即遍天下此錢皆爾未居前數十年所鑄何也其人遂服令大竒之南山僧舍有石佛南山即終南山也詩小雅斯干之詩幽幽南山注南山終南之山則亦以終南為南山也亦名中南孔頴達云昭四年左傳曰荆山中南九州之陰是此一名中南也劉長樂曰終南在鎬京之南故曰南山胡氏曰按鄠長安之西南皆曰終南山鄠縣在南山下北至長安城六十里嵗傳其首見光逺近男女聚觀晝夜雜處為政者畏其神莫敢禁止先使語其僧曰俟復見必先白吾職事不能往當取其首就觀之自是不復有光矣府境水害倉卒興役諸邑率皆狼狽惟先生所部飲食茇舍無不安便時盛暑泄利大行死亡甚衆獨鄠人無死者所至治役人不勞而事集嘗謂人曰吾之董役乃治軍法也遊定夫曰先生董役雖祁寒盛暑不擁裘不御蓋時所巡行衆莫測其至故人自致力常先期畢事異時夫伍中夜多譁一夫或怖萬夫競起姦人乘虛為盜者不可勝數先生以師律處之遂訖去無譁者及役罷夫散部伍猶整肅如常初至鄠有監酒稅者以賄播聞然怙力文身自號能殺人衆皆憚之文身者謂故刻其肌以丹青涅之所以文飾其身也雖監司州將未敢發州將謂知州也聞先生至其人心不自安輒為言曰外人謂某盜官錢新主簿將發之其勢窮必殺人言未訖先生笑曰人之為言一至於此足下食君之祿詎肯為盜萬一有之將救死不暇安能殺人其人默不敢言後亦私償其所盜卒以善去當路者欲薦之問所欲先生曰薦士當以才之所堪不當問所欲按唐桓彥範薦陽嶠為御史或以為嶠不樂搏擊之任彥範曰為官擇人豈必待其所欲所不欲者尢須與之所以長難進之風抑躁求之路其見頗與此合再期以避親罷時太中公以尚書虞部員外郎知鳯州事也調江寧府上元縣主簿上元古金陵地唐肅宗上元二年改今名上元田稅不均比他邑尢甚其美田地為貴家富室以厚價薄其稅而買之小民苟一時之利久則不勝其弊先生為令畫法民不知擾而一邑大均為去聲其始富者不便多為浮論欲搖止其事既而無一人敢不服者後諸路行均稅法慶厯中王素言天下田賦輕重不等請均定既而有言州縣多逃田未可盡括朝廷亦重勞人遂罷嘉祐五年復議均稅遣官分行諸路而祕書止丞髙本亦在遣中獨以為不可行才均數郡田而邑官不足益以他官經嵗歷時文案山積而尚有訴不均者計其力比上元不啻千百矣會令罷去先生攝邑事邑劇訴訟日不下二百為政者疲於省覽奚暇及治道先生處之有方不閲月民訟遂簡江南稻田賴陂塘以溉陂布眉反溉吉器反澤障曰陂溉灌也盛夏塘堤大決計非千夫不可塞法當由府轉達漕司漕司轉運使也然後計功調役非月餘不可調去聲也調算度先生曰如是則苗稿久矣民將何食救民獲罪所不辭也遂發民塞之嵗則大熟江寧當水運之衝舟卒病者則留之為營以處曰小營子嵗不下數百人至者輒死先生察其由蓋既留然後請於府給劵乃得食比有司文移具則困於飢已數日矣比必二反文下今本無移字先生白漕司給米貯營中至者與之食自是生全者大半八年癸卯先生年三十一仁宗登遐記曲禮告喪曰天王登假鄭氏曰登上也假已也上己者若仙去云爾孔頴達曰言上升已矣若仙去然也陳氏曰登升也假與遐同言其所升髙逺猶漢書稱大行行循行之行讀作去聲以其往而不返故曰大行也愚按魏孫育云諡法大行受大名細行受細名初崩未諡而嗣帝已立臣下所稱辭宜有異故謂之大行言其有大德行必受大名若稱諡也據此則陳説非也唯所釋登遐較鄭孔説為優遺制官吏成服三日而除三日之朝府尹率羣官將釋服時王贄知府事先生曰請至夜除之不然則所服止二日耳尹怒不從先生曰公自除之某非至夜不敢除也一府相視無敢除者顧亭林曰君喪之禮戰國來已久廢漢文帝乃特著之為令然詔但云吏民三日釋服蓋吏民於天子之喪當齊衰三月而今以三日故世謂以日易月初未嘗概之臣子又云殿中當臨者旦夕各十五舉音已下服大紅十五日小紅十四日纖七日釋服已下者下棺謂已葬也自始崩至葬皆斬衰及已葬而大功而小功而纖以示變除之漸漢諸帝自崩至葬有百餘日者未葬則服不除已葬變為輕服則又三十六日此所以制其臣子未嘗以日易月也至唐玄宗肅宗之喪遂改為初崩之後二十七日而宋仁宗遺制官吏成服三日而除蓋變而逾短不無追咎夫漢文之作俑矣胡致堂曰自漢丈短喪之後能斷然行三年者惟晉武帝魏孝文周髙祖可謂難得矣然晉武帝既為裴杜所惑行禮不備魏孝文之禮若備矣而服非所服周髙祖衰麻苫塊卒三年之制最為賢行然推明通喪止於五服之內不及羣臣非所以教天下著於君臣之義也又在喪頻出逰幸無門庭之冦興師伐鄰此皆禮所不得為者由髙祖不學無稽古之臣以輔之使髙祖至性如魏晉二君而講禮如孝文之詳教臣下以方喪三年不出遊幸不動兵革以終禮制雖三代何以加諸茅山有龍池茅山在江寧府句容縣東南四十五里山形如勾字初名句曲山因茅君得道於此更今名愚按茅山本不在上元因長吏使往請龍故及之其龍如蜥蜴而五色蜥音昔蜴音易蝘顔師古曰爾雅云蠑螈蜴蜥蜓守宫是則一類耳揚雄方言云在澤中者謂之蜥蜴祥符中中使取二龍中途乃奏一龍飛空而去自是嚴奉以為神物先生嘗捕而脯之使人不惑按伊川言伯淳守官南方長吏使往茅山請龍辭之謂祈請鬼神當使信嚮者則有應今先懷不信便非義理既到茅山嵒敕使人於水中捕得二龍持之歸復為小兒玩之致死此為魚蝦之類但形狀差異如龍之狀爾廣南亦有此蟲其形狀同但齧人有害不似茅山不害人也其始至邑見人持竿以黏飛鳥取其竿折之教之使勿為自此鄉民子弟不敢畜禽鳥時謝師直為江東轉運判官師宰來省其兄嘗從先生假公僕掘桑白皮師直名景溫師宰名景平其先陳郡陽夏人以父綘知鄧州卒於官葬焉遂為鄧之穰縣人皆進士後師宰官至祕書丞卒桑白皮者取桑嫩根用銅刀刮去青黃薄皮一重取裏白皮切焙乾用也先生曰漕司役卒甚多何為不使曰本草説桑白皮出土見日者殺人陶𢎞景名醫别録云采無時出土上者殺人但江邊多出土不可輕信云按原書無見日二字蓋出土上者必見日師宰以但出土意猶未明故加見日二字以足其意以伯淳所使人不欺故假之耳師宰之相信如此再期移澤州晉城令澤州宋屬河東路今隸山西宋白曰取濩澤為名晉城在州城東今廢澤人淳厚尤服先生教命其俗朴野不知學先生擇其秀異為置學舍朝夕督厲誘進去邑才十餘年而服儒服者蓋數百人矣先生為政條教精密而主之以誠心其民被服先生之化暴桀子弟知有恥不犯邑幾萬室三年間無強盜及鬬死者秩滿代者且至吏夜叩門稱有殺人者先生曰吾邑安有此誠有之則某村某人也問之果然蓋先生固疑此人惡少之弗革者也河東財賦窘迫官所科買嵗為民患雖至賤之物至官取之則其價翔湧多者至數十倍按和預買始於太平興國七年凡官所須物多有司下諸州從風土所宜及民産厚薄而率買謂之科率但諸路科買多出倉猝故其價翔湧民按司馬溫公言太宗平河東立糴法時斗米十餘錢樂與官為市其後物貴而和糴不解遂為河東世世患蓋溫公但就米而言其實他物都如此先生常度所需使富民預儲定其價而出之富室不失倍息而鄉民所費比常嵗十不過二三民稅常移近邊載往則道逺就糴則價高先生擇富民之可任者預使購粟邊郡所費大省民力用紓紓舒通用氏移運移也近邊謂近地之邊也按宋以前漕挽皆以運隨處儲倉轉相遞送又時西夏叛服不常河東地近陜西故往往留作邊儲富民即晉城之富民也預使於邊郡儲粟以待則就糴而價不甚高民不必載粟以往矣故費省刀紓邱瓊山謂漢唐宋漕挽皆是轉相遞送至明始用長運之法然愚按馬氏通考謂宋自蔡京從曾孝廣䇿始更四路轉般為直達京師之法而漕法始壞則長運不自明始也縣庫有雜納錢數百千常借以補助民力雜納錢謂民間所納之雜稅也部使者至則告之曰此錢令自用而不敢私請一切不問令先生自謂也言令自用見非國之正課也不敢私指借以補助民力而言使者屢更無不從者先時民憚差役役及則互相糾訴鄉鄰遂為仇讐先生盡知民産厚薄第其先後按籍而命之無有辭者河東義勇農隙則教以武事然應文備數而己先生至晉城之民遂為精兵仁宗康定初詔河北河東添籍強壯皆以時訓練慶厯二年籍強壯揀十之七為義勇且籍民丁以補其不足義勇者籍其民強壯者為軍刺手背為義勇字各營於其州給以俸廩分畨訓練不願者釋之按韓魏公言今之義勇河北幾十五萬河東幾八萬稍加簡練亦唐之府兵今觀明道為之而晉城之民遂為精兵亦可見韓公之言信而有徴也然韓公欲刺陜西民為義勇司馬公力爭不聽後卒為陜西之患其故何也蓋治得其人則兵精而民不擾不然也則徒見其擾民而已溫公語韓公有言公長在此地可嗚呼人不可以常得而法已一作而不能以復止矣可不慎乎晉俗尚焚尸雖孝子慈孫習以為安先生教諭禁止民始信之而先生去後郡官有母死憚於逺致以投烈火愚俗視效先生之教遂廢識者恨之按顧氏曰火葬之俗盛行於江南宋紹興間監登聞鼓院范同言生則奉養之具惟恐不至死則燔爇而捐棄之國朝著令貧無葬地者許以官地安葬韓琦鎮并州以官錢市田數頃給民安葬至今為美談而吳縣尉黃震亦言傷風敗俗莫此為甚今且習以為常恬不知怪悖謬喪心一至於此豈不哀哉先生為令視民如子欲訴者或不持牒徑至庭下陳其所以先生從容告語諄諄不倦在邑三年百姓愛之如父母去之日哭聲振野後劉立之官晉城距先生之去已十餘年見民有聚口衆而不析異者問其故曰守程公之化也其誠心感人如此用薦者改著作佐郎尋以御史中丞吕正獻公薦授太子中允權監察御史裏行裏行者資序未至未正除監察御史令於監察御史班裏行也鄭夾漈曰御史之名周官有之蓋掌贊書而授法令非今任也戰國時秦趙澠池之會各命御史書事又淳于髠謂齊王曰御史在前則皆記事之任至秦漢為糾察之官秦以御史監郡漢初定禮儀御史執法舉不如儀者輒引去是也按唐馬周起布衣詔命於監察御史裏行蓋未命以官故命於御史裏行後遂以裏行名官時神宗熙寧二年己酉而先生年三十七矣神宗素知先生名召對之日從容咨訪比二三見遂期以大用每將退必曰頻求對來欲常相見耳一日論議甚久日官報午正春秋傳天子有日官諸侯有日御宋名司天監先生遽求退庭中中人相謂曰御史不知上未食耶前後進説甚多大約以正心窒欲求賢育才為先先生不飾辭辨獨以誠意感動人主神宗嘗使推擇人才先生所薦者數十人而以父表弟張載暨弟頥為首所上章疏輒削藁不以示子弟曰揚已矜衆吾所不為嘗言人主當防未萌之欲神宗俯身拱手曰當為卿戒之及因論人才曰陛下奈何輕天下士按外書明道見神宗論人才上曰朕未之見也故先生云然神宗曰朕何敢如是言之至於再三神宗嘗問所以為御史者對曰使臣拾遺補闕禆贊朝廷則可使臣掇拾臣下短長以沽直名則不能神宗歎賞以為得御史體一日神宗言及辭命先生曰人主之學惟當務為急辭命非所先也會同天節英宗治平四年正月神宗登極以所生四月十日為同天節宮嬪專獻竒巧為天子壽先生既言於朝又顧謂執政戒之執政曰宮嬪實為非上意也庸何傷先生曰作淫巧以蕩上心所傷多矣月令曰毋或作淫巧以蕩上心此先生因執政以宫嬪為之為無傷故特引以見監工所以戒百工者如此固不必其出自上意也公言非是執政辭遂屈時王荆公安石日益信用先生每進見必為神宗陳君道以至誠仁愛為本未嘗及功利神宗始疑其迂而禮貌不衰嘗極陳治道神宗曰此堯舜之事朕何敢當先生愀然曰陛下此言非天下之福也荆公寖行其説先生意多不合事出必論列數月之間章數十上尤極論者輔臣不同心小臣與大計公論不行青苗取息正月放夏料五月放秋料蓋麥熟於夏而正月放之禾熟於秋而五月放之至其熟而斂之也每錢千文加利二百文如災傷及五分以上則夏料青苗錢令於秋料送納秋料於次年夏料送納歐陽文忠公嘗言夏料錢於正月俵散猶是青黃不接之時若秋料於五月俵散正是蠶麥成熟人户不乏之時何名濟闕直是放債取利耳若二麥不熟則夏料尚欠豈宜更俵秋欠其言可謂深切著明矣初陜西轉運使李參以部內多戍兵而糧儲不足令民自隱度麥粟之贏先貸以錢候榖熟還官號曰青苗錢經數年廩有餘糧至是條例司請以諸路常平廣惠倉錢榖依陜西青苗錢例朱子曰青苗之法其立意亦未嘗不善但其給之也以金而不以榖其處之也以縣而不以鄉其職之也以官吏而不以鄉人士君子其行之也以聚斂亟疾之意而不以慘怛忠利之心是以王氏能行之於一邑而不能行之於天下也賣祠部牒宋制祠部掌諸州宫觀僧尼道士童行住持教門事務牒僧道度牒也文獻通考云神宗熙寧元年降空名度牒五百道付兩浙運司令分賜本路召人納米或錢賑濟續通考云時歲河決知諫院錢公輔建議也差提舉官多非其人熙寧二年置諸路提舉官時條例司上言民間多願貸青苗錢乞遍下諸路轉運使施行仍詔諸路各置提舉二員管當一員掌行青苗免役農田水利諸路凡四十一人提舉官既置往往迎合王安石意務以多散為功民間苦之及不經封駁唐宋制門下省給事中主封駁詔敕有不可者封駁還之駁還而不欲宣泄重封上之故曰封駁不經封駁者如神宗初立司馬光罷御史中丞吕公著封還除目詔以告直付閣門熙寧三年光以言不用力辭樞密副使詔允光辭收還誥敕范鎮封還詔旨者再帝以詔直付光不由門下之類是也按顧氏曰漢哀帝封董賢而丞相王嘉封還詔書後漢鍾離意為尚書僕射數封還詔書自是封駁之事多見於史而未以為專職也唐制凡詔敕俱經門下省事有不便得以封還而給事中又有駁正違失之掌著於六典五代廢弛宋太宗淳化四年六月戊寅始復給事中封駁而司馬池猶謂門下雖有封駁之名而詔書一切自中書以下非所以防過舉也明代雖罷門下省長官而獨存六科給事中以掌封駁之任旨必下科其有不便給事中駁正到部謂之科參六部之官無敢抗科參而自行者故給事中之品卑而權特重萬厯時九重淵默泰昌後國論紛紜而維持禁止往往賴抄參之力今人所不知矣京東轉運使剝民希寵不加黜責謂王廣淵也初王安石欲行青苗法蘇轍極言其不可安石曰君言殊有理當徐思之會廣淵乞留本道錢帛五十萬貸之貧民嵗可獲息二十五萬其事與青苗法合於是決意行焉廣淵在京東一等戶給十五千等而下之至五等猶給一千民間喧然以為不便廣淵入奏謂民皆歡呼感德先生與諫官李常極論其抑配掊克迎旨困民不聽按廣淵在仁宗時因近昵獻文於英宗潛邸司馬公論其交結奔競世無與比則其為人固可見矣興利之臣日進尚德之風寖衰等十餘事以上乃章數十上中之切要者伊川不能悉録其詞而撤其大旨如此其詳並見文集荆公與先生雖道不同而嘗謂先生忠信先生每與論事心平氣和荆公多為之動而言路好直者必欲力攻取勝由是與言者為敵矣按遺書伯淳嘗言管仲猶能言出令當如流水以順人心今參政須要做不順人心事何故介甫之意只恐始為人所沮其後行不得伯淳却道但做順人心事人誰不願從也介甫道此則感賢誠意却為天祺其日於中書大悖緣是介甫大怒遂以死力爭於上前上為之一以聽用從此黨分矣又外書伯淳言熙寧初王介甫行新法並用君子小人君子正直不合介甫以為俗學不通世務斥去小人苟容諂佞介甫以為有才知變通而用之君子如司馬君實不拜同知樞密院以去范堯夫辭同修起居注得罪張天祺以御史而折介甫被責介甫性狠愎衆人以為不可則執之愈堅君子既去所用皆小人爭為刻薄故害天下益深使衆君子未與之敵俟其日久自緩委曲平章尚有聽從之理則小人無隙可乘其害不至如此之甚也先生言既不行懇求外補神宗猶重其去上章及面請至十數不許遂闔門待罪闔門謂閉門不復視事也神宗將黜諸言者命除先生監司差權發遣京西路提點刑獄復上章曰臣言是願行之如其妄言當賜顯責請罪而獲遷刑賞混矣纍請得罷既而神宗手批暴白同列之罪獨於先生無責改差僉書鎮寧軍節度判官事澶州於石晉為鎮寧軍節度崇寧四年建為北輔五年升開德府宣和二年罷輔郡仍隸河北東路金改為開州元明及今並因之屬北直大名府胡身之曰唐澶州治頓邱縣自晉李存審築德勝南北城及石晉天福三年遂移澶州及頓邱縣於德勝以防河津且懼契丹南牧也宋景德澶淵之役猶在德勝熙寧以來澶州治濮陽又非石晉所移之地為守者嚴刻多忌通判而下莫敢與辨事始意先生嘗任臺憲必不盡力職事而又慮其慢已既而先生事之甚恭雖管庫細務無不盡心管與管同事小未安必與之辨遂無不從者相與甚歡屢平反重獄反音翻得不死者前後蓋十數河清卒於法不他役時中人程昉為外都水丞怙勢蔑視州郡欲盡取諸掃兵治二股河河清宋西京畿縣名掃兵皆給他役惟河清兵以汴河所隸故不他役程昉開封人纍官內侍押班副都知熙寧十年以河決不白水災憂死掃堤岸竹木為枋以葦及秫秸實其中和土以捍水也今黃河有之河流𣲖别於魏州之第六掃曰二股河其廣二百尺距魏恩德博之境百三十里東至德滄入海神宗熙寧二年浚二股河以導東流蓋司馬溫公請舊宋昌程昉之議也韓魏公以為不可惟溫公力主之七月二股河通大河東流而商胡河北流稍塞蓋東流者自滑恩經德滄入海之路北流者商胡河乾寧入海之路先生以法拒之昉請於朝命以八百人與之天方大寒昉肆其虐用衆衆逃而歸州官晨集城門吏報河清兵潰歸將入城衆官相視畏昉欲弗納先生曰此逃死自歸弗納必為亂昉有言某自當之即親往開門撫諭約歸休三日復役衆歡呼而入具以事上聞得不復遣後昉奏事過州見先生言甘而氣懾既而揚言於衆曰澶卒之潰乃程中允誘之吾必訴於上同列以告先生笑曰彼方憚我何能爾也果不敢言會曹村掃決時先生方救護小吳相去百里曹村小吳並掃名熙寧四年八月河溢澶州曹村掃決州帥劉渙以事急告先生一夜馳至帥俟於河橋帥即知州也劉渙字仲章保州保塞人連州刺史文質子與兄滬並有名於時歷知澶州以工部尚書致仕河橋即河石晉天福六年德勝口所作浮梁也先生謂帥曰曹村決京城可虞臣子之分身可塞亦為之請盡以廂兵見付事或不集公當親率禁兵以繼之京城謂大名府城也仁宗慶厯二年五月契丹聚兵幽薊聲言南下吕夷簡請建都大名示將親征以沮其謀帝從之以大名府為北京故曰京城廂兵者諸州之鎮兵以分給役使者也按軍分左右廂唐已有之但唐於南北牙禁軍亦謂之廂兵如景雲初以臨淄王押左右廂萬騎開元中敕裴光庭蕭嵩分押左右廂兵至德初擇善騎射者千人為殿前射生手分左右廂魚朝恩以神䇿軍分左右廂之類皆謂禁兵其左右廂兵馬使則鎮兵之廂也與宋制專謂鎮兵為廂軍者不同禁兵者天子之衛兵以更畨戍邊者也宋制諸州長吏選所部內兵驍勇者教習訓練送闕下以備宿衛立更戌法使分畨屯戍捍禦邉圍故諸州皆有禁兵其餘留本城者謂之廂兵雖本城時或戍更然罕教閲類多給役而已帥義烈士遂以本鎮印授先生曰君自用之先生得印不暇入城省親徑走決隄決隄謂河所決之隄也是時廂兵已在決隄即下文士卒是也故授之以印使聽指麾諭士卒曰朝廷養爾輩正為緩急耳爾知曹村決則注京城乎吾與爾曹以身捍之衆皆感激自效論者皆以為勢不可塞徒勞人耳先生命善汨者銜細繩以渡決口水方奔注達者百一卒能引大索以濟衆汩古忽反從日月之日或作泅銜一作運汨沒也卒終也兩岸並進晝夜不息數日而合其將合也有大木自中流而下先生顧謂衆曰得彼巨木橫流入口則吾事濟矣語才已木遂橫衆以為至誠所致其後曹村之下復決數路困擾大為朝廷憂人謂使先生在職安有是也按熙寧十年大決於曹村北流斷絶河道南徙東匯於梁山張澤濼分為二𣲖一合南清河入於淮一合北清河入於海凡灌郡縣四十五而濮齊鄆徐尢甚判大名府文彥博言河勢變移四散漫流兩岸俱被水患而都水止固護東流北岸希省費之賞未嘗增修隄岸今日之決溢非天災實人力不至也逾年決口塞詔改曹村掃曰靈平五年十二月郊祀霈恩宋制三年而郊郊必先享太廟禮畢加恩肆赦以為常制伊川曰古者一年之間祭天甚多春則因民播種而祈榖夏則恐旱暵而大雩以至秋則明堂冬則圜邱皆人君為民之心也凡人子不可一日不見父母國君不可一嵗不祭天豈有三年一親郊之理先生曰吾罪滌矣可以去矣遂求監局以便養親罷歸嵗餘得監西京洛河竹木務時太中公得請領崇福宫崇福宫在嵩山故先生求監局以便歸養也宋以河南府為西京竹木務掌受諸路水運材租抽算商販竹木以經營造勾當官一人以京朝官充范氏曰先生自此居洛殆幾十年薦者言其未嘗敘年勞丐遷秩特改太常丞顔師古曰太常者王之旌也畫日月焉王者有大事則建以行禮官主奉持之故曰奉常後改為太者尊大之意也按漢景帝中六年改今名會修三經義神宗語執政曰程某可用執政不對熙寧六年三月置修經局以王安石提舉其事訓詩書周禮三經義以吕惠卿王雱同修撰帝欲召明道預其事安石不可熙寧八年頒之學宫以取士先儒傳注盡廢其後彗見翼軫間詔求直言先生應詔論朝政極切彗音遂見音現頴彗妖星爾雅彗星為欃槍文曰孛彗長三星其占略同而形象少異孛星光芒短其光四出蓬蓬孛孛也彗星光芒參參如掃彗長星有一直指或竟天或三丈二丈無常占法彗孛星多為除舊布新長星多為兵革事管子彗星見則修和翼軫南方鶉尾之宿翼二十二星軫四星楚荆州分野按熙寧八年十月彗星見詔求直言罷手實法又有星孛於軫帝以災異數見避殿減膳文按是疏不見集元豐元年戊午還朝神宗手批與府界知縣差知扶溝縣事宋謂開封府為府界扶溝其屬縣也今屬陳州府二年二月以右府同薦除判武學宋以中書樞密為二府中書主文居左曰左府亦曰東府樞密主武居右曰右府亦曰西府又或以樞密為宥府云樞密薦先生知兵故命判武學慶厯三年詔置武學於武成王廟以阮逸為武學諭未幾省去熙寧五年六月復置選知兵書者判武學置直講如國子監新進者言其新法之初首為異論罷復舊任李定何正臣劾其學術迂濶趨向僻異且新法之初首為異論時顧臨權開封府推官亦以為言故罷吕正獻公言皓立身行已素有本末武學未為仕宦要津而小人齗齗以為不可直欲深梗正路耳不聽先生為治專尚寬厚以教化為先雖若甚迂而民實風動扶溝素多盜雖樂嵗不減十餘發先生在官無復盜患廣濟蔡河出縣境瀕河不逞之民不復治生業專以脅取舟人物為事嵗必焚舟十數以立威脅同脅城廣濟河名舊名五丈河自汴歷曹濟及鄆其廣五丈故名宋間寶六年詔改名廣濟河蔡河即浚儀縣之琵琶溝也宋三朝會要曰蔡河即閔河也太祖建隆元年命陳承昭督丁夫導閔河自新鄭與蔡水合貫京師南歷陳潁達夀春以通淮右舟楫相繼商賈畢至都下利之於是以西南為閔河東南為蔡河至開寶六年始改閔河為惠民河脅以威力迫脅也先生始至捕得一人使引其類得數十人不復根治舊惡分地而處之使以挽舟為業挽舟南人用麻繩北人以竹為之名曰百丈陸放翁曰蜀人百丈以巨竹四破為之大如人臂且察為惡者自是邑境無焚舟之患畿邑田稅重朝廷嵗常蠲除以為惠澤然良善之民憚督責而先輸逋負獲除者皆頑民也先生為約前科獲免者今必如期而足於是惠澤始均司農建言天下輸役錢達户四等而畿內獨止第三請亦及第四司農卿掌邦國倉儲委積之事漢初置治粟內史景帝改曰大農武帝加司字四等謂計民貧富分四等輸錢所謂免役法也畿內獨止第三則下户得免蓋以稅重故役少輕也達通也謂通天下之户皆以四等輸錢也按太宗太平興國五年二月定差役法分諸州户為九等上四等充役下五等免則此所云達户四等者乃宋初差役舊制耳王安石免役之法則分為五等輸錢故其上五事劄子於免役之法云不得其人而行五等必不平募役必不均而判司農寺鄧綰曾布亦言家資之貧富上下分為五等嵗以夏秋隨等輸錢俱明明自云五等矣且青苗保甲諸法並以五等為則此云四等疑誤先生力陳不可司農奏其議謂必獲罪而神宗是之畿邑皆得免先生為政常權榖價不使至甚貴甚賤會大旱麥苗且枯先生教人掘井以溉一井不過數工而所灌數畝闔境賴焉水災民飢先生請發粟振貸振貸見漢書顔師古曰振起也為給貸之令其成立也俗從貝作賑非鄰邑亦請司農怒遣使閲實使至鄰邑而令遽自陳穀且登無貸可也先生獨力言民飢請貸不已遂得榖六千石飢者用濟而司農益怒視貸籍户同等而所貸不等檄縣杖主吏先生言濟飢當以口之衆寡不當以户之髙下且令實為之非吏罪乃得已內侍都知王中正巡閲保甲權寵至盛所至陵慢縣官諸邑供帳競務華鮮以悅奉之供帳之帳古通用張熙王中正字希烈開封人以父任補入內黃門寧三年十一月立保甲法其法十家為保五十家為大保有大保長十大保為都保有都保正副每一大保夜輪五人警盜凡告捕所獲以賞格從事諸州籍保甲禁令苛急往往去為盜郡縣不敢以聞方氏云供帳謂供具張設也漢書如髙祖留沛張飲黥布傳張御食飲疏廣傳設祖道供張東都門外並只用張字皆謂張設也愚按史記注張晏曰張帷帳也觀下文謂令有故青帳則此似當從張説主吏以請先生曰吾邑貧安能效他邑且取於民法所禁也令有故青帳可用之令或作今謂令先生自也先生在邑嵗餘中正往來境上卒不入鄰邑有寃訴府願得先生決之有犯小盜者先生謂曰汝能改行吾薄汝罪盜叩首願自新後數月復穿窬捕吏及門盜告其妻曰我與太丞約不復為盜今何靣目見之耶遂自經經縊也孫愐曰頸在前項在後故引繩經其頸謂之自經以刀割其頸謂之自剄元豐三年官制改按宋制臺省寺監官無定員無專責悉皆出入分蒞庶務其本司之事類以他官主判雖有正官非特旨供職亦不任其事州縣守令多帶中朝職事官外補故自真宗仁宗以來論者以官制淆亂每以正名為請帝慨然欲改其制六月詔置詳定官制局於中書命翰林學士張璪樞密副使張誠一領之九月頒行馬氏曰宋大率以職為階官以宰執言之如吏部尚書為階官同中書門下平章為職禮部侍郎為階官參知政事為職之類是也然所謂吏部尚書禮部侍郎者未嘗專有所繫屬治其事則為職不職其事則為階官猶云可也獨選人七階則皆以幕職令録之屬為階官而幕職令録則各有所係屬之監司州縣遂至有以京西路某縣令為階官而為河北路轉運司勾當公事者有以陜西路某軍節度判官為階官而為河東路某州州學教授者有以無為軍判官為階官而試祕書省校書郎者其叢雜可笑尤甚元豐時未暇革正至崇寧二年刑部尚書鄧洵武極言其事遂以承直郎等七階換之七階者承直儒林文林從事通仕登仕將仕也政和間改通仕為從政登仕為修職將仕為迪功除奉議郎朝廷遣官括牧地時三省密院欲以牧地募民牧養馬也民田當沒者千頃往往持纍世契劵以自明皆弗用諸邑已定而扶溝民獨不服遂有朝旨改稅作租不復加益及聽賣易如私田私田為稅官田為租改稅作租則是官田也官田不得私自賣易今聽賣易故云如私田民既倦於追呼又得不加賦乃皆服先生以為不可括地官至曰民願服而君不許何也先生曰民徒知今日不加賦而不知後日增租奪田則失業無以生矣增租承改稅作租而言奪田承賣易如私田而言因為言仁厚之道其人感動謝曰寧受責不敢違公遂去之他邑會先生罷括地官復至謂攝令者曰程奉議去矣爾復何恃而敢稽違朝旨耶令不敢違數日而事集扶溝地卑嵗有水旱先生經畫溝洫之法以治之未及興工而先生去官先生嘗曰以扶溝之地畫為溝洫必數年乃成吾為經畫十里之地以開其端後之人知其利必有繼之者矣夫為令之職必使境內之民凶年飢嵗免於死亡飽食逸居有禮義之訓然後為盡故吾於扶溝興設學校聚邑人子弟教之亦幾成而廢夫百里之施至狹也而道之興廢繫焉是數事者皆未及成豈不有命與然知而不為而責命之興廢則非矣此吾所以不敢不盡心也鄰邑民犯盜繫扶溝獄而逸坐罷邑人詣府及司農丐留者千數去之日不使人知老稚數百追及境上攀挽號泣遣之不去以親老求近鄉監局得監汝州酒稅汝州今屬河南八年三月五日神宗升遐詔至洛故相韓康公為留守韓康公名絳字子華真定靈夀人初以父任為大理評事舉進士第三人王安石薦之入相封康國公留守司掌宫鑰及京城守衛修葺彈壓之事畿內錢榖兵民之政宋制天子巡狩親征則命親王或大臣總留守事宋太祖自潞州還以大梁為東京洛陽為西京故洛亦有留守以執政從臣充先生以檄來舉哀於府既罷謂康公之子宗師兵部曰皓以言新法不便忤大臣同列皆謫官皓獨除監司皓不敢當辭之念先帝見知之恩終無以報已而泣宗師字傳道第進士纍官至集賢殿修撰知河中府卒兵部曰今日朝廷之事如何先生曰司馬君實吕晦叔作相矣兵部曰二公果作相當如何曰當與元豐大臣同若先分黨與他日可憂兵部曰何憂曰元豐大臣皆嗜利者使自變其已甚害民之法則善矣不然衣冠之害未艾也君實忠直難與議晦叔解事恐力不足耳既而果皆如所言朱子曰明道言當與元豐大臣共政此乃聖賢之用義理之正非姑為權譎苟以濟事於一時也蓋伊川氣象自與明道不同而其論變化人材亦有此意易傳於暌之初爻有不絶小人之説足見此自是正理也然亦須有明道廣大規模和平氣象而其誠心昭著足以感人然後有以盡其用耳不然而以權譎利害之心為之則其悖理而速禍也為尤甚矣亡何召先生為宗正寺丞宋制宗正寺判寺事二人以宗姓兩制以上充缺則以宗姓朝官以上知丞事元豐更官制詔宗正寺除長二外更不專差國姓未行以疾卒元豐八年乙丑六月十五日也享年五十有四以是年十月乙酉葬於伊川先塋子二端懿端本按明道次子端慤早卒故不書今明道集有程邵公墓志可考也但太中自撰墓志諸孫中有端輔早亡無端慤豈端輔即端慤耶寧宗嘉定十三年諡曰純諡法中正精粹曰純理宗淳祐元年追封河南伯按伊洛淵源録云韓持國撰明道墓志不傳於世韓氏家乘經亂不存然按今宋文鑑中有韓撰明道墓志蓋朱子偶未及見耳伊川先生名頥字正叔明道先生之弟也於仁宗明道二年癸酉月日生幼有髙識非禮不動年十四五與明道同受學於舂陵周茂叔先生永州寧逺縣有舂陵山舂水所出漢封長沙定王子為舂陵侯於此今有舂陵城道州本永州地故曰舂陵皇祐二年年十八上書闕下勸仁宗以王道為心生靈為念黜世俗之論期非常之功且乞召對靣陳所學不報按今疏稿見文集逰太學海陵胡翼之先生方主教導嘗以顔子所好何學論試諸生得先生所論大驚即延見處以學職海陵宋縣名屬泰州今省入州胡翼之先生名瑗皇祐四年為國子監直講吕希哲與先生鄰齋首以師禮事焉既而四方之士從逰者日益衆吕希哲字原明正獻公長子以恩補官元祐六年以范淳夫薦為崇政殿説書尋擢右司諌不拜紹聖初出知太平州坐黨謫居和州徽宗立召為光祿少卿出守奉祠而卒舉進士謂有司以進士舉先生使入京待禮部試非如今之既及第而後謂之進士也嘉祐四年己亥先生年二十八廷試報罷遂不復試初進士諸科待試京師者恆六七千人一不幸有故不下詔往往沉淪十數年以此毁行干進者不可勝數嘉祐二年十二月王洙侍邇英閣講周禮至州長三年大比帝曰古者選士如此今率四五歲一下詔故士有抑而不得進者不若裁其數而屢舉之也於是詔間嵗一舉士故嘉祐二年舉士而於此復舉也英宗治平三年以胡宿言改用三年一貢舉之制耶按史謂殿試自嘉祐二年免黜落然伊川獨報罷何蘇文忠公嘗言祖宗舊制過省舉人御試黜落不少既以慎重取人又以見名器威福專在人主至嘉祐末年始盡賜出身雖文理紕謬亦玷科舉而近嵗流弊之極至於雜犯亦免黜落皆非祖宗本意然則至後來乃始并雜犯亦免黜落蓋其初固猶未必如今盡賜及第也太中公屢當得任子恩輒推與族人治平熙寧間近臣屢薦自以為學不足不願仕也原注按吕申公家傳云公判太學命衆博士即先生之居敦請為太學正先生固辭公即命駕過之又雜記英宗治平三年九月申公知蔡州將行言先生通古今治亂之要有經世濟物之才望以不次擢用明道行狀云神宗嘗使推擇人才明道所薦者數十人以父表弟張載暨弟頥為稱首元豐八年三月哲宗嗣位門下侍郎司馬溫公尚書左丞呂申公及西京留守韓康公上其行義於朝原注按溫公集與呂申公同薦劄子言先生力學好古安貧守節言必忠信動遵禮義年餘五十不求仕進真儒者之髙蹈聖世之逸民伏望特加召命擢以不次足以矜式士類禆益風化三葉氏曰宋元豐官制本唐六典以尚書門下中書為省各以其省長官為宰相則侍中中書令尚書令是也既又以秩髙不除而以尚書令之二左右僕射為宰相而左僕射兼門下侍郎以行侍中之職右僕射兼中書侍郎以行中書令之職復别置尚書左右丞以代參知政事司馬溫公名光陜州夏縣人仁宗寶元元年進士官至左僕射贈溫國公諡文正十二月丁巳授汝州團練推官西京國子監教授汝州團練推官階也西京國子監教授職也以汝州之官而任西京國子監之職馬氏所謂官制叢雜可笑而元豐時猶未革正者也按團練推官後改為從事郎先生再辭尋召赴闕元祐元年三月至京師除宣德郎祕書省校書郎祕從示先生辭曰祖宗時布衣被召自有故事按太祖開寶三年王昭素召見便殿令講乾卦及問以治世養身之術然後授國子監博士以衰老不受賜致仕又真宗咸平五年种放以張齊賢言召至以幅巾入見崇政殿賜坐詢以民政邊事然後授左司諫直昭文館觀此則祖宗時布衣被召皆先入見而後授以官者故先生引以為言今臣未得入見未敢祗命於是召對太皇太后靣諭將以為崇政殿説書先生辭不獲始受西監之命且上奏論經筵三事其一以上富春秋輔養為急宜選賢德以備講官因使陪侍宿直陳説道義所以涵養氣質薰陶德性其二請上左右內侍宮人皆選老成厚重之人不使侈靡之物淺俗之言接於耳目仍置經筵祗應內臣十人祗旨夷反從示與從禾從衣者别令祇敬也言敬以應經筵之使也與閣門祗候之祗同使伺上在宮中動息以語講官其或小有違失得以隨事規諫其三請令講官坐講以養人主尊儒重道之心寅畏祗懼之德而曰若言可行敢不就職如不可用願聽其辭原注劄子三道見文集又按劉忠肅公文集有章疏論先生辭卑居尊未被命而先論事為非蓋不知先生出處語默之際其義固已精矣按文集謂經筵臣寮侍者皆坐而講者獨立於禮為悖蓋緣講官在御案旁以手指書所以不坐欲乞别一人指書講官稍逺御案坐講既而命下以通直郎充崇政殿説書元豐官制以通直郎換太子中允贊善大夫仁宗景祐元年正月置崇政殿説書日輪二人祗候按文獻通考引吳氏能改齋漫録曰傅簡公佳話云太祖性好藝文即位未幾召山人郭無為於崇政殿講書至今講官所領階銜猶曰崇政殿説書云然則是官固不始於仁宗也蓋或中間嘗罷去而仁宗復置之耳先生再辭而後受命四月例以暑熱罷講先生奏言輔導少主不宜疏略如此乞令講官以六參日上殿問起居六參日謂一月六赴朝參之日也元豐官制侍從官而上日朝垂拱為常參官百司朝官以上每五日一朝紫宸為六參官京朝官以上朔望一朝紫宸為朔參官望參官蓋常參日太數朔望參日太疏故請以六參日也按下跬步不離正人及間日一講為益少之語則間日進講程子尚以為未盡此乃請以六參曰上殿問起居者蓋程子因時以暑熱罷講不得已而為此説耳非欲以此盡正君之道也故下文請俟初秋令講官輪日入侍則此但就四月罷講時言之可見矣因得從容納誨以輔上德五月差同孫覺顧臨及國子監長二看詳國子監條制先是蔡確因太學生虞蕃訟博士受賄遂深探其獄連引朝士有司緣此造為法禁煩苛凝密博士諸生禁不相見教諭無所施御史中丞劉摯以為言至是命看詳學制云孫覺字莘老髙郵人官至御史中丞顧臨字子敦會稽人歷刑兵吏三部侍郎兼侍讀先生所定大概以為學校禮義相先之地而月使之爭殊非教養之道請改試為課有所未至則學官召而教之更不考定髙下制尊賢堂以延天下道德之士按文集謂如胡瑗張載邵雍輩有如此之人至於京師則長吏造門求見延請居於堂中不獨學者得以矜式又以見長二之為教不敢足諸己既上求之古人復博採今之士取善服義如恐不及乃為教之大本化人之要道無其人則虛之鐫解額以去利誘鐫子全反解居隘反去上聲詳見治法卷省繁文以專委任省所井反差按文集三舍升補舊專據文簿計較等今立法只委長二以公議推擇但取學行才器堪為時用者聞於朝廷更不須繁文勵行檢以厚風教行去聲按文集謂朝廷欲厚風教必自士人始近世士風惡薄士人不修行檢或無異於市井小人朝廷未嘗有法以教勵檢束之也今立法舉人及仕宦家子弟鬬毆使酒等本監採察牒開封府或本貫施行及置待賓吏師齊文集中不詳其制立觀光法按文集四方士子願觀光者掌儀引入遊覽堂舍觀禮儀聽絃誦惟不得入齊如是者亦數十條詳見文集尚原注舊實録云禮部書胡宗愈謂先帝聚士以學教人以經三舍科條固已精密宜一切仍舊因深詆先生謂不宜使在經筵六月上書太皇太后言今日至大至急為宗社生靈長久之計惟是輔養上德而輔養之道非徒涉書史覽古今而已要使跬步不離正人乃可以涵養薰陶成就聖德跬苦委反禮祭義作頃舉司馬法一舉足曰跬跬三尺兩足曰步步六尺今間日一講解釋數行為益既少又自四月罷講直至中秋不接儒臣殆非古人旦夕承弼之意間音間亦音諌行音杭宋唐制隻日視朝雙日謂之間日庠謂唐自中葉以還雙日及非時大臣奏事别開延英殿若今假日御崇政延和是也間日蓋即宋庠所云假日也按仁宗初詔雙日御經筵後以王曽言雖隻日亦召侍臣講讀可見雙日講讀猶仍唐制隻日則其特典也至元豐官制始以雙日聽政春二月至端午日秋八月至長至日遇隻日入侍邇英閣輪官講讀然則此所云間日一講及四月至中秋罷講皆指元豐之制而言也然按治平元年九月重陽節當罷講呂申公司馬溫公言仁宗時無事常開經筵近以聖體不安遂於端午及冬至後盛暑盛寒權罷數月則此當英宗時已有之至元豐遂著為令耳故程子論之如此旦夕承弼厥辟見周書冏命篇請俟初秋即令講官輪日入侍陳説義理仍選臣僚家十一二嵗子弟三人侍上習業按文集十嵗以上十二以下端謹穎悟者三人侍上左右上所讀之書亦使讀之辨色則入昏而罷歸常令二人入侍一人更休且以邇英迫隘暑熱恐於上體非宜邇英閣名在崇政殿西南景祐二年建邇英者以其為燕間親近儒臣之所故名而講日宰臣史官皆入使上不得舒泰悅懌請自今一月再講於崇政殿然後宰臣史官入侍餘日講於延和殿延和便坐殿也在崇政殿西北向則後楹垂簾而太皇太后時一臨之不惟省察主上進業其於后德未必無補且使講官欲有所言易以上逹所係尤大又講讀官例兼他職請亦罷之使得積誠意以感上心皆不報八月差兼判登聞鼓院登聞鼓院宋初改名匭院太宗雍熙元年復今名又按宋初鼓司以內臣掌之鼓在宣德門南街北廊至道三年命太子中舍王濟勾當鼓司用朝臣勾當自此始掌諸上封而進之以逹萬人之情隸司諫正言馬氏通考曰景德四年詔改為登聞鼓院與前所聞異未詳孰是逹又按宋制鼓院之外别有檢院隸諫議大夫凡欲上者先經鼓院進狀或為所抑則詣檢院並名登聞按周禮太僕建路鼓於大寢之門外而掌其政以待逹窮者鄭司農云窮謂窮寃失職者來擊此鼓以逹於王若今時上變事擊鼓矣後鄭不從以為逹窮者謂司寇之屬朝士掌以肺石逹窮民聽其辭以告於王賈公彥釋之以為窮民先在肺石朝士逹之乃得繫鼓也又秋官大司寇以肺石逹窮民注肺石赤石也置之外朝門右凡􅑱獨老幼之欲有復於上而其長弗逹者立於肺石三日士聽其辭以告於王而罪其長又朝士右肺石逹窮民沈括曰長安故宮闕前有唐肺石尚存其制如佛寺所擊響石而甚大可長八九尺形如垂肺亦有欵識但漫剝不可讀蓋伸寃者擊之如今之撾登聞鼓也先生引前説且言入談道德出領訴訟非用人之體再辭不受原注楊時曰事道與祿仕不同常夷甫以布衣入朝神宗欲優其祿令兼數局如鼓院染院之類夷甫一切受之及先生為講官朝廷亦欲使兼他職則固辭蓋前日所以不仕者為道也則今日之仕須其官足以行道乃可受不然是苟祿也然後世道學不明君子辭受取舍人鮮知之故常公之受人不以為非而先生之不受人亦不以為是也二年又上疏論延和講讀垂簾事且乞時召講官至簾前問上進學次第又奏邇英暑熱乞就崇政延和殿或他寬涼處講讀給事中顧臨以殿上講讀為不可有旨修展邇英閣先生復上疏以為修展邇英則臣所請遂矣然祖宗以來並是殿上坐講自仁宗始就邇英而講官立侍蓋從一時之便耳非若臨之意也石林葉氏曰國朝經筵講讀官舊皆坐乾興後始立蓋仁宗時年尚幼坐讀不相聞故起立欲其近耳後遂為故事熙寧初呂申公王荆公為翰林學士吳沖卿知諌院皆兼侍講始建議以為六經言先王之道講者當賜坐因請復行故事下太常禮院詳定蘇子容龔鼎臣周孟陽及禮官王汾劉攽韓忠彥等以為講讀官曰侍蓋侍天子非師道也且講讀官一等侍讀仍班侍講上今侍講坐而侍讀立不應為二申公等議遂格今講讀官初入皆坐賜茶唯當講時起就案立講畢復就坐賜湯而退侍讀亦如之蓋乾興之制也今臨之意不過以尊君為説而不知尊君之道若以其言為是則誤主上知見臣職當輔導不得不辨以上三疏皆二年所上蓋因前諸疏而類敘於此以見先生重道正君之意先生在經筵以下則又統就其為講官時歷言之也按外書三月二十六日戊寅伊川奏乞自四月就寬涼處講讀二十八日移講讀就延和四月六日丁亥講讀依舊邇英閣顧子敦封駁以謂延和執政得一賜坐啜茶己為至榮豈可使講讀小臣坐殿上違咸造勿褻之義持國微仲進呈令修邇英閣多置軒窗已得旨而呂公方入令修延義閣簾內云此待别有擘畫未知何所也十五日丙申邇英進講文潞公以下預焉邇英新修展御坐比舊近後數尺門南北皆朱漆釣窗前簾設朱幕障日殊寬涼矣先生在經筵每當進講必宿齋預戒潛思存誠冀以感動上意而其為説常於文義之外反復推明歸之人主一日當講顔子不改其樂章門人或疑此章非有人君事也將何以為説及講既畢文義乃復言曰陋巷之士仁義在躬忘其貧賤人主崇髙奉養備極苟不知學安能不為富貴所移且顔子王佐之才也而簞食瓢飲季氏魯國之蠧也而富於周公魯君用舍如此非後世之監乎聞者歎服而哲宗亦嘗首肯之不知者或誚其委曲已甚先生曰不於此盡心竭力而於何所乎按遺書先生講君祭先飯處因説古人飲食必祭食穀必思始耕者食菜必思始圃者先王無德不報如此夫為人臣者居其位食其祿必思何所得爵祿來乃得於君也必思所以報其君凡勤勤盡忠者為報君也如人主所以有崇髙之位者蓋得之於天與天下之人共戴也必思所以報民古之人君視民如傷若保赤子皆是報民也每講一處有以開導人君之處便説初內臣宮嬪皆攜筆在後抄録後來見説著佞人之類皆惡之呂微仲使人言今後且切不可傷觸人范堯夫云但不道著名字儘説不妨又外書講一言可終身行之其恕乎因言人君當推己欲惡知小民飢寒稼穡艱難後唐明宗年六十餘即位猶書田家詩二首於殿壁常以自誦上或服藥即日就醫官問起居然入侍之際容貌極莊時文潞公以太師平章重事或侍立終日不懈上雖喻以少休不去也元祐元年司馬溫公言彥博宿德元老宜起以自輔詔特起平章軍國重事六日一朝一月兩起經筵或問君之嚴視潞公之恭孰為得失先生曰潞公四朝大臣事幼主不得不恭吾以布衣職輔導亦不敢不自重也嘗聞上在宮中起行潄水必避螻蟻潄先奏反又平聲螻盧侯反蟻語綺反經史通作蛾亦作蟻言一起行一潄水必避螻蟻也因請之曰有是乎上曰然誠恐傷之爾先生曰願陛下推此心以及四海則天下幸甚一日講罷未退上忽起憑檻戲折柳枝檻軒前欄也先生進曰方春發生不可無故摧折上不悅原注見馬永卿所編劉諫議語録且云溫公聞之亦不悅或云恐無此事朱子曰折柳事有無不可知但劉公非妄語人而春秋有傳疑之法不應遽削之也且其涵養善端培植治本可為後法則但注其下云或云國朝講筵儀制甚肅恐無此事則得之矣所講書有容字中人以黃覆之曰上藩邸嫌名也哲宗初名傭後立為太子賜名煦按遺書乃講論語南容三復白圭章也胡氏曰唐宋人率稱東宮及諸王邸第為藩邸謂藩國邸第也顔師古曰郡國朝宿之舍在京師者率名邸邸至也言所歸至也愚按地官司關注征㕓者貨賄之稅與所止邸舍也關下亦有邸客舍其出布如市之㕓然則以旅店為邸舍自漢時已有此稱梁徐勉戒子嵩書亦有興立邸店語後人據師古注遂謂惟藩國朝宿之舍乃得稱邸非也蓋邸至也凡所歸至皆得稱邸耳先生講罷進言曰人主之勢不患不尊患臣下尊之過甚而驕心生耳此皆近習輩養成之不可以不戒請自今舊名嫌名皆勿復避按曲禮卒哭乃諱生者不相避名春秋衛侯名惡大夫有石惡君臣同名也唐太宗二名令天下不連言者勿避如民部李世績之類至崩後始改民部為户部世績則去世字稱李績胡氏曰古者死而無諡不以名為諱周人以諡易名於是乎有諱禮然如春秋所紀則有不諱者如莊公名同而書同盟僖公名申而書戊申襄公名午而書陳侯午定公名宋而書宋人之類所謂臨文不諱也後世不明此義則有以諱易人之名者又有以諱易人之姓者愚者違禮以為孝諂者獻佞以為忠忌諱繁名實亂而春秋之法不行時神宗之喪未除而百官以冬至表賀此元祐元年冬至也自神宗之崩至此連閏月二十有一月矣其不除喪者按宋制外庭雖用易月之制而宮中實行三年服故十二日而小祥期而又小祥二十四日而大祥再期而又大祥既以日為之又以月為之蓋君服三年而臣下則猶依漢制也此所云喪未除及下文除喪者皆指宮中三年之喪而言也先生言節序變遷時思方切請改賀為慰程子又言臣竊慮聖意以去年冬至及今嵗旦已受賀表不欲改更此甚不然後是可以蓋前非改過不吝成湯所以稱聖也及除喪按喪服不數閏則除喪當在元祐二年六月此蓋因上文所言而類及之也顧氏曰王肅據三年問二十五月而畢檀弓祥而縞是日禫徙月樂之文謂為二十五月鄭玄據服問中月而禫之文謂為二十七月二説各有所據古人祭當卜日小祥卜於十三月之日大祥卜於二十五月之日而禫則或於大祥之月或於大祥之後間一月自禮記之時而行之已不同矣按晉武帝時越騎校尉程猗贊成王肅駁鄭禫二十七月之失為六徵三驗博士許猛扶鄭義作釋六徵解三驗以二十七月為得並見魏書禮志今制從鄭氏説朱子曰看來當如王肅之説為順而今從鄭氏之説雖是禮疑從厚然未為當有司又將以開樂置宴先生又奏請罷宴曰除喪而用吉禮則因事用樂可矣今特設宴是喜之也按除服而開樂置宴蓋故事也范淳夫言如此則似服除而慶賀非君子不得已而除之之意其意蓋與此合經筵承受張茂則嘗招諸講官啜茶觀畫先生曰吾平生不啜茶亦不識畫竟不往張茂則字平甫開封人官寧國軍留後加兩省都都知卒嘗聞後苑以金製水桶問之曰崇慶宮物也崇慶太皇太后宮名元祐元年建楊遵道録作長樂先生曰若上所御則吾不敢不諫一日赴講會上瘡疹不坐己纍日疹止忍反小疹􅂒疹皮外起先生退詣宰臣問上不御殿知否曰不知先生曰二聖臨朝上不御殿太皇太后不當獨坐且人主有疾而大臣不知可乎翼日宰臣以先生言奏請問疾由是大臣亦多不悅而諌議大夫孔文仲因奏先生汙下憸巧素無鄉行憸思亷反行去聲孔文仲字經父臨江新喻人與弟武仲平仲以文聲起江西時號三孔官至左諌議大夫憸利口也貪黷請求奔走交結致市井目為五鬼之魁請放還田里以示典刑原注文仲傳載呂申公之言曰文仲為蘇軾所誘脅論事皆用軾意又呂申公家傳曰文仲本以伉直稱然憃不曉事為浮薄輩所使以害善良晚乃自知為小人所紿憤鬱嘔血而死八月差管勾西京國子監按三京留司御史臺國子監及諸州宮觀官使皆王安石增置之以處異議者蓋間局也神宗亦往往以處監司郡守老不任職者不限員先生既就職再上奏乞歸田里曰臣本布衣因説書得朝官按宋目常參官曰朝官祕書郎而下未常參者曰京官今以罪罷則所授官不當得三年又請皆不報乞歸田里三狀並見文集乃乞致仕至再又不報以三乞歸田里不報故不敢復以為請而但請致仕也今二狀並見文集五年正月丁太中公憂去官七年三月服除除直祕閣判西京國子監原注王公繫年録云元祐七年三月四日延和奏事三省進呈程頤服除欲與館職判檢院時適蘇軾弟轍執政才進稟便云但恐不肯靜簾中入其説令只與西監不復得召先生再辭極論儒者進退之道而監察御史董敦逸奏以為有怨望輕躁語董敦逸字夢授吉州永豐人官至户部侍郎五月改授管勾崇福宮崇福宮在嵩山熙寧四年詔宮觀嶽廟留官一員餘聽如分司致仕例從便居住未拜以疾尋醫時伊川腰胯為患故尋醫今有申河南府乞尋醫狀見文集元祐八年哲宗初親政申祕閣西監之命先生再辭不就時殿帥苖履見先生於陵下哲宗紹聖元年二月己酉葬宣仁聖烈皇后於永厚陵故先生在陵下而苗履於此見之也履殿前副都指揮使授之子也纍官捧日天武都指揮使問曰朝廷處先生如何則可曰且如山陵事苟得專處雖永安尉可也宋諸帝陵寢皆在永安邑境故先生云然永安舊本為鎮屬鞏縣宋景德四年以陵寢所在升為縣屬河南府今仍省入鞏紹聖間以黨論放歸田里四年十一月送涪州編管涪音浮府涪州宋隸夔州路今屬四川重慶編管者言編之册籍使有所管束蓋即今之安置也按今律凡流必加杖一百其中復有不杖流者安置其一也帝一日與輔臣語及元祐政事曰程頤妄自尊大在經筵多不遜於是言者論頤與司馬光同惡相濟遂有是竄先生至涪即普靜院闢堂注易黃庭堅扁曰鈎深門人謝良佐曰是行也乃族子公孫與邢恕之為耳公孫文簡公琳孫也博野人先生曰族子至愚不足責故人情厚不敢疑孟子既知天焉用尤臧氏元符二年正月易傳成而序之原注尹焞曰先生踐履盡易其作傳只是因而寫成熟讀詳味即可見矣又曰先生平生用意惟在易傳求先生之學觀此足矣語録之類出於學者所記所見有淺深故所記有工拙蓋未能無失也三年正月徽宗即位移峽州峽音洽地峽州古夷陵周武帝以扼三峽之口故名即今荆州府夷陵州宋隸荆湖北路按宋有夷陵縣即峽州屬邑也今省入州四月以赦復宣德郎任便居住按四月朔日食詔赦天下元豐官制以宣德郎換著作佐郎大理寺丞還洛原注記善録云先生歸自涪州氣貌容色髭髮皆勝平昔十月復通直郎權判西京國子監先生既受命即謁告欲遷延為尋醫計既而供職門人尹焞深疑之先生曰上初即位首被大恩不如是則何以仰承德意然吾之不能仕蓋已決矣受一月之俸焉然後惟吾所欲耳按楊遵道録云某在先朝皆知某者也故不當如此受今則皆無相知只是憐其貧不使飢餓於我土地某須領他朝廷厚意受一月料錢然官則某必做不得既已受他誥却不供職是與不受同且略與供職數日然後惟吾所欲建中靖國二年五月追所復官依舊致仕原注前此未嘗致仕而云依舊致仕疑西監供職未久即嘗致仕也未詳愚謂追所復官指通直郎判西監而言致仕則指前宣德郎任便居住而言崇寧二年四月言者論其本因姦黨論薦得官雖嘗明正罪罰而敘復過優原注云已追所復官又云敘復過優未詳愚謂敘復指前復宣德通直而言今復著書非毁朝政於是有旨追毁出身以來文字其所著書令監司覺察原注語録云范致虛言程某以邪説詖行惑亂衆聽而尹焞張繹為羽翼事下河南府體究盡遂學徒復隸黨籍先生於是遷居龍門之南龍門山名在河南府城西南括地志云闕塞山一名伊闕而俗名龍門耳髙誘云伊闕在洛陽西南六十里禹所辟也酈道元水經注云禹疏龍門以通水兩山相對望之若闕然伊水歷其間故名伊闕止四方學者曰尊所聞行所知可矣漢書董仲舒傳曽子曰尊其所聞則髙明矣行其所知則光大矣不必及吾門也五年復宣義郎致仕元豐官制以宣義郎換光祿衛尉寺將作監丞按是年正月有星孛於西方長竟天帝以星變避殿損膳中書侍郎劉逵請帝碎元祐黨碑寬上書邪籍之禁帝從之復謫者仕籍故先生得復官致仕大觀元年九月庚午卒於家年七十有五疾革革吉逆反門人進曰先生平日所學正今日要用先生力疾微視曰道著用便不是著直酌反忠力疾者疾之甚而勉強為力也不原注門人一作郭孝尹子曰非也忠孝自黨事起與先生往來及卒亦不致奠然按史忠孝後為永興軍路提點刑獄金人犯永興或勸忠孝以監司出巡可以避禍忠孝不答極守禦之備城陷不屈死然則忠孝豈肯畏黨禍者尹氏所言疑傳聞之誤陸務觀曰郭立之從程先生逰最久程先生疾革猶與立之有問答語著於語録尹氏所言恐未足為據也其人未出寢門而先生殁學者謂之伊川先生子二曰端中曰端彥寧宗嘉定十三年諡曰正諡法庶物從之曰正理宗淳祐元年追封伊陽伯或謂伊川守正則盡通變不足謝顯道曰陜右錢以鐡舊矣有議更以銅者已而會所鑄子不踰母謂無利也遂止伊川曰此乃國家之大利也利多費省私鑄者衆費多利少盜鑄者息民不敢盜鑄則權歸公上非國家之利乎呂東萊曰農桑衣食財貨之本錢布流通不過權一時之宜而已所以三代已前論財賦者皆以穀粟為本九貢九賦用錢幣為賦者甚少俸祿亦是頒田制祿君卿大夫不過以采地為多寡亦未嘗以錢帛為祿是故三代之人多地著不為末作漢初尚有古意王公至佐吏所謂萬石千石百石亦是以穀粟制祿至武帝有事邊陲國用不足於是立告緡之法以括責天下自此古意漸失錢幣方重自漢至唐惟五銖開元最為得中本朝初用開元法其錢皆可久行自太宗以張齊賢為江南轉運務欲多鑄錢自此開元之法一變而錢皆惡薄不可用不知國家所以設錢以權輊重本末未嘗取利彼識見短淺者但以鑄錢所入多為利而不知使權歸公上鑄錢雖多利之小者權歸公上利之大者南齊孔顗論鑄錢不可惜銅愛工不惜銅則鑄錢無利不得利則私鑄不起私鑄不起則斂散歸公上此利之大者徒狗小利錢便惡薄則姦民利之私鑄紛起利孔四散乃是以小利失大利足知此自是不易之論又有議增解鹽之直者解音械陜後漢以河中府解縣置州宋復為縣與安邑並隸西路河中府今解復為州安邑在州東五十里隸山西宋白曰即夏鳴條之野有鹽池之利楊佺期雒陽記曰河東鹽池長七十里廣七里前漢志池在安邑西南直價也按上蔡語録云時議增解鹽抄價六千為八千云按今河東鹽池在條山之麓環池築墻周一百十六里池之東西南三靣皆不生鹽惟北靣墾地為畦引池水灌之謂之種鹽須俟南風烈日吹曬使水耗池鹽方就如南風不起或遇隂雨則鹽不成三月至七月為晒鹽之候餘月封閉文獻通考云宋制顆鹽出解州安邑解縣兩池以户民為畦夫悉蠲其他役每嵗自三月一日墾畦四月始種八月乃罷官廪給之安邑池每户嵗種鹽千席解縣池減二十席席一百一十六斤半又曰種者曰顆鹽出解州煮者曰末鹽出瀕海又按宋史鹽之類有二引池而成者曰顆鹽周官所謂鹽鹽也鬻海煮井鬻鹻而成者曰末鹽周官所謂散鹽也盬周禮作苦鄭云杜子春讀苦為盬又按歐陽文忠公跋唐錢義方鹽宗神祠記云尚書郎張席自言家寓解州為余言安邑解縣兩池鹽事云夏月南風來池靣紫色須臾凝結如雪土人謂之漫生鹽而兩池嵗役畦夫數百種鹽公私耗敝而州縣吏緣以為姦利棄漫生鹽不取誣其苦不可食又云前世鹽皆自生開元中薑師度為河中尹而鹽池涸始置鹽屯後遂有畦夫營種之課席因上書論漫生鹽之利官遂罷畦夫而議者或害其事乃曰漫生鹽味苦不可食又暫結復銷不可畜今觀義方之記以謂隂陽調和鬼神驅遣不勞人而擅其利與夫鑿泉煮海不同乃知唐世鹽非營種為決可信歐公非妄語者姑附記於此以俟博物君子王伯厚曰古者川澤之饒與民共之自海王之篇祈望之守作俑於齊至漢二十倍於古考之漢志鹽官三十有五唐有鹽之縣一百五本朝鹽所出者十二路為池二為監七為場二十二為井六百有九法益詳而利無遺矣伊川曰價平則鹽易泄人人得食無積而不售者嵗入必倍矣增價則反是己而果然沈氏筆談曰鹽澤方百二十里久雨四山之水悉注其中未嘗溢大旱未嘗涸滷色正赤在版泉之下俗謂蚩尤血唯中間有一泉乃是甘泉得此水然後可以聚人而成鹽其北有堯梢水一謂之巫咸河如巫咸水入則鹽不復結故人謂之無鹹河為鹽之患築大隄以防之甚於備寇盜原其理蓋巫咸乃濁水入滷中則淤澱滷脈鹽遂不成非有他異也呂伯恭曰自管仲始興鹽策以奪民利天下之鹽皆入禁榷而其利惟海鹽與解池之鹽最資國用南方之鹽皆出於海北方之鹽皆出於池如蜀中井鹽自贍一方之用於大農國計不與今就宋論之其出於海者惟淮鹽最資國用解池之鹽朝廷專置使以領之北方之鹽盡出於解池然南方之鹽管得其人則其害少惟北方解池之鹽有契丹西夏之鹽常相參雜解池之鹽味不及西夏價直又西北之鹽較賤所以沿邊多盜販二國鹽以奪解池之利故國家每於此措置關防司馬公既相薦伊川而起之伊川曰將纍人矣使韓富當國時吾猶可以有行也韓魏公名琦字稚圭安陽人中天聖五年進士熙寧八年卒贈尚書令諡忠獻後追封魏王富韓公名弼字彥國河南人中天聖八年進士以司徒封韓國公元豐六年卒贈太尉諡文忠並仁英二宗時當國及溫公大變熙寧復祖宗之舊伊川曰役法當討論未可輕改也公不然之按哲宗元祐元年溫公請悉罷免役錢復差役法蘇子瞻謂差役免役各有利害免役之害聚斂於上而下有錢荒之患差役之害民常在官不得專力於農而吏胥緣以為姦二害輕重蓋略等范堯夫亦謂差役一事尤當熟講而緩行溫公不從論者以謂溫公忠直有餘而通逹不足但見安石新法之害民而欲盡變以復祖宗之舊故也既而紛紛數年不能定元祐五年以論差役未便者甚衆詔中書舍人王巖叟樞密都承旨韓川諫議大夫劉安世同看詳役法具利害以聞呂氏曰差役去衙前之重役顧役去寬剩之過數則二法皆可行又曰熙豐之小人不可不盡去而熙豐之法則其善者固不必盡變青苗均輸可罷而顧役之法去多取之弊而度差役之所宜獨不可乎保馬户馬可罷而保甲之法因其已成教閲以省兵費獨不可乎新經字説可廢而罷諸詩賦取經義獨不可因之以崇經學乎元祐惟不盡去熙豐之舊人獨務盡去熙豐之舊法所以激而為紹聖以後之紛紛也邵氏曰吳蜀以顧役為便秦晉以差役為便亦可以見其梗概矣陸氏曰梗概猶言大段大約枝葉綴於梗斗斛平於概故云橫渠先生張氏名載字子厚世大梁人大梁今河南開封府祥符縣父迪仕仁宗朝終於殿中丞知涪州事涪州漢涪陵縣地隋置涪州在長安南二千三百五十里贈尚書都官郎中涪州卒於官諸孤皆幼不克歸僑居於鳯翔郿縣橫渠鎮之南大振谷口因家焉郿音媚扶旅寓而居曰僑鳯翔即漢扶風唐至德元載敕改風為鳯翔郡在長安西三百五十里郿在府東南九十里史記封棄於邰即此先生生於真宗天禧四年庚申之嵗月日先生始就外傅志氣不羣知虔奉父命守不可奪涪州器之少孤自立無所不學與邠人焦寅遊邠州名今屬陜西西安府寅喜談兵先生悅其言慨然以功名自許按朝氏讀書志有張子注尉繚子一卷蓋是時作也仁宗康定元年庚辰年二十嘗以書謁范文正公范文正公名仲淹字希文中真宗祥符八年進士乙科父墉任武寧軍節度掌書記卒公時方二嵗母謝氏貧無依再適淄川長山朱氏以朱説名登第後復姓改今名公一見知其逺器欲成就之乃責之曰儒者自有名教何事於兵因勸讀中庸先生讀其書雖愛之猶以為未足於是又訪之釋老之書纍年盡究其説知無所得反而求之六經嘉祐初見二程先生於京師共語道學之要先生渙然自信曰吾道自足何事旁求乃盡棄異學淳如也方未第時文潞公以故相判長安文潞公名彥博字寬夫汾州介休人其先本敬氏以避晉髙祖諱及宋翼祖諱改焉然按敬從攴不從文此誤改也中天聖五年進士以太師致仕黨論起貶為太子少保紹聖四年五月卒復官諡忠烈宋敏求曰凡節度州為三品刺史州為五品宋初曹翰以觀察使判頴州是以四品臨五品州也同品為知隔品為判自後唯輔臣宣徽使太子太保僕射為判餘並為知州聞先生名行之美聘以束帛延之學宮異其禮際士子矜式焉嘉祐二年丁酉先生年三十六登進士第始仕祁州司法參軍祁州宋隸永興軍路今屬北直保定府司法掌議法斷刑宋制凡軍州二萬户設曹官三員不滿二萬置録事參軍司法參軍司法兼司户不滿萬户止置司法司户司户兼録事參軍户不滿五千止置司戶兼司法及録事參軍遷丹州雲巖縣令丹州今陜西延安府宜川縣其政績詳治法篇後凡散見近思録諸卷者不重出放此有所教告常患文檄之出不能盡逹於民每召鄉長於庭諄諄口諭使往告其閭里間長張兩反有民因事至庭或行遇於道必問某時命某告某事聞否聞則已否則罪其受命者故一言之出雖愚夫孺子無不預聞陸氏曰顧公國寶宰平湖民有犯賭博偷盜不孝諸罪者既如律治之則記於册朔望召其父兄鄰里而詢之能改過否不蹈前轍否衆皆言其無他也則喜而遣之莫對則量笞之此法甚善民之善惡官府常能記憶而教導懲戒之則自然漸格矣如京兆王樂道嘗延致郡學先生多教人以德嘗從容語學者曰孰能少置意科舉相從於堯舜之域否學者聞言亦頗有從之者樂音洛宋王樂道名陶京兆萬年人第進士纍官御史中丞史曰陶始為韓琦所知驟加奬拔在御史時頗能譏切時政及為中丞則承望風旨攻琦如仇讐欲自取重位呂公著言其反覆不可近帝亦薄其為人不復用時陶以龍圖閣學士知永興軍在英宗之初蓋猶其未變節時也又按歐陽公謂陶只因韓絳薦舉始得臺官及絳為中丞與之爭議絳終得罪據此則奬拔陶者乃絳也非魏公也遷著作佐郎簽書渭州軍事判官事渭州宋初隸秦鳯路慶厯元年置涇原路徽宗政和七年升渭州為平涼軍金置平涼府元明及今因之城北柳河上有宋守蔡挺避暑閣渭帥蔡子正特所尊禮軍府之政小大咨之先生夙夜從事所以贊助之力為多蔡子正名挺正宋史作政應天府宋城人神宗初加天章閣待制知渭州舉籍禁兵悉還府不使有隱占建勒武堂五日一訓之偏伍鉦鼓之法甚備諜告夏人集胡盧河挺出竒兵迎擊夏人潰分諸將躡而討之蕩其七族進右諫議大夫然挺為人譎智深險在渭嵗久鬱鬱不得志寓意詞曲有玉關人老之句中使至使優伶歌之傳逹禁中神宗愍之起為樞密副使蓋其人固不足取也並塞之民嘗苦乏食並蒲浪反塞先代反依並猶傍也近也服虔云也而貸於官帑不能足帑他郎反藏帑金帛也又屬霜旱屬之六反屬會也先生力言於府取軍儲數十萬以救之又言戌兵徒往來不可為用戌兵謂禁兵也宋懲唐以來藩鎮之弊分遣禁旅戍守邊城立更戍法使往來道路以習勤苦均勞逸自是將不得專其兵而士卒不至於驕惰然往往兵將不相識而緩急不可恃宋兵力之所以耗弱者實由於此故先生言之按熙寧三年議者有見於此因部令諸路將官總𨽻禁旅使兵知其將將練其兵平居知有訓厲而無番戌之勞有事而後遣焉庶不至如張子所云徒往來不可為用矣然司馬溫公又言祖宗朝分番出戌者欲使知山川險阻也自置將以來惟是全將起發然後與將官偕行其餘常在本營飲食嬉遊飬成驕惰嵗月滋久不可復用又每將下各有部隊將訓練官等二十餘人而諸州又自有總管鈐轄都監監押設官重復虛費廩祿因請盡罷諸路將官其禁軍各委本州長吏與總管鈐轄都監等使州郡平居武偹有餘然後緩急可責以守死諫議大夫孫覺亦以為言於是稍省諸路將官然亦不能盡如光等言蓋此猶戍法未改時之言也不若損數以募土人為便按富韓公謂客軍不諳邊事之艱苦不識山川之險易守則不固戰則多敗其數雖多未若土兵之少而精而蘇文忠公亦言禁兵戍郡縣逺者或數千里月廩嵗給之外又日給其芻糧三嵗一遷往者紛紛來者纍纍無異數十萬兵三嵗而一出征也國家之力安得而不竭乎彼郡縣之土兵所以鈍敝劣弱而不振者蓋見郡縣皆有禁兵待之異等是以自棄於賤隸役夫之用而將吏亦莫之教訓苟能優待郡縣之土兵豐其資糧教習訓練則彼固以歡欣鼓舞願效其力而禁兵可以漸省如此則內無屯聚仰給之費而外無遷徙供餽之勞費之省者又己過半矣其民之願為兵者皆三十以下則收限以十年而除其籍以無用之兵終身坐食之費而為重募則應者必衆彼知其不過十年而復為平民則自愛其身而重犯法如此縣官長無老弱之兵而民之不任戰者不至於無罪而死又言進取深入交鋒兩陳猶當雜用禁兵至於平日保境備禦小寇即須專用極邊土人慶厯中趙元昊反范仲淹劉滬种世衡等專務整緝蕃漢熟户弓箭手所以封殖其家砥礪其人者非一道藩籬既成賊來無所得故元昊復臣宋人言禁兵往來之害而欲減數以募土人者大要所見略同蓋訓練土兵責成守臣二者乃備邊良䇿若千里命將而逺調四方之兵以扞邊禦寇勞費倍多騷擾滋甚此最失䇿之甚者富蘇二公之言最得其要領而蘇氏尤為深切可與張子之言相發明因備録之將愚按漢順帝時賈昌討區憐等嵗餘不克朝議遣大發荆揚兖豫四萬人赴之李固獨以為逺涉萬里士卒疲勞死亡必衆比致南嶺不復堪用既不足禦敵當復更發此謂刻割心腹以補四肢者也前中郎將尹就討益州叛羌民患苦之以為羌來尚可尹來殺我後就徵還以兵付刺史張喬喬因其將吏旬月之間破殄強寇可見發將無益州郡可任宜更選有勇略仁惠任將帥者以為刺史太守而韓文公論淮西事宜以謂諸道客兵羈旅異鄉與賊不相諳委望風􅀈懼難便前進又其道路遼逺勞費倍多士卒有征行之艱閭里懷離别之思其於黃家賊事宜亦云可見此自是不易良法而小人好功喜事造作兵端以至兵連禍結荼毒生靈鬼責人非必生殃咎此古人所以不輕言兵也神宗熙寧二年己酉登用大臣思有變更而先生年四十有八矣御史中丞呂晦叔薦於朝曰張載學有本原四方之學者皆宗之可以召對訪問上召問治道以漸復三代為對上悅之曰卿宜日見二府議事朕且將大用卿先生謝曰臣自外官赴召未測朝廷新政所安願徐觀旬月繼有所獻上然之時王安石方借復古為説故神宗聞先生漸復三代之言而悅之但不知所以復之者異耳他日見執政執政語曰新政之更懼不能任事求助於子何如對曰朝廷將大有為天下之士願與下風若與人為善則孰敢不盡如教玉人追琢則人亦故有不能者願與之與去聲追與鎚同都回反古通用追琢詩大雅追琢其章朱注追雕也玉曰琢金曰雕分雕為二蓋本毛氏傳然按爾雅於治玉璞謂之雕治玉器謂之琢又云雕謂之琢則雕琢亦治玉之通稱也蓋毛氏亦據下文金玉其相句而分屬之非雕琢正訓也故鄭箋不從而引周禮追師掌追衡笄以見治玉亦名追也執政默然所語多不合除崇文院校書先生辭未得謝復命案獄浙東時知明州苗振以貪聞故命先生案問或言張載以道德進不宜使之治獄時明道為監察御史裏行特上書言之呂與叔為撮其大旨如此執政曰淑問如臯陶猶且獻囚庸何傷詩魯頌篇曰淑問如臯陶在泮獻囚詩本言魯侯有善於訊囚之臣如臯陶之治獄也王安石借以折明道之言則謂如臯陶聲問之善且使之治獄亦一時強詞耳與詩本文意别獄成還朝會弟天祺以言得罪天祺名戬熙寧二年為監察御史裏行請罷條例司因詣中書極陳其事辭氣甚厲安石以扇掩面而笑戬曰戬之狂易宜為公所笑然如公所為天下之士之笑之者不少矣章十數上卒不納遂申臺不視事而待罪罷知公安縣先生益不安乃謁告西歸居於橫渠故居遂移疾不起橫渠至僻陋有田數百畝以供嵗計約而能足人不堪其憂而先生處之益安學者有問多告以知禮成性變化氣質之道學必如聖人而後已聞者莫不動心有進知音智又以為教之必能養之然後信故雖貧不能自給苟門人之無資者雖糲蔬亦共之資音咨糲音賴通作糲粟糲粗糲也即今所謂脫也詩召旻彼蔬斯稗箋云糲十稗九鑿八侍御七言糲米十斗舂為稗則九斗又舂為鑿則八斗又舂為侍御則七斗也字林粟一斛舂八斗為糲九章算術粟一石為糲米六斗張晏又謂一斛粟舂七斗米為糲諸説不同未詳孰是其自得之者窮神化一天人立大本斥異學自孟子以來未之有也近世喪祭無法喪惟致隆三年自期以下未始有衰麻之變期音基下同衰音摧後楊氏曰按儀禮注前有衰有負版左右有辟領惟子為父母用之旁親則不用也朱子家禮至大功乃無衰負版辟領者蓋家禮初年本也後朱子之家所行之禮旁親不用衰負版辟領朱子曰古者五服皆用麻但布有差等亦皆用冠絰但功緦之絰小耳司馬公書儀斬衰古制而功緦不古制此却可疑廬陵李氏曰以布為衰綴之於衣因統名此衣為衰不言裁割而言斬者取痛甚之意司馬溫公曰古者既葬練祥禫皆有受服變而從輕今世俗無受服自成服至大祥其衰無變故於既葬别為家居之服是亦受服之意也徐氏曰古之喪服自三年至九月皆有受服以初喪之衰疏而易壞故至卒哭即易其衰而受之以成布書儀之不言受服者以有居喪常服也家禮既不言居喪之常服又不言葬後之受服將齊斬之衰可服至三年期年之久乎抑葬後即除衰服但存齊衰斬衰之名乎凡此皆朱子之偶失而後人之所當補也乃秦溪瓊山亦竟未有補之者於此書寧無遺憾哉祭先之禮一用流俗節序燕褻不嚴自喪惟致隆以下至此言近世喪祭之無法也先生繼遭期功之喪始治喪服輕重如禮朱子曰古者布帛精粗皆有升數所以言布帛精粗不中數不鬻於市今更無此制聽民之所為倉卒間難得中度者惟有買來自以意擇製之耳家祭始行四時之薦曲盡誠潔始行四時之薦謂不用俗節也此二節言先生所以盡喪祭之禮者如此聞者始或疑笑終乃信而從之一變從古者甚衆總承喪祭而言其家童子必使灑掃應對給侍長者女子之未嫁者必使親祭祀納酒漿皆所以養孫弟就成德孫同遜教此又言先生之所以於家者如此聞人之善喜見顔色見音現答問學者雖多不倦有不能者未嘗不開其端其所至必訪人才有可語者必丁寧以誨之惟恐其成就之晚嵗適大歉至人相食家人惡米不糳將舂之糳音作古通用鑿為穀梁傳曰一穀不升曰歉糳精也説文糲米一斛舂九斗曰糳與鄭氏糳八説不合愚謂從鄭為是先生急止之曰餓殍滿野雖蔬食且自愧又安忍有擇乎甚或咨嗟對案不食者數四熙寧九年秋先生感異夢乃集所立言謂之正蒙出示門人曰此豫歷年致思所得其言殆與前聖合大要發端示人而已其觸類廣之則將有待於學者爾上蔡語録云橫渠著正蒙時處處置筆研得意即書明道云子厚却如此不熟明年春秦鳯帥呂汲公薦之曰張載之學善發聖人之遺意其術略可措之以復古乞召還舊職訪以治體秦鳯即鳯翔府也熙寧五年分陜西為永興秦鳯路呂汲公名大防字微仲藍田人時以龍圖閣待制知秦州乃復召還館同知太常禮院先生曰吾是行也不敢以疾辭庶幾有遇焉及至都公卿聞風慕之然未有深知先生者以所欲行嘗試於人多未之信會有言者欲講行冠昏喪祭之禮冠去聲詔下禮官禮官安習故常以古今異俗為説先生獨以為可行且謂稱不可非儒生博士所宜講行古禮正儒生博士之事今以古今異俗為説是以古禮為不可行也故曰非儒生博士所宜朱子曰橫渠所制禮多不本諸儀禮有自杜撰處如溫公却是本儀禮最為適古今之宜衆莫能奪然議卒不決郊廟之禮禮官預焉先生見禮不致嚴急欲正之而衆莫之助知道之難行欲與門人成其初志會有疾謁告以歸先生知疾不可為過洛見二程先生曰載病不起尚可及長安也汴京至洛四百里洛至長安八百五十里長安至郿二百六十里行至臨潼沐浴更衣而寢及旦視之亡矣潼音同里臨潼縣名在長安東九十今屬陜西西安府熙寧十年十有二月乙亥也年五十有八葬涪州墓南之兆娶南陽郭氏有子曰因寧宗嘉定十四年魏了翁為太常少卿請諡曰誠議者以至諴感神曰誠不可用而止理宗淳祐元年追封郿伯按橫渠沒門人欲諡為明誠夫子質於明道先生先生疑之而訪於司馬溫公公以為不可而止今溫公答書在伊洛淵源録宋史本傳稱諡曰明熊氏性理羣書稱諡曰獻未知孰是黃氏日抄云魏了翁為太常少卿定諡曰明朱子曰修身大法小學備矣義理精微則近思録詳之又曰近思録好看四子六經之階梯近思録四子之階梯又曰聖賢説得語言平如大學中庸論孟皆平易近思録是近來人説話便較切又曰近思録一書無不切人身救人病者又曰近思録比舊本增多數條如買櫝還珠之論尤可以警今日學者用心之謬又曰近思録文字猝乍看也是難有時前靣恁地説後靣又不是恁地這裏説得如此那裏又却不如此仔細看來看去却自中間有箇路脈推尋通得四五十條又却只是一箇道理又曰向編近思録欲入數段説科舉壞人心術處而伯恭不肯今日乃知此箇病根從彼時已栽種培養得在心田裏了令人痛恨又曰易傳自是成書伯恭都托來作閫範今亦載在近思録某本不喜他如此按朱子編輯小學如所引論語內則弟子職諸書都自成書則此條恐非定論然細點檢來段段皆日用切近功夫而不可缺者於學者甚有益又曰程子所以有功於後學者最是敬之一字有力薛氏曰近思録宜熟讀其間有與朱子不同者須參考胡氏曰學者當就小學近思録熟讀體驗有所得方可博觀古今張氏曰學者能讀近思録方可以治經又曰豫年二十五六時求近思録不可得適賈人持至因得讀之然後稍知為學之門姚氏曰豫丁卯館錦村有出近思録宋刻相示録中凡先聖賢與諸先生必空一字想朱子原本式也五卷末較他本多一條後於友人處得楊泳齋衍注閲之注甚約而精要亦少其書實宋刻但嫌其中多載章句集注語蓋此時章句集注未行世而門人只以師説示學者故也但與前所見本又有不盡同者楊名伯嵒字彥瞻朱子門人愚按宋史有何氏基近思録發揮不言卷數元史有黃氏溍近思録廣輯三卷今皆無傳近思録原序淳熙乙未之夏淳熙二年孝宗之二年也東萊吕伯恭來自東陽伯恭尚書右丞好問之孫其先河東人五世祖正獻公徙間封祖好問始居婺州仕至著作郎兼國史院編修官諡曰成東萊吕氏郡名東陽縣名隸浙東路婺州婺州今金華府過豫寒泉精舍在建陽府建陽縣天湖之陽李賢曰儒釋肄業之地通曰精舍蓋以專精講習所業為義亦作精廬留止旬日相與讀周子程子張子之書歎其廣大閎博若無津涯而懼夫初學者不知所入也因共掇取其關於大體而切於日用者以為此編總六百二十二條分十四卷蓋凡學者所以求端用力處已治人之要與夫辨異端觀聖賢之大略皆粗見其梗概粗一作初者愚按朱子以求端用力六提挈綱維蓋有總括處有分貼處如葉氏謂求端指首卷似矣然如二卷之為學大要八卷之治道大要亦欲稍見其端緒使知所用力也况如所謂存養省察以下無非欲學者察識其端以推而廣之似不得專指首卷也至於用力處已治人分貼處尤不通之甚直不足與辨以為窮鄉晚進有志於學而無明師良友以先後之者誠得此而玩心焉亦足以得其門而入矣如此然後求諸四君子之全書沈潛反復優柔厭飫以致其博而反諸約焉則其宗廟之美百官之富庶乎共有以盡得之若憚煩勞安簡便以為取足於此而可則非今日所以纂集此書之意也愚按學者固不可取足於此其實四子書中切當精妙處已盡於朱子所纂取然不讀全書亦不知朱子纂取之精此如讀通鑑者不先看十七史亦不知司馬公棄取之深意蓋通鑑者治史之法而近思録者則治經之法此乃布帛菽粟不可一日無者也五月五日新安朱熹謹識新安本漢丹陽郡地吳孫權分置新都晉平吳改為新安宋屬江東路宣和三年改為徽州朱子世居新安之永平鄉松巖里父松為尤溪尉亡朱子年十四奉遺命依劉子羽寓居崇安晚徙建陽從李延平講學近思録既成或疑首卷隂陽變化性命之説大抵非始學者之事祖謙竊嘗與聞次緝之意後出晚進於義理之本原雖未容驟語苟茫然不識其梗概則亦何所底止列之篇端特使知其名義有所嚮望而已特使下一本有之字至於餘卷所載講學之方日用躬行之實且有科級循是而進自卑升髙自近及逺庶幾不失纂集之指若乃厭卑近而騖髙逺躐等凌節流於空虗迄無所依據則豈所謂近思者耶朱子曰近思録首卷難看所以教伯恭作此數語以載於後又曰如第一卷未曉得且從第二第三卷看起久久復看第一卷則漸曉得覽者宜詳之淳熙三年四月四日東萊吕祖謙謹序
