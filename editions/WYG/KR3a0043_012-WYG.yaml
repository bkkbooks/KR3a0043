body:
  text: 近思録集註卷十二歸安茅星來撰警戒此與第五卷相似而實不同盖第五卷就其當省察克治者言之此則就人之不能省察克治者而摘其疵病以深警而痛戒焉則其意愈深而語愈加切矣誠意正心修身齊家治國平天下之事皆有之几三十三條語類作改過及人心疵病濂溪先生曰仲由喜聞過令名無窮焉今人有過不喜人規如䕶疾而忌醫寧滅其身而無悟也噫通書曰蔡虚齋周子謂仲由令名無窮者非謂喜聞過一事令名也因喜聞過而勇於自修故有善可稱而令名無窮也伊川先生曰徳善日積則福禄日臻徳踰於禄則雖盛而非滿自古隆盛未有不失道而喪敗者也喪去聲同易傳下之泰九三傳行徳則善受禄則福徳為善之實禄為福實故下止言徳與禄也臻至也踰過也隆盛而溢其量曰滿盖三居泰之中在諸陽之上泰之盛也泰盛則有將否之漸惟於方泰之時愈厚其徳而不敢自安逸則可常保其泰矣有朱子曰漢初人未甚繁氣象較好到武宣極盛時便衰意人家亦然如家人嗃嗃悔厲吉婦子嘻嘻終吝亦此理也人之於豫樂心悅之故遲遲遂至于耽戀不能已也豫之六二以中正自守其介如石其去之速不俟終日故貞正而吉也處豫不可安且乆也乆則溺矣如二可謂見㡬而作者也豫六二爻傳六二介於石不終日貞吉繫辭下傳夫子釋之云君子見㡬而作不俟終日邱氏曰豫諸爻以無所係應者為吉豫初應四而三五比四皆有係者也故為凶為悔為疾獨六二隂静而中正與四無係特立于衆隂之中而無遲遲耽戀之意方其静也則確然自守而介于石及其動也則見㡬而作不俟終日盖其所居得正故動静之間不失其正吉可知矣盖中正故其守堅而能辨之早去之速也豫六二象傳象曰不終日貞吉以中正也辨之早就介於石言明也去之速就不終日言剛也介有分辨意故云辨之早人君致危亡之道非一而以豫為多豫六五傳五以柔居尊威權去已不能自立如漢成宋徽之類皆是也然大約沈溺于豫不能節制以至于此可不戒哉聖人為戒必於方盛之時方其盛而不知戒故狃安富則驕侈生樂舒肆則綱紀壊忘禍亂則釁孽萌是以浸淫不知亂之至也臨彖至于八月有凶傳方盛謂二陽方長於下也周易正義曰陽長之卦每卦皆應八月有凶但此卦名臨是盛大之義故於此卦特戒之耳若以類言之則陽長之卦至于終末皆有凶也孔疏臨為建丑之月從建丑數到否卦建申之月為八月也三隂既盛三陽方退小人道長君子道消故八月有凶以盛不可終保聖人作易以戒之也愚按此係臨彖辭自應從臨卦推去孔氏說當為得之不知朱子何以不取也姑附記于此以俟知者王伯厚曰臨所謂八月其說有三一云自丑至申為否一云自子至未為遯一云自寅至酉為觀程傳取自子至未本義兼取遯觀二說復之六三以隂躁處動之極復之頻數而不能固者也數入聲處震下坤上為復隂謂六躁謂三極之極謂居震體之終也趙氏曰三為震動之極故曰頻復貴安固頻復頻失不安于復也復善而屢失危之道也聖人開其遷善之道與其復而危其屢失故云厲旡咎不可以頻失而戒其復也頻失則為危屢復何咎過在失而不在復也開下吕本無其字與許也本註劉質夫曰頻復不已遂至迷復劉質夫曰以下葉本自為一條劉質夫名絢程子門人先世常山人祖舜卿以仕宦始家河南以䕃為潞州長子令元祐初韓維薦其經明行修為京兆府教授王巖叟朱光庭又薦為太學博士卒于官迷復上六爻辭也葉氏曰頻復頻失而不止乆則玩溺而不能復必至上六之迷復矣徐氏曰上六位高而無下仁之美剛逺而無遷善之機厚極而有難開之蔽柔終而無改過之勇是昏迷而不知復者也但張氏曰人于過失當時或不能自知過後未有不悔不能乘此悔心力圖自新他日臨事差忒如故韓昌黎所謂當其在辱亦克知悔及其既寧終莫知戒如此則終身所言所行只是有悔安得悔亡睽極則咈戾而難合剛極則躁暴而不詳明極則過察而多疑睽之上九有六三之正應實不孤而其才性如此自睽孤也睽孤二字上九爻辭葉氏曰上居睽之終是睽之極也以九居上是剛之極也居離之終是明之極也如人雖有親黨而多自疑猜妄生乖離雖處骨肉親黨之間而常孤獨也此即上節之意而申明之以見其必睽孤也葉氏曰多自疑猜明極之患也妄生乖離剛極睽極之患也愚按前言顔子剛而明故有不善未嘗不知知之未嘗復行則明與剛固美徳也而此又云然者盖聰明剛果過甚則為患如漢明帝綜核操切而漢業漸衰唐宣宗英明彊察而唐不復振剛與明其可極乎是故古之賢若不耀威武不峻刑誅降心以受言温恭以接下凡此所以濟其剛也不務苛察不矜摘伏集公議以為耳目採羣言以驗得失凡此所以益其明也不然未有不至于睽孤者解之六三曰負且乘致冦至貞吝傳曰小人而竊盛位雖勉為正事而氣質卑下本非在上之物終可吝也六三隂柔是小人也而居下之上則竊盛位矣勉為正事謂貞也氣質卑下就六三隂柔而言本非在上之物謂下卦也辨胡氏曰小人得有高位者盖由上之人慢其名器不賢否而與之以至為衆人所奪而致冦戎之害也若能大正則如何曰大正非隂柔所能也若能則是化為君子矣大正就貞字而極言之也如何者謂可免吝與否也隂柔才弱不能奮發有為故曰大正非隂柔所能益之上九曰莫益之或擊之傳曰理者天下之至公利者衆人所同欲苟公其心不失其正理則與衆同利無侵於人人亦欲與之若切於好利蔽于自私求自益以損於人則人亦與之力争故莫肯益之而有擊奪之者矣上九象傳胡雲峰曰二不求益而或益之自外來也上求益而或擊之亦自外來也孰有以來之五之吉由中心之有孚上之凶由立心之弗恒吉凶之道未有不自心生者愚按正義謂上九處益之極益之過甚者也求益無厭怨者非一故莫益之而或擊之也其言可謂深切著明矣嗚呼為人上者可不戒哉艮之九三曰艮其限列其夤厲薫心傳曰夫止道貴乎得宜行止不能以時而定於一其堅强如此則處世乖矣與物睽絶其危甚矣夤音寅堅腰為上下之界限故曰限列判隔也夤脊骨也其強如此以上釋艮其限處世乖戾二語釋列其夤葉氏曰三居内卦之上實内外之分故取象皆為限止之義沙隨程氏曰限分上下夤列左右各止其所無相資相待之意故危薰心人之固止一隅而舉世莫與宜者則艱蹇忿畏焚撓其中豈有安裕之理厲薫心謂不安之勢薰爍其中也固膠固也中即心也艱蹇忿畏四者皆其所以薫心者也胡氏曰寂然不動者心之體如之何而可以徇物感而遂通者心之用如之何而可以絶物三過剛不中確乎止而不能進退以至上下隔絶是絶物者也惟見其危厲薫心而已之楊氏曰此爻是惡動以為静而反至于動心者盖心與物本相聨屬時止而止時行而行則事應于心而心常泰然有意絶物則物終不可絶而心終不可靜矣大率以說而動安有不失正者歸妹彖曰征凶位不當也吳氏曰卦以少女從長男則非其配偶說以動則恣情縱慾中爻不正則隂陽皆失其常三五柔乘剛則不順宜其凶也然四者又以說以動為重雙湖胡氏曰動而說為隨此陽倡而隂和男行而女隨得男女之正故元亨利貞說以動為歸妹則是隂反先倡而陽和女反先行而男從失男女之正故征凶無攸利男女有尊卑之序夫婦有倡隨之禮此常禮也若徇情肆欲惟說是動男牽欲而失其剛婦狃說而忘其順則凶而無所利矣禮葉本作理而歸妹彖曰无攸利柔乘剛也此常理也以上指恒卦言㢲上震下曰恒震剛在上㢲柔在下尊卑之序也震長男而動于外㢲長女而順於内倡隨之禮也徇情肆欲以下則極言以說而動之不可也雖舜之聖且畏巧言令色說之惑人易入而可懼也如此兊九五傳說見書臯陶謨篇但禹本言能哲而惠何畏乎巧言令色孔壬而此直云舜畏亦斷章取義耳又惟帝其難孔蔡傳並作堯此則作舜說也治水天下之大任也非其至公之心能舍已從人盡天下之議則不能成其功豈方命圮族者所能乎圮從人已之已音杞與圯上之圯别程子謂方不順也命正理也謂其不循正理而毁圮族類傾陷忌克之人也朱子則謂命命令也方命謂止其命令而不行也王氏所謂圖則行方則止猶今言廢閣詔令也盖鯀悻戾自用不聽人言語不受人教令也二說不同自當以朱子為正鯀雖九年而功弗成然其所治固非他人所及也惟其功有叙故其自任益強咈戾圮類益甚公議隔而人心離矣是以其惡益顯而功卒不可成也顯而下葉本有其字經說下同君子敬以直内微生高所枉雖小而害則大害下葉本有直字人有慾則無剛剛則不屈于慾朱子曰此亦只要學問學問進則見得理明自是勝得他不然則只隨氣禀去便自是屈于慾人之過也各於其類君子常失于厚小人常失於薄君子過于愛小人傷于忍以上三條見論語朱子曰程子亦只是舉一隅耳若君子過于廉小人過于貪君子過于介小人過于通之類皆是愚按程子因本文言仁故以厚薄愛忍言之朱子則以此為專言之仁故復就貪廉通介之類推廣言之真西山曰此聖門觀人之法然為人君者尤當因臣下之過而察其心如愛君而極諫不無狂訐之過愛民而違命不無矯拂之過要其用心則皆仁也人君取其仁而略其過可也若姦邪之臣巧於揜覆未必有過之可指而其心則不可問矣以上並伊川語明道先生曰富貴驕人固不善學問驕人害亦不細遺書下同盡人之學問雖極富有日新亦止以人道所當然固不必驕而義理無窮亦終身行之而不能盡則又無可驕也况驕則氣盈氣盈則識量狹隘百病都生人以料事為明便駸駸入逆詐億不信去也說見論語人於外物奉身者事事要好只有自家一箇身與心却不要好苟得外面物好時却不知道自家身與心却已先不好了也外物奉身者如宫室飲食衣服之類皆是身不好謂身不修心不好謂心不正所謂以小害大賤害貴也貨朱子曰人亦有奉身儉嗇之甚而篤好外物如財聲色之類盖亦只因私欲不能克之故也人于天理昏者是只為嗜欲亂著他荘子言其嗜欲深者其天機淺此言却最是說見荘子大宗師篇嗜荘作耆荘子名周字子休蒙人著書名南華經伊川先生曰閱機事之乆機心必生盖方其閱時心必喜既喜則如種下種子上種去聲下如字必荘子曰有機械者有機事有機事者必有機心見外篇天地篇朱子曰荘老之言亦自有可取者但須中有所主不為異教所汩識其意所以異于聖人者何如耳疑病者未有事至時先有疑端在心周羅事者先有周事之端在心皆病也疑病者猜嫌疑慮之病端端緒也周羅宋時俚語猶言兠攬也愚謂窮理之功至則疑之病去矣自治之心切則周羅事之患去矣較事大小其弊為枉尺直尋之病此言事無大小皆不可以有忽也朱子曰吴氏謂子夏小徳出入可也之言不能無弊盖學者一以小失為無害而為之則于大節必將有枉尋而直尺者矣川以上並伊語小人小丈夫不合小了他本不是惡舊本並于他字句絶非孟不冝如此而如此曰不合今俗語有之程子亦只據子尹士章所謂小人小丈夫而論之耳小謂識量之淺狹也盖尹士但未聞君子之大道故據所見言之如此其心固無他也故云他本不是惡若淳于髠陳賈之徒有意作惡自不得與尹士同科矣愚按此條說者皆作泛論理甚難通如大學小人閒居為不善無所不至豈得謂之不是惡且又何以必與小丈夫並論耶學者特習而不察耳雖公天下事若用私意為之便是私熊氏曰如見人飢寒與之衣食稍有要譽之心即私矣伊川先生曰做官奪人志趙致道曰或謂此亦為富貴所移竊恐不特此也但纔仕宦則於窒礙處便有隨冝區處之意浸尋至于隨時徇俗與初間立志頓别此所謂奪志也朱子曰所論是也若欲救此但當隨事省察以審其輕重可也驕是氣盈吝是氣歉人若吝時於財上亦不足於事上亦不足凡百事皆不足必有歉歉之色吕本色下有也字遺上驕吝並言下但就吝言之者按書則人若吝時以下乃程子因或人以吝何如則是為問而復告之如此亦以言吝而驕可知也吝者百事皆不足必有歉歉之色則驕者百事皆有餘必有盈盈之状程子所以不别言也朱子曰驕者吝之所發吝者驕之所蔵如理本天下之公必吝惜而不以告人者盖恐為人所同得則我便無以驕于人故必私之于已使獨自有之貨財亦然惟其欲驕所以吝也愚按程子分二病言之朱子則謂驕生于吝其勢相因盖人固有驕而未必吝吝而未必驕者亦有驕而且吝者程子就其分者言之故有氣盈氣歉之别朱子以其合者言之則謂驕生於吝必兼此二說而其義始為完備未知道者如醉人方其醉時無所不至及其醒也莫不愧耻人之未知學者自視以為無缺及既知學反思前日所為則駭且懼矣自視以為無缺猶醉之無所不至也既學而知駭且懼猶醒時之愧耻也以上並伊川語邢恕云一日三㸃檢明道曰可哀也哉其餘時理㑹甚事盖倣三省之說錯了可見不曾用功恕吕本作七次曽子日以三事自省恕誤以為三㸃檢故程子警之又多逐人面上說一般話明道責之邢曰無可說明道曰無可說便不得不說便不得不說言既無可說則亦不必說矣便如此不得不說乎乃詰問之辭驗此二者皆心不存之故也心存則隨時省察隨事體語黙動静皆不敢苟故無二者之失按此條見外書謝上蔡語録列遺書誤横渠先生曰學者捨禮義則飽食終日無所猷為與下民一致所事不踰衣食之間燕遊之樂耳樂音洛者正䝉所猷為謀猷作為也下民凡不知學皆是謂民斯為下者也愚按學者當以禮義為根本而後考之經史以究其藴反之吾身與心以盡其實則知日以精行日以篤自可漸進于聖賢之域不然則讀書作文皆以益其放而已又何必所事不踰衣食燕樂間然後為與下民一致乎鄭衛之音悲哀令人意思留連又生怠惰之意從而致驕淫之心雖珍玩竒貨其始感人也亦不如是切從而生無限嗜好故孔子曰必放之亦是聖人經歴過但聖人能不為物所移耳感葉本作惑好去聲言禮樂説音意思留連三句總極鄭衛之惑人之切也孟子言反經特於鄉原之後者以鄉原大者不先立心中初無作惟是左右看順人情不欲違一生如此作吕本作怍一作主隨孟子說心先立乎其大者見孟子初無作言其人俯仰中初未嘗有所作為也渠以上並横語近思録集註卷十二欽定四庫全書近思録集註卷十二婺源江永撰朱子曰此卷改過及人心疵病濓溪先生曰仲由喜聞過令名無窮焉今人有過不喜人規如䕶疾而忌醫寧滅其身而無悟也噫通書伊川先生曰徳善日積則福禄日臻徳踰於禄則雖盛而非滿自古隆盛未有不失道而喪敗者也泰九三傳葉氏曰徳勝於禄則所享者雖厚而不為過禄過其徳薄且不能勝況於隆盛乎隆盛之喪敗必自無徳者致之易傳下同人之於豫樂心悦之故遲遲遂至於眈戀不能已也豫之六二以中正自守其介如石其去之速不俟終日故貞正而吉也處豫不可安且久也久則溺矣如二可謂見幾而作者也蓋中正故其守堅而能辨之早去之速也人君致危亡之道非一而以豫為多豫六五傳聖人為戒必於方盛之時方其盛而不知戒故狃安富則驕侈生樂舒肆則綱紀壞忘禍亂則釁孽萌是以浸淫不知亂之至也臨彖傳復之六三以隂躁處動之極復之頻數而不能固者也復貴安固頻復頻失不安於復也復善而屢失危之道也聖人開遷善之道與其復而危其屢失故云厲无咎不可以頻失而戒其復也頻失則為危屢復何咎過在失而不在復也本註劉質夫曰頻失不已遂至迷復劉絢字質夫程子門人葉氏曰頻復頻失而不止久則玩溺而不能復必至上六之迷復矣睽極則咈戾而難合剛極則躁暴而不詳明極則過察而多疑暌之上九有六三之正應實不孤而其才性如此自睽孤也如人雖有親黨而多自疑猜妄生乖離雖處骨肉親黨之間而常孤獨也葉氏曰睽上九居離之終是明極也多自疑猜過明之患妄生乖離過剛好暌之致也解之六三曰負且乘致寇至貞吝傳曰小人而竊盛位雖勉為正事而氣質卑下本非在上之物終可吝也若能大正則如何曰大正非隂柔所能也若能之則是化為君子矣益之上九曰莫益之或擊之傳曰理者天下之至公利者衆人所同欲苟公其心不失其正理則與衆同利無侵於人人亦欲與之若切於好利蔽於自私求自益以損於人則人亦與之力爭故莫肯益之而有撃奪之者矣艮之九三曰艮其限列其夤厲熏心傳曰夫止道貴乎得宜行止不能以時而定於一其堅强如此則處世乖戾與物睽絶其危甚矣人之固止一隅而舉世莫與宜者則艱蹇忿畏焚撓其中豈有安裕之理厲熏心謂不安之勢熏爍其中也葉氏曰限界分也列絶也夤膂内亦一身上下之限也三居内卦之上實内外之分故取象皆為限止之義大率以説而動安有不失正者歸妺傳葉氏曰歸妺兑悦震動心有所好樂則不得其正況從欲而忘返耶男女有尊卑之序夫婦有唱隨之理此常理也苟狥情肆欲唯説是動男牽欲而失其剛婦狃説而忘其順則凶而無所利矣同上雖舜之聖且畏巧言令色説之惑人易入而可懼也如此兑六五傳治水天下之大任也非其至公之心能舎己從人盡天下之議則不能成其功豈方命圮族者所能乎鯀雖九年而功弗成然其所治固非他人所及也惟其功有叙故其自任益强咈戾圮類益甚公議隔而人心離矣是其惡益顯而功卒不可成也經説下同君子敬以直内微生高所枉雖小而害則大朱子曰易得之物尚委曲如此若臨大事如何當有便道有無便道無才枉其小便害其大人有慾則無剛剛則不屈於慾朱子曰慾與剛正相反若耳之欲聲目之欲色之類皆是慾也才有些被他牽引去此中便無所主焉得剛人之過也各於其類君子常失於厚小人常失於薄君子過於愛小人傷於忍朱子曰厚與愛畢竟是仁上發來其苗脈可見明道先生曰富貴驕人固不善學問驕人害亦不細葉氏曰君子之學為己而己學問驕人非特其學為務外而傲惰敗徳學亦不進矣遺書下同人以料事為明便駸駸入逆詐億不信去也永按喜料事則逆億之心熟雖中猶為私意小智況未必皆中乎人於外物奉身者事事要好只有自家一箇身與心却不要好苟得外面物好時却不知道自家身與心却已先不好了也葉氏曰所謂小害大賤害貴者也人於天理昬者是只為嗜欲亂著他莊子言其嗜欲深者其天機淺此言却最是永按天機天理發動之機也伊川先生曰閲機事之久機心必生蓋方其閒時心必喜旣喜則如種下種子葉氏曰莊子云有機械者必有機事有機事者必有機心疑病者未有事至時先有疑端在心周羅事者先有周事之端在心皆病也葉氏曰周羅事猶言兠攬事較事大小其弊為枉尺直尋之病葉氏曰事無大小惟理是視或者有苟成急就之意則道雖小屈義雖㣲害亦有冒而為之者原其初心止於權大小遂至枉尺直尋其末流之弊有不可勝言矣小人小丈夫不合小了他本不是惡葉氏曰性無不善而局於氣質汩於利欲者自小之耳雖公天下事若用私意為之便是私做官奪人志問仕宦奪人志或言為富貴所移愚意以為不特言此但才仕宦則為事窒礙處有隨宜區處之意浸浸遂入於隨時徇俗之域與初間立心各别此所謂奪志也不知程子意出於此否又不知人未免仕宦而有此病又何以救之朱子曰所論奪志之説是也若欲救此但當隨事省察而審其輕重耳然幾微之間大須著精彩也驕是氣盈吝是氣歉人若吝時於財上亦不足於事上亦不足凡百事皆不足必有歉歉之色也朱子曰吝之所有乃驕之所恃也故驕而不吝無以保其驕吝而不驕無所用其吝此盈於虚者所以必歉於實而歉於實者所以必盈於虚也一學者來問驕是氣盈吝是氣歉歉則不盈盈則不歉如何却云使驕且吝試商量看吳伯豐對云盈是加於人處歉是存於己者粗喻之如勇於為非則怯於遷善明於責人則暗於恕己同是一箇病根先生曰如人曉些文義吝惜不肯與人説便是要去驕人非驕無所用其吝非吝則無以為驕驕吝雖有盈歉之殊然其勢常相因蓋驕者吝之枝葉吝者驕之本根故嘗論之天下之人未有驕而不吝吝而不驕者也問氣之盈歉如何曰驕吝是一般病驕是放出底吝吝是不放出底驕如人病寒熱攻注上則頭目痛攻注下則腰腹痛熱發在外似驕寒包縮在内似吝未知道者如醉人方其醉時無所不至及其醒也莫不愧恥人之未知學者自是以為無缺及旣知學反思前日所為則駭且懼矣邢七云一日三檢㸃明道先生曰可哀也哉其餘時理會甚事蓋倣三省之説錯了可見不曾用功又多逐人面上説一般話明道責之邢曰無可説明道曰無可説便不得不説横渠先生曰學者捨禮義則飽食終日無所猷為與下民一致所事不踰衣食之間燕遊之樂爾正䝉鄭衛之音悲哀令人意思留連又生怠惰之意從而致驕淫之心雖珍玩竒貨其始感人也亦不如是切從而生無限嗜好故孔子曰必放之亦是聖人經歴過但聖人能不為物所移耳横渠禮樂記孟子言反經者特於鄉原之後者以鄉原大者不先立心中初無怍惟是左右看順人情不欲違一生如此葉氏曰鄉原浮沉俯仰無所可否蓋其義理不立中無所主惟務悦人以是終身乃亂常之尤者君子反經復其常道則是非昭然而鄉原僞言僞行不得以惑之矣横渠孟子説近思録集註卷十二
