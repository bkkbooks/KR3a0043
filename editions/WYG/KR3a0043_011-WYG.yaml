body:
  text: 近思録集註卷十一歸安茅星來撰教學之道前於為學之道已詳而此則教人為學之道也葢學優而仕固可出而見之事業如不得已則惟有明斯道以淑其徒而已小學大學皆有之亦新民之事也凡二十一條朱子曰古人初入小學止是教之以事如禮樂射御及孝弟忠信之事自十六七入大學然後教之以理如致知格物及所以為忠信孝弟者濓溪先生曰剛善為義為直為斷為嚴毅為幹固惡為猛為隘為强梁柔善為慈為順為㢲惡為懦弱為無斷為邪佞㫁並都玩反陰朱子曰剛柔固陰陽之大分而其中又各有陽以為善惡之分焉惡者固為非正而善者亦未必皆得乎中也故問人有剛果過于中如何朱子曰只為見剛果勝柔一向剛去須如周子分别方可問何以制之使歸于善曰須于中求之惟中也者和也中節也天下之逹道也聖人之事也惟中下吕本無也字中節之中去聲朱子曰此以得性之正而言也然其以和為中與中庸不合葢就已發無過不及者而言之如書所謂允執厥中是也故聖人立教俾人自易其惡自至其中而止矣通書惡朱子曰易其則剛柔皆善有嚴毅慈順之徳而無强梁懦弱之病矣至其中則或為嚴毅或為慈順也又皆中節而無大過不及之偏矣而朱子曰知其所偏而欲勝之固在吾日用之間屢省痛懲之然使不明于理而徒欲救其偏亦恐矯枉之過而反失夫中也故學者雖莫急于自修而不加以讀書講學之功則無以見夫道體之全而審其是非邪正之端也又曰此章所言剛柔即易之兩儀各加善惡即易之四象易又加倍以為八卦而此書及圖則止于四象以為水火金木而即其中以為土葢道體則一而人之所見詳畧不同但于本體不差則並行而不悖矣伊川先生曰古人生子能食能言而教之能食則教之以右手能言則教之男唯女俞見記内則篇大學之法以豫為先人之幼也知思未有所主便當以格言至論日陳于前雖未曉知且當薰聒使盈耳充腹乆自安習若固有之雖以他言惑之不能入也聒音括曰學記曰大學之法禁于未發之之謂豫故以豫為先薰薰炙聒讙語也人幼也以下明教之所以當豫之故若為之不豫及乎稍長私意偏好生于内衆口辯言鑠于外欲其純完不可得也長張文反好去聲文集講見元祐元年上太皇太后書先生以供職以来六侍筵但見諸臣拱手黙坐當講者立案旁解説數行而退如此雖彌年積嵗所益㡬何或以為主上方幼且當如此因特言此以見教之不可不早也顏氏家訓曰人之教子于其始有知不可不使之知尊卑長幼之禮若侮詈父母毆擊兄姊父母不加訶禁反笑而奨之彼既未辨好惡謂禮當然及其既長習以成性乃怒而禁之不可復制矣于是殘忍悖逆無所不至葢父母無深識逺慮不能防微杜漸溺于小慈養成其惡故也後此又以不豫之患言之東萊吕氏曰唐虞三代設教與世學校不同舜命䕫典樂教胄子周官大司樂掌成均之法皆是掌樂之官掌教葢其優㳺涵養鼔舞動盪有以深入人心處却不是設一箇官司秦漢以後誤作官司故與唐虞三代題目自别雖足以善人之形而不足以善人之心周禮一書若師氏保氏大司樂大胥小胥之類所教者不過國子當時鄉遂所以興賢能未嘗見有設教之官葢學校事大體重非有司簿書期㑹之可領此學者所當深思也觀之上九曰觀其生君子無咎象曰觀其生志未平也傳曰君子雖不在位然以人觀其德用為儀法故當自慎省觀其所生常不失于君子則人不失所望而化之矣此言教者當自修其身以為學者觀法也所生凡在已視聽言動應事接物處皆是葉氏曰上為無位之地故曰不在位然當觀之時高而在上固衆人所觀瞻而用為法則者要當謹畏反觀内省已之所為常不違乎君子之道而後人心慰滿得所矜式也不可以不在於位故安然放意無所事也易傳聖人之道如天然與衆人之識甚殊邈也門人弟子既親炙而後益知其高逺既若不可以及則趨望之心怠矣故聖人之教常俯而就之不可下葉本無以字然朱子曰聖人固嘗俯就所謂高逺者亦即在此要在學者下學上逹自見得耳事上臨䘮不敢不勉君子之常行不困於酒尤其近也而以已處之者不獨使夫資之下者勉思企及而才之高者亦不敢易乎近矣行去聲夫音扶易音異俯經説之説見論語引此以明而就之意明道先生曰憂子弟之輕俊者只教以經學念書不得令作文字遺書與下分為二條心張氏曰教弟子以經學念書似為末節然欲收其放養以理義舍是又無别法問如此不見長進如何而可曰教之用心而已或随事問其義理或設難令其剖析或盤詰察其記憶或見人質其邪正皆是引其用心之方子弟凡百玩好皆奪志至於書札于儒者事最近然一向好著亦自䘮志如王虞顔栁輩誠為好人則有之曽見有善書者知道否平生精力一用於此非惟徒廢時日於道便有妨處足知䘮志也玩好好著之好去聲䘮並去聲曽音層遺書下同琴此因上不得令作文字之言而申明之玩好如畫與棊之類奪志奪其求道之志書札亦文字之一也史司馬相如傳請為天子逰獵之賦上令尚書給筆扎註木簡之薄小者時未用紙故給札以書後人遂以此為紙劄字用王羲之字逸少琅邪臨沂人也官右軍將軍㑹稽内史晉時人虞世南字伯施越州餘姚人官𢎞文館學士顔真卿字清臣京兆萬年人官吏部尚書使李希烈不屈死贈司徒謚文忠栁公權字誠懸京兆華原人官至右散騎常侍並唐時人善書又書札之一也吕涇野曰各人揀自已所累䖏一切盡除去不必是聲色貨利只冩字作詩凡嗜好一邉皆是胡安定在湖州置治道齋學者有欲明治道者講之於中如治民治兵水利算數之類葉氏曰治民如政教施設之方治兵如戰陣部伍之法水利如江湖渠堰之利算數如律厯九章之類容朱子曰胡公開治道齋亦非獨只理㑹此如所謂頭直足容重手容恭等語却是本原又曰安定規模雖少疎然却廣大著實也嘗言劉彞善治水利後累為政皆興水利有功累遺書作果池劉彞字執中福州人後第進士為朐山令作陂教種藝熈寧初神宗擇水官以彜悉東南水利除都水丞乆兩汴漲議開長城口􅂜請但啓楊橋斗門水即退所謂善治水利者推此類可見馬貴與曰三代之時捐膏腴之地以為溝洫澮川故能時其蓄洩以備水旱所以水利之説三代無有自秦人開阡陌廢井田任民所耕不計多少而溝洫之制大壊後之智者因川澤之勢引水以溉田而水利之説興焉史起鄭國之徒以此為功然水就下者也陂而遏之利于旱嵗不幸霪潦則其害有不可勝言者此翟子威杜元凱所以決壊隄防以紓水患也凡立言欲涵蓄意思不使知德者厭無德者惑厭謂厭其説之繁蕪也惑謂惑其説之瀾翻也教人未見意趣必不樂學欲且教之歌舞如古詩三百篇皆古人作之如關雎之類正家之始故用之鄉人用之邦國日使人聞之此等詩其言簡奥今人未易曉别欲作詩畧言教童子灑掃應對事長之節令朝夕歌之似當有助趣去聲樂音洛易音異别欲葉木作欲别要詩最易感發三百篇皆然也關雎之類又特舉其切者言之日使人聞之以上言古所以教之歌舞本如此也此等詩以下則為今人設法耳事長如内則即席飲食必後長者之類朱子曰虞書䕫教胄子與周禮大司徒之職俱用樂者葢教人朝夕從事于此使此心有所約束不至放失且樂有節奏學之者急不得緩不得乆之自移易人性情又曰嘗疑曲禮衣無撥足無蹶將上堂聲必揚將入户視必下等皆是古人教小兒語子厚以禮教學者最善使學者先有所據守胡敬齋曰程子謂横渠門人守禮節没滋味如喫木札相似言其少窮理致知功夫於理不深造非以守禮為不善也苟能于禮節中深體宻察而謹守之則知行兩盡此理實有諸已矣伊川曰語學者以所見未到之理不惟所聞不深徹反將理低看了葉氏曰學者所見未到驟以語之不惟無深造之功且將道理輕視之矣舞射便見人誠古之教人莫非使之成已成已承上誠字而言誠者所以自成故云程子嘗言舞中節射中鵠御中度皆誠也此獨不及御者以于學者少緩也自灑埽應對上便可到聖人事灑埽應對見前黄勉齋曰灑埽應對雖至小亦由天理之全體而著見于事物之節文聖人之所以為聖人者初不外乎此理特其事事物物皆由此理而不勉不思從容自中耳自幼子常視毋誑以上便是教以聖人事視同示教下葉本有人字誑欺妄也説見曲禮上篇幼子天真未漓常示之以不可欺誑使之一言笑一歩履無有不實不欺幽獨不愧屋漏亦不過從此充積以至于極也故曰便是教以聖人事先傳後倦君子教人有序先傳以小者近者而後教以大者逺者非是先傳以近小而後不教以逺大也説見論語吕氏曰後生學問且須理㑹曲禮内則少儀等篇灑埽應對進退之事及爾雅廣雅訓詁等文字然後可以語上下學上逹自當脫然有得度越諸子不如是則是躐等終不能成伊川先生曰說書必非古意轉使人薄學者須是潛心積慮優游涵養使之自得今一日説盡只是教得薄至如漢時説下帷講誦猶未必説書下帷講誦説見漢書董仲舒傳得張氏曰學者不從自己身心上字字句句體騐來總是随明随暗雖明不親切古者八嵗入小學十五入大學擇其才可教者聚之不肖者復之農􅅕蓋士農不易業既入學則不治農然後士農判小學大學者按學記家有塾黨有庠術有序國有學鄭氏讀術為鄉遂之遂陳可大集説則云術當為州州之學曰序周禮州長春秋以禮㑹民而射于州序是也愚謂當從陳氏為得葢州術以字形相似而誤也但州長集説作鄉大夫則誤也古者二十五家為閭而有塾二十閭為黨而有庠二十五黨為州而有序所謂鄉學也塾升之庠庠升之序然後鄉之大夫總五序所升從而考校以擇其秀異者俾入國之小學而教之大戴記保傅篇註所謂庠門虎闈是也葢小學自閭黨州至于國皆有之大學則惟國有之然雖閭黨州皆有小學亦曰塾曰庠曰序而已不得稱學也惟國稱學故曰國有學孟子亦言學則三代共之凡經傳所謂入學者皆謂國學也六遂之教與鄉同經不言者葢六郷在内舉内以見外也如飲曰鄉飲射曰鄉射賓興曰鄉三物糾民曰鄉八刑皆不及遂可見鄭註州長職云序州黨之學則黨學曰序而此云黨有庠者是州黨與鄉同處則在鄉學不别立序也遂之學不見于經傳然鄉學既名庠則遂學亦宜名庠自當以皇氏之説為正而六鄉自州學以下六遂自縣學以下皆為序也正義謂與黨連文故知術讀為遂愚謂如此則術正當讀為州葢葢五黨為州若遂學則應自縣而升矣陳氏禮書謂遂官降鄉官一等則遂之學亦降鄉一等故與州黨同名為序然則縣鄙以下之學何獨不降于州黨而同為序耶擇其才可教以下則承入大學言之葢八嵗入小學後兼習農事故尚書大傳有距冬至四十五日始出學傳農事之説而陳氏禮書亦謂班志坐里胥隣長于塾者所以教之耕葢嘗就小學言之至入大學則不復治農矣為士則任以近郊之地如載師士田之說程子下文所謂入學必有養也其不能為士者則授以二十五􅅕之田即孟子所謂餘夫也可見古人十五嵗時為士為農已判皆有以自養而不復仰給于父母矣公尚書大傳云王子八嵗而出就外舍束髪而入大學卿之世子大夫元士之適子十有三年始入小學二十入大學又云大夫七十而致仕退老歸其鄉里大夫為父師士為少師耰鉏已藏新穀已入嵗事已畢餘子皆入學年十五始入小學見小節踐小義焉年十八始入大學見大節踐大義焉距冬至四十五日始出學傅農事上老平明坐于右塾庶老坐于左塾餘子畢出然後皆歸夕亦如之餘子皆入父之齒随行兄之齒雁行朋友不相踰輕任并重任分頒白者不提携出入皆如之愚按尚書大傳所謂八嵗而出就外舍束髪而入大學者葢即大戴禮保傅篇及白虎通所謂八歲入小學十五入大學此王子之禮也小學云外舍者以小學在外故也而十三小學二十大學則公卿大夫元士之適子入學之期也其所謂十五小學十八大學者則通公卿以下及士庻人之子弟言之故曰餘子皆入學餘子對適子而言也又其上下文所言皆係農事可見矣然則其入學之早晚不同何也曰凡經傳所稱大學小學皆指天子之學而言也而其所謂公卿大夫之子弟與夫國之俊秀者亦皆就天子之國言之也葢古者凡入學以齒雖天子之元子亦齒于士雖大夫元士之子及國之俊選亦上與王子齒其重如此所以惟天子之子八歲便入小學其餘則必先有以教之俟少長知君臣上下之義然後令入學其分愈卑其入學愈遲如内則六年教之數與方名以至十年就外傅學書計學幼儀之類皆所以先教之于家至十有三年學樂誦詩舞勺方可入學下至閭里間亦皆以里老之有道徳者為左右師以至升之序升之庠幾經考校其升之學者皆司徒之所論定以選其秀者也故其教而成之也易為力所以至十五纔入小學而十八便能入大學也王制諸侯天子命之教然後為學亦指諸侯之國學而言也其州閭鄉黨之學不待天子之命也故下文小學在公宫南之左大學在郊但言國學未嘗及鄉學也又孔疏此小學大學殷制周則大學在國中小學在西郊愚謂不如禮書分天子諸侯説為得葢本文明云公宫又䝉上天子命之教然後為學説則其為諸侯之學無疑也在學之養若士大夫之子則不慮無養雖庻人之子既入學則亦必有養古之士者自十五入學至四十方仕中間自有二十五年學又無利可趨則所志可知須去趨善便自此成德後之人自童稚間已有汲汲趨利之意何由得向善故古人必使四十而仕然後志定只營衣食却無害惟利禄之誘最害人本註人有養便方定志於學愚按古者士農異業鑿然無疑故樊遲請學稼圃而夫子斥以小人孟子亦曰有大人之事有小人之事又曰居仁由義大人之事備矣然則既入學不復治農則必有養方定志于學其理自不易也朱子謂士升而上亦有時春夏耕耘秋冬肄業而疑程子學必有養之説為無據且謂安得許多糧給之恐是未定之論按語類問士人受田如何朱子曰上士中士下士是已命之士已有禄如管子士鄉十五是未命之士若農皆為士則無農矣故鄉止十五亦受田但不多周禮載師所謂士田是也觀此則前説之誤必矣又按鄭司農謂士田者士大夫之子得而耕之田也後鄭則謂士讀為仕仕者亦受田所謂圭田也然觀載師士田賈田並稱則朱子以士田為士所受之田其説得矣後鄭既以賈田等俱為其家所受田何獨于此乃必讀士為仕乎且其後引食貨志云士工商家受田五口乃當農夫一人則士田為士所受之田明矣又按士受田五口當農夫之一則是每人當二十􅅕也天下有多少才只為道不明於天下故不得有所成就且古者興於詩立於禮成於樂如今人怎生㑹得古人於詩如今人歌曲一般雖閭巷童稚皆習聞其説而曉其義故能興起於詩後世老師宿儒尚不能曉其義怎生責得學者是不得興於詩也古禮既廢人倫不明以至治家皆無法度是不得立於禮也古人有歌詠以養其性情聲音以養其耳目舞蹈以養其血脈今皆無之是不得成於樂也舞上遺書無目字雖真氏曰禮樂之制亡而禮樂之理則在故樂記謂致禮以治身致樂以治心荘敬者禮之本也和樂者樂之本也學者誠能以荘敬治其身和樂養其心則于禮樂之本得之矣亦足以立身而成徳也三百篇之詩雖云難曉今諸老先生發明其義昭然可知如能反復涵泳真可以感發興起則所謂興于詩者亦未嘗不存也古之成材也易今之成材也難易音異于朱子曰古者學校選舉之法始鄉黨而逹于國都教之以德行道藝而興其賢者能者葢其所以居之者無異處所以官之者無異術所以取之者無異路是以士有定志而無外慕早夜孜孜惟懼徳業之不修而不憂爵禄之未至若夫三代之教藝為最下然皆有實用而不可闕其為法制之宻又足以為治心養氣之助而進于道徳之歸此古之為法所以成人材厚風俗濟世務而興太平也孔子教人不憤不啟不悱不發葢不待憤悱而發則知之不固待憤悱而後發則沛然矣學者湏是深思之思而不得然後為他説便好為去聲下同釋此因孔子之言而之如此沛然者朱子所謂如時雨之化是也其㳺氏曰張子厚學成德尊識者謂與孟子比然猶秘學不輕為人講以為雖復多聞不務畜徳徒善口耳而已明道先生謂之曰道之不明乆矣人善其所習自謂至足必欲如孔門不憤不啟不悱不發則師資勢隔而先王之道或幾乎熄矣故今且當随其資而誘之雖識有明暗志有淺深亦各有得焉而堯舜之道庻可馴致子厚用其言故關中學者躬行之多與洛人並初學者須是且為他説不然非獨他不曉亦止人好問之心也好去聲若此又以發孔子未盡之意葢初學者自不知有憤悱不之啟發何由有開悟䖏故復言此以見教人不可執一道也語以上並伊川横渠先生曰恭敬撙節退譲以明禮仁之至也愛道之極也撙祖本反從手俗從木者非也説見曲禮撙裁抑也節儉約仁以全體言愛以發施處言也葢人有一毫人欲之私則必無以檢束其身心而非實有慈愛懇至之意周流貫徹則亦有行之而不能盡者故曰此仁之至愛道之極也張子嘗言禮儀三百威儀三千無一物而非仁即此意也已不勉明則人無從倡道無從𢎞教無從成矣正䝉見明謂明禮也此以理之不可不明也學記曰進而不顧其安使人不由其誠教人不盡其材此三句學記之文也下文乃詳解之其者指受教之人而言人未安之又進之未喻之又告之徒使人生此節目不盡材不顧安不由誠皆是施之妄也此明進而不顧其安之意葢不由誠不盡材之患皆由于此不可以不謹也教人至難必盡人之材乃不誤人觀可及處然後告之聖人之明直若庖丁之解牛皆知其隙刃投餘地無全牛矣此明教人必盡其材之意易言納約自牖即此意也庖丁解牛説見荘子養生主篇人之才足以有為但以其不由於誠則不盡其材若曰勉率而為之則豈有由誠哉禮記説下同此見三者又以使由其誠為主不然則雖進之而安亦必不能以盡其材也朱子曰若是逼得他𦂳他便來厮瞞便是不由誠問便是他解此兩句只作一意解否曰固是既是他不由誠自是材不盡古之小兒便能敬事長者與之提携則兩手奉長者之手問之揜口而對或于敬事長者句絶非奉敷勇反同敬事謂敬其所事也與論語執事敬事思敬意下特舉事長一節以見敬事之意他如灑埽之類皆然葢禮小兒無事可見故特舉此以見其概説見曲葢稍不敬事便不忠信故教小兒且先安詳恭敬此明小兒所以不可不教之敬事之意熊氏曰安詳則不躁率恭敬則不誕慢此忠信之本也孟子曰人不足與適也政不足與間也唯大人為能格君心之非非唯君心至於朋游學者之際彼雖議論異同未欲深較惟整理其心使歸之正豈小補哉適音責間去聲而孟子説如此從孟子之言推論之此見不獨事君當然也朋游以同輩言學者以後輩言整理其心使歸之正有以為入徳之基故曰非小補也横以上並渠語近思録集註卷十一欽定四庫全書近思録集註卷十一婺源江永撰朱子曰此卷教學之道濓溪先生曰剛善為義為直為斷為嚴毅為幹固惡為猛為隘為强梁柔善為慈為順為巽惡為懦弱為無斷為邪佞朱子曰剛柔固隂陽之大分而其中又各有隂陽以為善惡之分焉惡者固為非正而善者亦未必皆得乎中也惟中也和也中節也天下之逹道也聖人之事也朱子曰此以得性之正而言也然其以和為中與中庸不合蓋就已發無過不及者而言之如書所謂允執厥中者也故聖人立教俾人自易其惡自至其中而止矣朱子曰易其惡則剛柔皆善有嚴毅慈順之徳而無強梁懦弜之病矣至其中則其或為嚴毅或為慈順也又皆中節而無太過不及之偏矣通書伊川先生曰古人生子能食能言而教之大學之法以豫為先人之幼也知思未有所主便當以格言至論日陳於前雖未有知且當熏䀨使盈耳充腹久自安習若固有之雖以他説惑之不能入也若為之不豫及乎稍長私意偏好生於内衆口辯言鑠於外欲其純完不可得也文集觀之上九曰觀其生君子无咎象曰觀其生志未平也傳曰君子雖不在位然以人觀其徳用為儀法故當自慎省觀其所生常不失於君子則人不失所望而化之矣不可以不在於位故安然放意無所事也永按人所觀瞻而自修之志稍懈則不足為人望矣易傳聖人之道如天然與衆人之識甚殊邈也門人弟子旣親炙而後益知其高逺旣若不可以及則趨望之心怠矣故聖人之教常俯而就之事上臨喪不敢不勉君子之常行不困於酒尤其近也而以已處之者不獨使夫資之下者勉思企及而才之高者亦不敢易乎近矣朱子曰程子之意精矣但失不以何有於我為聖人之謙辭耳經説明道先生曰憂子弟之輕俊者只教以經學念書不得令作文字葉氏曰志輕才俊者憚於檢束而樂於馳騁使之習經念書則心平氣定若令作文字則得以用其才而長其輕俊矣永按今人於子弟輕俊者不以為憂而以為喜且早教之作文以干進他日輕俊之害不可勝言此由父兄之無識子弟凡百玩好皆奪志至於書札於儒者事最近然一向好著亦自喪志如王虞顔桺輩誠為好人則有之曾見有善書者知道否平生精力一用於此非惟徒廢時日於道便有妨處足知喪志也永按書札猶喪志其他玩好可知故書札惟欲揩正不必求工遺書下同胡安定在湖州置治道齋學者有欲明治道者講之於中如治民治兵水利算數之類嘗言劉彞善治水利後累為政皆興水利有功葉氏曰治民如政教施設之方治兵如戰陣部伍之法水利如江河渠堰之利算數如律歴九章之類永按安定又有經義齋專講明經義凡立言欲涵蓄意思不使知徳者厭無徳者惑葉氏曰知徳者玩其理而不厭無徳者守其説而不惑永按輕於立言無涵蓄意思知徳者厭其無味無徳者惑於輕揚朱子嘗謂尹氏論語説句句有味而於張無垢中庸解粗暴淺露舉程子此語譏之可知立言之方矣教人未見意趣必不樂學欲且教之歌舞如古詩三百篇皆古人作之如關雎之類正家之始故用之鄉人用之邦國日使人聞之此等詩其言簡奥今人未易曉别欲作詩畧言教童子灑掃應對事長之節令朝夕歌之似當有助子厚以禮教學者最善使學者先有所據守問横渠之教以禮為先恐謂之禮則有品節毎遇事秤停當方可遵守初學者或未曾識禮恐無下手處敬則有一念之肅便已改容更貌不費安排事事上見得此意如何朱子曰古者自幼入小學便教以禮及長自然在規矩之中横渠却是用官法教人禮也易學今人乍見往往以為難語學者以所見未到之理不惟所聞不深徹反將理低看了永按未見到之理必俟其深造將有得而後語之否則不惟不能深曉而亦以淺易輕視之矣舞射便見人誠永按舞射必誠乃可應節命中古之教人莫非使之成已自灑掃應對上便可到聖人事朱子曰此節言其理之在是而由是可以至於彼苟習焉而察而又勉焉以造其極則不俟改塗而聖可至耳豈曰一灑掃一應對之不失其節而遂可直以聖人自居也哉自幼子常視母誑以上便是教以聖人事永按小學皆是教之以誠誠即聖人事也先傳後倦君子教人有序先傳以小者近者而後教以大者逺者非是先傳以近小而後不教以逺大也朱子曰灑掃應對精義入神事有大小理無大小事有大小故有教有序而不可躐理無大小故隨其所處而皆不可不盡葉氏曰子夏正謂教人小大有别前段程子之説却就灑掃應對上發明理無大小自是一義伊川先生曰説書必非古意轉使人薄學者須是潛心積慮優游涵養使之自得今一日説盡只是教得薄至如漢時説下帷講誦猶未必説書葉氏曰理貴玩索至於口耳之傳末矣古者八歲入小學十五入大學擇其才可教者聚之不肖者復之農畞蓋士農不易業旣入學則不治農然後士農判在學之養若士大夫之子則不慮無養雖庶人之子旣入學則亦必有養古之士者自十五入學至四十方仕中間自有二十五年學又無利可趨則所志可知須去趨善便自此成徳後之人自童稚間已有汲汲趨利之意何由得向善故古人必使四十而仕然後志定只營衣食却無害惟利禄之誘最害人本註人有養便定志於學朱子曰程子之言未知何所據古者教士其比閭之學則鄉者坐於門而察其出入其來學也有時旣受學則退而習於其家及其升而上也則亦有時春夏耕耘餘時肄業未聞上之人復有以養之也夫旣給之以百畆之田矣又給之以學糧亦安得許多糧給之耶葉氏曰營衣食者求於力分之内未足以奪志若誘於利禄則所學皆非為己而根本已撥矣天下有多少才只為道不明於天下故不得有所成就且古者興於詩立於禮成於樂如今人怎生會得古人於詩如今人歌曲一般雖閭巷童稚皆習聞其説而曉其義故能興起於詩後世老師宿儒尚不能曉其義怎生責得學者是不得興於詩也古禮旣廢人倫不明以至治家皆無法度是不得立於禮也古人有歌詠以養其性情聲音以養其耳目舞蹈以養其血脈今皆無之是不得成於樂也古之成材也易今之成材也難孔子教人不憤不啓不悱不發蓋不待憤悱而發則知之不固待憤悱而後發則沛然矣學者須是深思之思之不得然後為他説便好朱子曰憤者心求通而未得之意悱者口欲言而未能之貌啓謂開其意發謂達其辭問如何是沛然曰此正所謂時雨之化如種植之物人力隨分已加但正當那時節欲發生未發生之際却欠了雨忽然得些兩來生意豈可禦也葉氏曰未嘗深思其受之也必淺旣無所得其聽之也若忘啓發於憤悱之餘則思深力窮而倐然有得必沛然而通達矣初學者須是且為他説不然非獨他不曉亦止人好問之心也葉氏曰此又誘進初學之道已上並遺書横渠先生曰恭敬撙節退讓以明禮仁之至也愛道之極也已不勉明則人無從倡道無從宏教無從成矣永按此張子言以禮教人當自勊也教者能恭敬樽節退讓以明禮則能率人使成材是仁之至能宏道以教人是愛道之極正蒙學記曰進而不顧其安使人不由其誠教人不盡其材人未安之又進之未喻之又告之徒使人生此節目不盡材不顧安不由誠皆是施之妄也教人至難必盡人之材乃不誤人觀可及處然後告之聖人之明直若庖丁之解牛皆知其隙刃投餘地無全牛矣人之才足以有為但以其不由於誠則不盡其才若曰勉率而為之則豈有由誠哉朱子曰嘗見横渠簡與人謂其子曰來誦書不熟宜教他熟誦盡其誠與材永按不顧學者之能受而强進之人雖勉强為之而無誠意旣無誠意則亦不能盡其才質三者相因皆躐等陵節之弊也横渠禮記説下同古之小兒便能敬事長者與之提攜則兩手奉長者之手問之掩口而對蓋稍不敬事便不忠信故教小兒且先安詳恭敬葉氏曰奉手則扶持尊者掩口而對習其鄉尊者屏氣安詳則不躁率恭敬則不誕慢此忠信之本也孟子曰人不足與適也政不足與間也唯大人為能格君心之非非惟君心至於朋游學者之際彼雖議論異同未欲深較惟整理其心使歸之正豈小補哉横渠孟子説近思録集註卷十一
