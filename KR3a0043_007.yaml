body:
  text: 近思録集注卷七歸安茅星來撰去就取舍身既修家既齊則可以出而措之國與天下矣而出處尤不可苟漢唐諸儒惟不明此義故雖王仲淹韓文公之賢猶不能無欲速干進之意因特於此具論之以見可以出而有為則治道治法具在舉而措之焉可也不然則明其道以傳之其徒無不可者所以十一卷特詳教學之道使有所據依其十卷臨政處事之方出與處皆可用也凡三十九條伊川先生曰賢者在下豈可自進以求於君苟自求之必無能信用之理古之人所以必待人君致敬盡禮而後往者非欲自為尊大蓋其尊德樂道之心不如是不足與有為也呂本古之人作古人之易傳道下無之心二字易傳下同蒙彖傳君子之需時也安靜自守志雖有須而恬然若將終身焉乃能用常也雖不進而志動者不能安其常也需初九象傳上條言賢者不可急於求進此條言雖不進而志或不能不動則亦不能以守其常也所以足上條未盡之意比吉原筮元永貞無咎傳曰人相親比必有其道苟非其道則有悔咎故必推原占決其可比者而比之所比得元永貞則無咎元謂有君長之道永謂可以常久貞謂得正道上之比下必有此三者下之從上必求此三者則無咎也比並音避長張丈反其推原占者謂推原象占之吉凶以決可比與否也元永貞三者正所謂决其可比者而比之也上比下必有此三者謂當修其在己者也下從上必求此三者謂當審其在人者也修其在已使可以當衆之比而無咎審其在人亦必其實有足以當吾之比而後可以無咎也不然則事不成必有戮辱之及事成亦蒙惡逆之名安能免於咎乎胡雲峰曰原筮本義讀如原蠶原廟及末有原之原訓作再與程傳異履之初九曰素履往無咎傳曰夫人不能自安於貧賤之素則其進也乃貪躁而動求去乎貧賤耳非欲有為也既得其進驕溢必矣故往則有咎去上聲痛此就人之不能安履其素者言之以見其必有咎也賢者則安履其素其處也樂其進也將有為也故得其進則有為而無不善處上聲樂音洛是九陽剛之才可以上進而初處至下能安其素而往不以貧賤而改其所樂者也異日出而有為可即於此而信之矣此亦孟子所謂禹稷顔子易地皆然之意以上初九爻傳若欲貴之心與行道之心交戰於中豈能安履其素乎承上文言賢者之進而有為者是專以行道為心者也天理之公也故無不善若使有欲貴之心交戰於中則是猶未免乎人欲之私矣故不能安履其素初九象傳大人於否之時守其正節不雜亂於小人之羣類身雖否而道之亨也故曰大人否亨不以道而自亨乃道否也否批美反小否六二象傳不以道以下指人吉而言道否見不足為吉也所以足夫子未盡之意胡雲峯曰二隂在下小人之羣也大人不為其羣所亂雖否而亨矣張氏曰小人頗多學為包承者君子但當安守其否以俟道亨不可以彼包承於我自失其守也慎之慎之人之所隨得正則遠邪從非則失是無兩從之理隨之六二苟係初則失五矣故象曰弗兼與也所以戒人從正當專一也隨六二象傳正與是指五之正應而言邪與非指初而言二若志係於初之小子則舍九五之丈夫必不能於二者兼而與之也故學者當慎擇所從使可宗而主然後為得也髙氏曰里克之中立鄧析之兩可壞名喪節多由於此可不戒哉君子所貴世俗所羞世俗所貴君子所賤故曰賁其趾舍車而徒君子所貴之貴易傳作賁賁初九傳君子所貴二語指賁其趾而言世俗所貴二語指舍車而徒而言賁其趾者自盡其所當為之道義也舍車而徒者不處非道之富貴也愚按王弼注云在賁之初以剛處下居於無位棄不義而安徒步以從其志者也其說頗與此相發明因録之蠱之上九曰不事王侯髙尚其事象曰不事王侯志可則也傳曰士之自髙尚亦非一道有懷抱道德不偶於時而髙潔自守者上九以陽剛之才居蠱之終無係應於下處事之外無所事之地是賢人君子不偶於時而髙潔自守者也故下文因此而歷推之有知止足之道退而自保者朱子曰如疏廣父子雖未盡出處之正然親見不可輔導計惟有去而已觀自云不去懼貽後悔亦是省事恬退底人有量能度分安於不求知者分音問問此與上何以别朱子曰知止足是能為者量能度分是不能為者有淸介自守不屑天下之事獨潔其身者所處雖有得失小大之殊皆自髙尚其事者也象所謂志可則者進退合道者也蠱上九傳遁者隂之始長君子知微固當深戒而聖人之意未便遽已也故有與時行小利貞之教長張丈反遁葉氏曰艮下乾上為二隂初長固所當戒然乾剛在上九五六二中正而應君子於此猶可與時消息雖未能大正尚幸其小有可正也楊誠齊曰二隂雖長於內然漸而未驟四陽猶盛於外其勢猶可以小有所正而未至大壞也問以彖辭小利貞浸而長之語觀之則小當為隂柔小人言小人利於守正不可以浸長之故而浸迫於陽也似與程傳意不同朱子曰如程傳所云則於剛當位而應與時行也之下當也云止而健隂進而長故小利貞今但云小利貞浸而長而不言止而健隂進而長則小指隂柔之小可知况當遁之時事勢已有不容正之者程傳雖善而有不通矣愚按王注隂道欲浸而長正道亦未全滅故小利貞程子之說蓋本乎此聖賢之於天下雖知道之將廢豈肯坐視其亂而不救必區區致力於未極之間强此之衰艱彼之進圖其暫安苟得為之孔孟之所屑為也王允謝安之於漢晋是也艱葉本作難太王允字子師原祁人漢獻帝初平初為司徒與司𨽻校尉黃琬僕射士孫瑞等密謀誅董卓詳後漢書及魏志謝安字安石陳國陽夏人也時桓溫權震內外安為吏部尚書中護軍與王坦之盡忠匡翼卒安晋祚詳見晋書上條言髙尚其事又恐如沮溺之流避世長往而不顧故以此條繼之言雖知道之將廢亦不可坐視其亂而不之救也明夷初九事未顯而處甚艱非見幾之明不能也如是則世俗孰不疑怪然君子不以世俗之見怪而遲疑其行也若俟衆人盡識則傷已及而不能去矣處上聲離下坤上為明夷初九明體居初雖有見傷之端其事未顯日入地中明傷而昏暗使不得上進是處甚艱也君子於行謂去祿退藏見幾之明也有所適而主人有言世俗之疑怪也漢楚王戊不設酒醴而穆生去之曰不去楚人將鉗我於市當時雖申公之賢猶以為過其後申公卒受胥靡之辱所謂傷已及而不能去者也君子固欲有為於世而見幾明决亦不可少故以此條繼之晋之初六在下而始進豈遽能深見信於上苟上未見信則當安中自守雍容寬裕無急於求上之信也苟欲信之心切非汲汲以失其守則悻悻以傷於義矣故曰晋如摧如貞吉罔孚裕無咎此以明罔孚當裕之意初居晋之下是始進也晋如遂其進也摧如不遂其進也總之惟得正則吉耳以上初六爻傳然聖人又恐後之人不達寬裕之義居位者廢職失守以為裕故特云初六裕則無咎者始進未受命當職任故也若有官守不信於上而失其職一日不可居也此又以見寬裕以待其自信者惟始進者則可而不可以槩之有官守而不見信者也一日不可居所以極言有官守不信於上而失職者之不可也不胡雲峯曰孟子云我無官守我無言責則我進退豈綽綽然有餘裕即此意然事非一槩久速唯時亦容有為之兆者此又承上文一日不可居而言見君子當隨時審處不得執此而遂同小丈夫之悻悻也為之兆如明道為條例司之類說見孟子傳以上初六象不正而合未有久而不離者也合以正道自無終睽之理故賢者順理而安行智者知幾而固守睽當從目後放此必睽六三象傳以六居三不正也但上九正應終得合故曰自無終睽之理君子當困窮之時既盡其防慮之道而不得免則命也當推致其命以遂其志知命之當然也則窮塞禍患不以動其心行吾義而已困象傳推致者謂於命之所當然一一推而致之以辨其正不正也遂志者謂於命之正者順而受之而死生禍福有所不計也朱子曰致命程子解作推致其命其義雖通然論語中致命字皆作委致之致猶言授命也又曰蹇與困不同象曰澤無水困是盡乾燥處困之極事無可為者故只得致命遂志若山上有水蹇則猶可進步如山上之泉曲折多艱阻猶有可行故教以反身修德自不得以困比也愚按孔疏謂遭困厄之世期於致命喪身必當遂其髙志不屈撓而移改則致命固亦作委致其身命解也馮氏當可曰君子之處困也命在天而致之志在我則遂之困而安於困者命之致也困而有不困者志之遂也若小人處之則凡可以求幸免者無不為也而卒不得免焉則亦徒喪其所守而已矣體坎險以致命體兑說而遂志苟不知命則恐懼於險難隕穫於窮厄所守亡矣安能遂其為善之志乎難去聲厄烏革反通五用厄俗借用厄非厄果切說文科厄木節也與厄别意此又反言以明命之不可不致之寒士之妻弱國之臣各安其正而已苟擇勢而從則惡之大者不容於世困九四傳寒士弱國指四而言其妻與臣謂初也勢指二而言四與初為正應然四以不中正處困其才不足以濟人之困初比二二有剛中之才足以拯困則宜為所從矣若不安其正而惟勢是從則惡之大者也井之九三泄治而不見食乃人有才智而不見用以不得行為憂惻也泄息列反陽泄不停汚也廣韻云除去也九三剛而處下卦之上在井則已泄治而可食矣以居下未得其用故不見食象傳行惻之行猶孟子行道之人不受之行程子却解作道不行之行故云以不得行為憂惻九三象傳蓋剛而不中故切於施為異乎用之則行舍之則藏者矣爻位剛而過中故切于施為正於爻辭憂惻上見也蓋程傳解心惻作三自惻與本義異故云然按孔疏亦解作使我心中惻愴與程傳同九三爻傳革之六二中正則無偏蔽文明則盡事理應上則得權勢體順則無違悖時可矣位得矣才足矣處革之至善者也必待上下之信故巳日乃革之也巳日乃革之爻辭也必待上下之信指卦辭巳日乃孚孚字而言蓋必孚而後能革也葉氏曰六二居中得正下卦為離故曰文明二與五應故曰應上爻位皆柔故曰體順時當變革則時可矣居正應上則位得矣文明體順則才足矣是處革之至善者然必待上下盡信而後革故辭曰巳日乃革之謹之至也如二之才德當進行其道則吉而無咎也不進則失可為之時為有咎也此係為得時乘勢而道可大行者言之鼎之有實乃人之有才業也當慎所趨向不慎所往則亦陷於非義故曰鼎有實慎所之也陷一作蹈應鼎九二象傳九二以剛居中為鼎有實之象二居中中不至失正然與初隂密比已雖自守以正彼或迫以相求如董卓曰我力能族人而蔡雍懼禍就徴華歆初與管幼安齊名後從曹操主謀為首惡蓋利欲薰於中禍患怵於外失身從人陷於不義而不自知也鳴呼可不戒哉慎所之者謂當從六五之正應而雖以初隂之密比有不得而昵就之也言此為人之有才業而急於自見者之也士之處髙位則有拯而無隨在下位則有當拯有當隨有拯之不得而後隨艮六二曰艮其腓不拯其隨在上位者可以直行已志故有拯無隨如必拯之而不得則有去而已不苟隨也若在下位則有不得直行已志者矣故有法所可為者是當拯也束於法而不得為者是當隨也拯之不得而後隨者蓋事所不便則為之請於上上不見聽則於隨之之中委曲調護必於事無有所害而後可也非徒曰隨之而已君子思不出其位位者所處之分也萬事各有其所得其所則止而安若當行而止當速而久或過或不及皆出其位也况踰分非據乎分音問其君子思不出位艮象傳文也下則程子所以釋其意如此人之止難於久終故節或移於晚守或失於終事或廢於久人之所同患也艮之上九敦厚於終止道之至善也故曰敦艮吉敦篤實也項氏曰上九與三相類皆一卦之主然九三當上下之交時不可止而止故危上九當全卦之極時可止而止故吉中孚之初九曰虞吉象曰志未變也傳曰當信之始志未有所從而虞度所信則得其正是以吉也信就中孚而言始謂初爻也未有所從如孔明之躬耕南陽不求聞達於諸侯是也所信謂干義可從而其人又可與有為者也如孔明之從昭烈是也虞度所信如孔明之必待三顧乃見是也志有所從則是變動虞之不得其正矣度待洛反是志有所從而後為之虞度其可否焉則變動不常矣豈為得其正乎賢者惟知義而已命在其中中人以下乃以命處義賢者知義則自然安命中人以下知命則自不為非義二者髙下雖不同其素位而行不願乎外則一也如言求之有道得之有命是求無益於得知命之不可求故自處以不求說見孟子此所謂中人以命處義者也程子又曰孟子之言猶只為中人言之若為中人以上而言却只道求之有道非道則不求更不消言命也若賢者則求之以道得之以義不必言命遺書下同以求之以道不枉道而妄求也得之義不非義而苟得也此所謂賢者知義而命在其中者也來張氏曰吳忠節公常言要窮就窮要死就死所以後能以身殉國蓋人之失身只為怕窮怕死所以無所不至人之於患難只有一箇處置盡人謀之後却須泰然處之有人遇一事則心心念念不肯捨畢竟何益若不㑹處置了放下便是無義無命也難去聲是只有一箇處置是義也盡人謀之後却須泰然處之命也心心念念不肯捨是無命也不㑹處置了放下是無義也一自首句至泰然處之言處患難之道當如此有人遇事以下則言人之未盡其道者也門人有居太學而欲歸應鄉舉者問其故曰蔡人鮮習戴記决科之利也鮮蘇典反今通作鮮康蔡州名上蔡其屬縣也宋為淮軍節度屬京西北路今河南汝寧府鮮少也按遺書游録云人有習他經既而舍之習戴記問其故曰决科之利也與此小異伊川先生曰汝之是心已不可入於堯舜之道矣夫子貢之髙識曷嘗規規於貨利哉特於豐約之間不能無留情耳且貧富有命彼乃留情於其間多見其不信道也故聖人謂之不受命有志於道者要當去此心而後可與語也去上聲語上呂本無與字和見游定夫所録二先生語祁寬所記尹靖語亦同注謂謝上蔡事一本云明道知扶溝縣事伊川侍行謝顯道將歸應舉伊川曰何不止試於太學曰蔡人鮮習禮記决科之利也先生云云顯道乃止是嵗登第注云尹子言其詳如此惟呂堅中所記尹和靖語作游定夫事誤也而張卓庵曰學者多言治生為急觀孔子稱回之死屢空不取賜之貨殖則知治生之說終是後人怕餓非志士不忘在溝壑之義他人無識見者不知為治生兩字壞却多少宜急取孔子之言正之人苟有朝聞道夕死可矣之志則不肯一日安於所不安也何止一日須臾不能如曽子易簀須要如此乃安人不能若此者只為不見實理實理者實見得是實見得非為去聲說見論語及檀弓朱子曰實理與實見不同今合說必記録有誤或曰實理者指理而言也實見者指見而言也曰善凡實理得之於心自别若耳聞口道者心實不見若見得必不肯安於所不安人之一身儘有所不肯為及至他事又不然若士者雖殺之使為穿窬必不為其他事未必然至如執卷者莫不知說禮義又如王公大人皆能言軒冕外物及其臨利害則不知就義理却就富貴如此者只是說得不實見及其蹈水火則人皆避之是實見得須是有見不善如探湯之心則自然别昔曾經傷於虎者他人語虎則雖三尺之童皆知虎之可畏終不似曾經傷者神色懾懼至誠畏之是實見得也之童呂本作童子遺書同意此節皆反覆申明實見之得之於心是謂有德不待勉强然學者則須勉强古人有捐軀隕命者若不實見得則烏能如此須是實見得生不重於義生不安於死也故有殺身成仁只是成就一箇是而已德楊本作得强並區兩反暇朱子曰或謂欲成仁所以殺身非也人當殺身時何更計及成仁只為死便是生便不是故伊川謂成就一箇是成仁乃自人視之云爾非其人殺身時有此意也孟子辨舜跖之分只在義利之間言間者謂相去不甚逺所爭毫末爾義與利只是箇公與私也才出義便以利言也只那計較便是為有利害若無利害何用計較利害者天下之常情也人皆知趨利而避害聖人則更不論利害惟看義當為不當為便是命在其中也為有之為去聲在楊氏曰舜跖之分固只義利之間然講之不熟見之不明未有不以利為義者又學者所當深察也大凡儒者未敢望深造於道且只得所存正分别善惡識廉恥如此等人多亦須漸好别必列反以所存正謂所存於心者正也如利祿不動其心耳目口體之欲不以繫其懷皆是此以體之存而言分别善惡二句以用之發而言蓋所存正則其本立分别善惡則知所擇識廉恥則能自守趙景平問伊川曰子罕言利所謂利者何利曰不獨財利之利凡有利心便不可如作一事須尋自家穩便處皆利心也聖人以義為利義安處便為利問下一本無伊川曰三字然趙景平名字爵里未詳萬問義安處便為利只是當而然便安否朱子曰只物各得其分便是利君得其為君臣得其為臣父得其為父子得其為子何利如之此利字即易所謂利者義之和如釋氏之學皆本於利故便不是問邢恕久從先生想都無知識後來極狼狽先生曰謂之全無知則不可只是義理不能勝利欲之心便至如此恕呂本作七勝下葉本有其字此下呂本有也字誣此謝上蔡問而伊川答之也恕朋比蔡京章惇諸奸宣仁有廢立意同文之獄組織萬端禍幾莫測詳見宋史故朱子曰他有意為惡又濟之以才罪過多謝湜自蜀之京師過洛而見程子子曰爾將何之曰將試教官子不答湜曰何如子曰吾嘗買婢欲試之其毋怒而弗許曰吾女非可試者也今爾求為人師而試之必為此媪笑也湜遂不行湜音直不答之不呂本作弗媪烏考反博謝湜字持正金堂人元豐進士官至國子士以一本云湜不能用又曰湜求見者三不許因陳經正請先生云聞其來問易遂為說以獻貴人注獻蔡卞如用脫桎梏之類按宋志初內外學官多朝廷特注後稍令國子監取其舊試藝等格優者用之熙寧八年始立教授試法即舍人院召試大義五道元祐中罷試法先生在講筵不曽請俸諸公遂牒户部問不支俸錢按通直郎料錢十八貫時先俸生嘗典錢使諸公因問必是給大段不足後乃知不曾請俸也户部索前任厯子先生云某起自草萊無前任厯子前任者蓋以先生曾受西監之命故也厯者料糧院所給料錢厯蓋據狀所開受官月日以令赴户部支俸錢者也子俗語助不支俸錢則無現任之厯可知故索前任厯子先生以布衣薦召雖恩命屢下並未受職故以起自草萊答之本注云舊例初入京官時用下狀出給料錢厯先生不請其意謂朝廷起我便當廩人繼粟庖人繼肉也料錢宋制有柴料茶料之類即俸錢也遂令户部自為出劵厯為去聲下為妻只為並同厯諸公以先生無料錢厯因特令户部自為出劵以給之俸也按先生後自涪陵歸復官半年不曾請俸料量院吏忽來索請劵狀子先生云自來不㑹寫狀子只令弟子録與受官月日事與此相類合而觀之而君子辭受取與之道蓋可見矣王氏曰按周禮天官一官唯宮正內宰獨言均其稍食蓋當時治朝之官掌之宮正禁中之官掌之內宰所以稍食必二人班之此等制度非獨關防所以護飬士大夫廉恥多矣葉竹野曰按周禮司祿中士四人下士八人鄭氏以為主班祿今此官職闕意即孟子所謂諸侯惡其害己而去其籍者然嘗以鄭氏說推之則周人班祿必使司祿班之宮正內宰自給之不獨杜官吏侵欺且以養士大夫廉恥今世班祿有所謂打請有所謂養劵盡叢集在料糧院而使士大夫自請甚非養廉恥之意伊川所以不請俸只緣不免持狀而請豈有廩人繼粟之意哉又不為妻求封范純甫問其故先生曰某當時起自草萊三辭然後受命豈有今日乃為妻求封之理范純甫即淳夫蓋以音義相近而通也純甫名祖禹字夢得後改淳父又或作醇父陸務觀曰本字淳朋友以一字難呼故增父字非其本也按遺書時先生與趙侍郎暨純甫同在後省行見曉示至節令命婦進表賀太皇及太后太妃問先生先生云某家無命婦二公愕然問何不叙封先生因語之如此問今人陳乞恩例義當然否人皆以為本分不為害先生曰只為而今士大夫道得箇乞字慣却動不動又是乞也因問陳乞封祖如何先生云此事體又别再三請益但云其說甚長待别時說分音問而今猶如今古字通用之朱子曰古者人有才德即舉用凡有封贈朝廷自行何待陳乞觀後來郊恩都不曾為太中陳請則陳乞封父祖程先生亦不為之矣問若是應舉得官便止當以常調自處雖陳乞封蔭可也曰此自今常人言之可也然朝廷待士却不當如此伊川所以難言之也但云其說甚長其意以為要當從科舉法都變了乃為正耳以上並伊川語漢䇿賢良猶是人舉之如公孫𢎞者猶强起之乃就對强區兩反士武帝初即位招賢良文學之時𢎞以賢良徴為博士使胸奴還報不合意乃移病免歸元光五年復徴賢良文學菑川國復推𢎞𢎞謝曰前已曾西用不能罷願更選國人固推𢎞見史記及漢書至如後世賢良乃自求舉爾若果有曰我心只望廷對欲直言天下事則亦可尚已若志在富貴則得志便驕縱失志則便放曠與悲愁而已若志下呂本無在字而馬氏曰漢自孝文䇿朝錯之後賢良方正皆上親䇿第其優劣或所對意有未盡如武帝之於仲舒再䇿三䇿必使理明意盡而後已孝昭年幼未即政故無親䇿之事然詔有司問以民所疾苦如鹽鐵均輸𣙜酤皆當時大事令建議之臣與之反覆詰難講究罷行之宜卒從其說為之罷𣙜酤不似後世之䇿士徒為具文也故其得人為較盛又曰漢以賢良方正與孝廉二科並行然賢良一科文帝武帝每對輒百餘人又徴詣公車上書自衒鬻者以千數而孝廉之選文帝十二年詔以為萬家之縣無應令者武帝元朔之詔亦以為闔郡不薦一人蓋賢良則稍有文墨才學者皆可充選而孝廉則非有實行可見者不容謬舉故也張氏曰三代後人才漢為盛亦以取士之法近古如以力田為科可使天下無閒田以孝弟為科則亂臣賊子不作風俗自然淳厚今國家即不制為科學者其可不以此自勉乎伊川先生曰人多說某不教人習舉業某何嘗不教人習舉業也人若不習舉業而望及第却是責天理而不修人事但舉業既可以及第則已若更去上面盡力求必得之道是惑也若於上面盡力求必得之道便須追逐時好曲避忌諱私意橫生矣故曰是惑也愚按舉業已非根柢切實之學今更以揣摩為必得之道而盡力求之于是東剽西竊愈趨愈下如邱瓊山所謂不知史冊名目朝代先後字畫偏旁者幸登一第出司文教而老儒宿望反欲俯而聽其甲乙可歎也問家貧親老應舉求仕不免有得失之纍何修可以免此伊川先生曰此只是志不勝氣若志勝自無此纍家貧親老須用祿仕然得之不得為有命曰在已固可為親奈何曰為己為親也只是一事若不得其如命何孔子曰不知命無以為君子人苟不知命見患難必避遇得喪必動見利必趨其何以為君子為有以為之為如字餘並去聲難喪並去聲上言習舉業者不可盡力求必得之道又恐藉口家貧親老故著此條或謂科舉事業奪人之功是不然且一月之中十日為舉業餘日足可為學然人不志於此必志於彼故科舉之事不患妨功惟患奪志不志下呂本無於字外書同宗外書舉以上三條為人之應科舉者言之朱子曰祖時科法疏濶張乖崖守蜀以士人無應舉者特去尋得李盿出來舉送去如士人要應舉時只是著布衫麻鞋陳狀稱百姓某人今聞朝廷取士來應舉連投所業太守略看所業請就客位換襴幞相見方得請試只一二人試訖舉送舊亦不糊名仁宗時方糊名橫渠先生曰世祿之榮王者所以録有功尊有德愛之厚之示恩遇之不窮也為人後者所宜樂職勸功以服勤事任長廉遠利以似述世風而近代公卿子孫方且下比布衣工聲病售有司不知求仕非義而反羞循理為無能不知䕃襲為榮而反以虛名為善繼誠何心哉樂音洛長張丈反無能之能宋本作不呂本同文集此條按宋文鑑乃策問題也事任謂事之責任也似嗣同世謂先世世風猶言家風也聲四聲平上去入也病八病按李淑詩苑類格沈約曰八病者一平頭第一字不得與第六字同聲第二字不得與第七字同聲如今日良宴㑹歡樂難具陳今歡字同聲日樂字同聲也二上尾第五字不得與十字同聲如西北有髙樓上與浮雲齊樓齊字同聲也三蜂腰第二字不得與第五字同聲兩頭大中心細似蜂腰也如聞君愛我甘切欲自修飾君甘皆平聲欲飾皆入聲也四鶴膝第五字不得與十五字同聲兩頭細中心粗如鶴膝也如客從逺方來遺我一書札上言長相思下言久離别來思皆平聲也五大韻重叠相犯如以親字為韻者九字內不得更用津人字如吳姬年十五春日正當罏吳罏同聲也六小韻非韻腳相犯但九字中有兩字同韻如客子已乖離那宜遠相送子與已同韻離與宜同韻也七正紐如壬紝任入一紐也一句內有壬字不得犯紝任入字如我本漢家女來嫁漠北庭家與嫁係正紐也八旁紐如一句內有月字便不得更用元阮願等字如丈人且安坐梁陳將欲起丈梁二字係旁紐也王伯厚曰唯上尾鶴膝最忌餘病亦通楊龜山曰應舉乃寒士不得已藉以進身耳既得矣何用應舉朱子曰先德遺風具在方策有能誦其言行其行不替其志節則所以世其家者孰大於是而區區之蔭襲又不足道矣顧氏曰人主設科以待寒畯不宜使大臣子弟得與其間大臣亦不當使其子弟與寒士兢進魏孝文時于烈為光祿勳卿子登引例求進烈疏請黜落孝文以為有識之言雖武夫猶知此義也宋仁宗患縉紳奔競用宰臣文彥博等言以韓維好古嗜學安於靜退召試學士院不赴除國子監主簿可謂得化理之本者矣唐宋時大臣子弟多以嫌不使應科舉間有及第者便招物議以致考覆黜落至於有明此法不講又以非進士一科不能顯達三百年來惟聞一山陰王文端子中解元不令赴㑹試而唐宋之風蕩然無存矣不資其力而利其有則能忘人之勢孟子說此按今正䝉作者篇有條但力作勢則作然後人多言安於貧賤其實只是計窮力屈才短不能營畫耳若稍動得恐未肯安之須是誠知義理之樂於利欲也乃能樂音洛同語録下天下事大患只是畏人非笑不養車馬食粗衣惡居貧賤皆恐人非笑不知當生則生當死則死今日萬鍾明日棄之今日富貴明日飢餓亦不恤惟義所在張子因始持朞喪恐人非笑已亦若有羞色者後雖大小功亦服之人亦熟之不以為怪矣因言此以見人非笑之不必畏也以上並橫渠語近思録集注卷七欽定四庫全書近思録集注卷七婺源江永撰朱子曰此卷出處進退辭受之義伊川先生曰賢者在下豈可自進以求於君苟自求之必無能信用之理古人之所以必待人君致敬盡禮而後往者非欲自為尊大蓋其尊德樂道之心不如是不足與有為也䝉彖傳人葉氏曰賢者之進將以行其道也自非君有好賢之誠心則諫不行言不聽豈足以有為哉易傳下同君子之需時也安靜自守志雖有須而恬然若將終身焉乃能用常也雖不進而志動者不能安其常也需初九傳者葉氏曰靜退以待時而終至於失常其身雖退而志則動也比吉原筮元永貞無咎傳曰人相親比必有其道苟非其道則有悔咎故必推原占决其可比者而比之所比得元永貞則無咎元謂有君長之道永謂可以常久貞謂得正道上之比下必有此三者下之從上必求此三者則無咎也永按朱子本義謂筮得此卦者當為人所親輔然必再筮以自審有元善長永正固之德然後可以當衆之歸而無咎與程傳意異傳專以君臣相比言之履之初九曰素履往無咎傳曰夫人不能自安於貧賤之素則其進也乃貪躁而動求去乎貧賤耳非欲有為也既得其進驕欲必矣故往則有咎賢者則安履其素其處也樂其進也將有為也故得其進則有為而無不善若欲貴之心與行道之心交戰於中豈能安履其素乎葉氏曰欲貴之心勝則必不能安行乎素位而亦卒無可行之道矣大人於否之時守其正節不雜亂於小人之羣類身雖否而道之亨也故曰大人否亨不以道而身亨乃道否也否六二傳人之所隨得正則逺邪從非則失是無兩從之理隨之六二苟係初則失五矣故象曰弗兼與也所以戒人從正當專一也葉氏曰隨六二與九五為正應然下比初九苟隨私昵必失正應君子所貴世俗所羞世俗所貴君子所賤故曰賁其趾舍車而徒賁初九傳以永按世俗勢位為榮君子以道義為貴故寧舍非道之車而安於徒步蠱之上九曰不事王侯髙尚其事象曰不事王侯志可則也傳曰士之自髙尚亦非一道有懷抱道德不偶於時而髙潔自守者有知止足之道退而自保者有量能度分安於不求知者有清介自守不屑天下之事獨潔其身者所處雖有得失小大之殊皆自髙尚其事者也象所謂志可則者進退合道者也問知止足之道與量能度分者何以别朱子曰知止足是能做底量能度分是不能做底疏葉氏曰懷抱道德伊尹太公是也知止足之道張良廣是也量能度分徐稚申屠蟠是也清介自守嚴光周黨是也遁者隂之始長君子知微固當深戒而聖人之意未便遽己也故有與時行小利貞之教聖賢之於天下雖知道之將廢豈肯坐視其亂而不救必區區致力於未極之間强此之衰艱彼之進圗其暫安苟得為之孔孟之所屑為也王允謝安之於漢晉是也朱子曰小利貞小指隂小之小况當遁去之時事勢已有不容正之者程說雖善而有不通矣伊川說小利貞云尚可以有為隂已浸長如何可以有為所說王允謝安之於漢晉恐也不然王允是算殺了董卓謝安是乘王敦之老病皆是他衰微時節不是漫長之時也兼他是大臣亦如何去此為在下位有為之兆者則可以去大臣與君存亡如何去艱葉氏曰强此之衰扶君子之道未盡消彼之進抑小人之道未驟長明夷初九事未顯而處甚艱非見幾之明不能也如是則世俗孰不疑怪然君子不以世俗之見怪而遲疑其行也若俟衆人盡識則傷已及而不能去已葉氏曰初九傷猶未顯而曰君子于行三日不食蓋知幾而去之速處人之所難而不疑也楚王戊不設醴酒而穆生去之曰不去楚人將鉗我於市當時雖申公之賢猶以為過其後申公受胥靡之辱至是欲去而不得矣晉之初六在下而始進豈遽能深見信於上苟上未見信則當安中自守雍容寬裕無急於求上之信也苟欲信之心切非汲汲以失其守則悻悻以傷於義矣故曰晉如摧如貞吉罔孚裕無咎然聖人又恐後之人不達寬裕之義居位者廢職失守以為裕故特云初六裕則無咎者始進未受命當職任故也若有官守不信於上而失其職一日不可居也然事非一槩久速唯時亦容有為之兆者永按裕者不急進亦不遽退孟子所謂無官守言責則吾進退綽綽然有餘裕者也兆事之端為之兆謂若孔子之不去魯示以道有可行之端也不正而合未有久而不離者也合以正道自無終睽之理故賢者順理而安行智者知幾而固守睽六三傳幾永按順理安行者隨時之宜無心遇合也知固守者知事之微不苟求合也君子當困窮之時既盡其防慮之道而不得免則命也當推致其命以遂其志知命之當然也則窮塞禍患不以動其心行吾義而已苟不知命則恐懼於險難隕穫於窮危所守亡矣安能遂其為善之志乎困象傳命朱子曰致伊川解作推致是命雖說得通然論語中致命字都是委致之致永按隕穫謂為窮厄所壓而顛墜消落寒士之妻弱國之臣各安其正而已苟擇勢而從則惡之大者不容於世矣困九四傳井之九三泄治而不見食乃人有才智而不見用以不得行為憂惻也蓋剛而不中故切於施為異乎用之則行舍之則藏者矣革之六二中正則無偏蔽文明則盡事理應上則得權勢體順則無違悖時可矣位得矣才足矣處革之至善者也必待上下之信故己日乃革之也如二之才德當進行其道則吉而無咎也不進則失可為之時為有咎也葉氏曰己日乃革之謹之至也革固不可遽然當其時處其位有其才豈容自已故辭曰征吉無咎鼎之有實乃人之有才業也當慎所趨向不慎所往則亦陷於非義故曰鼎有實慎所之也鼎九二傳有葉氏曰有才者急於為不暇謹持所向如荀彧之類是也士之處髙位則有拯而無隨在下位則有當拯有當隨有拯之不得而後隨艮六二傳弊永按拯者救其隨者隨其失也處髙位不可坐視其失在下位則有職所不及力所不能者矣君子思不出其位位者所處之分也萬事各有其所得其所則止而安若當行而止當速而久或過或不及皆出其位也况踰分非據乎艮象傳據葉氏曰踰越常分據非所又出位之尤者人之止難於久終故節或移於晚守或失於終事或廢於久人之所同患也艮之上九敦厚於終止道之至善也故曰敦艮吉中孚之初九曰虞吉象曰志未變也傳曰當信之始志未有所從而虞度所信則得其正是以吉也志有所從則是變動虞之不得其正矣葉氏曰未有所從則中無私係苟志有所係則好惡成於中是非變於外賢者惟知義而已命在其中中人以下乃以命處義如言求之有道得之有命是求無益於得知命之不可求故自處以不求若賢者則求之以道得之以義不必言命朱子曰程子言義不言命之說有功於學者亦前聖所未發之一端殺君子之所急當先義語義則命在其中如行一不義一不辜而得天下不為此只說義若不恤義惟命是恃則命可取有得雖萬鍾有不辨禮義而受之矣義有可取如為養親於義合取而有不得則當歸之命爾葉氏曰命雖定於事物之先實顯於事物之後義雖因事物而有實著於應酬之時如去就辭受要决於義而後命從之以顯苟欲以命決之可乎故君子求之道義而已命不必言也遺書下同人之於患難只有一箇處置盡人謀之後却須泰然處之有人遇一事則心心念念不肯捻畢竟何益若不㑹處置了放下便是無義無命也葉氏曰遇事不能處是無義處置了不能放下是無命門人有居太學而欲歸應鄉舉者問其故曰蔡人鮮習戴記決科之利也先生曰汝之是心已不可入於堯舜之道矣夫子貢之髙識曷嘗規規於貨利哉特以豐約之間不能無留情耳且貧富有命彼乃留情於其間多見其不信道也故聖人謂之不受命有志於道者要當去此心而後可語也人苟有朝聞道夕死可矣之志則不肯一日安於所不安也何止一日須臾不能如曽子易簀須要如此乃安朱子曰道者事物當然之理苟得聞之則生順死安無復遺恨矣言程子引易簀之事蓋以道之重於生明正之安於死有夫子所言之志而後能有曾子所處之事耳非以聞道便為得正亦非以聞道而得正者便無餘事而可以死也問曾子易簀當時若差了這一著喚做聞道不聞道曰不論易簀與不易簀只論他平日是聞道與不聞道平日已是聞道那時萬一照管不到也無奈何問若果已聞道到那時也不曽放過曰那時是正終大事既見得自然不放過人不能若此者只為不見實理實理者實見得是實見得非朱子曰伊川說實理有不可曉處云實見得是實見得非恐是記者之誤見字上必有漏落理自是理見自是見實理與實見不同蓋有那實理人須見得確定若不實見得又都間了葉氏曰本以人心見處而言惟實見是非之理然後為實理蓋理無不實但見有不實耳永按葉氏說亦可通凡實理得之於心自别若耳聞口道者心實不見若見得必不肯安於所不安人之一身儘有所不肯為及至他事又不然若士者雖殺之使為穿窬必不為其他事未必然至如執卷者莫不知說禮義又如王公大人皆能言軒冕外物及其臨利害則不知就義理却就富貴如此者只是說得不實見及其蹈水火則人皆避之是實見得須是有見不善如探湯之心則自然别昔曾經傷於虎則他人語虎則雖三尺童子皆知虎之可畏終不似曽經傷者神色懾懼至誠畏之是實見得也朱子曰致知便要窮究徹底真見得决定如此程子虎傷之譬甚好箇今人行到五分便是他只知得五分譬諸穿窬稍是人便不肯做蓋真知穿窬之不善也虎傷事亦然得之於心是謂有德不待勉强然學者則須勉强朱子曰這不待勉强不是不勉而中從容中道只是見得通透做得順便如所謂樂循理底意思古人有捐軀隕命者若不實見得則烏能如此須是實見得生不重於義生不安於死也故有殺身成仁只是成就一箇是而已朱子曰曽見人解殺身成仁言殺身者所以全性命之理人當殺身時何暇更思量我是全性命之理只為死便是生便不是不過就一箇是故伊川說生不安於死至於全其性命之理乃是旁人看他說底話非是其人殺身時有此意也孟子辨舜跖之分只在義利之間言間者謂相去不甚逺所爭毫末爾義與利只是箇公與私也才出義便以利言也只那計較便是為有利害若無利害何用計較利害者天下之常情也人皆知趨利而避害聖人則更不論利害惟看義當為不當為便是命在其中也南軒張氏曰無所為而為之者義也有所為而為之者利也葉氏曰義如是則命亦當如是大凡儒者未敢望深造於道且只得所存正分别善惡識廉恥如此等人多亦須漸好趙景平問子罕言利所謂利者何利曰不必財利之利凡有利心便不可如作一事須尋自家穩便處皆利心也聖人以義為利義安處便為利如釋氏之學皆本於利故便不是朱子曰程子謂作一事須尋自家穩便處皆利心如此則善利之間相去毫髮苟辨之不明其不反以利為善者鮮矣萬問義安處便為利只是當然而然便安否曰是也只物各得其分便是利君得其為君臣得其為臣父得其為父子得其為子何利如之此利字即易所謂利者義之和利便是義之和處然那句解得不似此語却親切正好去解那句義初似不和而却和截然不可犯似不和分别後萬物各得其所便是和不和生於不義義則和而無不利矣倫葉氏曰釋氏惡死則欲無生惡物欲亂心則絶滅人推其本心惟欲利己而已是賊義之大者問邢七久從先生想都無知識後來極狼狽先生曰謂之全無知則不可只是義理不能勝利欲之心便至如此也邢七邢恕也附章惇為惡則朱子曰此言以責人言之恕以教人言之則切謝湜自蜀之京師過洛而見程子子曰爾將何之曰將試教官子弗答湜曰何如子曰吾嘗買婢欲試之其母怒而弗許曰吾女非可試者也今爾求為人師而試之必為此媪笑也湜遂不行先生在講筵不曽請俸諸公遂牒戶部問不支俸錢户部索前任厯子先生云某起自草萊無前任厯子本注舊例初入京官時用下狀出給料錢厯先生不請其意謂朝廷起我便當廩人繼粟庖人繼肉也遂令户部自為出券厯又不為妻求封范純甫問其故先生曰某當時起自草萊三辭然後受命豈有今日乃為妻求封之理問今人陳乞恩例義當然否人皆以為本分不為害先生曰只為而今士大夫道得箇乞字慣却動不動又是乞也因問陳乞封父祖如何先生曰此事體又别再三請益但云其說甚長待别時說朱子曰某因說甚長之意思之後來人只是投家狀便是陳乞了以至入任事事皆然古者人有才德即舉用當時這般封贈朝廷自行之何待陳乞程先生之意恐然也觀後來郊恩都不曾為太中陳請則乞封贈程先生亦不為之矣問封父母此自朝廷合行之禮當令有司檢舉行下亦不必俟陳乞也曰如此名義却正亦問若是應舉得官便只當以常調自處雖陳乞封䕃可曰本以應舉得官則當只以常調自處此自令常人言之如此可也然朝廷待士却不當如此伊川先生所以難言之也但云其說甚長則是其意以為要當從科舉法都改變了乃是正耳漢䇿賢良猶是人舉之如公孫𢎞者猶强起之乃就對至如後世賢良乃自求舉爾若果有曰我心只望廷對欲直言天下事則亦可尚已若志富貴則得志便驕縱失志則便放曠與悲愁而已伊川先生曰人多說某不教人習舉業某何嘗不教人習舉業也人若不習舉業而望及第却是責天理而不修人事但舉業既可以及第即已若更去上面盡力求必得之道是惑也問家貧親老應舉求仕不免有得失之纍何修可以免此伊川先生曰此只是志不勝氣若志勝自無此纍家貧親老須用祿仕然得之不得為有命曰在己固可為親奈何曰為己為親也只是一事若不得其如命何孔子曰不知命無以為君子人苟不知命見患難必避遇得喪必動見利必趨其何以為君子朱子曰死生有定命若合死於水火死於刀兵看如何逃不得此說雖甚粗然所謂知命者不過如此若這裏信不及才見利便趨見害便避如何得成君子或謂科舉事業奪人之功是不然且一月之中十日為舉業餘日是可為學然人不志此必志於彼故科舉之事不患妨功惟患奪志問科舉之妨功朱子曰程先生有言不恐妨功惟恐奪志若一月之間著十日事舉業亦有二十日修學若被他移了志則更無醫處矣以科舉為為親而不為為己之學只是無志以舉業為妨實學不知曽妨飲食否只是無志也聖非是科舉纍人自是人纍科舉若髙見逺識之士讀賢書據吾所見而為文以應之得失利害置之度外雖日日應舉亦不纍也居今之世使孔子復生也不免應舉然豈能纍孔子耶得科舉亦不害為學但今人把心不定所以為害才以失為心理㑹文字意思都别了外書橫渠先生曰世祿之榮王者所以録有功尊有德愛之厚之示恩遇之不窮也為人後者所宜樂職勸功以服勤事任長亷逺利以似述世風而近代公卿子孫方且下比布衣工聲病售有司不知求仕非義而反羞循理為不能不知䕃襲為榮而反以虛名為善繼誠何心哉文集不資其力而利其有則能忘人之勢葉氏曰人之歆動乎勢位者皆有待於彼也惟不藉其力而利其所有則己自重而彼自輕孟子說人多言安於貧賤其實只是計窮力屈才短不能營畫耳若稍動得恐未肯安之須是誠知義理之樂於利欲也乃能朱子曰人須是讀書洞見此理知得不求富貴只是本分求著便是罪過不惟不可有求之之迹亦不可有求之之心下語録同是天下事大患只是畏人非笑不養車馬食粗衣惡居貧皆恐人非笑不知當生則生當死則死今日萬鍾明日棄之今日富貴明日飢餓亦不恤惟義所在葉氏曰義之所在死生去就有所不顧豈有懷齷齪之見畏人非笑者哉近思録集注卷七
