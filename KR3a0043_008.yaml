body:
  text: 近思録集注卷八歸安茅星來撰治道大要此二卷乃大學治國平天下之道而此則其大綱也猶前致知存養省察詳言為學工夫而二卷乃先言為學大要蓋此書所以發明大學先論綱領次詳條目固大學之書然也凡二十五條濂溪先生曰治天下有本身之謂也治天下有則家之謂也朱子曰則謂物之可視以為法者猶俗言則例則樣是也真西山曰漢髙祖能誅秦蹙項而不能割戚姬如意之寵唐太宗能取孤隋攘羣盜而閨門慙德顧不免焉可見情欲之私雖英雄之主尚不能以自克而家之所以不齊者率由於此不可以不謹也本必端端本誠心而已矣則必善善則和親而已矣此承上文言所以端本善則之道真西山曰心不誠則私意邪念紛紛交作欲身之修得乎親不和則閨門乖戾情意隔絶欲家之正得乎葉氏曰以上總論治天下在端本善則之意家難而天下易家親而天下疏也易音異親真西山曰則私情易溺故難疏則公道易行故易朱子曰不先其難亦未有能其易者家人離必起於婦人故睽次家人以二女同居而其志不同行也朱子曰睽次家人易卦之序二女以下睽彖傳文二女謂睽卦兑下離上兑少女離中女也隂柔之性外和悅而內猜嫌故同居而志異堯所以釐降二女於媯汭舜可禪乎吾茲試矣是治天下觀於家媯音規汭如鋭反遂此因上文二女同居不同志之意而引此以實之也媯水在今山西平陽府蒲州界朱子曰釐理也降下也媯水名汭水北舜所居也堯理治下嫁二女于舜將以試舜而授之天下也親葉氏曰以上明善則在和之意治家觀身而已矣身端心誠之謂也誠心復其不善之動而已矣朱子曰所以誠心者不善之動息於外則善心之生於內者無不實矣不善之動妄也妄復則無妄矣無妄則誠矣矣從原書葉吕本並作焉之雙溪王氏曰復者賢人之事無妄者聖人事無妄則誠而復者所以求至於無妄者也故無妄次復而曰先王以茂對時育萬物深哉通書次程傳茂盛也對時謂順合天時朱子曰無妄復亦卦之序先王以下引無妄卦大象以明對時育物惟至誠者能之而歎其旨之深也葉氏曰以上明端本在誠心之意明道先生嘗言於神宗曰得天理之正極人倫之至者堯舜之道也用其私心依仁義之偏者霸者之事也熙寧二年先生以御史中丞吕公公著薦召除太子中允權監察御史裏行上疏首言王霸之事王道如砥本乎人情出乎禮義若履大路而行無復回曲霸者﨑嶇反側於曲徑之中而卒不可與入堯舜之道曲徑之曲楊本作由故誠心而王則王矣假之而霸則霸矣二者其道不同在審其初而已易所謂差若毫釐繆以千里者其初不可不審也差初加反繆音謬此差若毫釐二語見禮記經解裴駰曰今易無而易緯有之陳遁齊曰按王充論衡注乃易之緯文也陸德明曰蓋連山歸藏之詞未詳孰是大戴禮差若作失之繆以作差之惟陛下稽先聖之言察人事之理知堯舜之道備於己反身而誠之推之以及四海則萬世幸甚文集下同雜朱子曰宣帝王霸原不識王霸只是以寬慈喚做王嚴酷喚做霸自古論王霸至明道先生此劄無餘藴矣伊川先生曰當世之務所尤先者有三一曰立志二曰責任三曰求賢今雖納嘉謀陳善算非君志先立其能聽而用之乎君欲用之非責任宰輔其孰承而行之乎君相協心非賢者任職其能施於天下乎此三者本也制於事者用也三者之中復以立志為本所謂立志者至誠一心以道自任以聖人之訓為可必信先王之治為可必行不狃滯於近規不遷惑於衆口必期致天下如三代之世也相去聲復扶又反而上條言王霸之辨以定所趨向趨向既定其所當先者則在此三事也然愚又以為如宋之神宗志向何嘗不立責任吕王諸人何嘗不専而宋室大壤此朱子所以必以致知格物正心誠意為君言也説此為太中公上英宗應詔書中語也陳定宇曰程子立志一段最為切要學者亦當如此但在身在天下有大小不同耳比之九五曰顯比王用三驅失前禽傳曰人君比天下之道當顯明其比道而已如誠意以待物恕己以及人發政施仁使天下蒙其惠澤是人君親比天下之道也如是天下孰不親比於上若乃暴其小仁違道干譽欲以求下之比其道亦已狹矣其能得天下之比乎比並音避下同暴音僕意此一節明所以顯比之王者顯明其比道天下自然來比來者撫之固不煦煦然求比於物若田之三驅禽之去者從而不追來者則取之也此王道之大所以其民皞皞而莫知為之者也煦音許田畋通此就王用三驅失前禽而釋之以見所以為顯比之意來者取之以喻下四隂之順乎五也去者不追以喻上一隂之背乎五也去問伊川所謂來者撫之去者不追與失前禽而殺不者所譬頗不相類如何朱子曰田獵之禮置旃以為門刈草以為長圍田獵者自門驅而入禽獸向我而出者皆免惟被驅而入者皆獲故以前禽比去者不追獲者譬來則取之大意如此胡氏曰師比之五皆取田象師之田有禽害物之禽也比之失前禽背已之禽也在師則執之王者之義也在比能失之王者之仁也非惟人君比天下之道如此大率人之相比莫不然以臣於君言之竭其忠誠致其才力乃顯其比君之道也用之與否在君而已不可阿諛逢迎求其比己也在朋友亦然修身誠意以待之親已與否在人而已不可巧言令色曲從苟合以求人之比己也於鄉黨親戚於衆人莫不皆然三驅失前禽之義也易傳下同自此復就顯比推廣言之法此條言人君有公平正大之體綱紀度之施以親比于天下而不必用私恩小惠以取悅也古之時公卿大夫而下位各稱其德終身居之得其分也位未稱德則君舉而進之士修其學學至而君求之皆非有預於己也農工商賈勤其事而所享有限故皆有定志而天下之心可一後世自庶士至於公卿日志於尊榮農工商賈日志於富侈億兆之心交鶩於利天下紛然如之何其可一也欲其不亂難矣稱並去聲分音問賈並音古億履象曰君子以辨上下定民志詩萬及秭注萬億為兆孔頴達曰億之數有大小二法其小者數以為等十萬為億十億為兆也其大數以萬為等萬萬為億萬億為兆也而此以見上下各有定分但當盡力于其所當為不可有慕乎其外之心也泰之九二曰包荒用馮河傳曰人情安肆則政舒緩而法度廢弛庶事無節治之之道必有包含荒穢之量則其施為寬裕詳密弊革事理而人安之若無含𢎞之度有忿疾之心則無深逺之慮有暴擾之患深弊未去而近患已生矣故在包荒也馮音憑下同曰此明所以當包荒之意葉氏不詳密則無深逺之慮不寬裕則有暴擾之憂無深逺之慮則深弊未易革有暴擾之憂則近患己生自古泰治之世必漸至於衰替蓋由狃習安逸因循而然自非剛斷之君英烈之輔不能挺特奮發以革其弊也故曰用馮河斷都坑反河此明所以用馮之意或疑上云包荒則是包含寬容此云用馮河則是奮發改革似相反也不知以含容之量施剛果之用乃聖賢之為也此明包荒與用憑河相反而實相成之意含容謂二剛果謂九以朱子曰何萬一之嘗論本朝自李文靖王文正當國來廟論主於安靜凡有建明便以生事歸之馴至後世天下弊事極多此説甚好且如仁宗朝是甚次第時節國勢却如此緩弱事多不理英宗即位已自有性氣要改作但以聖躬多病不久晏駕神宗繼之性氣越緊尤欲更新之却撞出介甫來承當所以作壞得如此觀盥而不薦有孚顒若傳曰君子居上為天下之表儀必極其莊敬如始盥之初勿使誠意少散如既薦之後則天下莫不盡其孚誠顒然瞻仰之矣觀古玩反迎此安定胡氏之言而先生引之也朱子發曰祭之初尸入廟天子涗手而後酌酒涗謂之盥酌酒獻尸尸得之灌地而祭謂之祼祼之後三獻而薦腥五獻而薦熟謂之薦楊氏曰按禮天子諸侯之祭先於堂上設南面位行祼鬯薦腥之禮而後延尸入室東面位行饋食禮大夫士之祭不祼不薦血腥惟室中設尸主東面行饋食禮故儀禮少牢特牲禮皆云饋食也朱子曰盥與灌不同灌是以秬鬯之酒灌地以降神盥只是洗手凡祭祀數數盥手一拜則手拊地便又著洗蓋謂精誠之至但是盥滌而不待乎薦享有孚已自顒若也伊川承先儒之誤恐非易本意至謂既薦之後誠意懈散則先王祭祀只是灌鬯之初猶有誠意及薦羞之後皆不成禮矣愚按程傳盥謂祭祀之始盥手酌鬱鬯於地則程子固未嘗直以盥為灌也但所謂盥者乃就灌之時而言耳惟王弼注言宗廟之可觀莫盛於盥至薦簡略不足復觀且引夫子禘自既灌而往吾不欲觀之言為證則似直以盥為灌而其意亦與程傳薦後誠意少散云云相似蓋胡説之所本也又有孚顒若伊川主天下之人説本義以謂孚信在中而尊嚴故下觀而化之主在上者説二説不同然按彖傳下觀而化之言則夫子明以有孚顒若為下之化其在上者之自盡其誠敬已在盥而不薦句內程傳得之惟説盥而不薦處誠如朱子所駁觀所云但盥而不待薦享有孚已自顒若則朱子亦以有孚句作效驗説也不自從本義而從程傳蓋明以程傳為可從也孔疏下觀此盛禮莫不皆化悉有孚信而顒然則亦就下之人言也凡天下至於一國一家至於萬事所以不和合者皆由有間也無間則合矣以至天地之生萬物之成皆合而後能遂凡未合者皆為有間也若君臣父子親戚朋友之間有離二怨隙者蓋讒邪間於其間也去其間隔而合之則無不和且治矣噬嗑者治天下之大用也間並去聲惟之間於其間如字皆有間間上吕本無有字且治之治去聲虛噬嗑卦傳按程傳此卦上下二剛爻而中柔外剛中人頥口之象也九四一陽間於其中為口中有物之象口中有物則隔其上下而不得合矣有間指九四一陽爻而言也大畜之六五曰豶豕之牙吉傳曰物有總攝事有機會聖人操得其要則視億兆之心猶一心道之斯行止之則戢故不勞而治其用若豶豕之牙也豕剛躁之物若強制其牙則用力勞而不能止若豶去其勢則牙雖存而剛躁自止君子法豶豕之義知天下之惡不可以力制也則察其機持其要塞絶其本原故不假刑法嚴峻而惡自止也豶音墳道音導強如字善豶豕去勢也道之斯行謂導之為也止之則戢謂禁其為惡也勢外腎也先程子又曰教人之術如童牛之梏當其未能觸時已制之善之大者其次則豶豕之牙也且如止盜民有欲心見利則動苟不知教而迫於飢寒雖刑殺日施其能勝億兆利欲之心乎聖人則知所以止之之道不尚威刑而修政教使之有農桑之業知廉恥之道雖賞之不竊矣此又就止盜言之之此條言聖人化強暴法貴察其機要而治其本原不徒威刑之是尚也解利西南無所往其來復吉有攸往夙吉傳曰西南坤方坤之體廣大平易當天下之難方解人始離艱苦不可復以煩苛嚴急治之當濟以寬大簡易乃其宜也解音蟹下同易並音異難去聲下同復扶又反下不復復盛復生並同於坎下震上為解以卦變言其卦自升來三往居四入坤體故以坤方言文王八卦方位坤居西南維故西南為坤平易之方也也此一節言解之所以利西南既解其難而安平無事矣是元所往也則當修復治道正紀綱明法度進復先代明王之治是來復也謂反正理也自古聖王救難定亂其始未暇遽為也既安定則為可久可繼之治自漢以下亂既除則不復有為姑隨時維持而已故不能成善治蓋不知來復之義也此一節釋無所往來復吉之義有攸往夙吉謂尚有當解之事則早為之乃吉也當解而未盡者不早去則將復盛事之復生者不早為則將漸大故夙則吉也去上聲則如張柬之等不殺武三思及勢盛乃欲除之無及矣此一節釋有攸往夙吉之意夫有物必有則父止於慈子止於孝君止於仁臣止於敬萬物庶事莫不各有其所得其所則安失其所則悖聖人所以能使天下順治非能為物作則也惟止之各於其所而已艮彖曰艮其止止其所也朱子曰程子於此却自解得分明又曰萬物庶事各有其所著自家私意不得兑説而能貞是以上順天理下應人心説道之至正至善者也説並音悅下同而兑彖曰説以利貞是以應乎天順乎人説就柔外而言謂三與上也貞就剛中而言謂二與五也若夫違道以干百姓之譽者苟説之道違道不順天干譽非應人苟取一時之説耳非君子之正道君子之道其説於民如天地之施感之於心而説服無斁之於易傳作於其斁音亦惠干求也違道干譽如所謂私恩小是也斁厭也此言説之所以順天應人者也朱子曰悅若不剛中便是違道干譽愚按後世君相于道之所在可以稍有利於人者偏不去講求甚有知之而不肯為而私恩小惠沾沾焉欲以干百姓之譽究之百姓絶不蒙其利益而已亦不足以致譽此皆所謂苟悅之道君子不取也天下之事不進則退無一定之理濟之終不進而止矣無常止也衰亂至矣蓋其道已窮極也聖人至此奈何曰惟聖人為能通其變於未窮不使至於極也堯舜是也故有終而無亂既濟彖曰終止則亂其道窮也無常止蓋雖止而有常心猶可蒙業而安如漢之文帝宋之仁宗是也然既有止心則怠忽乘之往往不能以有常此衰亂所以至也繫辭下傳云神農氏沒黃帝堯舜氏作通其變使民不倦神而化之使民宜之易窮則變變則通通則久獨言堯舜者舉其極盛者而言也觀孟子許行章所言其大略可概見也張希獻曰卦曰終亂而彖曰終止則亂非終之能亂於其終而有止心此亂之所由生也俞玉吾曰人之常情處無事則止心生止則怠怠則有患而不為之防此所以亂也當知終止則亂不止則不亂也為民立君所以養之也養民之道在愛其力民力足則生養遂生養遂則教化行而風俗美故為政以民力為重也春秋凡用民力必書其所興作不時害義固為罪也雖時且義必書見勞民為重事也後之人君知此義則知慎重於用民力矣為民之為養之養民之養並去聲餘如字慎重於民下葉本無用字用見春秋隱公七年夏城中邱傳此一節釋春秋所以民力必書之意廬陵彭氏曰三代之君不敢鄙夷其民以從已之欲每有興作謀及庶民如盤庚遷殷登進厥民而告之三代世守此道觀十月之交詩曰胡為我作不即我謀蓋可見矣然有用民力之大而不書者為教之意深矣僖公修泮宫復閟宫非不用民力也然而不書二者復古興廢之大事為國之先務如是而用民力乃所當用也人君知此義知為政之先後輕重矣泮禮記作頖經説下同之此又將春秋之用民力而不書者言之正以見民力不可輕用也泮半也諸侯鄉射之宫東西南有水而北無形如半璧故曰泮宫蓋天子璧雍水旋邱如璧以節觀者諸侯則半於天子之制也閟深閉也宫廟也事並見詩魯頌按小序泮水頌僖公能修泮宫也閟宫頌僖公能復周公之宇也蓋序以泮水篇有既作泮宫句閟宮篇有復周公之宇句故云然朱子辨之則謂泮水燕飲落成之詩不為頌其能修也閟宫言莊公之子又言新廟奕奕則為僖公修廟之詩明矣但詩所謂復周公之宇者祝其能復周公之土宇非謂其能復周公之屋宇也愚謂朱子説固然然序於閟宫篇但言頌僖公能復周公之宇未嘗言屋宇正義釋之亦以謂魯初土地特大異於他國其後君德漸衰鄰國侵削境界狹小至是僖公有德更能復之故作詩頌之亦未嘗有復屋宇之説也要其於二者能舉而修之則是鑿然無疑者朱子與舊説一也治身齊家以至平天下者治之道也建立治綱分正百職順天時以制事至於創制立度盡天下之事者治之法也聖人治天下之道惟此二端而已冶之治綱之治並去聲餘如字後放此見書解命羲和章朱子曰聖人治天下之道固不外此二端然必人主之心術公平正大無偏黨反側之私而後治之法可得而行必親賢逺佞講明義理之歸閉塞私邪之路而後治之道可得而盡又不可以不知也愚按經説治道就克明俊德至於變時雍而言治法就乃命義和至庶績咸熙而言或疑治道固盡於此矣治法似非治厯明時所可盡者不知察隂陽驗氣候以布順時之政使人得遂其生養之道事之最大最先孰過於此故堯典首舉而詳載之然則程子于此所以提挈綱維示人為治之要亦深切矣明道先生曰先王之世以道治天下後世只是以法把持天下遺書下同先王以道治天下道盡而法已具法固不外於道也後世以法把持天下法立而道已多不合矣觀後世之天下而曰把持蓋亦不足以言治也不鶴山魏氏曰荆公云周禮小宰言以法掌祭祀則亦與道揆故也荆公嘗以道揆自居而元不曉道與法不可離法不本于道不足為法道不施於法亦不見其為道荆公以法不與道揆故其新法皆商君之法而非帝王之道所見一偏為害不小永嘉二陳作唐制皮紀綱論云得古人為天下法不若得之於其法之外彼以道德為法外事皆因荆公判道法為二後學遂為此説如周禮三百六十官甸稍縣鄙井地溝洫比閭族黨教忠教孝道正寓于法中後世以刑法為法故法為申商為政須要有紀綱文章大曰綱小曰紀白虎通曰綱謂綱之大繩紀謂綱中絲縷之目文章其中之品節條理也先有司以下五者紀綱文章之條目也先有司説見論語初愚按日知録謂明錢糧掌於縣丞案牘掌於主簿稅課掌於大使為令者總其要而無所與焉又自言其家有嘉靖時屋契猶用稅課司印則其事一歸之於縣固在嘉靖後也然則謂佐二官不得擅受民詞非通論矣但明制佐二限於資格清流往往恥為之其人亦以卑職冗員自棄作姦犯科不自愛重所以至後來遂舉其事一歸之於縣縣於是政令繁瑣而不暇及教化養民之事吏治之所以愈衰也今欲凡事必先之有司使得各舉其職須要厚其俸不限以資格使之退可自給進知所奮然後嚴為之考成以計功過亦所以使之各盡其材能也鄉官詳見下卷鄉黨條下魏莊渠曰鄉遂羣吏漢散為亭長三老嗇夫尚以教導為務至唐為里正坊正村正宋為保長耆長則僕僕執役於官惟徴催錢糧勾攝公事耳古意蕩然矣王氏曰漢之鄉老嗇夫亦皆百石魏之州縣鄉官悉由吏部唐之里正村正皆以勳品宋以後則胥徒任之賤而多責人不樂為禮庫曰古者許多長民之官往往多自民間推擇且如五家為比有比長即是五家中自推一人來做朝廷因爵以下士命之為比長五比為閭有閭胥亦是二十五家中自推一人來做朝廷因爵以中士命之為閭胥此豈非進賢使能耶要之朝廷才進賢使能天下便知賢者之可尊能者之可貴而自勉于善矣讀法按周禮地官州長正月之吉各屬其民而讀法以考其德行道藝而勸之以糾其過惡而戒之嵗時祭祀州社則屬其民讀法亦如之正嵗則讀教法如初黨正四時孟月吉日則屬民而讀邦法以糾戒之春秋祭禜亦如之正嵗屬民讀法而書其德行道藝以嵗時涖校比族師月吉屬民讀邦法書其孝弟睦姻有學者春秋祭酺亦如之閭胥於凡祭祀役政喪紀聚衆庶既比則讀法書其敬敏任恤者賈公彥曰讀法者謂對衆讀一年政令及十二教之法使知之也鄉大夫管五州去民逺不讀法州長管五黨去民漸親故嵗四讀法黨正去民彌親則嵗七讀法族師則十四讀法閭胥則不拘時節但聚衆庶既比即讀法矣王氏曰大司徒之職因此五物者民之常而施十有二教焉又曰以鄉三物教萬民而賓興之小司徒正嵗則帥其屬而觀教象之法徇以木鐸曰不用法者國有常刑則所謂讀邦法者即此十二教與三物之謂也朱子謂周禮中多有説事之綱目者如屬民讀法其法不可知蓋亦偶未之思耳愚按讀法使民知之者無非欲感發人之善心懲創人之逸志而已鄉三物十二教之類所以感發其善心也鄉八刑徇木鐸之類所以懲創其逸志也讀法如今州縣官講鄉約之類但古以鄉官主之與民既親而其責専又冇糾考勸戒之法而選舉之典即出其中故官民皆不敢視為具文今州縣地廣事繁以此為虛行故事而已是則鄉官不設則讀法亦不能獨行也王昭禹曰鄉官之讀法與夫書考民之德行道藝孝友睦姻每於屬民者非特衆而已亦所以公是非而明好惡每於嵗之正月吉日者非徒謹其始而已亦使之日有所改月有所化朱子曰周禮嵗時屬民讀法其當時所讀者不知云何今若將孝弟忠信等事撰一文字或半嵗或三月一次或于城市或于鄉村聚民而讀之就為解説令其通曉及所在立粉壁書寫亦須有益平價王氏曰周禮賈師禁貴儥者使有恆價亦惟三代上可行之蓋三代聖王養民者周而取民者略商賈五口而當農夫一人亦受田於國荒則去幾札喪則無征又市政森嚴所以使之安其業而樂樂利利者尤備是故當其貪漁無厭乘天患而髙價厲民則賈師為之展成而奠價後世皆民自為養而關津之使因公擅斂以掊克之無所不至倘賈師之法行則惟有裹足不至而小民坐稿而已矣趙清獻公在會稽不減粟價四方商賈輻輳嵗凶而民不飢後世有以禁民貴糶為救荒竒䇿者此芻狗周官而不知潤澤者也愚按賈師就天患之時言之故王氏之論如此程子則就其常者言之也蓋末世人情多欺商賈尤甚故必立司市之官以平其價使不得欺誑愚民也按地官司市凡市入則胥執鞭度守門市之羣吏平肆展成奠價其詐偽飾行儥慝者則胥師察而誅罰之使不得欺誑買者其或有用後始得其情亦或貨多不及詳檢則質人治其質劑國中一旬郊二句野三旬都三月邦國期期內治期外不治蓋既不得使愚民見欺又為之期限使不得好訟所謂仁之至義之盡也謹權量説見論語也權銖兩斤鈞石也量籥合升斗斛度分寸尺丈引也不言度者引文不具也謹權量如夏官合方氏同其數器一其度量是也顧亭林曰虞書同律度量衡則通於天下五嵗巡狩而一正之者也月令日夜分同度量鈞衡石角斗甬正權概則行于國中每嵗而再正之者也陳氏曰舜以五嵗同度量周十有二嵗同度量此步尺所以一而得其正也後世之尺或以黍或以忽或以指然黍有大小絲有巨細指有長短此步尺所以異也又曰周公頒度量出以內宰掌以司市以合方氏一之以質人行之同之其同民心出治道如此無愚按馬貴與氏謂律度量衡四者惟律差之絲忽則以諧聲以定樂故不可以不同度量衡則隨世立法隨地從宜取其適於用而初無害于事固不必盡同也愚以謂馬説固然然愚嘗往來北方見其丈尺斗斛有大小二等而其物之價亦適如其大小之數以為之各别則不同固無害其為同也獨權衡之大小四方不同南方尤甚甚有以小者出而以大者入其弊不可窮詰此關乎人心風俗之大而非止權衡之不謹而已有王者起當亟思所以正之也但按宋志稱宋既平定四方其一應權度斗斛之制詔有司精考古式作為定制以頒天下其有不中式者悉去之乾德中又禁民造者由是尺度量衡之制盡皆復古然則權量之謹宋初固行之矣但未能如先王設官専責嵗必考較故其法不久遂廢為可惜也皆不可闕也以上言治之法法必待人而行故下兩節詳言所以得人之道愚按此與下卷所論十事皆明道就經書中舉其最切要者以為天下萬世法亦猶孔子論為邦而舉四代禮樂也但此摘其要故載之治道彼及其詳故列於治法也惟鄉官一項下十事中亦有之其餘四者則有以補十事之所未及彼以法之大者言此以法之小者言也人各親其親然後能不獨親其親二語並出記禮運篇引之以起下文當各舉所知之意仲弓曰焉知賢才而舉之子曰舉爾所知爾所不知人其舍諸便見仲弓與聖人用心之大小推此義則一心可以喪邦一心可以興邦只在公私之間耳焉於虔反喪去聲意朱子曰程子非謂仲弓有固權市寵之而至於喪邦但一蔽於小則其害有時而至此也故極言之以警學者用心之私也又曰人各親其親以下舊本或别為一條則全章之旨首尾衡決而皆失之矣程子此章之説廣大精微無所不備學者所宜詳玩也此條明治之法以上並明道語伊川先生曰治道亦有從本而言亦有從事而言從本而言惟是格君心之非正心以正朝廷正朝廷以正百官若從事而言不救則已若須救之必須變大變則大益小變則小益格正也真西山曰人君能正其心湛然清明物莫能惑則發號施令罔有不臧而朝廷正矣朝廷正則賢不肖有别君子小人不相易位而百官正矣自此以下特舉而措之耳薛敬軒曰法雖善久必有弊要在隨時以審其勢之輕重以救之勿使至于偏甚則善也此條明治之道唐有天下雖號治平然亦有夷狄之風三綱不正無君臣父子夫婦其原始於太宗也故其後世子弟皆不可使君不君臣不臣故藩鎮不賓權臣跋扈陵夷有五代之亂雖號上遺書有如貞觀開元間六字今當增入其原始于太宗者如太宗以晉陽宫人侍髙祖便無君臣父子夫婦之義後世子弟不可使者如玄宗使肅宗至靈武則自立稱帝使永王璘使江南則反之類是也藩鎮謂外權臣謂內跋扈強梁貌陵夷言邱陵隤墮漸與地平風俗頽敗亦類于此也漢之治過於唐漢大綱正唐萬目舉本朝大綱正萬目亦未盡舉並伊川語租大綱如民風士習吏治之類萬目如口分世業庸調府兵省府之類朱子曰北周宇文泰及蘇綽有意復古制度頗詳盡唐因之故萬目舉吕微仲曰自古人主事母后朝見有時如漢武帝五日一朝長樂宫祖宗以來事母后皆朝夕見此事親之法也前代太長公主用臣妾禮仁宗以姪事姑之禮見獻穆太長公主此事長之法也前代宫闈多不肅宫人或與廷臣相見本朝宫禁嚴密內外整肅此治內之法也前代外戚多預政事本期母后之族皆不與事此待外戚之法也前代宫室多尚華侈本朝宫殿止用赤白此尚儉之法也前代人君雖在宫禁出輿入輦祖宗皆步自內庭出御後殿此勤身之法也前代人君在禁中冠服苟簡祖宗以來燕居必以禮此尚禮之法也前代多深於用刑本朝臣下有罪止于罷黜此寬仁之法也王伯厚曰真文忠公論本朝治體曰立國不以力勝仁理財不以利傷義御民不以權易信用人不以才勝德恩結乎人心富藏於天下君民相孚而猜忌不作材智不足而忠信有餘愚按觀此二條所言於程子所謂大綱正者可以略見為此就漢唐宋以明治道治法之意張揚園曰夫子論邦斟酌四代而損益之學者遭時遇主斟酌於漢唐宋明之制擇其善者而從之庶乎小康矣教人者養其善心而惡自消治民者導之敬讓而爭自息外書下同謂教謂教化也治法制禁令也愚按即前豶豖之牙一條之意之此見治天下不徒法度之是尚以起下條意明道先生曰必有關雎麟趾之意然後可行周官之法度可下一本有以字下朱子曰須是自閨門衽席之微積纍至薰蒸洋溢天無一民一物不被其化然後可以行周官之法度不然則為王莽矣後世論治皆欠此意伊川先生曰君仁莫不仁君義莫不義天下之治亂繫乎人君仁不仁耳離是而非則生於其心必害於其政豈待乎作之於外哉是謂仁非謂不仁也昔者孟子三見齊王而不言事門人疑之孟子曰我先攻其邪心心既正然後天下之事可從而理也夫政事之失用人之非知者能更之直者能諌之然非心存焉則一事之失救而正之後之失者將不勝救矣格其非心使無不正非大人其孰能之夫音扶知音智更勝並平聲孟子三見齊王説見苟子大略篇齊王本作宣王一事之失兼政事用人而言此承上治道而言以歸本于君心也橫渠先生曰道千乘之國不及禮樂刑政而云節用而愛人使民以時言能如是則法行不能如是則法不徒行禮樂刑政亦制數而已矣不徒之不葉本作亦誤正蒙下同説見論語節用愛人使民以時者即孟子所謂仁心也禮樂刑政即孟子所謂仁政也張子言此一以見夫子之言尚未及其法使後之人知所以求之也一以見治國之道不當徒恃其法使後之人知所以先之也亦即孟子徒善不足以為政徒法不能以自行之意法立而能守則德可久業可大鄭聲佞人能使為邦者喪其所守故放逺之喪逺並去聲所下宋本有以字與原書合但原書所上無其字繫説見論語可久則賢人之德可大則賢人之業見易辭上傳上為行法者言之欲使後之人知所以立其本也此為守法者言之欲使後之人知有以去其害也橫渠先生答范巽之書曰朝廷以道學政術為二事此正自古之可憂者巽之謂孔孟可作將推其所得而施諸天下邪將以其所不為而強施之於天下歟邪音耶強區兩反所得謂道學也施之天下謂政術也所不為謂有出於道學之外者也大都君相以父母天下為王道不能推父母之心於百姓謂之王道可乎所謂父母之心非徒見於言必須視四海之民如已之子設使四海之內皆為已之子則講治之術必不為秦漢之少恩必不為五霸之假名相去聲見音現必此所以講求治術者以道學為本而非徒如後世法制禁令之為也巽之為朝廷言人不足與適政不足與間能使吾君愛天下之人如赤子則治德必日新人之進者必良士帝王之道不必改途而成學與政不殊心而得矣為去聲適音謫間音諌節文集其人不足與適二句見孟子上二泛論理此節乃為巽之言所以事君之道以深明道學政術非二事之意治德必日新則不憂為政之失矣所進皆良士則無慮用人之非矣道道學體也政術用也就其所得于身心者而言則曰學而以之施于天下即政術也無二事也自後世分為兩途而道學無用則非所以為道學政術無體則又何以為政術哉故特引張子此言以見學與政非有二事以結全篇之意近思録集注卷八欽定四庫全書近思録集注卷八婺源江永撰朱子曰此卷治國平天下之道濓溪先生曰治天下有本身之謂也治天下有則家之謂也朱子曰則謂物之可視以為法者猶俗言則例則樣也本必端端本誠心而已矣則必善善則和親而已矣朱子曰心不誠則身不可正親不和則家不可齊家難而天下易家親而天下疏也朱子曰聧次家人易卦之序二女以其難亦未有能其易者家人離必起於婦人故睽次家人以二女同居而志不同行也朱子曰聧次家人易卦之序二女以下聧彖傳文二女謂睽卦兑下離上兑少女離中女也隂柔之性外和悅而內猜嫌故同居而異志堯所以釐降二女于媯汭舜可禪乎吾兹試矣朱子曰釐理也降下也媯水名汭水北舜所居也堯理治下嫁二女於舜將以試舜而授之天下也是治天下觀於家治家觀身而已矣身端心誠之謂也誠心復其不善之動而已矣朱子曰不善之動息於外則善心之生於內者無不實矣不善之動妄也妄復則無妄矣無妄則誠矣程子曰無妄之謂誠故無妄次復而曰先王以茂對時育萬物深哉朱子曰無妄次復亦易之序先王以下引無妄卦大象以明對時育物唯至誠者能之而贊其旨之深也通書明道先生嘗言於神宗曰得天理之正極人倫之至者堯舜之道也用其私心依仁義之偏者霸者之事也王道如砥本乎人情出乎禮義若履大路而行無復回曲霸者﨑嶇反側於曲徑之中而卒不可與入堯舜之道故誠心而王則王矣假之而霸則霸矣二者其道不同在審其初而已易所謂差者毫釐繆以千里者其初不可不審也惟陛下稽先聖之言察人事之理知堯舜之道備於己及身而誠之推之以及四海則萬世幸甚朱子曰宣帝雜王霸元不識王霸只是以寬慈喚做王嚴酷喚做霸自古論王霸至明道先生此論無餘藴矣文集下同伊川先生曰當世之務所尤先者有三一曰立志二曰貴任三曰求賢今雖納嘉謀陳善算非君志先立其能聽而用之乎君欲用之非責任宰輔其孰承而行之乎君相協心非賢者任職其能施於天下乎此三者本也制於事者用也三者之中復以立志為本所謂立志者至誠一心以道自任以聖人之訓為可必信先王之治為可必行不狙滯於近規不遷惑於衆口必期致天下如三代之世也問程先生進説只以聖人之説為可必信何也朱子曰也不得不恁地説如今説與學者也只得教他依聖人言語恁地做去待他就裏靣做工夫有見處便自知得聖人底是確然恁地葉氏曰立志篤實而逺大則不膠於淺近不惑於流俗比之九五曰顯比王用三驅失前禽傳曰人君比天下之道當顯明其比道而已如誠意以待物恕己以及人發政施仁使天下蒙其惠澤是人君親比天下之道也如是天下孰不親比於上葉氏曰積誠實之意以待物推愛己之心以及人發政施仁公平正大羣心自然豫附若乃暴其小仁違道干譽欲以求下之比其道亦已狹矣其能得天下之比乎王者顯明其比道天下自然來比來者撫之固不煦煦然求比於物若田之三驅禽之去者從而不追來者則取之也此王道之大所以其民皞皞而莫知為之者也朱子曰田獵之禮置旃以為門刈草以為長圍田獵者自門驅而入禽獸向我而出者皆免惟被驅而入者皆獲故以前禽比去者不追者譬來則取之未永按樹旌以表門御者驅而過之轂擊則不得入此田之前習過君表之御法也逐獸别設驅逆之車非以驅車入門為驅獸記録有小差讀者得其大意可也非惟人君比天下之道如此大率人之相比莫不然以臣於君言之竭其忠誠致其才力乃顯其比君之道也用之與否在君而已不可阿諛逢迎求其比己也在朋友亦然修身誠意以待之親己與否在人而已不可巧言令色曲從苟合以求人之比己也於鄉黨親戚於衆人莫不皆然三驅失前禽之義也易傳下同古之時公卿大夫而下位各稱其德終身居之得其分也位未稱德則君舉而進之士修其學學至而君求之皆非有預於己也農工商賈勤其事而所享有限故皆有定志而天下之心可一後世自庶士至於公卿日志於尊榮農工商賈日志於富侈億兆之心交騖於利天下紛然如之何其可一也欲其不亂難矣履象傳上葉氏曰履象曰君子以辨上下定民志之人不度其德而制爵位則為仕者日志於尊榮不明其分而立品節則為民者日志於富侈貴賤競趨而心欲無窮此亂之所由生也泰之九二曰包荒用馮河傳曰人情安肆則政舒緩而法度廢弛庶事無節治之之道必有包含荒穢之量則其施為寬裕詳密弊革事理而人安之若無含𢎞之度有忿疾之心則無深逺之慮有暴擾之患深弊未去而近患已生矣故在包荒也自古泰治之世必漸至於衰替蓋由狃習安逸因循而然自非剛斷之君英烈之輔不能挺特奮發以革其弊也故曰用馮河或疑上云包荒則是包含寬容此云用馮河則是奮發改革似相反也不知以含容之量施剛果之用乃聖賢之為也葉氏曰有含容之量則剛果不至於疏迫有剛果之用則含容不至於委靡二者相資而治泰之道可成也永按神宗用王安石更新法而宋室以否有馮河之果而無包含之量故也觀盥而不薦有孚顒若傳曰君子居上為天下之表儀必極其莊敬如始盥之初勿使誠心少散如既薦之後則天下莫不盡其孚誠顒然瞻仰之矣朱子曰祭祀無不薦者此是假設來説薦是用事了盥是未用事之初言常持得這誠敬如盥之意常在若薦則是用出用出則才畢便過了凡天下至於一國一家至於萬事所以不和合者皆由有間也無間則合矣以至天地之生萬物之成皆合而後能遂凡未合者皆為間也若君臣父子親戚朋友之間有離二怨隙者蓋讒邪間於其間也去其間隔而合之則無不和且洽矣噬嗑者治天下之大用也噬嗑傳也朱子曰噬齧也嗑合物有間者齧而合之也人葉氏曰天地有間則氣不通而生化莫遂倫有間則情不通而恩義日睽大畜之六五曰豶豕之牙吉傳曰物有總攝事有機會聖人操得其要則視億兆之心猶一心道之斯行止之則戢故不勞而治其用若豶豕之牙也豕剛躁之物若強制其牙則用力勞而不能止若豶去其勢則牙雖存而剛躁自止君子法豶豕之義知天下之惡不可以力制也則察其機持其要塞絶其本原故不假刑法嚴峻則惡自止也且如止盜民有欲心見利則動苟不知教而迫於飢寒雖刑殺日施其能勝億兆利欲之心乎聖人則知所以止之之道不尚威刑而修政教使之有農桑之業知亷恥之道雖賞之不竊也葉氏曰制強暴者察其機要治其本原而人自服非若役世權謀之術執其要會以御人之謂也解利西南無所往其來復吉有攸往夙吉傳曰西南坤方坤之體廣大平易當天下之難方解人始離艱苦不可復以煩苛嚴急治之當濟以寬大簡易乃其宜也既解其難而安平無事矣是無所往也則當修復治道正紀綱明法度進復先代明王之治是來復也謂反正理也自古聖王救難定亂其始未暇遽為也既安定則為可久可繼之治是漢以下亂既除則不復有為姑隨時維持而已故不能成善治蓋不知來復之義也朱子曰禍亂既平正合修明治道求復三代之規模却只便休了兩漢以來人主還有理會正心誠意否須得人主如陋巷之士治心修身講明義理以此應天下之務用天下之才方見次第有攸往夙吉謂尚有當解之事則早為之乃吉也當解而未盡者不早去則將復盛事之復生者不早為則將漸大故夙則吉也葉氏曰張柬之等不殺武三思及其勢復盛乃欲除之則亦晚矣夫有物必有則父止於慈子止於孝君止於仁臣止於敬萬物庶事莫不各有其所得其所則安失其所則悖聖人所以能使天下順治非能為物作則也惟止之各於其所而已艮彖傳最朱子曰伊川於艮其止止其所也解得分明艮其背恐當只如此説兑説而能貞是以上順天理下應人心説道之至正至善者也若夫違道以干百姓之譽者苟説之道違道不順天干譽非應人苟取一時之説耳非君子之正道君子之道其説於民如天地之施感之於心而説服無斁朱子曰説若不剛中便是違道干譽天下之事不進則退無一定之理濟之終不進而止矣無常止也衰亂至矣蓋其通已窮極也聖人至此奈何曰唯聖人為能通其變於未窮不使至於極也堯舜是也故有終而無亂既濟傳葉氏曰常人苟安於既濟乃衰亂之所由生聖人通變於未窮故有終而無亂堯舜通其變使民不倦是也為民立君所以養之也養民之道在愛其力民力足則生養遂生養遂則教化行而風俗美故為政以民力為重也春秋凡用民力必書其所興作不時害義固為罪也雖時且義必書見勞民為重事也後之人君知此義則知慎重於用民力矣然有用民力之大而不書者為教之意深矣僖公修泮宫復閟宫非不用民力也然而不書二者復古興廢之大事為國之先務如是而用民力乃所當用也人君知此義知為政之先後輕重矣葉氏曰書不時者如隱七年夏城中丘之類書時者如桓十六年冬城向之類書不義者如莊二十三年丹桓宫楹之類書義者如莊元年築王姬之館之類泮宫諸侯之學閟宫毛氏以為先妣薑嫄之廟冸宫所以教育賢材閟宫所以尊事祖先二者皆為國之先務經説下同治身齊家以至平天下者治之道也建立治綱分正百職順天時以制事至於創制立度盡天下之事者治之法也聖人治天下之道唯此二端而已明道先生曰先王之世以道治天下後世只是以法把持天下葉氏曰先王治天下以仁義為主法固在其中後世惟恃法令以控制天下而法亦非先王之法矣遺書下同為政須要有紀綱文章先有司鄉官讀法平價謹權量皆不可闕也人各親其親然後能不獨親其親仲弓曰焉知賢才而舉之子曰舉爾所知爾所不知人其舍諸便見仲弓與聖人用心之大小推此義則一心可以喪邦一言可以興邦只在公私之間爾朱子曰所謂文章者便是文飾那謹權審量讀法平價之類耳問何以言人各親其親然後能不獨親其親曰此所以明夫人必各舉其所知然後可以得其所不知也於此可見聖賢用心之大小仲弓只緣見識未極其開闊故如此人之心量本自大緣私故小蔽錮之極則可以喪邦矣程子之意固非謂仲弓有固權市恩之意而至於喪邦但一蔽於小則其害有時而至此亦不為難矣故極言之以警學者用心之私也流仲弓之問未見其為私意然其心淺狹欠闕處多其弊便有喪邦之理凡事微有過差才有安頓不著處便是惡則問所謂公私者豈非仲弓必欲人才皆由已舉聖人使人各得而舉之否曰仲弓只是見不到才見不到便陷於私學者見程子説興邦喪邦説得甚驗多疑於此然程子亦曰惟其義耳程子此章之説廣大精微無所不備學者所宜詳玩治道亦有從本而言亦有從事而言從本而言惟是格君心之非正心以正朝廷正朝廷以正百官若從事而言不救則已若須救之必須變大變則大益小變則小益永按此謂事有積弊不可不變革者須變乃有益倘輕於故作或變之不得其道則不惟無益而已有煩擾之害矣唐有天下雖號治平然亦有夷狄之風三綱不正無君臣父子夫婦其源始於太宗也故其後世子弟皆不可使君不君臣不臣故藩鎮不賔權臣跋扈陵夷有五代之亂葉氏曰太宗以智力劫持取天下其於君臣父子之義有虧閨門之間又有慙德三綱皆已不正是以後世子孫氣習相傳綱常陵蔑而不可止玄宗使肅宗至靈武則自立使永王璘使江南則反君臣之道不正逐使瀋鎮割據於外閹竪擅專於內馴致五季之極亂也漢之治過於唐漢大綱正唐萬目舉本朝大綱正萬目亦未盡舉葉氏曰大綱謂綱常唐之治日若世業若府兵若祖庸調若省府其區畫法制略倣先王之遺意故亦足以維持天下教人者養其善心而惡自消治民者導之敬讓而爭自息外書下同明道先生曰必有關雎麟趾之意然後可行周官之法度問必有關雎麟趾之意只是要得誠意素孚否朱子曰須是自閨門衽席之微積纍到薰蒸洋溢天下無一民一物不被其化然後可以行周官之法度不然則為王莽矣揚雄不曽説到此後世論治皆欠此一意孟子云徒善不足以為政徒法不能以自行程子嘗言為政須要有綱紀文章謹權審量讀法平價皆不可闕而又曰必有關雎麟趾之意然後可以行周官之法度正謂此也君仁莫不仁君義莫不義天下之治亂繫乎人君仁不仁耳離是而非而生於其心必害於其政豈待乎作之於外哉昔者孟子三見齊王而不言事門人疑之孟子曰我先攻其邪心心既正然後天下之事可從而理也夫政事之失用人之非知者能更之直者能諫之然非心存焉則一事之失救而正之後之失者將不勝正矣格其非心使無不正非大人其孰能之朱子曰大人者大德之人正己而物正者也橫渠先生曰道千乘之國不及禮樂刑政而云節用而愛人使民以時言能如是則法行不能如是則法不徒行禮樂刑政亦制數而已楊氏曰此特論其所存而已未及為政也苟無是心則雖有政不行焉正蒙法立而能守則德可久業可大鄭聲佞人能使為邦者喪其所守故放逺之葉氏曰夫子既告顔子以四代之禮樂而必欲放鄭聲逺佞人蓋二者蕩心之原敗法亂紀之要也橫渠先生答范巽之書曰朝廷以道學政術為二事此正自古之可憂者巽之謂孔孟可作將推其所得而施諸天下邪將以其所不為而強施之於天下歟永按所得即所學之道所不為謂非其平日所學者也葉氏謂不以政術非吾所事非是大都君相以父母天下為王道不能推父母之心於百姓謂之王道可乎所謂父母之心非徒見於言必須視四海之民如己之子設使四海之內皆為己之子則講治之術必不為秦漢之少恩必不為五伯之假名巽之為朝廷言人不足與適政不足與間能使吾君愛天下之人如赤子則治德必日新人之進者必良士帝王之道不必改途而成學與政不殊心而得矣葉氏曰帝王之道即今日之政事非有兩途今日之政術即平日之學問非有二心也文集近思録集注卷八
