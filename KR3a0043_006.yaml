body:
  text: 近思録集註卷六歸安茅星來撰齊家之道此以下即大學新民之事也而此卷則論齊家之道於父子兄弟夫婦以至睦族䘏孤之道無不具焉凡二十二條伊川先生曰弟子之職力有餘則學文不修其職而學非為己之學也為去聲弟經説者説見論語此為後世之教子以文言之文凡詩書禮樂射御書數皆是亦非後世之所謂文也然且必待力有餘而後學焉則其教之先後緩急蓋可見矣愚按弟子之職既修而不學文則為子為弟之道必有所不明而所以修弟子之職者亦苟焉而已又不可以不知也孟子曰事親若曾子可也未嘗以曽子之孝為有餘也葢子之身所能為者皆所當為也易傳下同子師九二傳説見孟同氏曰曾子嘗芸𤓰作羮家故貧窶乃每食必有酒肉又其父子性情各不相似奉事甚難且觀曽晳言志樂與人同必呼羣引類以為常兼其所與未必一一為曾子之樂與而能先意承順終身不變如此此可以為後世法矣也輔氏曰孟子只平説去至程子方㸔得可有深意以此知讀書不可不熟讀玩味幹母之蠱不可貞子之於母當以柔巽輔導之使得於義不順而致敗蠱則子之罪也蠱九二傳幹母之蠱不可貞爻詞也下則程子所以釋之者如此九陽剛而二居下上與六五為應是以陽剛之才在下而幹在上隂柔之事故取子幹母蠱為義二巽體而處柔於順之義為多葉氏曰人子事親當以承順為主而婦人柔暗尤難以遽曉苟為矯拂而反害其所治之事則子之過也從容將順豈無道乎若伸已剛陽之道遽然矯拂則傷恩所害大矣亦安能入乎在乎屈已下意巽順將承使之身正事治而已剛陽之臣事柔弱之之君義亦相近將承從易傳呂本作相承也剛陽謂九也伸已剛陽之道則是貞貞則矯拂而傷恩矣以釋不可貞之義屈已下意謂下卦也巽順將承謂巽體也末又從事親推廣言之蠱之九三以陽處剛而不中剛之過也故小有悔然在巽體不為無順順事親之本也又居得正故無大咎然有小悔已非善事親也此上三條論事親之道正倫理篤恩義家人之道也家人卦傳乖或問今欲正倫理則有傷恩義欲篤恩義又有倫理如何朱子曰湏是於正倫理處篤恩義篤恩義而不失倫理方可新安陳氏曰臯陶謨惇叙九族惇者即此所謂篤恩也叙者即此所謂正倫理也惇叙二字盡齊家之道人之處家在骨肉父子之間大率以情勝禮以恩奪義惟剛立之人則能不以私愛失其正理故家人卦大要以剛為善家人六二傳此指初三上三爻而言也朱子曰父母愛其子正也愛之無窮而必欲其如何則以私愛而失其正理矣此天理人欲之關正宜審慎王巽卿曰彖傳謂家人有嚴君焉父母之謂也葢父道固主乎嚴母道尤不可以不嚴猶國有尊嚴之君長也無尊嚴則孝敬衰無君長則法度廢故家人一卦大意要以剛嚴為尚引此以足上條之家人上九爻辭謂治家當有威嚴而夫子又復戒云當先嚴其身也威嚴不先行於己則怨而不服身下宋本無也字言上九象傳此承上條而治家固貴剛立而又必以正已為先也趙氏曰爻于初言閑三言嗃嗃上言威聖人慮後世以為威嚴有餘而親睦不足故特釋之以反身見非嚴厲以為威也朱子發曰威非外求反之於身而已後世不知此義或身不正而尚威嚴則父子相夷愈不服矣安得吉本此上三條統論治家之道王伯厚曰謹獨者齊家之故家人之吉在于反身歸妹九二守其幽貞未失夫婦常正之道世人以媟狎為常故以貞靜為變常不知乃常久之道也媟音屑象曰利幽人之貞未變常也此為婦人而遇夫之不良者言之九二陽剛而得中女之賢正者也上有正應而反隂柔之質則是女賢而配不良者也五雖不正而動於悦二能自守其幽静貞正乃所利也李氏曰自古人君修身謹行而無流連荒亡之禍非獨有忠臣義士亦由有賢后妃夙夜警戒以成其德周宣之姜后齊桓之衛姬楚莊之樊妃是也不獨人君為然吳許升為博徒妻呂榮躬勤家業以養其姑數勸升修學升感激自勵乃尋師逺學遂成名賢婦之助如此世人多慎於擇壻而忽於擇婦其實壻易見婦難知所繫甚重豈可忽哉易音異條遺書下同上言夫雖不良而女能自守其幽貞為不失其常道故復録此以見當慎擇於始也壻之行見乎外故易見婦則無事可見故難知置愚按今之擇婚以富貴貧賤為主而男女賢否徃徃之不論甚有明知其不賢而以其家之富貴或聘財資装之豐厚勉强俯就是自誤其子與女也且富貴無常而男女之賢否已一定而不可移易矣可不謹哉袁氏曰擇壻擇婦固不可忽然又湏自量自家子女如何若不相當則子女終身抱恨至有不和而生他事者又不可以不審也人無父母生日當倍悲痛更安忍置酒張樂以為樂若具慶者可矣為樂之樂音洛慶父母俱存曰具問行狀云盡性至命必本於孝弟不識孝弟何以能盡性至命也行去聲也行狀者伊川先生所以狀其兄明道之行者詳見末篇盡性至命説見説卦傳伊川曰後人便將性命别作一般事説了性命孝弟只是一統底事就孝弟中便可盡性至命般同班葉本般下無事字朱子曰若是做時湏是從孝弟上推將去方始知得性命如孝弟為仁之本非謂孝弟便是仁但為仁自孝弟始若是聖人如舜之孝王季之友便是盡性至命如灑埽應對與盡性至命亦是一統底事無有本末無有精粗却被後來人言性命者别作一般髙逺説故舉孝弟是於人切近者言之然今時非無孝弟之人而不能盡性至命者由之而不如也問第五倫視其子之疾與兄子之疾不同自謂之私如何伊川曰不待安寢與不安寢只不起與十起便是私也父子之愛本是公才著些心做便是私也不起上遺書有是字第五氏倫名字伯魚漢京兆人仕至司空或問倫曰公有私乎對曰吾兄子嘗病一夜十起退而安寢吾子有疾雖不省視而竟夕不眠若是者豈可謂無私乎事見後漢書列傳朱子曰只就理所當為處便為若又怕人道如何此却是私意但倫見得此意已大段㑹省察也又問視已子與兄子有間否曰聖人立法曰兄弟之子猶子也間去聲下同猶䘮服兄弟之子子也葢引而進之也見檀弓上篇欲視之猶子程子所以釋禮之意也又問天性自有輕重疑若有間然曰只為今人以私心㸔了孔子曰父子之道天性也此只就孝上説故言父子天性若君臣兄弟賓主朋友之類亦豈不是天性只為今人小㸔却不推其本所由來故爾己之子與兄之子所爭幾何是同出於父者也只為兄弟異形故以兄弟為手足人多以異形故親已之子異於兄弟之子甚不是也父子之道天性也見孝經聖治章意此兩節總以明己子與兄子一體之不得有所異同於其間也又問孔子以公冶長不及南容故以兄之子妻南容以己之子妻公冶長何也曰此亦以己之私心㸔聖人也凡人避嫌者皆内不足也聖人自至公何更避嫌凡嫁女各量其才而求配或兄之子不甚美必擇其相稱者為之配己之子美必擇其才美為之配豈更避嫌耶若孔子事或是年不相若或時有先後皆不可知以孔子為避嫌則大不是如避嫌事賢者且不為况聖人乎妻並音娶至公上葉本無自字自下遺書有是字稱去聲朱此又借孔子之事以明避嫌不可之意事見論語子曰避嫌自是不可然亦有理所當避者如𤓰田不納履李下不整冠君不與同姓同車與異姓同車不同服之類豈可不避問孀婦於理似不可取如何伊川曰然凡取以配身也若取失節者以配身是已失節也取並音娶娶此言孀婦不可也又問或有孤孀貧窮無託者可再嫁否曰只是後世怕寒餓死故有是説然餓死事極小失節事極大怕普駕反言怕畏懼也此孀婦不可再嫁正以見其不可取之意葢孀婦或有藉口寒餓故程子言此所以極言節之不可失也朱子曰夫死而嫁固為失節然亦有不得已者聖人不能禁也故為之制服以處其子而母不得與其祭焉其貶之亦明矣愚按周禮媒氏中春司男女之無夫家者而㑹之註司察也無夫家謂鰥寡者小司徒註夫家猶言男女也賈疏夫丈夫則男春秋傳曰男有室女有家婦人稱家故以家為女王氏曰一與之齊終身不改固女子之節然苟盡責其如此則失所者必多且非貞節之人徒使之不嫁以避失節之名則其隂至於敗俗必有甚者故聖人特於中春創為㑹無夫家者之法以待中人其娶之者亦孟子所謂娶妻非為養而有時乎為養也明道曰病卧於牀委之庸醫比之不慈不孝事親者亦不可不知醫外書下同兼父兄之於子弟皆不可委之庸醫是為父兄者言之也而人子事親尤不可以不謹故下句專就人子言之世程長年曰醫不可不知但不可行行醫即近利熟於法人品心術遂壞程子𦵏父使周恭叔主客客欲酒恭叔以告先生曰勿陷人於惡周恭叔名行己永嘉人元祐六年進士官至秘書省正字遺書第十七卷或云乃其所為也其行實見伊洛淵源錄須按禮行弔之日不飲酒食肉朱子曰行弔而遇酒食力辭必不得已而留亦湏數辭先起不可醉飽買乳婢多不得已或不能自乳必使人然食己子而殺人之子非道必不得已用二子乳食三子足備他虞或乳母病且死則不為害又不為己子殺人之子但有所費若不幸致誤其子害孰大焉或不之或葉本作我食並音嗣二下呂本無子字不為己子之為去聲不得已者如晚年得子或母有疾之類然則世之非有不得已而買乳婢者固非矣以楊誠齋夫人羅氏生四男三女悉自乳曰飢人之子哺吾子是誠何心哉此可謂得伊川之心者矣葉氏曰㓜吾㓜以及人之㓜其慮之周葢如此愚按禮内則國君世子生卜士之妻大夫之妾使食子三年而出大夫之子有食母士之妻自養其子則乳婢固於禮有之也但當曲為體䘏如程子所言耳先公大中諱珦字伯温前後五得任子以均諸父子孫嫁遣孤女必盡其力所得俸錢分贍親戚之貧者伯母劉氏寡居公奉養甚至其女之夫死公迎從女兄以歸教養其子均於子姪既而女兄之女又寡公懼女兄之悲思又取甥女以歸嫁之時官小禄薄克己為義人以為難大音泰珦許亮反從才仲反下從叔之從同太中宋寄禄官名元豐定官制以太中大夫換諫議大夫伯温以太中大夫致仕太中舊名温字君玉既登朝後改今名任子猶今所謂廕生也何問取甥女歸嫁一段與前孤孀不可再嫁相反也朱子曰理固如此但此亦人所不能盡者公慈恕而剛斷平居與幼賤處惟恐有傷其意至於犯義理則不假也左右使令之人無日不察其飢飽寒燠娶侯氏處家傳作語令平聲下同燠音郁家燠煖也以上言太中公之德詳見太中傳侯夫人事舅姑以孝謹稱與先公相待如賓客先公頼其内助禮敬尤至而夫人謙順自牧雖小事未嘗專必禀而後行仁恕寛厚撫愛諸庶不異已出從叔幼孤夫人存視常均己子孤呂本作姑誤縣侯夫人潤州丹徒縣令諱道濟女太原盂人禀受命也如商書禀令左傳禀命是也治家有法不嚴而整不喜笞撲奴婢視小臧獲如兒女諸子或加呵責必戒之曰貴賤雖殊人則一也汝如是大時能為此事否笞丑知反扑從手或從木作朴誤古通用撲箠擊曰笞杖擊曰扑今則以為扑責之通稱應劭曰揚雄方言云海岱之間罵奴曰臧罵婢曰獲燕之北郊民而聓婢謂之臧女而歸奴謂之獲葢罵如婢之醜稱也今則以為奴婢之道稱大謂年之長大也對上小臧獲小字而言先公凡有所怒必為之寛解唯諸兒有過則不掩也常曰子之所以不肖者由母蔽其過而父不知也夫人男子六人所存惟二其愛慈可謂至矣然於教之之道不少假也為去聲下為之同夭六人者長應昌次天鍚五韓奴六蠻奴並並明道伊川為六也纔數嵗行而或踣家人走前扶抱恐其驚啼夫人未嘗不呵責曰汝若安徐寧至踣乎飲食常置之坐側嘗食絮羮即叱止之曰㓜求稱欲長當何如踣仆同芳故反絮敕慮反即呂本作皆家傳同稱去聲長張丈反下同以飲食置之坐側者言每當飲食時必使侍食於坐側便教導之也絮羮謂羮無味而就器加以鹽梅調和之也曲禮母絮羮鄭註絮猶調也按朱子與張敬夫論胡文定家程集之誤云如嘗食絮羮叱止之無皆字則不成文理據此則即字當作皆為得然愚以謂叱上無皆字亦未至不成文理依此作即字亦未為不可不知朱子何見而云然也雖使令軰不得以惡言罵之故頥兄弟平生於飲食衣服無所擇不能惡言罵人非性然也教之使然也與人爭忿雖直不右曰患其不能屈不患其不能伸及稍長常使從善師友游雖居貧或欲延客則喜而為之具稍蘇老反也右助也稍漸夫人七八嵗時誦古詩曰女子不夜出夜出秉明燭自是日暮則不復出房閤既長好文而不為辭章見世之婦女以文章筆札傳於人者則深以為非閤古㳫反與閣别好去聲傳文集古詩未詳誦古詩家作教以古詩則知夫人之淑德所得於庭訓者深也記曲禮女子出門夜行以燭無燭則止閤爾雅釋宮篇宮中之門謂之闈其小者謂之閨小閨謂之閤文以上言侯夫人之德詳見上谷郡君家傳此編皆集居先而此獨在後者葢以是章乃統叙治家之道凡事上撫下睦族䘏孤之道無弗具焉故繫之此也橫渠先生嘗曰事親奉祭豈可使人為之行狀奉事親謂事生者祭謂事死者言皆不可不親致其誠也未按先生之家童子必使灑掃應對給侍長者女子之嫁者必使親祭祀納酒漿而因自言如此供呂榮陽曰糓梁言天子親耕以供粢盛王后親蠶以祭服國非無良農工女也以為人之所盡事其祖襧不若以己之所自親者也此説最盡事親之道葢孝子事親須事事躬親不可委之使令也舜之事親有不悦者為父頑母嚚不近人情若中人之性其愛惡略無害理姑必順之為去聲嚚音銀惡去聲見事親非有甚害理不可從者必當曲為承順而不可輕為矯拂也親之故舊所喜者當極力招致以悦其親凡於父母賓客之奉必極力營辦亦不計家之有無然為養又須使不知其勉强勞苦苟使見其為而不易則亦不安矣强上聲易音異中横渠雜説此故舊所喜謂故舊所喜者承上順字之意而申明之斯干詩言兄及弟矣式相好矣無相猶矣言兄弟宜相好不要相學猶似也人情大抵患在施之不見報則輟故恩不能終不要相學已施之而已好去聲上不要相學之相呂本作厮葢長安讀相為厮思必反亦通作厮又音斯詩説下同斯干小雅篇名式語辭好和好輟止也已施之而已言當自盡其道而不必計人報否也朱子曰如兄能友其弟弟却不恭其兄兄不可學弟之不恭而遂忘其友但當自盡其友而已如弟能恭其兄兄却不友其弟弟不可學兄之不友而遂忘其恭但當自盡其恭而已如冦萊公撻倒用印事王文正公謂他底既不是不可學他不是亦是此意然詩之本意猶字作相圖謀説思張氏曰此本非正解朱子既載入詩註又於小學近録載之其示人之意切矣葢兄弟相謀自非至不令者未忍出此唯施報相學常情類然不可以不謹也愚按張子亦第就斯干之詩言之耳從此類推則君雖不仁臣不可以不忠父雖不慈子不可以不孝夫雖不良婦不可以不順亦各自盡其當然之分而已人不為周南召南其猶正牆面而立常深思此言誠是不從此行甚隔著事向前推不去葢至親至近莫甚於此故須從此始説見論語此引夫子之言以見正家為急不從此行三句接上是字之意而申明之至親至近三句又明所以不從此行向前推不去之故也張氏曰古人凡事謹小慎微家庭間尤為𦂳要能於嫌隙幾微處潜消黙化不使積漸而長則善矣婢僕始至本懷勉勉敬心若到所提掇更謹則加謹慢則棄其本心便習以成性故仕者入治朝則徳日進入亂朝則徳日退只觀在上者有可學無可學耳至下呂本有者字語録此并及教養婢僕之法盖一家之中必使婢僕下人皆得其道而後可以為齊也末又就上文推廣言之以上並横渠語近思録集註卷六欽定四庫全書近思錄集註卷六婺源江永撰朱子曰此卷齊家之道伊川先生曰弟子之職力有餘則學文不修其職而學文非為己之學也永按不修其職而學文雖詩書六藝猶為務外為人况習為浮華妍巧之詞乎經解孟子曰事親若曾子可也未嘗以曽子之孝為有餘也葢子之身所能為者皆所當為也師六二傳朱子曰程子論曽子事先儒所不到易傳下同幹母之蠱不可貞子之於母當以柔巽輔導之使得於義不順而致敗蠱則子之罪也從容將順豈無道乎若伸已剛柔之道遽然矯拂則傷恩所害大矣亦安能入乎在乎屈己下意巽順相承使之身正事治而已剛陽之臣事柔弱之君義亦相近蠱九二傳蠱陳芝拜辭朱子贈以近思録曰公事母可檢幹母之看便自見得那道理因言易傳自是成書伯恭都摭來作閫範今亦載在近思錄某本不喜他如此然細㸃檢來段段皆是日用切近功夫而不可闕者於學者甚有益為葉氏曰幹治也蠱事之弊也人子事親皆當以承順主使事得於理而已然婦人柔暗有難以遽曉尤當以柔巽行之比之事父有間矣但為矯拂而反害其所治之事則子之過也剛陽之臣事柔弱之君葢孟子於齊宣王諸葛孔明於蜀後主是也蠱之九三以陽處剛而不中剛之過也故小有悔然在巽體不為無順順事親之本也又居得正故无大咎然有小悔已非善事親也正倫理篤恩義家人之道也家人傳義問今欲正倫理則有傷恩欲篤恩義又有乖於倫理如何朱子曰須是於正倫理處篤恩義篤恩義而不失倫理方可葉氏曰正倫理則尊卑之分明篤恩義則上下之情合人之處家在骨肉父子之間大率以情勝禮以恩奪義惟剛立之人則能不以私愛失其正理故家人卦大要以剛為善家人六二傳九永按初九之閑有家而悔亡三之嗃嗃而吉上九之威如終吉皆以剛為善九五之王假有家勿恤吉剛而得中尤善之至也家人上九爻辭謂治家當有威嚴而夫子又復戒云當先嚴其身也威嚴不先行於己則人怨而不服葉氏曰持身謹嚴無少縱弛則家人自然有所嚴憚而不敢踰越有所觀感而卒歸於正歸妹九二守其幽貞未失夫婦常正之道世人以媟狎為常故以貞靜為變常不知乃常乆之道也葉氏曰正靜乃相處可乆之道媟狎則玩侮乖離所自生世人多慎於擇壻而忽於擇婦其實壻易見婦難知所繫甚重豈可忽哉永按古人納采之後加諸卜而後納吉是以卜筮擇之也今擇之之法宜就知其性行者審於諏問遲之稍乆而後議婚如問不能詳審則以筮决之易中元有取女吉勿用取女諸辭或遇他辭不言取女者亦可以意斷之也遺書下同人無父母生日當倍悲痛更安忍置酒張樂以為樂若具慶者可矣問程子云人無父母生日當倍悲痛如先生舊時亦嘗有夀母生朝及大碩人生朝與向日賀髙倅詞不審又何也豈在人子自己言則非其所宜而為父母待親朋則其情又有不容己處否然恐為此則是人子以禮律身而以非禮事其親以非禮待於人也其義如何朱子曰此等事是力量不足放過了處然亦或有不得已者其情各不同也問行狀云伊川所作明道行狀盡性至命必本於孝弟不識孝弟何以能盡性至命也曰後人便将性命别作一般事說了性命孝弟只是一統底事就孝弟中便可盡性至命朱子曰盡性至命必從孝弟做起盡若是聖人如舜之孝王李之友便是性至命事如洒埽應對與盡性至命亦是一統底事無有本末無有精粗永按程子嘗言洒埽應對是其然必有所以然其所以然者即精也本也却被後來人言性命者别作一般髙逺說故舉孝弟是於人切近者言之然今時非無孝弟之人而不能盡性至命者由之而不知也葉氏曰行不著習不察故不能擴而充之以至於極問第五倫視其子之疾與兄子之疾不同自謂之和如何曰不待安寢與不安寢只不起與十起便自私也父子之愛本是公才著些心做便是也後漢第五倫傳或問倫曰公有私乎對曰吾兄子嘗病一夜十起退而安寢吾子有疾雖不省視而竟夕不眼若是者豈可謂無私乎性葉氏曰事物各有自然之理不容安排父子之愛天今子疾不視而十起於兄子豈人情哉著意安排即是私矣又問視己子與兄子有間否曰聖人立法曰兄弟之子猶子也是欲視之猶子也永按䘮服兄弟之子與己衆子皆期服又問天性自有輕重宜若有間然曰只為今人以私心看了孔子曰父子之道天性也此只就孝上說故言父子天性若君臣兄弟賔主朋友之類亦豈不是天性只為今人小看却不推其本所由來故爾己之子與兄之子所爭幾何是同出於父者也只為兄弟異形故以兄弟為手足人多以異形故親己之子異於兄弟之子甚不是也又問孔子以公冶長不及南容故以兄之子妻南容以己之子妻公冶長何也曰此亦以己之私心看聖人也凡人避嫌者皆内不足也聖人自至公何更避嫌凡嫁女各量其才而求配或兄之子不甚美必擇其相稱者為之配己之子美必擇其才美者為之配豈更避嫌耶若孔子事或是年不相若或時有先後皆不可知以孔子為避嫌則大不是如避嫌事賢者且不為况聖人乎問伊川言避嫌之事賢者不為自今觀之閨門中安知無合避嫌處朱子曰聖人正大道理合做處便做何用避嫌問古人門内之治恩掩義門外之治義斷恩恐閨門中主恩亦有避嫌處曰固是主恩亦須是當理方可程子所謂年之長幼時之先後正是解或人之說未必當時如此大抵二人都是好人可託或先見公冶長遂将女妻他後來見南容亦是箇好人又把兄之女妻之看來文勢恐是孔子之女年長先嫁兄之女少後嫁亦未可知程子所謂凡人避嫌者皆内不足實是如此問程子避嫌之說曰合當委曲便是道理當如此且如避嫌亦不能無如通判與太守是親戚也合當避嫌第五倫之事非不見得如此自是常有這心在克不去今人這様甚多只是徇情恁地去少間將這箇做正道理了大是害事所以古人於正心誠意上更做工夫正怕到這處問若是有一項合委曲而不可以直遂者這不可以為避嫌曰自是道理合如此如避嫌者却是怕人道如何這却是私意如十起與不起便是私這便是避嫌只是他見得這意思已是大段做工夫大段會省察了問孀婦於理似不可取如何曰然凡取以配身也若取失節者以配身是已失節也又問或有孤孀貧窮無託者可再嫁否曰只是後世怕寒餓死故有是説然餓死事極小失節事極大病卧在牀委之庸醫比之不慈不孝事親者亦不可不知醫外書下同程子𦵏父使周恭叔主客客欲酒恭叔以告先生曰勿陷人於惡周行已字恭叔買乳婢多不得已或不能自乳必使人然食己子而殺人之子非道必不得已用二乳食三子足備他虞或乳母病且死則不為害又不為己子殺人之子但有所費若不幸致誤其子害孰大焉葉氏曰㓜吾㓜以及人之㓜其慮之周如此先公太中諱珦字伯温前後五得任子以均諸父子孫嫁遣孤女必盡其力所得俸錢分贍親戚之貧者伯母劉氏寡居公奉養甚至其女之夫死公迎從女兄以歸教養其子均於子妷既而女兄之女又寡公懼女兄之悲思又取甥女以歸嫁之問取甥女歸嫁一段與前孤孀不可再嫁相反何也朱子曰大綱恁地但人亦有不能盡者時小官祿薄克己為義人以為難公慈恕而剛斷平居與幼賤處惟恐有傷其意至於犯義理則不假也左右使令之人無日不察其飢飽寒燠娶侯氏侯夫人事舅姑以孝謹稱與先公相待如賔客先公頼其内助禮敬尤至而夫人謙順自牧雖小事未嘗專必禀而後行仁恕寛厚撫愛諸庻不異已出從叔幼姑夫人存視常均己子治家有法不嚴而整不喜笞扑奴婢視小臧獲如兒女諸子或加呵責必戒之曰貴賤雖殊人則一也汝如是大時能為此事否先公凡有所怒必為之寛解唯諸兒有過則不掩也常曰子之所以不肖者由母蔽其過而父不知也夫人男子六人所存惟二其慈愛可謂至矣然於教之之道不少假也纔數嵗行而或踣家人走前扶抱恐其驚啼夫人未嘗不呵責曰汝若安徐寧至踣乎飲食常置之坐側嘗食絮羮皆叱止之曰幼求稱欲長當何如永按絮羮嫌味薄復以厚味調和也絮摛慮切嘗食與絮羮二事皆求詳於味他本作常食絮羮即叱止之者非雖使令輩不得以惡言罵之故頤兄弟平生於飲食衣服無所擇不能惡言罵人非性然也教之使然也與人爭忿雖直不右曰患其不能屈不患其不能伸及稍長常使從善師友游雖居貧或欲延客則喜而為之具夫人七八嵗時誦古詩曰女子不夜出夜出秉眀燭自是日暮則不復出房閤既長好文而不為辭章見世之婦女以文章筆札傳於人者則深以為非文集横渠先生嘗曰事親奉祭豈可使人為之葉氏曰使人代為孝敬之心安在行状舜之事親有不悦者為父頑母嚚不近人情若中人之性其愛惡略無害理姑必順之葉氏曰事親以順為主非甚不得已者不可輕為矯拂也親之故舊所喜者須極力招致以悦其心凡於父母賔客之奉必極力營辦亦不計家之有無然為養又須使不知其勉强勞苦苟使見其為而不易則亦不安矣葉氏曰所謂養志者也横渠記説斯干詩言兄及弟矣式相好矣無相猶矣言兄弟宜相好不要厮學猶似也人情大抵患在施之不見報則輟故恩不能終不要相學已施之而已問兄弟宜相好不要相學指何事而言朱子曰不要相學不好處且如兄去友弟弟却不能恭其兄兄豈可學弟之不恭而遂亦不友為兄者但當盡其友可也為弟能恭其兄兄乃不友其弟為弟者豈可亦學兄之不友而遂忘其恭為弟者但當知其盡恭而已然詩之本意猶字當作相圖謀説或曰猶當作尤矣此於本義或未必然然意則善詩説下同人不為周南召南其猶正牆靣而立嘗深思此言誠是不從此行甚隔著事向前推不去葢至親至近莫甚於此故須從此始朱子曰周南召南所言皆修身齊家之事正牆面而立言即其至近之地而一物無所見一步不可行婢僕始至者本懐勉勉敬心若到所提掇更謹則加謹慢則棄其本心便習以性成故仕者入治朝則徳日進入亂朝則徳日退只觀在上者有可學無可學爾永按提掇更謹者涖之以莊御之以道令其自不敢惰慢非徒尚威嚴之謂也語錄近思錄集註卷六
