body:
  text: 近思録集註後序近思録集註既成或疑名物訓詁非是書所重胡考訂援據之不憚煩為曰此正愚註之所以作也自宋史分道學儒林為二而後之言程朱之學者往往但求之身心性命之間而不復以通經學古為事於是彼稍稍知究心古學者輒用是為詬病以謂道學之說興而經學寖微噫何其言之甚歟夫道者所以為儒之具也而學也者所以治其具也故人不學則不知道不知道則不可以為儒而不通知古今則不可以言學夫經其本也不通經則雖欲博觀今古亦泛濫而無所歸也宋史離而二之過矣伊川分學者為三曰文章曰訓詁曰儒者夫六經皆文章也其異同疑似為之博考而詳辨之即訓詁也子曰有德者必有言非儒者之文章乎孟子曰不以文害辭不以辭害志以意逆志是為得之非儒者之訓詁乎然則文章也訓詁也而儒之所以為儒者要未始不存乎其間然而伊川且必欲别儒於文章訓詁之外者何也盖欲求儒者之道於文章訓詁中則可而欲以文章訓詁盡儒者之道則不可其本末先後之間固有辨也柰之何進訓詁章句之學於儒林而反别道學於儒之外其無識可謂甚也夫道學與政術判為二事横渠猶病之况離道學與儒而二之耶甚矣其蔽也盖嘗竊論之馬鄭賈孔之説經譬則百貨之所聚也程朱諸先生之説經譬則操權度以平百貨之長短輕重者也㣲權度則貨之長短輕重不見而非百貨所聚則雖有權度亦無所用之矣故愚嘗以謂欲求程朱之學者其必自馬鄭諸傳疏始愚故於是編備著漢唐諸家之説以見程朱諸先生之有本俾彼空疎寡學者無得以藉口焉乾隆元年正月之望歸安後學茅星來謹識
