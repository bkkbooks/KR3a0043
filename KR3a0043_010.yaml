body:
  text: 近思録集註卷十歸安茅星來撰臨政處事之方此卷亦致知格物之事即程子所謂應接事物而處其當是也以居官任職事尤重大而不可忽畧故獨詳焉凡六十四條伊川先生上疏曰夫鐘怒而擊之則武悲而擊之則哀誠意之感而入也告于人亦如是古人所以齊戒而告君也齊側皆反下同之此言感人必以誠意意臣前後兩得進講未嘗敢不宿齊預戒潛思存誠覬感動于上心若使營營于職事紛紛其思慮待至上前然後善其辭説徒以頰舌感人不亦淺乎頰音劫道文集下同誠頰説文面旁也此程子自其事君之意以冀感動于君心也觀程子營營職事之言則知當日之所以使兼他職而固辭者意固有在矣或問伊川未進講以前還有間斷否朱子曰尋常未嘗不誠臨見君時又加意耳如孔子沐浴而告哀公是也此元祐元年上太皇太后書中語也按文集時講讀官五人四人皆兼他職唯伊川不領别官近復差修國子監太學條制無一人專職輔導者執政之意葢惜人才不欲使之閒又以為雖兼他職不妨講讀故程子言之以見講讀官當精思竭誠專在輔導不可兼他職之意伊川答人示奏藁書云觀公之意專以畏亂為主頥欲公以愛民為先力言百姓飢且死丐朝廷哀憐因懼将為冦亂可也不惟告君之體當如是事勢亦宜爾丐音蓋愛丐求也此言奏藁當以民為先之意公方求財以活人祈之以仁愛則當輕財而重民懼之以利害則將恃財以自保祈通蘄祈求也古之時得丘民則得天下後世以兵制民以財聚衆聚財者能守保民者為迂周禮小司徒四井為邑四邑為丘四丘為甸丘民謂一丘之民也猶古一成一旅之意説見孟子此兩端所以明奏藁不可專以畏亂為主之意無愚按程子亦因後世之見如此故特言此以見言之益耳非真謂兵與財之足恃也後世富强莫如秦隋率皆二世而亡而漢唐稍知愛民享國長久可得云保民者為迂乎惟當以誠意感動覬其有不忍之心而已此二句所謂欲公以愛民為先者也許魯齋曰人臣為君言只當言義理可與不可當與不當若以利害相恐動則利害不應時便不信矣且如天道福善禍滛有時而差是天道亦不足信也人只得求當于義理而已利害一切不卹也明道為邑及民之事多衆人所謂法所拘者然為之未嘗大戾于法衆亦不甚駭謂之得伸其志則不可求小補則過今之為政者逺矣人雖異之不至指為狂也至謂之狂則大駭矣盡誠為之不容而後去又何嫌乎吕進伯使河東伊川問為政何先對曰莫要于守法而伊川告之以此以見法有所不可盡拘也東萊吕氏曰當官以方便為上如差科既不能免即就其間求所以便民省力者使不騷擾重為民害其益多矣明道先生曰一命之士苟存心于愛物于人必有所濟見行状周禮一命受職如今之第九品也苟誠也物即人也位者乎言此以見一命猶然况居大伊川先生曰君子觀天水違行之象知人情有争訟之道故凡所作事必謀其始絶訟端于事之始則訟無由生矣謀始之義廣矣若慎交結明契劵之類是也券從刀勸平聲與從力者别易傳下同訟象傳坎下乾上為訟天上水下相違而行故曰違行交結朋友結納也契券文書要約也二者偶舉一二以例其餘也項平甫曰乾陽生于坎水坎水生于天一乾坎本同氣而生者也一動之後相背而行遂有天淵之隔由是觀之天下之事不可以細微而不謹也不可以親暱而不敬也禍亂之端夫豈在大曹劉共飯地分于七箸之間蘇史滅宗忿起于笑談之頃謀始之誨豈不深切著明乎師之九二為師之主恃專則失為下之道不專則無成功之理故得中為吉師卦惟九二一陽居下卦之中上下五陰順而從之是九二為師之主也九二以剛居下而用事六五以柔居上而應之則倚任專矣鄧艾之承制拜假事不待報是恃專也顔魯公讓功于賀蘭進明以至為所牽制不能成功則不專之患也二居中故有得中之象專愚按程傳于三五兩爻輿尸並訓作衆主即此傳不之意也夫任將不專使衆主之鮮有不敗是固然矣然必先慎擇其人使其勇畧仁信足以勝將帥任者而後可專以任之故彖辭曰丈人六五曰長子並老成之稱見非新進喜事才弱志剛之輩所可與其選也凡師之道威和並至則吉也恃專則不和不專則無威惟威和並至為得中而吉愚按程子亦但就為將之道論之耳人君之命將亦然推心置腹所謂和也信賞必罰所謂威也未有舍此而能得將之用者楊誠齋曰河曲之師趙盾為將而令出趙穿邲之師苟林父為將而令出先縠後世復有中人監軍從中牽制皆取敗之道也世儒有論魯祀周公以天子禮樂以為周公能為人臣不能為之功則可用人臣不得用之禮樂是不知人臣之道也夫居周公之位則為周公之事由其位而能為者皆所當為也周公乃盡其職耳亦師九二傳以王安石有此言因特論之父按程子又云子之事父其孝雖過于曾子畢竟是以母之身做出來豈是分外事若曽子者僅可以免責耳臣之于君猶子之于父也假如功業大于周公亦是以君之人民勢位做出來而謂人臣所不能為可乎大有之九三曰公用亨于天子小人弗克傳曰三當大有之時居諸侯之位有其富盛必用亨通于天子謂以其有為天子之有也乃人臣之常義也通於之於易傳作乎為三居下體之上在下而居人上公侯之象也以其有天子之有如程子所謂蕃養其衆以為王之屛翰豐殖其財以待上之徵賦是也此一節所以明公用亨于天子之意朱子曰古人于亨字作享烹字通用如公用亨于天子分明是享字程子作亨通解不是字畫音韻是經中淺事故先儒得其大者而於此多不留意然不知此等䖏不理㑹却枉費了無限辭説牽補而卒不得其大義亦甚害事也胡雙湖曰按春秋傳晉文公將納王使卜偃筮之遇大有之暌曰吉遇公用亨于天子之卦戦克而王亨吉孰大焉則是卜偃時固讀為享矣項平甫曰隨上六王用亨于西山益六二王用亨于帝升六四王用亨于岐山程子或作亨通解或作亨盛解獨于益六二作享讀者蓋不敢解作享帝也若小人處之則專其富有以為私不知公以奉上之道故曰小人弗克也公以之以葉吕本並作已今從易傳此明小人所以弗克之意人心所從多所親愛者也常人之情愛之則見其是惡之則見其非故妻孥之言雖失而多從所增之言雖善為惡也苟以親愛而隨之則是私情所與豈合正理故隨之初九出門而交則有功也惡之惡去聲正出門謂非私昵交不以私故其隨不失其而能有功俞氏曰初九乃成卦之主爻主不可以隨人故不言隨而言交自張氏曰人能内不惑于妻孥外不惑于諂讒立身便卓然隨九五之象曰孚于嘉吉位正中也傳曰隨以得中爲善隨之所防者過也蓋心所悦隨則不知其過矣孚誠也就九五中實言嘉善也就六二中正吉九五陽剛中正下應六二之中正故曰孚于嘉正中謂九五葉氏曰震下兌上為隨震動也兌悦也以悦而動易過于隨而不自知故必得中為善坎之六四曰樽酒簋貳用缶納約自牖終无咎傅曰此言人臣以忠信善道結於君心必自其所明䖏乃能入也樽本作尊後加木加缶加瓦加土者各隨所見也簋音癸缶俯九反方樽酒器周禮春官司尊彝有獻象著壺太山六尊外内圓曰簠内方外圓曰簋皆盛黍稷器並漆赤中有蓋象龜形考工記旊人為簋受一斗二升高一尺厚半寸脣寸缶瓦器愚按旊人疏祭宗廟皆用木簋此用瓦簋者據祭天地及外神尚質器用陶匏之類也蓋樽與簋皆宗廟所用有金玉雕文之飾不專以瓦為之故下文復言用缶以見其為尚質也語類以既云樽酒簋貳又云用缶為不成文理蓋朱子誤以樽簋為專用瓦缶故以複出用缶字為不成文理也熊氏曰一樽之酒二簋之食復以瓦缶為器質之至也所謂忠信善道也牖者室中所以通明也葢忠信者納約之本苟不因其明而納焉則亦不能入矣人心有所蔽有所通通者明䖏也當就其明處而告之求信則易也故云納約自牖能如是則雖艱險之時終得无咎也易音異既程子又曰人君有過以理開諭之不肯聽却湏就人君開明處進説如左師觸龍事之類且如君心蔽於荒樂唯其蔽也故爾雖力詆其荒樂之非如其不省何必於所不蔽之事推而及之則能悟其心矣自古能諫其君者未有不因其所明者也故訐直强勁者率多取忤而温厚明辯者其説多行樂並音洛尤楊龜山曰對人主語言及章疏文字温柔敦厚不可無如子瞻詩多渉譏玩殊無惻怛愛君之意荆公在朝論事多不循理惟是争氣而已何以事君非惟告於君者如此為教者亦然夫教必就人之所長所長者心之所明也從其心之所明而入然後推及其餘孟子所謂成德逹財是也此又推廣言之以見因其所明而導之不獨事君當然也熊氏曰成德者因其有徳而成就之逹財者因其有財而遂逹之皆謂就其所長而開導之也恒之初六曰浚恒貞凶象曰浚恒之凶始求深也傳曰初六居下而四為正應四以剛居髙又為二三所隔應初之志異乎常矣而初乃求望之深是知常而不知變也世之責望故素而至悔咎者皆浚恒者也初六爻傳素舊也初六以隂柔居巽下巽性務入故求望之深陰性柔暗故知常而不知變常就四為正應而言變就為二三所隔而言此爻本義及程傳皆就初求望上説蓋特其一端其實凡事皆當審已量力循序漸進積久有成不然則急遽無序進鋭退速必不能以有恒也遯之九三曰係遯有疾厲畜臣妾吉傳曰係戀之私恩懷小人女子之道也故以畜養臣妾則吉係音計畜許六反養去聲九三下比二隂使有所係戀不得遯也故以畜養臣妾則吉問小人女子近之則不遜逺之則怨若專以私恩懐之未必不有悔吝而此爻以為吉何也朱子曰此爻不可大事但可畜臣妾耳御下而有以懐之未必失正但恐所以懐之者非其道也然君子之待小人亦不如是也易言畜臣妾吉原就九三之係而言惟可以畜臣妾也非謂畜臣妾之必當以係也程子恐學者不察而一以私恩係戀之則必有優柔養奸之患故又言此以見係之有未盡吉者其不言女子何也葢女子不過侍巾櫛承恩寵懐之未為不可但不可使預外事耳至小人而牽頋私情酿成奸惡則不可言矣漢唐末階亂並坐此葢所以足易文未盡之意睽之象曰君子以同而異傳曰聖賢之處世在人理之常莫不大同於世俗所同者則有時而獨異睽從耳目之目與睽違之睽别按本義二卦合體而性不同故為同而異也蓋離中女兌少女為合體火炎上澤潤下則性不同人理之常如人倫日用之類有時獨異如戦國尚功利詐謀而孟子獨言仁義崇王道黜霸功是也同按呉氏補註謂熊本有時獨異下脱去葢于秉彝則矣于世俗之失則異也十五字當從易傳補入愚謂人倫之常内秉彝意已具世俗所同自是也世俗之失朱子刪之更覺簡盡非熊氏脱去不能大同者亂常拂理之人也不能獨異者隨俗習非之人也要在同而能異耳此申明上文之意睽之初九當睽之時雖同德者相與然小人乖異者至衆若棄絶之不㡬盡天下以仇君子乎如此則失含𢎞之義致凶咎之道也又安能化不善而使之合乎故必見惡人則旡咎也同徳相與謂初與四當相應之位而爻皆陽也乖異者衆亦就睽之時言之蓋當睽之初其睽未深惡人睽間之情猶未甚故猶可見之以免避禍咎若罪惡已極所亟宜誅絶者而猶托含𢎞之義則未有不至䘮名失節者也又學者所不可不察也古之聖王所以能化姦凶為善良革仇敵為臣民者由弗絶也睽之九二當睽之時君心未合賢臣在下竭力盡誠期使之信合而已睽九二象傳葉氏曰二五相應然時方睽違上下乖戾故二必外竭其内盡其誠期使疑者信睽者合耳至誠以感動之盡力以扶持之明義理以致其知杜蔽惑以誠其意如是宛轉以求其合也此明上文竭力盡誠期使之信合之意葉氏曰内竭其誠以感動君心外盡其力以扶持國政此盡其在我者也推明義理使君之知無不至杜塞蔽惑使君之意無不誠此正其在君者也愚按宛轉求合即指上四者而言若有意求合而過為宛轉則是曲徑詭遇而非君子之所由矣遇非枉道逢迎也巷非邪僻由徑也故象曰遇主于巷未失道也由易傳作曲道此即孟子惡不由其之意損之九二曰弗損益之傳曰不自損其剛貞則能益其上乃益之也若失其剛貞而用柔説適足以損之而已説音悦説剛貞以九言二居體故曰用柔説董氏曰二以剛益五之柔亦如初益四而彼以為酌損之與此不同何也葢初以剛居剛少損之則可裁度以助四二以剛居柔更損之將至媚悦以㣘五矣林次崖曰九二在爻則為剛中在人則為自守不肯妄進夫自守而不妄進宜若無益于上矣然由是而啓時君尊徳樂道之心止士大夫奔競之習其益于上也不少是弗損乃所以益之也世之愚者有雖無邪心而惟知竭力順上為忠者葢不知弗損益之之義也益之初九曰利用為大作元吉旡咎象曰元吉旡咎下不厚事也傳曰在下者本不當處厚事厚事重大之事也以為在上所任所以當大事必能濟大事而致元吉乃為旡咎能致元吉則在上者任之為知人已當之為勝任不然則上下皆有咎也勝平聲而下謂初上謂四朱子曰初九上為四所任作大事必盡善而後无咎不然不惟已不安而亦累于上向以此段非常有不必入伯恭以有時而有不可不書以為戒今思之果然又曰如子之于父臣之于君僚屬之于官長皆不可以踰分越職縱可為亦須是盡善方能無過革而無甚益猶可悔也况反害乎古人所以重改作也革彖辭或謂宋太祖受命盡除五代弊法用能易亂為治朱子曰不然只是去其太甚者其他法令條目多仍其舊如王安石大綱不理㑹却纖悉于細微之間所以弊也漸之九三曰利用禦冦傳曰君子之與小人比也自守以正豈惟君子自完其已而已乎亦使小人得不陷于非義是以順道相保禦止其惡也比音避相漸九三象傳爻詞下疑脱去象曰利用禦㓂順保也十字今當増入不然則傳文順道相保句無下落矣與小人比指上下皆陰而言自守以正謂三也熊氏曰小人得不陷非義亦以近正而不敢為非也旅之初六曰旅𤨏𤨏斯其所取災傳曰志卑之人既處旅困鄙猥𤨏細無所不至乃其所以致悔辱取災咎也陰柔故志卑居下故旅困役王伯厚曰斯其所㒋取災王輔嗣註為斯賤之唐郭京謂斯合作但按漢左雄傳職斯禄薄注斯賤也不必改作㒋愚謂王説固然然總不若程朱解作此字為穏葢斯賤意已在上𤨏𤨏二字内也在旅而過剛自高致困災之道也旅九三傳處旅之道以柔順謙下為先三剛而不中有過剛之象居下體之上又為艮體有自高之象過剛則暴下自高則不順于上所以致困災困災如䘮其童僕焚其次之類是也以上二條皆言䖏旅之道上條言過卑固所以取辱此言過高亦所以致災潘氏曰居剛而用剛平時猶不可况旅乎九三以剛居下體之上則焚次上九以剛居上體之上則焚巢位愈高剛愈亢則禍愈深矣之建安邱氏曰䖏旅之道以得中為善故雖以四處上下無過高過卑之失亦未得中所以雖得資斧而心未快也惟二五得二體之中故二即次懐資而得僕五亦終有譽命之榮也然二當位而五不當位故五不免射雉亡失之患然則居旅道之善其惟六二乎兌之上六曰引兌象曰未光也傳曰説既極矣又引而長之雖説之之心不已而事理已過實無所說事之盛則有光輝既極而强引之長其無意味甚矣豈有光也長並張文反强巨兩反來説既極矣及事理已過云云並指上爻而言楊氏曰兌引兌皆小人也在君子則當來而勿受引而勿去也君子以道徳相引其道為光明引而為説則心術曖昧行事邪僻甚矣豈得為光乎蒋氏曰當説之時剛則有節柔則無度故初二及四五凶四爻皆以剛陽而得吉三上二爻皆以陰柔而致中孚之象曰君子以議獄緩死傳曰君子之于議獄盡其忠而已於決死極于惻而已天下之事無所不盡其忠而議獄緩死最其大者也項氏曰獄之將决則議之其既决則又緩之然後盡于人心王制正聽之司㓂聽之三公聽之議獄也周禮卿士旬而職聽遂士二旬而職聽縣士三旬而職聽緩死也故獄成而孚輸而孚在我者盡故在人者無憾也朱子曰今法家惑于罪福報應之説多喜出人罪以求福報是使無罪者不得直而有罪者得倖免是乃所以為惡也何福報之有葢書所謂惟刑之恤者亦欲其詳審曲直使不至于濫耳豈謂極惡大罪概可從末減哉邱瓊山曰易象傳言刑獄者五卦噬嗑賁豐旅中孚也噬嗑賁豐旅皆有離象而噬嗑豐則兼取震賁旅則兼取艮惟中孚則有取于㢲兌者先儒謂中孚體全似離互體有震艮葢獄以明照為主必先得其情實則刑不濫然非震以動之則無有威斷又必艮以止之然後不過用其明以恣其威也夫然後兌以議之巽以緩之原情定罪至再至三詳之以八議原之以三宥議而又議緩而又緩求其出而不可得然後入之求其生而不可得然後死之本乎至誠孚信之心存乎至仁惻怛之意則在我者既盡而在人者無憾矣事有時而當過所以從宜然豈可甚過也如過恭過哀過儉大過則不可所以小過為順乎宜也能順乎宜所以大吉小過彖曰飛鳥遺之音不宜上宜下大吉上逆而下順也過恭過哀過儉象傳文也事以得中為貴然亦有時而當過者要必有以順乎事之宜而使不至于太甚故雖過而無有失也理陸君啓曰即夫子所謂寧儉寧戚之意所當過即是時中也防小人之道正已為先小過九三傳小人指衆陰而言小過當陽失位之時三獨以剛居正而為衆陰所忌惡故其傳云然正王伯厚曰申屠嘉不受私謁則可以折幸臣董仲舒身率下則可以事驕主魏相以亷正霍氏不能誣袁安任隗以素行竇氏無以害故曰正已為先周公至公不私進退以道無利欲之蔽其處已也䕫䕫然存恭畏之心其存誠也蕩蕩焉無顧慮之意所以雖在危疑之地而不失其聖也焉葉本作然在一作處疑䕫䕫敬謹恐懼之貎蕩蕩寛廣平坦之意危謂遭流言之變也詩曰公孫碩膚赤舄几几孫音遜之經説下同也詩豳風狼跋篇孫謙遜碩大也膚美也单下曰屨複下曰舄湯氏曰几舄之内必有屨屨外又加以舄故曰複也夏以葛冬以皮舄與今屐相似以木置履下乾腊不畏泥濕但無齒耳屨舄各象裳色王舄有三韋弁皮弁白舄冠弁之服黒舄而冕服則赤舄也几几安重貎孔頴逹曰葛屨所以當暑特為便于時耳若行禮之服雖夏猶當用皮吕涇野曰詩人只是從步履上看便見得周公之聖蓋人内不足者或有䜛謗之言步履必至錯亂不能安詳如謝安折屐豈能强制得住採察求訪使臣之大務釋詩皇皇者華章葢因每章有咨諏咨謀咨度咨詢語而釋其義也葉氏曰採察民隠求訪賢才二者使職之大事輔慶源曰人君正以耳目不得與逺民相接故遣使以宣已意而通下情為之使者豈可不務廣詢博訪以副君意耶李氏曰周官撢人之職掌誦王志道國之政事以巡天下邦國而語之則是使臣之職欲其周徧咨訪無所不及也范氏曰唐陳大徳使高麗以賂遺覘其險阻詭詐誘其人民以為竒能藉口歸報啟人主征伐之志失使臣之職矣愚按秋官小行人毎所至萬民之利害為一書禮俗政事教治刑禁之逆順為一書悖逆暴亂作慝猶犯令者為一書札䘮凶荒厄貧為一書康樂和親安平為一書凡此五物者毎國辨異之以反命于王以用知天下之故然則採察求訪因古使臣之道然也明道先生與吳師禮談介甫之學錯處謂師禮曰為我盡逹諸介甫我亦未敢自以為是如有説願往復此天下公理無彼我果能明辯不有益於介甫則必有益於我為我之為去聲錢遺書下同上呉師禮字安仲杭州塘人太學舍賜第工翰墨以直秘閣知宿州卒安石行事論之之錯由其學之錯故也程子特就源頭䖏天祺在司竹常愛用一卒長及將代自見其人盜筍皮遂治之無少貸罪已正待之復如初畧不介意其德量如此愛楊本作要長張文反治平聲貸度耐反復扶又反出司竹官名天祺于熈寜三年以監察御史裏行言事知江陵府公安縣改陜州夏縣轉運使舉監鳳翔府司竹監馬貴與文獻通考云河南淇園竹自魏晉後各置官守之後魏有司竹都尉隋曰司竹監唐因之有監丞監副掌植養園竹之事愚按淇園在今河南衞輝府淇縣魏晉後久廢其至宋猶置官守之者乃盩厔縣司竹園非淇園也馬氏混為一誤矣然按元史食貨志元初衛輝懐孟京兆鳳翔皆有在官竹園各置司竹監掌之至元末始罷則司竹不獨在鳳翔也蓋自元増置之耳盩厔今屬陕西西安府筍皮楚謂之箬亦竹箭明道因論口將言而囁嚅云若合開口時要他頭也須開口本註云如荆軻于樊於期須是聴其言也厲囁尼葉反嚅音如吕本無明道二字故葉氏曰囁嚅欲言而不敢發之貎厲則理明義直出于口者自然剛决不可回撓安有囁嚅之態所朱子曰合開口者亦曰理之所當言樊於期事非理得言特取其事之難言而猶言之耳須是就事上學蠱振民育德然有所知後方能如此何必讀書然後為學明道語其事上學謂即事而窮理也振民所以治人育徳所以修已二者皆以行言故曰有所知後方能如此有所知應上就事上學而言也愚按今人將事與學看作兩截所以學為俗學事為俗事不然則日用應接無非事即無非學也時皆以讀書為學故程子云然先生見一學者忙迫問其故曰欲了幾處人事曰某非不欲周旋人事者曷嘗似賢急迫伊川語雖葉氏曰事多為之必有序事雖急應之必有節未有可以急遽苟且而處之者安定之門人往往知稽古愛民矣則於為政也何有安定胡氏郡望韓文公胡良公神道碑胡姓系出安定後徙清河是也先生名瑗字翼之㤗州海陵人為湖州教授時方尚詞賦獨立經義治事等齋以敦實學從之遊者常數百人呉氏曰稽古即經義齋之民事愛民即治事齋之事熊氏曰稽古則知為政之法愛則得為政之本門人有曰吾與人居視其有過而不告則於心有所不安告之而人不受則奈何明道曰與之處而不告其過非忠也要使誠意之交通在於未言之前則言出而人信矣曰上吕本無明道字又曰責善之道要使誠有餘而言不足則於人有益而在我者無自辱矣責善以下遺書内自為一條以其意相發明因並録之職事不可以巧免職事職所當為之事也巧免則避難而就易避勞而就逸也居是邦不非其大夫此理最好語見家語子夏問篇子路以夫子不答魯大夫練而杖之問為有所不知也而子貢語之以此按荀子子道篇亦有此語但練而杖作練而昧邦作邑非非議之也葢泛論其理則可直論其人則不可非其大夫且不可况敢言朝政門失乎克勤小物最難語見用書畢命篇呉氏曰小物猶言小事不忽小事謹之至也欲當大任須是篤實葉氏曰篤實則力量深厚而謀慮審固斯可以任大事凡為人言者理勝則事明氣忿則招怫為去聲忿遺書作勝怫符勿反一作拂病怫怫鬱也言所以明理理勝則言必平正通逹而無故事明白而人易從苟以忿戾之氣出之則言出而動招怫鬱雖理勝事以明亦打格語而不能入也自克勤小物下並明道居今之時不安今之法令非義也若論為治不為則已如復為之須於今之法度内處得其當方為合義若須更改而後為則何義之有復扙又反處上聲當去聲更平聲富此為在下位者言之朱子曰韓魏公鄭公皆言新法不便韓魏公見上不從只就其法上為之區處使不至擾民而已富公則直用自己法度後遂為人所劾罷然畢竟謂之是不得葢大不可行則有去而已直行已意固不可也今之監司多不與州縣一體監司專欲伺察州縣專欲揜蔽不若推誠心與之共治有所不逮可教者教之可督者督之至于不聽擇其甚者去一二使足以警衆可也伺音四又音斯伺察下葉本有州縣二字遺書無去上聲司監司如宋之轉運提刑諸使是也首四句言今時監之弊不若以下則為監司論所以待屬官之道也推誠心與之共治正所以與州縣一體者也不能共治者則教之教之而不從者則督之總欲與為一體而已伊川先生曰人惡多事或人憫之世事雖多盡是人事人事不教人做更責誰做惡去聲教平聲為呉氏曰人能各盡其所當之事則世事何患其多明道曰感慨殺身者易從容就義者難易音異從音冲再朱子曰從容是徐徐義理不精思之三或汨于利害而止此所以為難人或勸伊川先生以加禮近貴先生曰何不見責以盡禮而責之以加禮禮盡則已豈有加也盡禮則止循夫分所當然不使有欠缺而已加則溢于本分之外其極至于由竇吠籬無所不至不可以不謹也朱子曰觀程子之言則為人僚属世俗常禮有不可廢者亦自當隨例不須大段立異不濟得事徒為人所指目憎嫌却費調䕶求寛假所屈愈多也或問簿佐令者也簿所欲為令或不從奈何曰當以誠意動之今令與簿不和只是争私意令是邑之長若能以事父兄之道事之過則歸已善則惟恐不歸于令積此誠意豈有不動得人長張文反簿縣主簿也按宋制縣千戸以上置令尉主簿凡三員户不滿千置令尉縣令兼主簿事户不滿四百止置主簿尉以主簿兼知縣事戸不滿二百止置主簿兼令尉益唐簿之上有丞而宋無之故曰簿佐令者也此章言事上官之道亦不獨簿之于令當然也各愚按程子之言誠善然令亦當推誠與之共治使得舉其職然後從而考其成以計功過如此則已既不煩而属官亦争相淬勵以自效兼可使歴練吏事此亦所以教誨之也問人於議論多欲直已無含容之氣是氣不平否曰固是氣不平亦是量狹人量隨識長亦有人識高而量不長者是識實未至也大凡别事人都强得惟識量不可强長並張丈反强並區兩反下同識以所見言量以所容言今人有斗筲之量有釡斛之量有鐘鼎之量有江河之量釡周禮作鬴鐘與鍾同古字通用十升為斗筲竹器容斗二升釡容六斗四升十斗為斛鍾樂器鼎烹飪之器鐘鼎皆古重器故並言非鍾釡之鍾也江河之量亦大矣然有涯有涯亦有時而滿惟天地之量則無滿故聖人者天地之量也聖人之量道也常人之有量者天資也天資有量湏有限大抵六尺之軀力量只如此雖欲不滿不可得也如鄧艾位三公年七十處得甚好及因下蜀有功便動了便動了下遺書有言姜維云云五字軍鄧艾字士載棘陽人司馬宣王辟為掾累遣征西將平蜀進位太尉為衛瓘所害艾與漢姜維相持毎戰輙身先士卒以子忠戰不利引退叱出將斬之馳還更戰大勝及蜀君臣靣縛輿櫬詣軍門降艾執節解縛焚櫬受而宥之檢御将士無所虜畧綏納降附使復舊業皆所謂處得甚好也其遺書有言姜維云云者按魏志鄧艾傳艾深自矜伐謂蜀士大夫曰諸軍頼遭某故得有今日耳如遇呉漢之徒已殄滅矣又曰姜維自一時雄兒也與某相值故窮耳有識者笑之所謂因下蜀有功而動也謝安聞謝𤣥破苻堅對客圍碁報至不喜及歸折屐齒强終不得也謝安見前𤣥字幼度鎮西將軍第三子也苻堅蒲洪子也洪以讖文有草付應王又其孫堅背有草付字遂改姓苻俗本從竹作符者誤秦苻堅率衆號百萬次于淮肥𤣥與安子琰及桓伊等以精銳八千渡水决戰破之㨗書至安方對客圍碁看書既竟便攝放牀上了無喜色碁如故客問之徐答曰小兒輩遂已破賊既罷還内過戸限心甚喜不覺屐齒之折其矯情鎮物如此愚按史非以屐齒之折為喜葢特以形容其喜之至故雖屐齒已折而猶不自覺耳不然則屐齒之折初何闗于喜喜亦豈能折屐之齒耶胡氏曰人以小小功業動其心只是不識義理如鄧艾下蜀助簒逆以滅人之國罪大矣謝安時中原淪没不能匡復僅得一勝而屐齒折器量之小可知更如人大醉後益恭謹者只益恭謹便是動了雖與放肆者不同其為酒所動一也又如貴公子位益高益卑謙只卑謙便是動了雖與驕傲者不同其為位所動一也只益恭下吕本無謹字遺書同為並去聲然惟知道者量自然宏大不勉强而成今人有所見卑下者無他亦是識量不足也人纔有意於為公便是私心呉氏曰有意為公即南軒所謂有所為而為之者也昔有人典選其子弟係磨勘皆不為理此乃是私心心葉本作意以係該也磨勘宋制文武官吏皆按年分磨勘其功績轉陞官階也此以明上文有意為公便是私心之意人多言古時用直不避嫌得後世用此不得自是無人豈是無時直謂直道也此指不避嫌而言古時用直三句乃程子述時人之言如此自是無人二句言當用直不必避嫌以見無古今之異也本註因言少師典舉明道薦才事少師諱羽字冲逺官尚書兵部侍郎贈太子少師二程先生之高王父也太平興國五年典試貢士得人居多其典舉不避嫌䖏未詳明道薦才者神宗嘗使明道推擇人才明道所薦者數十人而以父表弟張載暨弟頥為首引此以明自是無人豈是無時之意君實嘗問先生云欲除一人給事中誰可為者先生曰初若泛論人才却可今既如此頥雖有其人何可言君實曰出于公口入于光耳又何害先生終不言給事中掌封駁之官唐宋屬門下省以有事殿中因名朱子曰于此可見前賢語黙之節學者最宜詳味先生云韓持國服義最不可得一日頥與持國范夷叟泛舟於頴昌西湖須臾客將云有一官員謁見大資頥將為有甚急切公事乃是求知己頥云大資居位却不求人乃使人倒來求已是甚道理客將之將去聲大如字為去聲下同公韓持國名維忠憲公億子也范夷叟名純禮文正仲淹子也頴昌即許州元豐三年升為頴昌府葢以神宗自頴王升儲故也今𨽻開封府西湖上有徳星亭漢時為陳寶荀淑建也客將即牙將以其主客徃來因名張繹師説作典謁按王偁東都事畧持國于元祐二年以資政殿大學士出知鄧州改汝州知頴昌府而宋史但云知鄧州猶王薛兩通鑑因之葢以無事而畧之耳資政稱大資者叅政稱大叅觀文稱大觀也不求人者在我為失士例來求者在人為失已此人已兩失也按洛至頴昌四百里夷叟云只為正叔太執求薦章常事也頥云不然只為曽有不求者不與來求者與之遂致人如此持國便服正叔一作姨夫便一作大兩又祁寛録尹氏語謂持國與兩先生善欲屈致之先生至暇則同逰西湖愚按韓公明道墓誌謂先生罷扶溝貧無以家寓止頴昌余方為守遂得從先生逰葢韓公知頴昌凡三其再知頴昌則明道同伊川寓止而祁録所謂暇則同逰西湖者也元祐初韓公復出守頴昌則明道已卒而伊川徃訪同韓范二公逰也此自是二事吕氏童䝉訓謂韓公閒居頴昌伊川自洛徃訪時范右丞夷叟亦居頴昌但伊川明云大資居位且有官員求知而伊川復以不求人責之則吕氏閒居之誤明矣又按持國有與明道湖上獨酌詩云曲肱飲水程夫子晏坐焚香范使君似夷叟居頴昌乃在明道罷扶溝時後讀曾文昭公忠宣墓誌有請還頴昌里第語然則范氏固僑居頴昌故前後並得同逰與先生因言今日供職只第一件便做他底不得吏人押申轉運司狀頥不曾簽國子監自係臺省臺省係朝廷官外司有事合行申狀豈有臺省倒申外司之理只為從前人只計較利害不計較事體直得恁地為去聲西元符三年復以伊川判京國子監既受命即謁告欲遷延為尋醫計既而供職門人尹焞疑之先生曰吾之不能仕葢已决矣但以上初即位首被大恩不如是何以仰承德意受一月之俸焉然後惟吾所欲耳此葢先生供職之初既以解門人之疑而因以此語之也押者文書作花字也亦謂之署字簽簽押也國子監自是五監非臺省也以臺省寺監四者皆朝廷官故概言之國子以下明所以不簽之故只計較利害者抑之葢恐内太重必有植黨營私之患故令倒申外司以稍耳事體者内外尊卑之體統也恁地猶言如是也也葉氏曰春秋書法王人雖微序于諸侯之上尊王須看聖人欲正名處見得道名不正時便至禮樂不興是自然住不得説見論語引此以明上文之意見非故為矯異也學者不可不通世務天下事譬如一家非我為則彼為非甲為則乙為世務如天文地理禮樂制度兵刑皆是甲乙説見前朱子曰范文正公自為秀才時便以天下為己任無一事不理㑹過一旦仁宗大用之便做出許多事業人無逺慮必有近憂思慮當在事外外書下同之在事外謂慮之逺也如不為旦夕苟且計不為目前自便之策是也伊以上並川語聖人之責人也常緩便見只欲事正無顯人過惡之意只欲事正公也無顯人過惡之意恕也公而恕所以責人常緩伊川先生云今之守令惟制民之産一事不得為其他在法度中甚有可為者患人不為耳吕希哲于治平中見先生而先生語之以此甚有可為者如訓士則設書院明禮讓之類養民則修陂塘興水利以及常平平糶之類朱子曰徒賑濟于凶荒之餘雖善不濟事明道先生作縣凡坐處皆書視民如傷四字嘗曰顥常愧此四字楊氏曰觀先生之用心應是不錯決撻了人古人于民若保赤子為其無知也無知則不察利害所在教之趨利避害全在保者故凡事疑有後害或于民所見未到者常與他作主始得伊川先生每見人論前輩之短則曰汝輩且取他長處祁寛問尹和靖伊川謂永叔如何尹氏曰前輩不言人短因遂以此告之也朱子曰此意甚善學者見二先生自許之高便都有下視前輩意此風不可長也劉安禮云王荆公執政議法改令言者攻之甚力明道先生嘗被㫖赴中堂議事荆公方怒言者厲色待之先生徐曰天下之事非一家私議願公平氣以聽荆公為之媿屈附録下同安劉立之字禮河間人程子門人也郭雍稱其登門最早精于吏事云中堂中書堂也中書省堂為中堂者猶尚書都省堂稱都堂也按宋制宰相議事及見客于中堂樞宻議事及見客于都堂中堂亦曰政事堂時先生權監察御史裏行故被召議事朱子曰所謂平氣者非欲使甲操乙之見乙守甲之説也亦非謂都不論事之是非也但欲姑暫置其是已非彼之意然後可耳以據事論理而終得其是非之實劉安禮問臨民明道曰使民各得輸其情輸送也如物相輸送也民得輸其情而後民之情有以上逹或有不平處上之人得以平之則民自無不得其所之患矣問御吏曰正已以格物格感格也言正已而推之以格夫物也葢必正已而後物可以格非謂已正而物自無不格可無事防檢勸懲之道也横渠先生曰凡人為上則易為下則難然不能為下亦未能使下不盡其情偽也大抵使人句常在其前已嘗為之句則能使人熊氏呉氏並于其前句絶非情文集上下以上下司而言實也為上者出令以使人故易為下者聽命于人故難然或苦于為下之難而不能為則下之情偽有所不知不但為所欺罔而已之所以使之者亦必不能以盡其道故亦未能以使下也葢使人作事常于其前身自為之則有以盡其情偽所以能使人也判愚按古人言為縣令者必為丞簿為郡守者必為通為監司者必為郡守不然雖有善政不宜驟擢其見葢與此合當不但欲使之親民知利害所在而已坎維心亨故行有尚外雖積險苟處之心亨不疑則雖難必濟而徃有功也難去聲為葉氏曰坎維心亨二語坎卦彖辭也坎重險故曰積險二五以剛居中故外雖有積險其中心自亨通而無所疑懼也心亨而無疑則可以出險矣今水臨萬仞之上要下即下無復凝滯險在前惟知有義理而已則復何回避所以心通險楊葉吕本並作之言易説下同苟熊氏曰此以坎象而人于義理能信之篤行之决如水之就下沛然莫禦何徃而不心亨哉愚按臨萬仞之山所謂積險也要下即下無復凝滯所謂䖏之心亨不疑也險在前以下申明所以要下即下無復凝滯之意人所以不能行已者於其所難者則惰其異俗者雖易而羞縮惟心𢎞則不顧人之非笑所趨義理耳視天下莫能移其道易音異趨心𢎞而不顧人之非笑則無羞縮之患矣義理而莫能移其道則無有惰之患矣然為之人亦未必怪正以在己者義理不勝惰與羞縮之病或于不勝句絶非消則有長不消則病常在意思齷齪無由作事長張丈反義消指惰與羞縮之病而言長謂理之心齷齪急促局陿貎在古氣節之士冐死以有為于義未必中然非有志概者莫能况吾于義理已明何為不為中去聲顧釋大壮卦彖辭冐死有為則死且不何有惰與羞縮之為患乎于義未必中見義理未必素明而臨難且有所不避也不為指惰與羞縮而言也朱子曰近世士大夫不以節操為事凡事回互却笑人慷慨奮發以為必蹈于矯激之禍此風更不可長蓋事只論當為與不當為如當為豈可避矯激之名而不為乎姤初六羸豕孚蹢躅豕方羸時力未能動然至誠在于蹢躅得伸則伸矣葉氏曰羸弱也孚必也蹢躅跳躍也豕性陰躁雖當羸弱之時其誠心未嘗不在于動也得肆則肆矣猶小人雖困志在求逞君子所當察也胡氏曰五陽之下一陰甚微故于豕為羸言王伯厚曰一許敬宗在文館唐為武氏矣一楊畏居路元祐為紹聖矣羸豕之孚左腹之入可不戒哉如李德裕處置閹宦徒知其帖息威伏而忽于志不忘逞照察少不至則失其幾也閹一作羣也一作矣大李德裕字文饒唐趙郡人宰相吉甫子武宗時賢相中初貶崖州司户㕘軍三年卒閹經傳通作奄以其精氣奄閉因名良愚按張子謂德裕照察少不至則失其㡬然觀仇士教其黨以奢靡蠱惑其君勿使讀書親近儒生以知前代興亡然後吾輩可以得志而徳裕不之知也則此輩布置之宻與徳裕防閑之疎可以概見恐并未能帖息威㐲也惟劉楊二樞宻以愿慤不敢與事已為老宦所尤他可知矣卒之定策大事權歸宦寺徳裕束手見逐其所由來漸矣嗚呼以士良之策早得反其道而用之正君定國無踰此者雖百士良其何能為而惜乎其不能也人教小童亦可取益絆已不出入一益也絆音半也絆牽繫授人數數已亦了此文義二益也數並入聲也數數猶頻頻了明了也對之必正衣冠尊瞻視三益也常以因已而壞人之才為憂則不敢惰四益也壊音怪惰葉本作墮語録按此條所論皆教小童時所以自處之道非論教小童之道也葉氏謂當在十一卷者非朱子曰更須自己勉力使義理精通踐履篤實足以應學者之求而服其心則成已成物兩無虧欠矣愚按朱子謂此書所録雜毎卷不可以一事名如此卷不可以事君目之以末有人教小童一段在耳然細玩各條乃泛論處事接物之道居多其言事君者僅三十餘條正不獨末條有人教小童一段在也以上並横渠語近思録集註卷十欽定四庫全書近思録集註卷十婺源江永撰朱子曰此卷處事之方伊川先生上疏曰夫鐘怒而撃之則武悲而擊之則哀誠意之感而入也告於人亦如是古人所以齋戒而告君也臣前後兩得進講未嘗敢不宿齋預戒潛思存誠覬感動於上心若使營營於職事紛紛其思慮待至上前然後善其辭説徒以頰舌感人不亦淺乎問伊川未進講時有間斷否朱子曰尋常未嘗不誠臨見君時又加意爾如孔子沐浴而告哀公是也文集下同伊川答人示奏藁書云觀公之意專以畏亂為主頤欲公以愛民為先力言百姓饑且死丐朝廷哀憐因懼將為冦亂可也不惟告君之體當如是事勢亦宜爾公方求財以活人祈之以仁愛則當輕財而重民懼之以利害則將恃財以自保古之時得邱民則得天下後世以兵制民以財聚衆聚財者能守保民者為迂惟當以誠意感動覬其有不忍之心而已葉氏曰後世以兵制民謂民有所不足畏以財養兵謂財有所不可闕於是以聚財為守國之道以愛民為迂緩之事苟徒懼之以禍亂則無惻隠愛民之心愈増其聚財自守之慮矣明道為邑及民之事多衆人所謂法所拘者然為之未嘗大戾於法衆亦不甚駭謂之得伸其志則不可求小補則過今之為政者逺矣人雖異之不至指為狂也至謂之狂則大駭矣盡誠為之不容而後去又何嫌乎葉氏曰先生道徳之盛從容裁處故不大戾當時之法而有補於民人亦不至於駭者亦其存心寛平而區處有方也盡誠為之不容而後去又可見先生忠厚懇惻之心豈若悻悻小丈夫之為哉永按先生為邑正熙寧行新法之時明道先生曰一命之士苟存心於愛物於人必有所濟葉氏曰苟存愛物之心必有及物之效伊川先生曰君子觀天水違行之象知人情有爭訟之道故凡所作事必謀其始絶訟端於事之始則訟無由生矣謀始之義廣矣若慎交結明契劵之類是也易傳下同師之九二為師之主恃專則失為下之道不專則無成功之理故得中為吉凡師之道威和並至則吉也葉氏曰不恃專者如衛青不敢專誅歸諸天子使自裁是也專者如將在軍君令有所不受是也威而不和則懼而離和而少威則玩而弛九二剛中故有威和交濟之象世儒有論魯祀周公以天子禮樂以為周公能為人臣不能為之功則可用人臣不得用之禮樂是不知人臣之道也夫居周公之位則為周公之事由其位而能為者皆所當為也周公乃盡其職耳師九二傳永按臣事君猶子事親皆無遇分之事大有之九三四公用亨于天子小人弗克傳曰三當大有之時居諸侯之位有其富盛必用亨通於天子謂以其有為天子之有也乃人臣之之常義也若小人處之則專其富有以為私不知公已奉上之道故曰小人弗克也朱子曰古人於亨字作享烹字通用公用亨於天子分明是享字解作亨字不是葉氏曰如朝鞄供貢之儀凡所以奉上之道皆不敢自有其有隨九五之象曰孚于嘉吉位正中也傳曰隨以得中為善隨之所防者過也蓋心所説隨則不知其過矣人心所從多所親愛者也常人之情愛之則見其是惡之則見其非故妻孥之言雖失而多從所憎之言雖善為惡也苟以親愛而隨之則是私情所與豈合正理故隨之初九出門而交則有功也葉氏曰出門而交則無所係累而所從者有功坎之六四曰樽酒簋貳用缶納約自牖終无咎傳曰此言人臣以忠信善道結於君心必自其所明處乃能入也人心有所蔽有所通通者明處也當就其明處而告之求信則易也故曰納約自牖能如是則雖艱險之時終得无咎也葉氏曰牖者室中所以通明也且如君心蔽於荒樂唯其蔽也故爾雖力詆其荒樂之非如其不省何必於所不蔽之事推而及之則能悟其心矣自古能諫其君者未有不因其所明者也故訐直強勁者率多取忤而溫厚明辨者其説多行朱子曰事君匡救其惡是正理伊川説納約自牖又是一等葉氏曰訐直則無委曲强勁則乏和順溫厚者其氣和明辨者其理著非唯告於君者如此為教者亦然夫教必就人之所長所長者心之所明也從其心之所明而入然後推及其餘孟子所謂成徳逹財是也恒之初六曰浚恒貞凶象曰浚恒之凶始求深也傳曰初六居下而四為正應四以剛居高又為二三所隔應初之志異乎常矣而初乃求望之深是知常而不知變也世之責望故素而至悔咎者皆浚恒者也朱子曰浚恒是欲深以常理求人遯之九三曰係遯有疾厲畜臣妾吉傳曰係戀之私恩懷小人女子之道也故以畜養臣妾則吉然君子之待小人亦不如是也問小人女子近之則不遜專以私恩懷之未必不有悔吝而此以為吉何耶朱子曰此爻不可大事但可畜臣妾耳御下而有以懐之未為失正但恐所以懐之者失其正耳問畜臣妾吉傳曰待臣妾之道君子之待小人亦不如是如何曰君子小人更不可相接若臣妾是終日在自家身邊若無以懐之則望望然去矣睽之象曰君子以同而異傳曰聖賢之處世在人理之常莫不大同於世俗所同者則有時而獨異不能大同者亂常拂理之人也不能獨異者隨俗習非之人也要在同而能異耳朱子曰君子有同處有異處如周而不比羣而不黨是也此處伊川説得甚好又如今之言地理者必欲擇地之吉是同也不似世俗專以求富貴為事惑亂此心則異矣如士人應科舉則同也不曲學以阿世則異矣事事推去斯得其㫖睽之初九當睽之時雖同徳者相與然小人乖異者至衆若棄絕之不幾盡天下以仇君子乎如此則失含宏之義致凶咎之道也又安能化不善而使之合乎故必見惡人則无咎也古之聖王所以能化姦凶為善良革仇敵為臣民者由弗絕也睽之九二當睽之時君心未合賢臣在下竭力盡誠期使之信合而已至誠以感動之盡力以扶持之明理義以致其知杜蔽害以誠其意如是宛轉以求其合也遇非枉道逢迎也巷非邪僻由徑也故象曰遇主於巷未失道也損之九二曰弗損益之傳曰不自損其剛貞則能益其上乃益之也若失其剛貞而用柔説適足以損之而已世之愚者有雖無邪心而惟知竭力順上為忠者蓋不知弗損益之之義也葉氏曰剛正不撓乃能有益於君九二剛中非有邪心者但當損下益上之時惟知損己以奉上而不知臣道之少貶未有能致益其君者益之初九曰利用為大作元吉无咎象曰元吉无咎下不厚事也傳曰在下者本不當處厚事厚事重大之事也以為在上所任所以當大事必能濟大事而致元吉乃為无咎能致元吉則在上者任之為知人已當之為勝任不然則上下皆有咎也朱子曰初九上為四所任而作大事必盡善而後无咎若所作不盡善未免有咎也故釋之曰下不厚事也蓋在下之人不當重事若在下之人為在上之人作事未能盡善自應有咎又云不惟已不安而亦累於上向編近思録説與伯恭此一叚非常有不必入伯恭云既云非常有則有時而有豈可不書以為戒後思之果然革而無甚益猶可悔也况反害乎古人所以重改作也革彖傳葉氏曰苟非有大益無後患君子不輕改作漸之九三曰利禦冦傳曰君子之與小人比也自守以正豈惟君子自完其己而已乎亦使小人得不陷於非義是以順道相保禦止其惡也葉氏曰小人近正亦不敢為惡旅之初六曰旅瑣瑣斯其所取災傳曰志卑之人既處旅困鄙猥瑣細無所不至乃其所以致悔辱取災咎也葉氏曰此教人處旅困之道當畧細故存大體斯免悔咎在旅而過剛自高致困災之道也旅九三傳葉氏曰過剛則暴戾而无和順自高則驕亢而人不親附兑之上六曰引兑象曰未光也傳曰説既極矣又引而長之雖説之之心不已而事理已過實無所説事之盛則有光輝旣極而强引之長其無意味甚矣豈有光也中孚之象曰君子以議獄緩死傳曰君子之於議獄盡其忠而已於决死極其惻而已天下之事無所不盡其忠而議獄緩死最其大者也事之時而當過所以從宜然豈可甚過也如過恭過哀過儉大過則不可所以小過為順乎宜也能順乎宜所以大吉小過傳朱子曰三者之過皆小者之過可過於小而不可過於大可以小過而不可甚過防小人之道正己為先小過九三傳葉氏曰已正則彼雖奸詐無間之可乘矣周公至公不私進退以道無利欲之蔽其處已也䕫䕫然存恭畏之心其存誠也蕩蕩焉無顧慮之意所以雖在危疑之地而不失其聖也詩曰公孫碩膚赤舄几几朱子曰孫讓也碩大也膚美也赤舄冕服之舄也几几安重貌公遭流言之變而其安肆自得乃如此蓋其道隆徳盛而安土樂天有不足言者所以遭大變而不失其常也葉氏曰當危疑之地旣不忿戾而改常亦不疑懼而失守經説下同採察求訪使臣之大務朱子曰詩云載馳載驅周爰咨諏使臣自以毎懷靡及故廣詢博訪以補其不及而盡其職也葉氏曰採察民隠求訪賢才使職之大者也明道先生與吳師禮談介甫之學錯處謂師禮曰為我盡逹諸介甫我亦未敢自以為是如有説願徃復此天下公理無彼我果能明辯不有益於介甫則必有益於我永按介甫惟自以為是先生以虚公無我之説箴之而介甫終不能改也遺書下同天祺在司竹常愛用一卒長及將代自見其人盗筍皮遂治之無少貸罪已正待之復如初畧不介意其徳量如此葉氏曰徳量大則不為喜怒所遷因論口將言而囁嚅云若合開口時要他頭也須開口本註如荆軻於樊於期事見史記刺客傳須是聽其言也厲朱子曰所謂合開口者亦曰理之所當然耳樊於期事非理之所當言者蓋取其事之難言而猶言之非以為理之當言也須是就事上學蠱振民育徳然有所知後方能如此何必讀書然後為學葉氏曰振民育徳修已治人之事然必知之至而後行之至無非學也豈但讀書而後謂之學哉程子之教固以讀書窮理為先務然不就事而學則捨簡冊之外凡應事接物之際不知所以用力其學之間斷多矣與子路之言意異先生見一學者忙廹問其故曰欲了幾處人事曰某非不欲周旋人事者曷嘗似賢急廹葉氏曰事雖多為之必有序事雖急應之必有節未聞可以急遽苟且而處之者安定之門人徃徃知稽古愛民矣則於為政也何有葉氏曰胡安定教學者以通經術治時務明體適用故其門人皆知以稽古愛民為事稽古則為政之法愛人則為政之本門人有曰吾與人居視其有過而不告則於心有所不安告之而人不受則奈何曰與之處而不告其過非忠也要使誠意之交通在於未言之前則言出而人信矣又曰責善之道要使誠有餘而言不足則於人有益而在我者無自辱矣永按誠有餘而言不足謂誠至而不為煩數也其進言之時自當宛轉間導非謂言不可盡如是而人猶不受則夫子亦謂不可則止矣職事不可以巧免葉氏曰職所當為而巧圖規避自私用智之人也居是邦不非其大夫此理最好永按夫子答練而杖之問指其人則言不知不指其人則言非禮是也事見家語蓋居是邦當存敬上之心也若非居是邦或為是邦之先大夫則議論固有及之者矣由是推之今時郡縣官員長短得失亦非君子所宜言克勤小物最難永按克勤小物惟精宻謹慤者能之亦惟才大者能不忽於小欲當大任須是篤實葉氏曰篤實則力量深厚而謀慮深固斯可以任大事凡為人言者理勝則事明氣忿則招怫永按為人言者從容以理譬喻之則人易曉而言易入矣居今之時不安今之法令非義也若論為治不為則已如復為之須於今之法度内處得其當方為合義若須更改而後為則何義之有朱子曰不安今之法令謂在下位者永按明道先生為邑當法令繁密之深未嘗從衆為應文逃責之事而亦不病其拘礙者今之法度内處得其當也今之監司多不與州縣一體監司專欲伺察州縣專欲掩蔽不若推誠心與之共治有所不逮可教者教之可督者督之至於不聽擇其甚者去一二使足以警衆可也伊川先生曰人惡多事或人憫之世事雖多盡是人事人事不教人做更責誰做永按有厭事之心則有怠惰荀且之病知其為人所當為則雖多而不厭矣感慨殺身者易從容就義者難問如何是從容就義朱子曰從容謂徐徐但義理不精則思之再三或汩於利害却悔了此所以為難人或勸先生以加禮近貴先生曰何不見責以盡禮而責之以加禮禮盡則已豈有加也葉氏曰與孟子不與右師言意同永按不妄悦人卽是盡禮或問簿佐令者也簿所欲為令或不從奈何曰當以誠意動之今令與簿不和只是爭私意令使邑之長若能以事父兄之道事之過則歸己善則唯恐不歸於令積此誠意豈有不動得人永按此條合之監司一條上之使下下之事上皆以誠為本問人於議論多欲直已無含容之氣是氣不平否曰固是氣不平亦是量狹人量隨識長亦有人識高而量不長者是識實未至也葉氏曰見識陋則人已得失之間皆為之動是即量之狹也故識長則量亦長大凡别事人都强得惟識量不可强今人有斗筲之量有釜斛之量有鍾鼎之量有江河之量江河之量亦大矣然有涯有涯亦有時而滿惟天地之量則無滿故聖人者天地之量也聖人之量道也常人之有量者天資也天資之量須有限葉氏曰聖人之心純乎道道本無外故其量亦無涯大抵六尺之軀力量只如此雖欲不滿不可得也如鄧艾位三公年七十處得甚好及因下蜀有功便動了謝安聞謝𤣥破苻堅對客圍碁報至不喜及歸折屐齒强終不得也更如人大醉後益恭謹者只益恭便是動了雖與放肆者不同其為酒所動一也又如貴公子位益高益卑謙只卑謙更是動了雖與驕傲者不同其為位所動一也葉氏曰居之如常而不為異者量足以勝之也一冇意於其間雖驕肆謙恭之不同要皆為彼所動也然惟知道者量自然宜大不待勉强而成永按此所謂量隨識長也然此亦謂大賢以下之人若聖人與道如一更不必言知道今人有所見卑下者無他亦是識量不足也人纔有意於為公便是私心昔有人典選其子弟係磨勘皆不為理此乃是私心人多言古時用直不避嫌得後世用此不得自是無人豈是無時本註因言少師典舉明道薦才事永按不為理磨勘者避私嫌也有意避嫌雖公亦私苟能以大公之心行之當遷則遷當黜則黜何嫌之避亦何時而不可行程子謂凡人避嫌者内不足也内不足則上不見信於君下不見信於友欲不避嫌而不得矣君實嘗問先生云欲除一人給事中誰可為者先生曰初若泛論人才却可今旣如此頤雖有其人何可言君實曰出於公口入於光耳又何害先生終不言冏伊川不答温公給事中如何朱子曰自是不容預如兩人有公事在官為守令者來問自不當答問者已是失曰此莫是避嫌否曰不然本原已不是與避嫌異永按問者為失言言之則為出位當黙而黙制義之方也先生云韓持國服義最不可得一日頤與持國范夷叟泛舟於頴昌西湖須臾客將去有一官員上書謁見大資頤將謂有甚急切公事乃是求知己頤云大資居位却不求人乃使人倒來求已是甚道理夷叟云只為正叔大執求薦章常事也頤云不然只為曾有不求者不與來求者與之遂致人如此持國便服韓維字持國范淳理字夷叟葉氏曰求知者失己使之求知者失士先生因言今日供職只第一件便做他底不得吏人押申轉選司狀頤不會簽國子監自係臺省臺省係朝廷官外官有事合得行申狀豈有臺省且申外司之理只為從前人只計較利害不計較事體直得恁地須看聖人欲正名處見得道名不正時便至禮樂不興是自然住不得朱子曰明道徳性寛大規模廣伊川氣質剛方文理宻察其道雖同而造徳各異故明道嘗為條例司官不以為凂而伊川所作行狀乃獨不載其事明道猶謂青苗可且放過而伊川乃於西監一狀計較如此此可謂不同矣然明道之放過乃孔子之獵較為兆而伊川之一一理會乃孟子之不見諸侯也此亦何害其為同耶但明道所處是大賢以上事學者未至而輕議之恐失所守伊川所處雖髙然實中人皆可跋及學者只當以此為法則庻乎寡過矣然又當觀用之淺深事之大小裁酌其宜難執一意此君子所以貴窮理也程子所論西監申狀之事尢足以驗聖言於日用之間學者不可不通世務天下事譬如一家非我為則彼為非甲為則乙為葉氏曰君子存心正大如此其所以講明世務者亦非分外之事也已上並遺書人無逺慮必有近憂思慮當在事外永按思慮在事外則圖之早防之周而近患可免矣外書下同聖人之責人也常淺使見只欲事正無顯人過惡之意伊川先生云今之守令惟制民之産一事不得為其他在法度中甚有可為者患人不為耳永按法度中有可為之事惟有愛人之實心者能為之明道先生作縣凡坐處皆書視民如傷四字常曰顥常愧此四字伊川毎見人論前輩之短則曰汝輩且取他長處永按前輩之短非所當議舎短取長則有進徳之益而無浮薄之失劉安禮云王荆公執政議法改令言者攻之甚力明道先生嘗被㫖赴中堂議事荆公方怒言者厲色待之先生徐曰天下之事非一家私議願公平氣以聽荆公為之媿屈劉立之字安禮程子門人王荆公安石葉氏曰從容一言之間有以破其私已之見消其忿厲之氣附録下同劉安禮問臨民明道先生曰使民各得輸其情問御吏曰正己以格物葉氏曰使民各得輸其情惟平易聰達者能之永按正己以格物不徒恃乎苛察嚴威也横渠先生曰凡人為上則易為下則難然不能為下亦未能使下不盡其情偽也大抵使人常在其前已嘗為之則能使人永按已嘗事人則使之之際能盡其情而亦能知其偽文集坎維心亨故行有尚外雖積險苟處之心亨不疑則雖難必濟而徃有功也今水臨萬仭之山要下即下無復凝滯之在前惟知有義理而已則復何囘避所以心通葉氏曰坎為重險二五以剛居中其心自亨通心亨而無疑則可以出險矣人於義理苟能信之篤行之决如水之就下則何徃而不心亨哉易説下同人所以不能行己者於其所難者則惰其異俗者雖易而羞縮惟心宏則不顧人之非笑所趨義理耳視天下莫能移其道永按心大而志立故無羞縮與惰之病然為之人亦未必怪永按難能異俗之事義理所當為故人亦終不之怪正以在己者義理不勝惰與羞縮之病消則有長不消則病常在意思齷齪無由作事永按惰與羞縮之病常與義理相為消長在古氣節之士冒死以有為於義未必中然非有志槩者莫能况吾於義理已明何為不為葉氏曰舉重明輕所以激昻柔懦之士姤初六羸豕孚蹢躅豕方羸時力未能動然至誠在於蹢躅得伸則伸矣如李徳裕處置閹宦徒知其帖息威伏而忽於志不忘逞炤察少不至則失其幾也葉氏曰唐武宗時徳裕為相君臣契合莫能間之宦官帖息畏伏若無能為而不知其志在求逞也繼嗣重事卒定於宦者之手而徳裕逐矣幾㣲之間所當深察人教小童亦可取益絆已不出入一益也授人數數上數如字下數音朔謂授書遍數多也已亦了此文義二益也對之必正衣冠尊瞻視三益也常以因己而壞人之才為憂則不敢惰四益也永按教小童者或多出入授書草率惰慢無威儀不顧壞人才是不善取四益矣語録近思録集註卷十
