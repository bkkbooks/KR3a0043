body:
  text: 近思録集注卷十四歸安茅星來撰觀聖賢几二十六條明道先生曰堯與舜更無優劣及至湯武便别孟子言性之反之自古無人如此說只孟子分别出來便知得堯舜是生而知之湯武是學而能之文王之德則似堯舜禹之德則似湯武要之皆是聖人遺書上同仲尼元氣也顔子春生也孟子並秋殺盡見見音現仲尼無所不包顔子示不違如愚之學於後世有自然之和氣不言而化者也孟子則露其材蓋亦時然而已問孟子露其材蓋亦時然而已豈孟子亦有戰國之習否朱子曰亦是戰國之習如三代人物自是一般氣象左傳所載春秋人物又是一般氣象戰國人物又是一般氣象仲尼天地也顔子和風慶雲也孟子泰山巖巖之氣象也觀其言皆可見之矣仲尼無迹顔子微有迹孟子其迹著孔子儘是明快人顔子儘豈弟孟子儘雄辨豈弟愷悌同伊川先生曰曾子傳聖人學其德後來不可測安知其不至聖人如言吾得正而斃且休理㑹文字只看他氣象極好被他所見處大後人雖有好言語只被氣象卑終不類道遺書又曰曽子疾病只要以正不慮死與武王殺一不辜行一不義得天下不為同心傳經為難如聖人之後才百年傳之已差聖人之學若非子思孟子則幾乎息矣道何嘗息只是人不由之道非亡也幽厲不由也差初加反舒漢書董仲對賢良策云夫周道衰於幽厲非道亡也幽厲不絲也荀卿才高其過多揚雄才短其過少卿吕本作子葉荀卿名况字卿為楚蘭陵令揚雄見前氏曰荀子才高過多如以人性為惡子思孟子為非是也揚雄才短過少如作太𤣥擬易作法言擬論語皆摹倣前聖遺言是也朱子曰荀子亦有說得好處君子大心則天而道小心則畏義而節又如說能定而後能應皆是好語揚子無好處說到深處只是走入老莊窠窟裏去如清靜寂寞之說皆是也荀子極偏駁只一句性惡大本已失揚子雖少過然已自不識性更說甚道荀子性惡篇人之性惡其善者僞也揚子修身篇人之性也善惡混修其善則為善人修其惡則為惡人氣者所識善惡之馬也此因韓退之有荀與揚大醇小疵之說而論之如此朱子曰程子說荀子極偏駁揚子雖少過此等語皆是就分金稱上說下來若不曾看荀子揚子則所謂偏駁少過等處亦見不得董仲舒曰正其義不謀其利明其道不計其功此董子所以度越諸子仲舒語見第二卷度越諸子見漢書揚雄贊顔師古曰度􅂒也或謂此語是有是非無利害如何朱子曰是不論利害只論是非理固然也要亦當權其輕重方盡善但今人止知有利害於是非全輕也川以上並伊語漢儒如毛萇董仲舒最得聖賢之意然見道不甚分明下此即至揚雄規模又窄狹矣萇後漢書作長間按孔氏毛詩正義漢書儒林傳云毛公趙人也為河獻王博士不言其名范曄後漢書云趙人毛萇傳詩初學記荀卿授魯國毛亨作詁訓傳以授趙國毛萇時人謂亨為大毛公萇為小毛公朱子曰董子識得本原如云正心修身可以治國平天下又仁義禮樂皆其具俱說得好問見道不分明處曰如命者天之令性者生之質情者人之欲命非聖人不行性非教化不成情非制度不節等語似不識性善模樣又云明於天性知自貴於物知自貴於物然後知仁義知仁義然後重禮節重禮節然後安處善安處善然後樂循理又似見得性善模樣終是說得騎墻不甚分明端的問何故而取毛公曰考之詩傳緊要有數處如關睢所謂夫婦有别則父子親父子親則君臣敬君臣敬則朝廷正朝廷正則王化成要之亦不多見只是氣象大概好伊川先生曰林希謂揚雄為祿隱揚雄後人只為見他著書便須要做他是怎生做得是只為之為去聲囊按遺書或問括還做得在位使否先生曰六四位是在上然坤之六四却是重隂故曰賢人隱便做不得在位又問恐後人緣此謂有朝隱者先生既答以安有此理而遂以林希嘗有此說語之也林希字子中長樂人阿章惇意草元祐諸賢謫詞朱子曰子雲深沈善思索如隂陽消長之妙都去推求然如太𤣥之類亦是拙底工夫蓋天地之間只有自二而四自四而八如此推去都走不得子雲却添兩作三謂之天地人事事欲分作三截又有氣無朔有日星無月恐不是道理孔明有王佐之心道則未盡王者如天地之無私心焉行一不義而得天下不為孔明必求有成而取劉璋聖人寧無成耳此不可為也孔明先世葛氏琅琊諸縣人後徙陽都陽都先有葛姓者時人謂諸葛因氏劉璋字季江夏竟陵人益州牧焉子也張松勸璋迎先主先主至涪璋往㑹之松勸先主於㑹襲璋先主不忍松兄廣漢太守肅懼禍及已因發其謀璋收松斬之敇諸關戍文書勿復得通先主先主怒還兵擊璋所在戰剋進圍成都璋降遷之公安以病卒事詳後漢書及蜀志若劉表子琮將為曹公所并取而興劉氏可也劉表字景升山陽高平人為荆州牧卒子琮舉州降曹操先主久之乃覺或勸先主攻琮荆州可得日劉荆州臨亡托我以孤遺背信自濟吾所不為且死何面目以見荆州乎遂將其衆去事詳後漢書及魏志諸葛武侯有儒者氣象此程子所以語孫覺者如此有朱子曰孔明雖嘗學申韓然資質好却正大氣象孔明庶幾禮樂中說王道篇曰使孔明而無死禮樂其有興乎朱子曰義利之大分武侯知之有非他人所及者亦其天資有過人處若其細微之間則不能無未察處觀其讀書之時他人務為精熟而已則獨觀大意此其大者固非人所及而不務精熟亦豈得無缺闕耶文中子本是一隱君子世人往往得其議論附㑹成書其間極有格言荀揚道不到處文中子見第三卷見朱子曰其書多為人添入真僞難然好處甚多就中論世變因革處最好又曰文中子於作用處曉得故上書欲興太平為周公事業及知時勢不可為則急退而續詩書續元經又欲為孔子事業殊不知孔子時有三代禮樂制度典謨故可以明道漢魏下不背道者甚鮮安可取而續詩書春秋耶以上並伊川語韓愈亦近世豪傑之士如原道中言語雖有病然自孟子而後能將許大見識尋求者才見此人至如斷曰孟子醇乎醇又曰荀與揚擇焉而不精語焉而不詳若不是他見得豈千餘年後便能斷得如此分明韓愈見前却朱子曰王通于施為作用處極分曉于大體處不窺見退之于大體處見得而于作用施為處却不曉又曰文中子根基淺却是以天下為心韓文公雖見得道之大用然却無實用功處只是欲求官職而已學本是修德有德然後有言退之却倒學了因學文日求所未至遂有所得如曰軻之死不得其傳似此言語非是蹈襲前人又非鑿空撰得出必有所見若無所見不知言所傳者何事伊川語文朱子曰韓公見得大意已分明只是不曽就身上細密做工夫黃東發曰所傳者即原道篇所謂其位君臣父子其教禮樂刑政其文詩書易春秋以至麻絲宫室粟米蔬果魚肉皆道之實也故曰以是而傳以是者指原道之書所謂道者而言之以明中國聖人皆以此道而為治也故他日論異端曰果孰傳之耶正言此之所謂道者無非實而其傳具有自來彼之所謂道者無非虛而初無所自傳云爾非他有面相授受之密傳也愚按觀公送文暢序道莫大乎仁義教莫正乎禮樂刑政下便接堯以是傳之舜云云則所傳者指仁義及禮樂刑政言之明矣仁義便是性道便是率性之道教便是修道之教中庸要領已具於此朱子所謂於道之大體大用已見得及見得大意已分明者蓋即指此而言之也周茂叔胸中灑落如光風霽月灑沙也反有見黃庭堅所作詩序李延平每誦此言以為善形容道者氣象朱子曰所謂灑落者只是形容其不疑所行清明高逺之意若有一毫私吝心則何處更有此等氣象胡敬齊曰此二語終有清高意必如所謂心廣體胖脺面盎背充實光輝真有道氣象此節言其體其為政精密嚴恕務盡道理通書附録濂見潘興嗣所撰墓志政原文作治朱子曰溪在當時人見其有山林之志則以為襟懷灑落有仙風道氣見其政事精絶則以為宦業過人無有知其學者惟程太中知之所見如此冝其生兩程先生也此節言其用伊川先生撰明道先生行狀曰先生資禀既異而充養有道純粹如精金溫潤如良玉寬而有制和而不流忠誠貫於金石孝弟通於神明視其色其接物也如春陽之溫聽其言其入人也如時雨之潤胸懷洞然徹視無間測其藴則浩乎若滄溟之無際極其德美言蓋不足以形容間去聲下同溟音明稟溟海也葉氏曰以上言資之粹充養之厚也先生行已內主於敬而行之以恕見善若出諸已不欲勿施於人居廣居而行大道言有物而動有常葉氏曰以上言行已之有本也先生為學自十五六時聞汝南周茂叔論道遂厭科舉之業慨然有求道之志未知其要泛濫於諸家出入於老釋者幾十年返求諸六經而後得之汝南周氏郡周平王少子烈食采汝墳漢興仍封其後於汝是為正公雖後屢遷徙猶稱汝南云濂溪為南安軍司理參軍時程太中公攝通守事視其氣貌非常人與語知其為學知道也因與為友且使其二子受學焉外書又云明道嘗言吾學雖有所受天理二字却是自字體貼出來蓋其博求精察益充所聞以底於成者尤多自得之功所朱子曰明道當時已見大意故始雖博取而能不為惑若此見得未的而更以釋老等說助之恐為所漂蕩而無以自立也明於庶物察於人物知盡性至命必本於孝弟窮神知化由通於禮樂明于庶物二句說見孟子朱子曰盡性至命二句以心言窮神知化二句以用言言張楊園曰學者好言盡性至命而不盡愛敬之實好窮神知化而不思進反之義遺下學而希上達所謂窮深極微而不可以入堯舜之道者也辨異端似是之非開百代未明之惑秦漢而下未有臻斯理也謂孟子殁而聖學不傳以興起斯文為已任其言曰道之不明異端害之也昔之害近而易知今之害深而難辨昔之惑人也乘其迷暗今之入人也因其高明葉氏曰淺近故迷暗者為所惑深逺故高明者反陷其中自謂窮神知化而不足以開物成務謂下吕本有之字成陳氏曰開物謂人所未知者開發之務謂人所欲為者成全之言為無不周遍實則外於倫理其所言自以為大包法界細入微塵無不周遍矣而實則外于人倫物理胡氏曰釋氏窺見心體故言為無不周遍然未知止於其所故外倫理而妄行夏氏以言為為所言所為拘泥不可從窮深極微而不可以入堯舜之道天下之學非淺陋固滯則必入於此自道之不明也邪誕妖異之說競起塗生民之耳目溺天下於汙濁雖高才明智膠於見聞醉生夢死不自覺也是皆正路之蓁蕪聖門之蔽塞闕之而後可以入道蓁草盛貌蕪穢也葉氏曰淺陋固滯者刑名功利之習詞章訓詁之士是也學者不入于淺陋固滯則必入於佛老之虛無先生進將覺斯人退將明之書不幸早世皆未及也其辨析精微稍見於世者學者之所傳耳見音現闢葉氏曰以上言學道之本末與其異端正人心之大略也先生之門學者多矣先生之言平易易知賢愚皆獲其益如羣飲於河各充其量先生教人自致知至於知止誠意至於平天下此専就大學之教言之也陳氏曰格物致知所以求知所止誠意至于平天下所以求得所止灑掃應對至于窮理盡性此兼大小學之教言之也陳氏曰灑掃應對小學之教也窮理即致知至於知止之事盡性即誠意至于平天下之事循循有序病世之學者舍近而趨逺處下而窺高所以輕自大而卒無得也易並去聲下同灑舍近趨逺承致知至于知止二句而言處下窺高承掃應對二句而言未致知而求知止未誠意而求平天下是舍近而趨逺也方灑掃應對而求窮理盡性是處下而窺高也葉氏曰以上言教人之道本末備具而循序漸進恐學者厭卑近而務高逺輕自肆而無實得也先生接物辨而不間辨分辨也間間隔也言雖賢否自有分辨而物我一體未嘗有間也感而能通教人而人易從怒人而人不怨賢愚善惡咸得其心狡僞者獻其誠暴慢者致其恭聞風者誠服覿德者心醉覿葉本作觀雖小人以趨向之異顧於利害時見排斥退而省其私未有不以先生為君子也荆公與先生雖道不同而嘗謂先生忠信先生每與論事心平氣和荆公多為之動葉氏曰以上言接物之道先生為政治惡以寬處煩而裕當法令繁密之際未嘗從衆為應文逃責之事人皆病於拘礙而先生處之綽然衆人憂以為甚難而先生為之沛然憂上吕本無人字雖當倉卒不動聲色方監司競為嚴急之時其待先生率皆寬厚設施之際有所賴焉卒音猝言葉氏曰以上為政之道先生所為綱條法度人可效而為也至其道之而從動之而和不求物而物應未施信而民信則人不可及也道音導此文集感葉氏連上為一節今正之節言應之逹有人之所不可及者狀朱子曰明道嘗為條例司不以為浼而伊川所作行乃獨不載其事明道謂青苗可放過而伊川乃于西監一狀較計如此蓋明道所處是大賢以上事學者未至而輕議之恐失所守伊川所處雖高然實中人皆可跂及又當觀用之淺深事之大小裁酌其宜難執一意君子所以貴窮理也按伊川先生既殁門人高弟多已先亡無有能形容其德者故是編獨闕焉然先生嘗謂張繹曰我之道蓋與明道同異時欲知我者求之於此文可也讀者詳之明道先生曰周茂叔窗前草不除去問之云與自家意思一般除下葉本無去字無遺書下同指生意周流間而言本注云子厚觀驢鳴亦謂如此蓋取其有自得意也張子厚聞生皇子喜甚見餓莩者食便不美明道語伯淳嘗與子厚在興國寺講論終日而曰不知舊日曾有甚人於此處講此事按吕侍講家傳中亦有此語與此字句微蓋别又但言與二程諸公不言子厚興作相興國寺舊名相國寺宋太平興國中改今名在開封府城內謝顯道曰明道先生坐如泥塑人接人則渾是一圑和氣外書下同之葉氏曰所謂望儼然即之也溫侯師聖云朱公掞見明道于汝歸謂人曰光庭在春風中坐了一箇月掞舒店反生侯仲良字師聖河東人二程先舅氏無可之孫朱光庭字公掞河南偃師人以給事中封還劉丞相摯罷政制落職後遷集賢院學士汝州名今屬汝寧府時明道以親老求近鄉監局得監汝州酒稅故公掞於此見之遺書內劉絢過汝所聞乃是時語也游楊初見伊川伊川瞑目而坐二子侍立既覺顧謂曰賢輩尚在此乎日既晚且休矣及出門門外之雪深一尺按是時明道已殁而游楊復師事伊川於洛此一條言二先生氣象之不同也劉安禮云明道先生德性充完粹和之氣盎於面背樂易多恕終日怡恱立之從先生三十年未嘗見其忿厲之容樂音洛易音異附録吕與叔撰明道先生哀詞云先生負特立之才知大學之要博聞強識躬行力究察倫明物極其所止渙然心釋洞見道體強區兩反識去聲其造於約也雖事變之感不一知應以是心而不窮雖天下之理至衆知反之吾身而自足其致于一也異端並立而不能移聖人復起而不與易復扶又反不葉氏曰致一者見之明而守之定故邪說能移百世以俟聖人而不惑也其養之成也和氣充浹見於聲容然望之崇深不可慢也遇事優為從容不迫然誠心懇惻弗之措也見音現從音冲置措委也其自任之重也寧學聖人而未至不欲以一善成名愚按士君子立志自當如此然善無大小隨分皆當自盡如以目前所當為之事而舍之而不為曰吾不欲以一善成名也是又與於自欺之甚者也此等處學者須善看不以辭害志焉可也寧以一物不被澤為已病不欲以一時之利為已功其自信之篤也吾志可行不苟潔其去就吾義所安雖小官有所不屑吕與叔撰橫渠先生行狀云康定用兵時先生年十八慨然以功名自許上書謁范文正公公知其逺器欲成就之乃責之曰儒者自有名教何事於兵因勸讀中庸先生讀其書雖愛之猶以為未足仁宗康定元年西夏趙元昊攻保安軍取金明寨李士彬父子被執乘勝抵延州城下執副總管劉平石元孫以歸又陷塞門諸寨所謂用兵時也范文正公時為陜西招討副使故先生上書謁之也先生與邠人焦寅遊寅喜談兵先生悅其言故亦喜談兵於是又訪諸釋老之書纍年盡究其說知無所得反而求之六經嘉祐初見程伯淳正叔于京師共語道學之要先生渙然自信曰吾道自足何事旁求於是盡棄異學淳如也嘉祐宋仁宗年號也尹和靖以盡棄異學語言之程先生云表叔平生議論謂頤兄弟有同處則可若謂學於頤兄弟則無是事頃屬與叔刪去不謂尚存斯言幾于無忌憚然按淵源録謂盡棄異學語一本作盡棄其學而學焉則盡棄異學語恐是後來所改本注尹彥明云橫渠昔在京師坐虎皮說周易聽從甚衆一夕二程先生至論易次日橫渠撤去虎皮曰吾平日為諸公說者皆亂道有二程近到深明易道吾所不及汝輩可師之為去聲不及之不吕本作弗歸按外書注逐日虎皮出是日更不出虎皮也自是乃陜西朱子曰橫渠之學實亦自成一家但其源則自二程發之耳晚自崇文移疾西歸橫渠終日危坐一室左右簡編俯而讀仰而思有得則識之或中夜起坐取燭以書其至道精思未始須臾息亦未嘗須臾忘也識音志起坐宋本作坐起之崇文宋藏書館名乾德初置三館於長慶門西謂西館書凡八萬卷太平興國三年帝臨幸嫌其陋命于升龍門東北創立三館賜名崇文院遷西館書貯焉三館者史館昭文館集賢院也元豐定官制改名祕書省神宗熙寧二年吕正獻公薦先生有古學召見問治道先生曰為政不法三代者終苟道也帝恱以為崇文院校書移疾顔師古漢書注移書言疾也愚按猶今言告病也學者有問多告以知禮成性變化氣質之道學必如聖人而後已聞者莫不動心有進知禮成性變化氣質說見第二卷嘗謂門人曰吾學既得於心則修其辭命辭無差然後斷事斷事無失吾乃沛然精義入神者豫而已矣斷都玩反第精義入神說見二卷朱子曰張子謂須先說得分明然後方行得分明今人見得不明故說得自儱侗如何得行處分明先生氣質剛毅德盛貌嚴然與人居久而日親其治家接物大要正已以感人人未之信反躬自治不以語人雖有未喻安行而無悔故識與不識聞風而畏非其義也不敢以一毫及之治並平聲橫渠曰二程從十四五時便鋭然欲學聖人鋭吕本作脫注一作鋭愚按從鋭為優人語録此言二程自幼立志如此以見之皆可以為聖人也按二程已見于前此復引橫渠之言以終之者蓋隱以二程接古聖賢相傳之統亦所以俟後聖於無窮也其㫖深矣黃勉齊曰道之正統待人而後傳自周以後任傳道之責者不過數人而能使斯道章章較著者一二人而止耳由孔子而後曾子子思繼其微至孟子而始著由孟子而後周程張子繼其絶至朱子而始著識者以為知言近思録集注卷十四欽定四庫全書近思録集注卷十四婺源江永撰朱子曰此卷聖賢氣象明道先生曰堯與舜更無優劣及至湯武便别孟子言性之反之自古無人如此說只孟子分别出來便知得堯舜是生而知之湯武是學而能之文王之德則似堯舜禹之德則似湯武要之皆是聖人朱子曰堯舜天性渾全不假修習湯武修身體道以復其性又曰性者得全於天無所汚壞不假修為聖之至也反之者修為以復其性而至於聖人也以書觀之湯畢竟反之之功極細密如以義制事以理制心等語又自謂有慙德覺多不是往往自此益去加切如武王大故疏其數紂之罪辭氣暴厲如湯便都不如此葉氏曰文王不識不知順帝之則蓋亦生知之性也禹克勤克儉不矜不伐蓋亦學能之事也遺書下同仲尼元氣也顔子春生也孟子并秋殺盡見仲尼無所不包顔子示不違如愚之學於後世有自然之和氣不言而化者也孟子則露其才蓋亦時焉而已仲尼天地也顏子和風慶雲也孟子泰山巖巖之氣象也觀其言皆可見之矣仲尼無迹顏子微有迹孟子其迹著孔子儘是明快人顏子儘豈弟孟子儘雄辨問顏子春生孟子并秋殺盡見朱子曰仲尼無不包顏子方露出春生之意如無伐善無施勞是也使此更不露便是孔子孟子便如秋殺都發出來露其才如所謂英氣是發用處都見也明道下二句便是解上三句獨時焉而已難曉問顔子之微有迹處曰如願無伐善無施勞皆是若孔子無迹只是人捉摸不著問孟子露其才時焉而已或曰非常如此蓋時出之耳或曰戰國之習俗如此或曰世衰道微孟子不得已耳三者孰是曰恐只是習俗之說較穩大抵自堯舜以來至於本朝一代各自是一樣氣象不同問時焉而已豈孟子亦有戰國之習否曰亦是戰國之習如三代人物自是一般氣象左傳所載春秋人物又是一般氣象戰國人物又是一般氣象葉氏曰夫子清明在躬猶青天白日故極其明快顔子有若無實若虛犯而不校故極其豈弟孟子息邪說距詖行放淫辭故極其雄辨曾子傳聖人學其德後來不可測安知其不至聖人如言吾得正而斃且休理會文字只看他氣象極好被他所見處大後人雖有好言語只被氣象卑終不類道葉氏曰曾子易簣之言自非樂善不倦安行天理一息尚在必歸於正夫豈一時之所能勉強哉傳經為難如聖人之後才百年傳之已差聖人之學若非子思孟子則幾乎息矣道何嘗息只是人不由之道非亡也幽厲不由也末二句董仲舒對䇿語葉氏曰羣經定於夫子之手至孟子時才百年間微言絶而大義乖猶賴曾子之門有傳子思孟子之徒相繼纘述提綱挈領闢邪輔正以垂萬世如論語大學中庸孟子之書可見矣荀子才高其過多揚雄才短其過少葉氏曰荀子名況字卿為楚蘭陵令揚雄字子雲為漢光祿卿荀卿才高敢為異論如以人性為惡以子思孟子為非其過多揚雄才短如作太元擬易法言擬論語皆摸擬前聖之遺言其過少荀子極偏駁只一句性惡大本已失揚子雖少過然已自不識性更說甚道朱子曰荀揚諸人論性其實只說得氣荀子只見得不好人底性便說惡揚子見半善半惡底人便說善惡混問揚雄言學者所以修性故伊川謂揚雄為不識性曰性不容修修是揠苗荀子極偏駁揚子雖少過等語皆是就分金稱上說下來若不曾看荀子揚子則所謂極偏駁雖少過等語亦見不得董仲舒曰正其誼不謀其利明其道不計其功此董子所以度越諸子朱子曰漢儒惟董仲舒三篇說得稍親切終是不脫漢儒氣味只對江都易王云仁人正其誼不謀其利明其道不計其功方無病又是儒者語誼必正非是有意要正道必明必是有意要明功利自是所不論仁人於此有不能自已者師出無名事故不成明其為賊敵乃可服此便是有意立名以正其誼仲舒所立甚高後世所以不如古人者道義功利關不透耳仲舒資質純良摸索道得數句如正誼不謀利之類然亦非他真見得這道理仲舒本領純正班固所謂醇儒極是至於天下國家事業恐施展未必得漢儒如毛萇董仲舒最得聖賢之意然見道不甚分明下此即至揚雄規模又窄狹矣毛萇治詩為河間獻王博士問伊川於毛公不知何所主而取之朱子曰程子不知何所見而然嘗考之詩傳其緊要處有數處如關雎所謂夫婦有别則父子親父子親則君臣敬君臣敬則朝廷正朝廷正則王化成要之亦不多見只是其氣象大槩好問董仲舒見道不分明處曰見得鶻突如命者天之令性者生之質情者人之欲命非聖人不行性非教化不成情非制度不節等語似不識性善模樣又云明於天性知自貴於物知自貴於物然後知仁義知仁義然後重禮節重禮節然後安處善安處善然後樂循理又似見得性善模樣終是說得騎牆不分明端的揚子為人深沉㑹去思索然太元亦是拙底功夫道理不是如此其學似本於黃老如云惟清惟靜惟寂惟寞之類某嘗謂揚雄最無用真是一腐儒到急處只是投黃老自身命也奈何不下如何會理得别事林希謂揚雄為祿隱揚雄後人只為見他著書便須要做他是怎生做得是葉氏曰祿隱謂浮沉下位依祿而隱雄失身仕莽以是祿隱何辭而可孔明有王佐之心道則未盡王者如天地之無私心焉行一不義而得天下不為孔明必求有成而取劉璋聖人寧無成耳此不可為也若劉表子琮將為曹公所并取而興劉氏可也朱子曰程子謂孔明有王佐之心道則未盡其論極嘗問殺劉璋事何如曰這只是不是問聖人處此合如何曰亦須有别箇道理若似如此寧可事不成只為後世事欲苟成功欲苟就便有許多事孔明大綱却好只為如此便有斑駁處葉氏曰琮降則地歸曹氏取以興漢何負於表較之取劉璋則曲直有間矣諸葛武侯有儒者氣象問武侯有儒者氣象如何朱子曰孔明學不甚正但資質好有正大氣象葉氏曰孔明輔漢討賊以信義為主以節制行師以公誠待人至於親賢臣逺小人咨諏善道察納雅言有大臣格君之業永按鞠躬盡力死而後已成敗利鈍非所逆暏數言尤近儒者氣象孔明庶幾禮樂文中子曰使孔明而無死禮樂其有興乎問孔明庶幾禮樂如何朱子曰也不見得孔明是禮樂中人也只是粗底禮樂孔明也粗若興禮樂也是粗禮樂葉氏曰亮之治國政刑修舉而人心豫附名正言順禮樂其庶幾乎文中子本是一隱君子世人往往得其議論附會成書其間極有格言荀揚道不到處朱子曰王通極爽說得廣闊緣他於事上講究得精故於世變興亡人情物態更革沿襲施為作用先後次第都曉得識得箇仁義禮樂都冇用處若用於世必有可觀只可惜不曾向上透一著於大體處有所缺闕所以如此若更曉得高處一著那裏得來只細看他書便見他極有好處非特荀揚道不到雖韓退之也道不到文中子其間有見處也即是老氏又其間被人夾雜今也難分别但不合有許多事全似孔子其間論文史及時事世變煞好伊川謂文中子有些格言被後人添入壞了看來必是阮逸諸公增益張大復借顒顯者以為重耳葉氏曰文中子王通隋末不仕教授河汾其弟王凝子福畤等收其議論增益為書名曰中說韓愈亦近世豪傑之士如原道中言語雖有病然自孟子而後能將許大見識尋求者才見此人至如斷曰孟子醇乎醇又曰荀與揚擇焉而不精語焉而不詳若不是他見得豈千餘年後便能斷得如此分明朱子曰韓退之却有些本領如原道其言雖不精然皆實大綱是自古罕有人說得端的惟退之原道庶幾近之却說自大體程子謂能作許大見識尋求真箇如此他資才甚高然那時更無人制服他便做大了謂世無孔子不當在弟子之列問遺書第一卷言韓愈近世豪傑揚子雲豈得如愈第六卷則曰揚子之學實韓子之學華華則涉道淺二說取豫似相抵牾曰只以言性論之則揚子善惡混之說所見僅足以比告子若退之見得到處却甚峻絶性分三品正是說氣質之性至程門說破氣字方有去著此退之所以不易及而第二說未得其實也問韓子稱孟子醇乎醇荀與揚大醇而小疪程子謂韓子稱孟子甚善非見得孟子意亦道不到其論苟揚則非也竊謂韓子既以失大本不識性者為大醇則其稱孟子醇乎醇亦只是說得到未必真見得到曰如何見得韓子稱荀揚大醇處便是就論性處說又云韓子說苟揚大醇是泛說與申不害韓非之徒較之則荀揚為大醇韓子只說得那一邊凑不著這一邊若是㑹說底說那一邊亦自凑著這一邊學本是修德有德然後有言退之却倒學了因學文日求所未至遂有所得如何軻之死不得其傳似此言語非是蹈襲前人又非鑿空撰得出必有所見若無所見不知言所傳者何事朱子曰韓文公第一義是去學文字第二義才去窮究道理所以看得不親切問韓公雖有心學問但於利祿之意甚重曰他也是不曾去做工夫他於外面皮殼上都見得只是不曾向裏省察不曾就身上細密做工夫只從粗處去不見得原頭來處平日只以詩文飲酒博戲為事問軻之死不得其傳程子以為非見得真實不能出此語而屛山以為孤聖道絶後學如何先生笑曰屛山只要說釋子道流皆得其傳耳朱子韓文考異云諸賢之論惟程子此條為能極其深處然考諸臨川王氏之書則其詩有曰紛紛易盡百年身舉世何人識道真力去陳言誇末俗可憐無補費精神其為豫奪乃冇大不同者故常折其衷而論之竊謂程子之意固為得其大端而王氏之言亦自不為無理蓋韓公之道知其用之周於萬事而未知其體之具於吾之一心知其可行於天下而未知其本之當先於吾之一身也是以其言常詳於外而略於內其志常極於逺大而其行未必能謹於細微雖知文與道有內外淺深之殊而終未能審其緩急重輕之序以決取舍雖知汲汲以行道濟時抑邪崇正為事而或未免乎貪位慕祿之私此其見於文字之中信有如王氏之所譏者但王氏雖能言此而其所謂道真者實乃老佛之餘波正韓公所深詆則是楚雖失而齊亦未為得耳周茂叔胸中灑落如光風霽月見黃庭堅所作詩序朱子曰延平先生每誦此言以為善形容有道者氣象所謂灑落者只是形容一箇不疑所行清明高逺之意若有一毫私吝心何處更有此等氣象其為政精密嚴恕務盡道理見潘延之所撰墓志通書附録伊川先生撰明道先生行狀曰先生資稟既異而充養有道純粹如精金溫潤如良玉寬而有制和而不流忠誠貫於金石孝悌通於神明視其色其接物也如春陽之溫聽其言其入人也如時雨之潤胸懷洞然徹視無間測其蘊則浩乎若滄溟之無際極其德美言蓋不足以形容葉氏曰以上一節言資稟之粹充養之厚也先生行已內主於敬而行之以恕見善若出諸已不欲弗施於人居廣居而行大道言有物而動有常葉氏曰以上一節言行已之本末也先生為學自十五六時聞汝南周茂叔論道遂厭科舉之業慨然有求道之志未知其要泛濫於諸家出入於老釋者幾十年返求諸六經而後得之朱子曰二程之於濓溪如曰仲尼顔子所樂吟風弄月以歸皆當時口傳心受的當親切處後來二程先生舉似後學亦不將作第二義看然則行狀所謂反求之六經然後得之者特語夫功用之大全耳至其入處則自濓溪不可誣也葉氏曰按濓溪先生為南安軍司理參軍時程公珦攝通守事視其氣貌非常人與語知其為學知道也因與為友且使其二子受學焉而程氏遺書言再見周茂叔後吟風弄月以歸有吾與㸃也之意明道學於濓溪者雖得其大意然其博求精察益充所聞以抵於成者尤多自得之功明於庶物察於人倫知盡性至命必本於孝弟窮神知化由通於禮樂朱子曰明道行狀說孝弟禮樂處上兩句說心下兩句說用問盡性至命必本於孝弟盡性至命是聖人事然必從孝弟做起否曰固是又問伊川說就孝弟中便可盡性至命看來孝弟上面更有幾多事如何只是孝弟便可至命曰知得孝弟之理便是盡性至命也只如此若是做時須是從孝弟上推將去方始知得性命如孝弟為仁之本不成孝弟便是仁了但是為仁自孝弟始若是聖人如舜之孝王季之友便是盡性至命事辨異端似是之非開百代未明之惑秦漢而下未有臻斯理也謂孟子沒而聖學不傳以興起斯文為己任其言曰道之不明異端害之也昔之害近而易知今之害深而難辨昔之惑人也乘其迷暗今之入人也因其高明葉氏曰昔之害楊墨申韓是也今之害佛老是也淺近故迷暗者為所惑深逺故高明者反蹈其中自謂之窮神知化而不足以開物成務言為無不周遍實則外於倫理窮深極微而不可以入堯舜之道天下之學非淺陋固滯則必入於此自道之不明也邪誕妖異之說競起塗生民之耳目溺天下於汚濁雖高才明智膠於見聞醉生夢死不自覺也是皆正路之蓁蕪聖門之蔽塞闢之而後可以入道先生進將覺斯人退將明之書不幸早世皆未及也其辨析精微稍見於世者學者之所傳耳葉氏曰以上一節言學道本末與其闢異端正人心之大略也先生之門學者多矣先生之言平易易知賢愚皆獲其益如羣飲於河各充其量朱子曰明道之言一見便好久看愈好所以賢愚皆獲其益伊川之言乍見未好久看方好故非久於玩索者不能識其味此其自任所以有成人材尊師道之不同先生教人自致知至於知止誠意至於平天下灑掃應對至於窮理盡性循循有序病世之學者捨近而趨逺處下而窺高所以輕自大而卒無得也葉氏曰以上一節言教人之道本末備具而循序漸進也先生接物辨而不間葉氏曰是非明辨而亦不絶之感而能通教人而人易從怒人而人不怨賢愚善惡咸得其心狡僞者獻其誠暴慢者致其恭聞風者誠服覿德者心醉雖小人以趨向之異顧於利害時見排斥退而省其私未有不以先生為君子也葉氏曰先生以議新法不合遂遭排斥然當時用事者亦曰伯淳忠信人也則其言行之懿有不可誣者以上一節言接物之道先生為政治惡以寬葉氏曰聞其自新之路改而止處煩而裕葉氏曰得其要領且順乎理當法令繁密之際未嘗從衆為應文逃責之事人皆病於拘礙而先生處之綽然衆憂以為甚難而先生為之沛然葉氏曰法令峻密而先生未嘗為苟且應命之事然而處之有道故不見其礙為之有要故不見其難雖當倉卒不動聲色葉氏曰理素明而志素定方監司競為嚴急之時其待先生率皆寬厚設施之際有所賴焉葉氏曰忠信懇惻足以感人故能不狗時好而遂得其所為先生所為綱條法度人可效而為也至其道之而從動之而和不求物而物應未施信而民信則人不可及也葉氏曰以上一節言為政之道文集明道先生曰周茂叔窗前草不除去問之云與自家意思一般本注子厚觀驢鳴亦謂如此問周子是取其生生自得之意邪抑於生物中欲觀天理流行處邪朱子曰此不要解得那田地自理會得須看自家意思與那草底如何是一般問周子窗前草不除去即是謂生意與自家一般曰他也只是偶然見與自家意思相契又問橫渠觀驢鳴是天機自動意思曰固是但也是家偶然見他如此如謂革與自家意一般木葉便不與自意一般乎如驢嗚與自家呼喚一般馬嗚便不與自家一般乎遺書下同張子厚聞皇子生喜甚見餓莩者食便不美吳必大曰子厚聞皇子生云云正淳嘗云與人同休戚陸子夀曰此主張題日耳先生曾問致思否曰皆是均氣同體惟在我者至公無私故能無間斷而與之同休戚曰固是如此然亦只說得一截如是說時真是主張題目實不曾識得今土木何嘗有私然與他物不相管人則元有此心故至公無私便都管欇之無間斷也葉氏曰此即西銘之意亦其養德之厚故隨所感遇蹶然動於中而不可遏初無擬議作意而為之也伯淳嘗與子厚在興國寺講論終日而曰不知舊日曾有甚人於此處講此事呂原明曰此處氣象自有合得如此等人說此等話道理謝顯道云明道先生坐如泥塑人接人則渾是一團和氣葉氏曰所謂望之儼然即之也溫外書下同侯師聖云朱公掞見明道於汝歸謂人曰光庭在春風中坐了一箇月游楊初見伊川伊川瞑目而坐二子俟立既覺顧謂曰賢輩尚在此乎日既晚且休矣及出門門外之雪深一尺侯仲良字師聖朱光庭字公掞皆程子門人葉氏曰明道接人和粹伊川師道尊嚴皆盛德所形但氣質成就有不同耳明道似顔子伊川似孟子劉安禮云明道先生德性充完粹和之氣盎於面背樂易多恕終日怡悅立之從先生三十年未嘗見其忿厲之容葉氏曰先生質之美養之厚德之全故其睟然發見從容豈弟如此百世之下聞之者鄙夫寬薄夫敦而況於親炙之者乎附録吕與叔撰明道先生哀詞云先生負特立之才知大學之要博文强識躬行力究察倫明物極其所止渙然心釋洞見道體其造於約也雖事變之感不一知應以是心而不窮雖天下之理至衆知反之吾身而自足其致於一也異端並立而不能移聖人復起而不能與易其養之成也和氣充浹見於聲容望之崇深不可慢也遇事優為從容不迫然誠心懇惻弗之措也其自任之重也寧學聖人而未至不欲以一善成名寧以一物不被澤為己病不欲以一時之利為己功其自信之篤也吾志可行不苟潔其去就吾義所安雖小官有所不屑葉氏曰志若可行不潔其去以為高義擇所安亦不屑於就以自卑吕與叔撰橫渠先生行狀云康定用兵時先生年十八慨然以功名自許上書謁范文正公公知其逺器欲成就之乃責之曰儒者自有名教何事於兵因勸讀中庸先生讀其書雖愛之猶以為未足於是又訪諸釋老之書纍年盡究其說知無所得反而求之六經嘉祐初見程伯淳正叔於京師共語道學之要先生渙然自信曰吾道自足何事旁求於是盡棄異學淳如也本注尹彥明云橫渠昔在京師坐虎皮說周易聽從甚衆一夕二程先生至論易次日橫渠撤去虎皮曰吾平日為諸公說者皆亂道有二程近到深明易道吾所弗及汝輩可師之朱子曰行狀有兩本一云盡棄其學而學焉一云盡棄異學淳如也後本為勝橫渠之學實亦自成一家但其源則自二程先生發之葉氏曰此可見橫渠先生勇於從善無一豪係吝之意非大公至明孰能如是晚自崇文移疾西歸橫渠終日危坐一室左右簡編俯而讀仰而思有得則識之或中夜起坐取燭以書其志道精思未始須臾息亦未嘗須臾忘也朱子曰橫渠教人道夜間自不合睡只為無可應接他人皆睡了己不得不睡他做正䝉時或夜裏默坐徹曉他直是恁地勇方做得橫渠作正䝉時中夜有得亦須起寫了方放下睡不然放不下無安著處學者有問多告以知禮成性變化氣質之道學必如聖人而後已聞者莫不動心有進嘗謂門人曰吾學既得於心則修其辭命辭無差然後斷事斷事無失吾乃沛然精義入神者豫而已矣朱子曰橫渠言吾學既得於心云云他意謂須先說得分明然後行處分明今人見得不明故說得自儱侗如何到得行處分明橫渠言吾學既得於心云云看來理會道理須是說得出一字不穩便無下落所以中夜便筆之於紙只要有下落橫渠如此若論道理他却未熟然他地位却要如此高明底却不必如此天理人欲之分只爭些子故周先生只管說箇幾字然辨之又不可不早故橫渠每說豫字葉氏曰人於義理其初得於心者了然無疑及宣之於口筆之於牘則或有差故命辭無差則所見已審以是應酬事物知明理精妙用無方矣是皆窮理致知之功素立而非勉强擬議於應事之時也先生氣質剛毅德盛貌嚴然與人居久而日親其治家接物大要正己以感人人未之信反躬自治不以語人雖有未諭安行而無悔故識與不識聞風而畏非其義也不敢以一毫及之葉氏曰德貌嚴毅而中誠懇惻故與人久而益親躬自厚而薄責於人故人心服而不敢加以非義橫渠先生曰二程從十四五時便脫然欲學聖人朱子曰伊川好學論十八時作明道十四五時便學聖人二十及第出去做官一向長進定性書二十二三時作語録近思録集注卷十四
