body:
  text: 近思錄集註卷一歸安茅星來撰道體此篇就理之本然者而言必於此精察明辨而後於道知所從入可以用力以求至焉凡五十一條德此卷乃中庸之理而大學所未及者然如曰明曰至善曰天之明命曰峻德以至身心意知之類大學固已畧見其端特以方欲明體道之方而未暇詳夫道之體也此卷乃一一發明之蓋道之體既明而所以體道者自愈以詳審而精密矣濓溪先生曰無極而太極無宋本作无下同至太者大無以加之謂極者極之義以其無形之可見故曰無極朱子曰上天之載無聲無臭而實造化之樞紐品彚之根柢也故曰無極而太極非太極之外復有無極也太朱子曰上天之載無聲無臭是就有中説無無極而極是就無中說有又曰老子之言有無以有無為二周子之言有無以有無為一又曰不言無極則太極同於一物而不足為萬化之根柢不言太極則無極淪於空寂而不能為萬化之根柢陳北溪曰老子曰復歸於無極栁子曰無極之極康節先天圖説亦曰無極之前陰含陽也有極之後陽分陰也是周子以前已有無極之説矣但意各不同老子栁子康節以氣言此則專以理言也又曰百家諸子都將太極説屬氣形去如漢志謂太極函三為一乃是指天地人氣形已具而渾淪未判老子説有物混成先天地生正指此也莊子謂道在太極之先所謂太極亦是指此渾淪未判而道又别懸空在太極之先則道與太極分為二矣不知道即是太極道以理之通行者而言太極是以理之極至者而言惟理之極至所以古今人物通北行惟古今人物通行所以為理之極至無二理也陳溪曰未有天地萬物先有是理然是理不是懸空在那裏纔有天地萬物之理便有天地萬物之氣纔有天地萬物之氣則此理便全在天地萬物之中那相接處無些子縫罅如何分得孰為先執為後又曰理不外乎氣若説截然在陰陽五行之先及在陰陽五行之中便成理與氣為二物矣愚按易所言太極在兩儀四象八卦之先此所謂太極即在陰陽五行天地萬物之中彼處有次第此處無次第也蓋彼處在聖人畫卦上説須是以漸生出故有次第此則直就陰陽五行天地萬物自然之理言之故無次第也太極動而生陽動極而靜靜而生陰靜極復動一動一靜互為其根分陰分陽兩儀立焉復扶又反同兩儀謂天地與易畫卦兩儀不朱子曰儀匹也如俗所謂一雙一對是也太極之有動靜是天命之流行也所謂一陰一陽之謂道誠者聖人之本物之終始而命之道也其動也誠之通也繼之者善萬物之所以資始也其靜也誠之復也成之者性萬物各正其性命也動極而靜靜極復動一動一靜互為其根命之所以流行而不已也動而生陽靜而生陰分陰分陽兩儀立焉分之所以一定而不移也盖太極者本然之妙也動靜者所乘之機也太極形而上之道也陰陽者形而下之器也是以自其著者而觀之則動靜不同時陰陽不同位而太極無不在焉自其微者而觀之則冲穆無朕而動靜陰陽之理已悉具於其中矣雖然推之於前而不見其始之合引之於後而不見其終之離也故程子曰動靜無端陰陽無始非知道者孰能識之其朱子曰太極生陰陽理生氣也陰陽既生則太極在中理復在氣之内也又曰性猶太極也心猶隂陽也太極只在陰陽之中非能離陰陽也然至論太極則太極自是太極陰陽自是隂陽惟性與心亦然所謂一而二二而一也又曰太極動即是陽非動而後生陽也動極生靜亦非别有一靜来繼此動盖隂氣流行即為陽陽氣凝聚即為隂非真有二物相對也又曰隂陽有以流行言者一動一靜互為其根寒暑往來是也有以定位言者分隂分陽兩儀立焉天地上下四方是也易有兩義一曰變易便是流行底一曰交易便是對待底又曰動則此理行此動中之太極也靜則此理存此靜中之太極也盖隂陽五行錯綜不失條緒便是理又曰太極動而生陽周子偶從動處發端其實自有天地無非此二者流行旋轉不動則靜不靜則動中間更無空處聖人定之以中正仁義便是主張此二者盖聖人之動即天道之元亨其靜則是利貞所以繼天地之志述天地之事與西銘都相貫通如云五行之生至變化無窮亦即天地之塞吾其體天地之帥吾其性之意但説有詳畧緩急耳吳草廬曰太極無動靜動靜者氣機也氣機一動則太極亦動氣機一靜則太極亦靜故朱子釋云太極之有動靜是天命之流行也此是為周子分解太極不當言動靜以天命之有流行故只得以動靜言也陽變隂合而生水火木金土五氣順布四時行焉朱子曰有太極則一動一靜而兩儀分有隂陽則一變一合而五行具然五行者質具於地而氣行於天者也以質而語其生之序則曰水火木金土而水木陽也火金隂也以氣而語其行之序則曰木火土金水而木火陽也金水隂也又統而言之則氣陽而質隂也又錯而言之則動陽而靜隂也盖五行之變至於不可窮然無適而非隂陽之道至其所以為隂陽者又無適而非太極之本然也夫豈有所虧欠間隔哉又曰水質隂而性本陽火質陽而性本陰水外暗而内明以其根於陽也火外明而内暗以其根於隂也太極圖陽動之中有黒底隂静之中有白底是也横渠言隂陽之精互藏其宅正此意也書正義曰萬物成形以微著為漸五行先後亦以微著為漸五行之體水最微為一火漸著為二木形實為三金體固為四土質大為五金朱子曰陽變而助隂故生水隂合而陽盛故生火木各從其類故在左右問陽何以言變隂何以言合曰陽動而隂隨之故云變合又曰以質語其生之序而水木為陽火金為隂者盖天一生水地二生火天三生木地四生金一三陽也二四隂也以氣語其行之序而木火為陽金水為隂者盖以四時而言則春夏為陽秋冬為隂又曰初生水火流動閃爍其體尚虚次生木金則確然有定形矣水火初是自生木金則資於土盖天地生物先其輕清以及重濁水火在五行中最輕清金木重於水火土又重於金木又曰金木水火分屬四時土則寄旺四季惟夏季十八日土氣為最旺故能生秋金也以圖象考之木生火金生水之類各有小畫相牽連而火生土土生金獨穿乎土之内餘則從旁而過為可見矣問向聞先生語學者五行不是相生合下有時多有如何朱子曰此難説若會得底便自然不相悖喚做一齊有也得喚做相生也得便雖不是相生他氣亦自相灌注如人五臓固不曽有先後但其灌注時自有次序又曰天地始初混沌未分時想只有水火二者水之極濁便成地火之極清便成風霆雷電日星之屬又曰五行之序木為之始水為之終而土為之中以河圖洛書之數言之則水一木三而土五皆陽之生數而不可易者也故得以更迭為主而為五行之綱以徳言之則木為發生之始水為貞靜之體而土又包育之母也故水之包五行也以其流通貫徹而無不在木之包五行也以其歸根反本而藏於此也若夫土則水火之所寄金木之所資居中而應四方一體而載萬類者也問金木水火體質屬土曰正䝉有一説好只金與木之體質屬土水與火却不屬土葉氏曰二氣變合而生者原於對待之體也一氣循環而生者本於流行之用也愚按唐孔氏謂大禹謨水火金木土穀惟修與洪範之次不同洪範以生數為次大禹謨以相克為次周子此所言即洪範之次也盖亦就隂陽生五行者而言若五行相生次序則又當云木火土金水矣今俗復有金木水火土之語盖班固白虎通五行章已有之而左傳昭二十五年用其五行注亦如此為次正義云隨便而言之不以義為次也又按邵氏皇極經世書謂東赤南白西黄北黒此正色也驗之於曉午暮夜之時可見之矣張氏㟭曰東方木色青南方火色赤西方金色白北方水色黒中方土色黄此五行之氣色色之分辨也東赤南白西黄北黒者一陽之氣色色之逓變也故嬰兒始生而赤稍變而白人病而黄老死而黒物生地下而赤稍長而白萎菸則黄枯槁而黒也物皆資一陽以生此四變者無物不然五行一隂陽也隂陽一太極也太極本無極也五行之生也各一其性朱子曰五行具則造化發育之具無不備矣故又即此而推本之以明其渾然一體莫非無極之妙而無極之妙亦未嘗不各具於一物之中也盖五行異質四時異氣而皆不能外乎隂陽隂陽易位動靜異時而皆不能離乎太極至於所以為太極者又初無聲臭之可言是性之本體然也天下豈有性外之物哉然五行之生隨其氣質而所禀不同所謂各一其性也各一其性則渾然太極之全體無不各具於一物之中而性之無所不在又可見矣左傳正義云五物世所行用故謂之五行五者各有材能故傳又謂之五材釋名云五氣於其方各施行也白虎通云為天行氣故謂之五行朱子曰五行一隂陽隂陽一太極則非太極之後别生二五而二五之上先有太極也無極而太極太極本無極則非無極之後别生太極而太極之上先有無極也問無極太極本非二物曰無極而太極則無極之中萬象森列不可謂之無矣太極本無極則太極之體冲漠無朕不可謂之有矣又曰雖云五行各一其性然一物又各具五行之理不可不知康節曽細推來無極之真二五之精妙合而凝乾道成男坤道成女二氣交感化生萬物萬物生生而變化無窮焉朱子曰天下無性外之物而性無不在此無極二五所以混融而無間者也所謂妙合者也真以理言無妄之謂也精以氣言不二之名也凝者聚也氣聚而成形也盖性為之主而隂陽五行為之經緯錯綜又各以類凝聚而成形焉陽而健者成男則父之道也隂而順者成女則母之道也是人物之始以氣化而生者也氣聚成形則形交氣感遂以形化而人物生生變化無窮矣自男女而觀之則男女各一其性而男女一太極也自萬物而觀之則萬物各一其性而萬物一太極也盖合而言之萬物統體一太極也分而言之一物各具一太極也所謂天下無性外之物而性無不在者於此尤可以見其全矣子思子曰語大天下莫能載焉語小天下莫能破焉此之謂也後朱子曰天地方開未有人種自是氣蒸結成兩箇人方生許多萬物所以先言乾道成男坤道成女然後言化生萬物又曰生氣流行一滚而出初非以其全氣付與人减下一等與物也但禀受隨其所得物固昏塞矣而昏塞之中亦有輕重昏塞尤甚者於氣之渣滓中又復禀得渣滓之甚者耳又曰太極只是箇極好至善底道理人人有一太極物物有一太極問無極而太極先生謂此五字増减不得而此言無極之真却不言太極曰真字便是太極真西山曰就其在人物者言之性即太極仁義即隂陽仁義禮智信即五行惟人也得其秀而最靈形既生矣神發知矣五性感動而善惡分萬事出矣知去聲静朱子曰此言衆人具動之理而常失之於動也盖人物之生莫不有太極之道焉然隂陽五行氣質交運而人之所禀獨得其秀故其心為最靈而有以不失其性之全所謂天地之心而人之極也然形生於隂神發於陽五常之性感物而動而陽善隂惡又以類分而五性之殊散為萬事盖二氣五行化生萬物其在人者又如此自非聖人全體太極有以定之則欲動情勝利害相攻人極不立而違禽獸不逺矣氣朱子曰天地之性是理也才到有隂陽五行處便有質之性於此遂有昏明厚薄之殊得其秀而最靈乃氣質以後事問靈處是心抑是性曰靈處只是心不是性性只是理問通書多説幾太極圖却無此意曰五性感動善惡未分處便是幾聖人定之以中正仁義本註聖人之道仁義中正而已矣而主靜本註無欲故靜立人極焉故聖人與天地合其徳日月合其明四時合其序鬼神合其吉凶朱子曰此言聖人全動静之徳而常本之於静也盖人禀隂陽五行之秀氣以生而聖人之生又得其秀之秀者是以其行之也中其處之正其發之也仁其裁之也義盖一動一靜莫不有以全夫太極之道而無所虧焉則向之所謂欲動情勝利害相攻者於此乎定矣然静者誠之復而性之貞也苟非此心寂然無欲而静則又何以酬酢事物之變而一天下之動哉故聖人中正仁義動静周流而其動也必主乎静此其所以成位乎中而天地日月四時鬼神有所不能違也盖必體立而後用有以行若程子論乾坤動静而曰不專一則不能直遂不翕聚則不能發散亦此意耳仁朱子曰正所以能中義所以能仁正與義為體中與為用中仁是動正義是静又曰中正仁義常在此中流轉然必倚著静為之本如無夜則做得晝不分曉無冬則做得春夏不長茂易言利貞者性情也元亨是發用處必至於利貞乃見乾之實體萬物至秋冬收斂成實方見得他本質故曰性情此亦主静之説問不言禮智而曰中正何也曰禮智猶説得寛中正則切而實矣且謂之禮尚或有不中節處謂中則無過不及乃節文恰好處也謂之智尚或有正不正正則是非端的分明乃智之正當處也又曰圖説首言隂陽變化之原其後即以人所禀受明之秀而最靈者純粹至善之性也所謂太極也形生神發則陽動隂静之為也五性感動則陽變隂合而生水火木金土也善悪分則成男成女之象也萬事出則萬物化生之義也至聖人定之以中正仁義而主静立人極則又有以得乎太極之全體而與天地混合無間矣故又言天地日月四時鬼神無不合也君子修之吉小人悖之凶朱子曰聖人太極之全體一動一静無適而非中正仁義之極盖不假修為而自然也未至此而修之君子之所以吉也不知此而悖之小人之所以凶也修之悖之亦在乎敬肆之間而已矣敬則欲寡而理明寡之又寡以至於無則靜虚動直而聖可學矣其朱子曰修吉悖凶最是此篇喫𦂳處而本則主於静故曰立天之道曰隂與陽立地之道曰柔與剛立人之道曰仁與義又曰原始反終故知死生之説死生一作生死道朱子曰隂陽成象天之所以立也剛柔成質地道之所以立也仁義成德人道之所以立也道一而已隨事著見故有三才之别而於其中又各有體用之分焉其實則一太極也陽也剛也仁也物之始也隂也柔也義也物之終也能原其始而知所以生則反其終而知所以死矣此天地之間綱紀造化流行古今不言之妙聖人作易其大意盖不出此故引之以證其説辭立天之道三句見易説卦傳原始反終二句見易繋上傳朱子曰陽主進而隂主退陽主息而隂主消進而息者其氣強退而消者其氣弱此隂陽之所以為柔剛也陽剛温厚居東南主春夏而以作長為事隂柔嚴凝居西北主秋冬而以歛藏為事作長為生收斂為殺此剛柔之所以為仁義也楊子所謂於仁也柔於義也剛者乃自其用處末流言之盖亦所謂陽中之隂隂中之陽固不妨自為一義但不可雜乎此而論之耳又曰隂陽是陽中之隂陽剛柔是隂中之隂陽隂陽以氣言剛柔以質言又曰仁義中正既知界限分曉又須知四者之中仁義是對立闗鍵盖禮則仁之著智則義之藏猶春夏秋冬雖為四時而春夏為陽秋冬為隂是知天地之道不兩則不能以立故端雖有四而立之者則兩耳又曰說者多以仁為柔以義為剛非也盖仁本是柔然却是發出來者便是剛義本是剛然却收斂向裏者便是柔仁之體本静而其用則流行不窮義之用本動而其體則各止其所此即陽中之隂隂中之陽互藏其根之意又曰始處是生生之初終處是一定之理始有處説生已定處說死死則不復變動矣張乖崖說斷公事未判屬陽已判屬隂意盖如此朱子曰造化周流未著形質便是形而上者屬陽才麗於形質為人物為金木水火土便轉動不便是形而下者屬隂若是陽時便有多少流行變動在及至成物一成而不返如人之初生屬陽只管有長及至長成便只有衰此氣逐漸衰減則死矣周子所謂原始反終只於衰盡處可見返終之理大哉易也斯其至矣朱子曰易之為書廣大悉備然語其至極則此圖盡之其㫖豈不深哉周子手是圖以授程氏兄弟程子之言性與天道多出於此然卒未嘗明以此圖示人是必有㣲意焉學者不可以不知也問孔門工夫皆切已做去朱子曰此亦未嘗不切已皆非在外乃我所固有也曰恐徒長人億度料想之見曰理㑹不得者固如此若理㑹得者莫非在我便可受用何億度之有此所謂無極而太極也所以動而陽静而隂之本體也然非有以離乎隂陽也即隂陽而指其本體不雜乎隂陽而為言耳此太極之動而陽静而隂也中者其本體也三愚按易上下卦各三畫而此圖左右方亦各外中内重者盖天地人三才至極之理自然而然而非聖賢心思智慮之所得為也周易本義謂六爻五上為天三四為人初二為地則此圖左方外中二重為天右方外中二重為地左右方内一重為人又細分之則立天之道曰隂與陽而左方外一重為陽中一重為隂立地之道曰柔與剛而右方外一重為柔中一重為剛立人之道曰仁與義而左方為仁右方為義問左方屬天右方屬地固矣人則兼左右方言之伺也曰得天地之理氣以成性與形故自不能離天地而獨立也此陽之動也太極此隂之静也太極此隂中之用所以行也之體所以立也之陽陽動之根也白愚按此此陽中之隂隂静之根也言就右方之者而言愚按此就左方之黒者而此陽變隂合而生水火木金土也此陽之變也此隂之合也隂盛故居右陽盛故居左陽穉故次火隂穉故次水冲氣故居中小愚按凡圖解大並指太極其水火木金土各有一小􅊶之即所謂五行之生各一其性性者即太極也餘放此黄勉齊曰質曰水火木金盖以隂陽相間言猶曰東西南北所謂對待者也氣曰木火金水盖以隂陽相固言猶曰東南西北所謂流行者也此陽變隂合也水右火左而此以交係乎上隂根陽陽根隂也水而木木而火火而土土而金金復生水如環無端五氣布而四時行也中愚按動而陽靜而隂即兩儀也陽之動隂之靜與隂之陽陽中之隂則四象也陽變隂合而生水火木金土即易之天一地二云云而八卦之所由成也五行一隂陽五殊二實無餘欠也隂陽一太極精粗本末無彼此也太極本無極上天之載無聲無臭也五行之生各一其性而五行各一太極無假借也此無極二五所以妙合而無間也緯愚按舊本並作但細按似與原圖及朱註所謂經錯綜者不合因為正之其下者即上所謂五行之生各一其性而五行各一太極者是也又按自左而右即從上陽之變者直下自右而左即從上隂之合者直下相連不斷以間以水火字故似乎中斷另起耳乾道成男坤道成女以氣化者言也各一其性而男女一太極也有朱子曰在動物如牝牡之類在植物亦有男女如麻牡麻及竹有雌䧺之類愚按氣化者謂未有人種隂陽之氣凝結而成者也萬物化生以形化者言也各一其性而萬物一太極也愚按形化者謂既有人種後交合而生者也與上成男成女並兼人物在内以上悉本朱子圖解朱子曰先天乃伏羲本圖非康節所自作雖無言語而所該甚廣凡今易中一字一義無不自其中流出者太極却是周子自作發明易中大概綱領意思而已故論其格局則太極不如先天之大而詳論其義理則先天不如太極之精而約葢合下規模不同而太極終在先天範圍之内又不若彼之自然不假思慮安排也若以數言之則先天自一而二自二而四自四而八以為八卦太極亦自一而二為剛柔自二而四為剛善剛惡柔善柔惡遂加其一為中以為五行而遂下及於萬物盖物理本同而象數亦無二致但推得有大小詳畧耳劉靜修曰先天太極之圖其理實未嘗不一也先天圖之左方震一離兌二乾三者即太極圖之左方陽動者也其離兌為陽中之隂即陽動中之為隂静之根者也先天圖者之右方㢲四坎艮五坤六者即太極圖之右方隂靜也其坎艮為隂中之陽即隂靜中之為陽動之根者也盖凡陽皆乾凡隂皆坤其左方皆離之象右方皆坎之象先天之與太極圖一也故先天圖坎離列左右之門太極圖陽變隂合而即生水火也河圖亦然其中宫即所謂太極無極也其竒偶即所謂陰陽也其東北陽之二生數統隂之二成數即先天太極圖之左方也其西南隂之二生數統陽之二成數即先天太極圖之右方也其水火居南北之極亦猶先天太極圖之坎離水火各居左右方也愚按夫子所言太極亦但就儀象卦畫上言耳周子又就中推去見得天地萬物莫不皆然且於其中指出無極示人則其理愈精而言愈廣矣然要之説個太極便包個無極在内説個易有太極便包個天地萬物之太極在内則夫子之言實足以該周子之言而周子之言亦無非發明夫子之言也朱子實始尊信而表章之其功偉矣陸氏曰正蒙云由太虚有天之名由氣化有道之名合虚與氣有性之名合性與知覺有心之名朱子謂太虚便是太極圖上靣一圓圏氣化便是隂靜陽動此是縂説合虚與氣有性之名有這氣便有這理合性與知覺有心之名知覺又是那氣之虚處此二句就人上説夲只是一箇太虚漸細分説得宻耳九峯蔡氏曰横渠四語只是理氣二字而細分由太虚有天之名即無極而太極之謂以理言也由氣化有道之名即一隂一陽之謂道之謂以氣言也合虚與氣有性之名即繼之者善成之者性之謂以人物禀受而言也合性與知覺有心之名即人心道心之謂以心之體而言也以朱子九峯之言觀之則知張子此四語偹一篇太極圖説之意由太虚有天之名是指太極之不雜乎隂陽者言之所謂一故神也由氣化有道之名是指太極之不離乎隂陽者言之所謂两故化也下二句則是無極之真二五之精妙合而凝以下之事但濓溪分氣為二曰動曰靜而太極在其中不離乎動静亦不雜乎動静横渠分氣為二曰虚曰氣而以太虚為不雜之太極太和為不離之太極所以朱子謂其落在一邉又謂其有未瑩處然朱子又嘗謂其議論極精宻則此固猶無礙惟所謂氣聚散於太虚猶冰凝釋於水朱子謂其流乃是箇大輪廻此則與程朱不可合者也誠無為朱子曰實理自然何為之有即太極也感問既誠而無為則恐未有惡朱子曰當其未五性具備無有不善及其應事始有照管不到處置失宜處盖合下本但有善惡是後一截事幾善惡朱子曰幾者動之微善惡之所由分也盖動於人心之微則天理固當發見而人欲亦已萌乎其間矣此隂陽之象也亡朱子曰通書每説幾字近則公私邪正逺則廢興存但於此看破便幹轉也此是日用第一親切工夫惟精惟一克已復禮即其事也又曰天理人欲之分只爭些子故周子每説幾字然辨之又不可不早故横渠每説豫字徳愛曰仁宜曰義理曰禮通曰智守曰信朱子曰道之得於心者謂之徳其别有是五者之用而因以名其體焉即五行之性也朱子曰幾善惡徳則但就善者言之為聖為賢都從此五者做就仁義禮智信徳之體愛宜理通守徳之用誠性也幾情也徳兼性情而言也蔡虚齋曰此雖似皆以用而言然以五者並列又有徳字冠於其上則其理自明韓子以其發用之地而目為道體之全自不可也性焉安焉之謂聖復焉執焉之謂賢朱子曰性者獨得於天安者夲全於已聖者大而化之之稱此不待學問勉強而誠無不立幾無不明徳無不備者也復者反而至之執者保而持之賢者才徳過人之稱此思誠研幾以成其徳而有以守之者也發微不可見充周不可窮之謂神通書疾朱子曰發動也微幽也言其不而速一念方萌而至理已其所以發之微妙而不可見也充廣也周徧也言其不行而至盖隨其所寓而理無不到所以充之周徧而不可窮也神則聖人之徳之至妙而不可測者也又曰發字充字就人看㣲不可見周不可窮却是理如此問誠幾神學者當從何入朱子曰隨處用工夫誠是存主處幾是決擇處發用處是神然𦂳處在幾黄勉齊曰此一段只把體用二字來讀他便見誠是體幾是用仁義禮智信是體愛宜理通守是用在誠為仁則在幾為愛在誠為義則在幾為宜性焉復焉發㣲不可見是體安焉執焉充周不可窮是用伊川先生曰喜怒哀樂之未發謂之中中也者言寂然不動者也故曰天下之大本發而皆中節謂之和和也者言感而遂通者也故曰天下之達道文集下同而説見中庸寂然不動感遂通二語易繋辭上傳文也朱子曰寂然不動衆人皆有是心至感而遂通惟聖人能之盖衆人雖具此心未發時已自汨亂思慮紛擾夢寐顛倒曽無操存之道感發處如何得似聖人中節按此條今見遺書暢潜道夲列文集誤心一也有指體而言者本註寂然不動是也朱子曰此言性也有指用而言者本註感而遂通天下之故是也朱子曰此言情也惟觀其所見何如耳何如一作如何皆見伊川與吕大臨論中書吕氏以伊川有几言心者指已發而言之説因以書問而程子答之如此體朱子曰程子所謂凡言心者皆指已發之説盖指心流行而言非謂事物思慮之交也然與中庸本文不合又恐學者以心為已發而不知有未發時涵養之功故自以為未當而復正之如此乾天也天者乾之形體乾者天之性情乾健也健而不息之謂乾乾之之乾易傳作天無易傳作无後凡遇傳之無倣此乾彖辭朱子曰健而不息便是天之性情健之體是性健之用是情惟其健所以不息不可把不息做健又曰性情是天愛健處夫天專言之則道也天且弗違是也分而言之則以形體謂之天以主宰謂之帝以功用謂之鬼神以妙用謂之神以性情謂之乾易傳下同妙道兼理與氣而言如下文形體主宰功用用性情皆是形體以氣言如所謂天之蒼蒼是也主宰以理言如所謂惟皇上帝降衷於下民是也功用造化之有迹者以二氣之屈伸徃來者言也妙用造化之無迹者以屈伸徃來之不可測者言也朱子曰天地以生物為心心即天之主宰處也然所謂主宰者亦即是理非心之外别有理理之外别有心也黄勉齊曰合而言之言鬼神則神在其中矣析而言之則鬼神者其粗迹神者其妙用也伊川言鬼神者造化之迹此以功用言也横渠言鬼神二氣之良能此合妙用而言也四徳之元猶五常之仁偏言則一事專言則包四者乾彖傳偏言者不全言也必合義禮智仁字之理方全今就其中分言之則仁只是四徳之一所謂偏言也若專言之則舉一仁而四德都在其中故曰仁者人心之全徳全者兼義禮智而為言也朱子曰愛之理是偏言則一事心之徳是專言則包四者又曰偏言之者如惻隠之類專言之者如克己之類然即此一事便包四者盖亦非二物也陳北溪曰禮義智亦是心之徳而不可以心之徳言者如家有兄弟四人稱其家者只舉長兄位號而言則下三弟已包在内矣黄勉齊曰六經中專言仁者包四徳也言仁義而不言禮智者仁包禮義包智愚按從黄氏之説推之言仁禮而不言義智者仁包義禮包智言禮義而不言仁智者禮即仁之秩然處義即智之分别事理各得其宜處盖義禮智皆從仁流出無仁則生意已亡義禮智便都没有故有時不言仁而衆善自從仁以出不能離也此仁之所以包四徳而獨尊也朱子曰文王只是説大亨利於貞不以分配四時孔子見此四字好始分作四件説孔子之易與文王之易畧自不同天所賦為命物所受為性同上物朱子曰理一也自天所賦予萬言之謂之命以物所禀受於天言之謂之性命猶誥勅性猶職任鬼神者造化之迹也乾文言傳曰與鬼神合其吉凶朱子曰造化之妙不可得而見於其氣之往來屈伸者足以見之㣲鬼神則造化無迹矣陸氏曰迹指能屈能伸者言非謂有迹可見也剥之為卦諸陽消剥已盡獨有上九一爻尚存如碩大之果不見食將有復生之理上九亦變則純隂矣然陽無可盡之理變於上則生於下無間可容息也聖人發明此理以見陽與君子之道不可亡也将有之有易傳作見復扶又反下為復復生音服餘同此間如字碩果不食剥上九爻辭果中有仁則天地生生之心存故有復生之理間不容息出淮南子原道訓篇或曰剥盡則為純坤豈復有陽乎曰以卦配月則坤當十月以氣消息言則陽剥為坤陽來為復陽未嘗盡也剥盡於上則復生於下矣故十月謂之陽月恐疑其無陽也隂亦然聖人不言耳隂死為消陽生為息息有止義而訓為生者盖一事止則一事生中無間㫁亦剥盡復生之意也十月為陽見爾雅朱子曰凡隂陽之生一爻當一月須是滿三十日方滿三十分而成一畫剥之陽盡於十月小雪為純坤然陽於小雪已生三十分之一分則坤固未嘗無陽也但始生甚㣲不能成一畫耳須積漸生去至冬至纔滿得三十分而成一畫不是昨日全無今遂一旦都復所謂一氣不頓進一形不頓虧也又曰隂亦然以夬乾姤推之可見聖人所以不言者便是參賛裁成之道盖扶陽抑隂長善消惡進君子退小人自是理當如此如堯舜之世豈無小人但有聖人在上不容他出而有為耳愚按董仲舒謂十月純隂疑於無陽故謂之陽月四月純陽疑於無隂故謂之隂月觀此則四月亦有隂月之説程子以為聖人不言者盖特據爾雅及易文言傳而言耳然饒氏曰此隂陽消息之理至精至㣲自程子始發之但言其理而未有以騐其氣數之必然也朱子又從而推明之曰是當以一爻分三十分隂陽日進退一分剥之陽剥於九月之霜降而盡於十月之小雪復之陽則生於小雪而成於十一月之冬至夬之隂決於三月之榖雨而盡於四月之小滿姤之隂則生於小滿而成於五月之夏至於是理與數合然後知隂陽絶續之際果無一息之間㫁而程子之言為愈信矣一陽復於下乃天地生物之心先儒皆以靜為見天地之心盖不知動之端乃天地之心也非知道者孰能識之兩乃字下並當有見字朱子謂動是見天地之心不是天地之心如十月豈得謂無天地之心流行固自若也但人不見耳愚按遺書謂復卦非天地之心復則見天地之心然則程子固已言之矣盖此為易傳脱誤無疑也故復彖曰復其見天地之心乎下謂初六畫初最居下曰下也端緒也陽初復尚㣲故以端言之過此則陽氣浸長萬物蕃盛天地之心反不可得而見矣朱子曰十月積隂陽氣收斂天地生物之心固未嘗息但無端倪可見一陽既復則生意發動乃始復見其端緒也李氏曰一陽復於下程子以動而言也利貞誠之復周子以靜而言也以静言者於坤爻指其所歸之地以動言者於震爻指其所動之處所歸之地利貞之徳所動之處又元之徳也言異而意同矣朱子曰王弼亦以靜而言然以卦爻之意推之自當以伊川之説為正又曰學者但如初九象傳所云知不善則速改以從善為最要切處若云須窺見端倪而心體可識則又是添却一事也仁者天下之公善之本也復六二象曰休復之吉以下仁也人心之所同然者謂之公於下仁上見得仁天下之公有仁則惻隠羞惡辭讓是非之端皆由此出故曰善之本也徐進齋曰仁謂初剛剛復於下在人則惻隠之心仁之端也初不逺復二從初而復故曰以下仁也李閎祖曰天下之公是無一毫私心善之本也是萬善從此出愚按朱子謂此語寛而不切盖程子本但就下仁上言之故如此寛説朱子取之則直以仁之徳言矣與易傳本㫖㣲别有感必有應凡有動皆為感感則必有應所應復為感所感復有應所以不已也感通之理知道者黙而觀之可也所感易傳無所字所以不已也以上咸九四傳末二語則彖天地感而萬物化生節傳也有感必有應總天地萬物之理言之凡有動五句所以申明有感必有應之意盖此理無物不有無時不然黙而觀之而天地萬物之情可見矣朱子曰人之氣與天地之氣常相接無間斷人自不見如卜筮之類皆是心自有此物所以才動便應凡人一睡一覺一出一入一語一黙以至盛衰治亂無不如此問感應工夫於學者有用處否曰此理無乎不在如繫辭傳所云精義入神以致用也利用安身以崇徳也亦是此理天下之理終而復始所以恒而不窮恒非一定之謂也一定則不能恒矣惟隨時變易乃常道也天地常久之道天下常久之理非知道者孰能識之乃常道也以上恒彖利有攸往終則有始傳其天地常久以下則下日月得天而能久照節傳也天地常久之道以造化言如晝夜寒暑之類是也天下常久之理以人事言如出處語黙之類是也朱子曰隨時變易如君尊臣卑分固不易然上下不交亦不得父子固親親而所謂命士以上異宫則又有變焉又如可以仕則仕可以止則止孟子辭齊王之金而受宋薛之餽皆隨時變易故可以為常也又曰論其體則終是恒然體之常所以為用之變用之變乃所以為體之恒人性本善有不可革者何也曰語其性則皆善也語其才則有下愚之不移革上六傳下愚不移説見論語所謂下愚有二焉自暴也自棄也人苟以善自治則無不可移者雖昏愚之至皆可漸磨而進惟自暴者拒之以不信自棄者絶之以不為雖聖人與居不能化而入也仲尼之所謂下愚也漸音尖進下原書有也字也自暴自棄説見孟子拒之以不信者謂其無有此理絶之以不為者則知有此理而謂已之不能為也朱子曰自暴者有強悍意剛惡之所為自棄者有懦弱意柔惡之所為朱子曰以夫子之言觀之人固自有不移者而程子則以為無不可移盖以其不肯移而後不可移耳夫子本但以氣質而言其品第未及乎不肯不可之辨也程子則以禀賦甚異而不肯移非以禀賦之異而不可移也然天下自棄自暴者非必皆昏愚也往往強戻而才力有過人者商辛是也聖人以其自絶於善謂之下愚然考其歸則誠愚也史記稱紂資辯捷疾聞見甚敏才力過人手格猛獸知足以拒諫言足以飾非則天資固非昏愚者然力可以為善而絶之而不為非下愚而何既曰下愚其能革面何也曰心雖絶於善道其畏威而寡罪則與人同也唯其有與人同所以知其非性之罪也革上六曰小人革靣在物為理處物為義艮彖傳程子以順理合義觧動静不失其時因復言此以明理義二字之意事物各有當然之則而在物言之則謂之理就吾之所以處之者言之則謂之義陳北溪曰理是體義是用理是事物當然之則義則所以處此理者陳潛室曰理對義言則理為體而義為用理對道言則道為體而理為用吳草廬曰凡物必有所以然之故亦必有所當然之則所以然者理也所當然者義也理之有義猶形影聲響也吕氏曰湛甘泉改作在心為理便是義外之病若以物為外是分内外之道非皆備之㫖也又曰禅學最怕拈著理字後來便要拈理字以明其非禅只打開物字則理字便好活用此正僧杲教張侍郎所謂即用儒家言語改頭換靣接引人去之術也姚江格物之説正是此法動靜無端隂陽無始非知道者孰能識之經説下同不易繫辭傳朱子曰動靜無端隂陽無始本可以先後言然就中間截斷言之則亦不害其有先後也觀周子所言動而生陽則未動之前固已嘗靜矣又言靜極復動則已靜之後固必有動矣如春夏秋冬元亨利貞固不能無先後然不冬則無以為春不貞則無以為元就此言之又自有先後也皆愚按程子於咸之感應恒之變易復之見天地之心以歸之知道者而於此復云然盖其所以感應所以變易天地之心之所以見者無非道也亦無非太極之隂陽動靜也必於此有黙契焉而後於天地生物之心天下感通之理天地常久之道静觀黙識而有以自得之矣仁者天下之正理失正理則無序而不和論語説失正理以心言無序不和以事言也朱子曰仁固是正理然必以正理從人心上言之方説得仁字全盖仁者本心之全徳人若本然之良心存而不失則所作為自有序而和不然而此心一放只是以人欲私心為之安得有序安得有和又曰如義禮智皆可謂天下之正理便是程子之説有太寛處天地生物各無不足之理常思天下君臣父子兄弟夫婦有多少不盡分處分音問二遺書下同天地句以其在物者而言君臣父子二句以人之所以處物者而言忠信所以進徳終日乾乾君子當終日對越在天也説見乾九三文言傳對越在天詩周頌清廟篇之辭也忠信則所為皆實故徳自進乾天也終日乾乾則終日便對越在天矣越於也朱子曰忠信進徳修辭立其誠是終日乾乾乾此一節釋終日乾之義盖上天之載無聲無臭其體則謂之易其理則謂之道其用則謂之神其命於人則謂之性率性則謂之道修道則謂之教上天之載無聲無臭所謂無極而太極也體體質也猶言骨子也該體用而言靜而動動而靜所以為易之體也易者隂陽錯綜變易之謂而其所以能隂陽變化者道也其功用著見處則謂之神下三句説見中庸章句程子嘗言吾儒本天於此可見朱子曰其體謂之易在人則心也其理謂之道在人則性也其用謂之神在人則情也其體三句就在天者而言其命於人三句則就在人者言之孟子去其中又發揮出浩然之氣可謂盡矣中庸性道教皆就理言然人亦有明知理之當然而或不免於疑懼而不能以有為者則氣之未充也孟子又於其中發揮出浩然之氣盖此氣一生勇往精進無復疑憚從此直上自有以全夫天命之本然而性可以盡道可以凝即教亦可以自我而立矣四子書中精藴不外是四者程子指出示人學者其詳究焉故説神如在其上如在其左右大小大事而只曰誠之不可揜如此夫徹上徹下不過如此形而上為道形而下為器須著如此説器亦道道亦器但得道在不繫今與後已與人只音止俗讀若質者非夫音扶著直酌反後倣此語類以此條為伊川語上文説道已盡此以見道體無所不在上而天地鬼神下而萬事萬物無非此理因復引易傳之言以明之大小大事宋時方言猶云多少大事也後倣此不繫猶言不拘也問形而上下如何以形言朱子曰此言最的當盖若以有形無形言之則是物與理相間㫁也明道所以謂惟此語截得上下最分明器亦道道亦器有分别而不相離也又曰形而上者指理而言形而下者指事物而言總是須於事事物物上見得此理然後於已有益所以大學不謂之窮理而謂之格物異端将道理説作𤣥妙空虗之物而以人事為下靣粗濁者故都欲擺脱去也以此條縂發明所以終日乾乾之意此以上二條原書不分二先生語今仍之後倣醫書言手足痿痹為不仁此言最善名状仁者以天地萬物為一體莫非已也認得為已何所不至若不有諸已自不與己相干如手足不仁氣已不貫皆不屬已痿音威痹音秘從畀予之畀與爾雅鷯鶉雄鶛牝痺之痺從卑者别彼平聲此去聲也今四書大全本從卑音畀者誤痿痹張揖曰不能行也内經痹論篇云皮膚不營故為不仁又曰痹在於肉則不仁痿論篇云肌肉不仁發為肉痿又云痹而不仁發為肉痿痿與痹分為二程子概舉而兼言之又專屬手足亦約畧言之耳陳定宇曰仁者之心視人物即已身也體認得人物皆為已則此心之仁周流貫通何所不至不然則私意間隔與人物自不相連屬矣萬朱子曰與天地萬物為一體固是仁然便將與天地物為一體作仁不得盖如此只説得仁之軀殻必須實見得為已方為親切黄勉齋曰所謂仁者當於氣已不貫上求之故博施濟衆乃聖人之功用仁至難言故止曰己欲立而立人已欲達而達人能近取譬可謂仁之方也已欲令如是觀仁可以得仁之體聖下呂本無人字遺書有令平聲二明道語問程子作一統説先生作段説如何朱子曰程子之説如大屋一般愚説如大屋下分别㕔堂房屋一般又曰程子合而言之上下似不相應不若分両截看惟仁者之心如此故求仁之術必如此也又曰無私是仁之前事與天地萬物為一體是仁之後事惟無私然後仁惟仁然後與天地萬物為一體學者欲曉得仁名義須並義禮智三字㸔欲真箇見得仁模様須是從克己復禮做工夫去聖人都不説破在學者以身體之而已矣生之謂性性即氣氣即性生之謂也性即氣者見性之不能離乎氣也氣即性者言氣以成形而性即附於其中也來按告子以氣為性猶佛氏作用是性之説程子却引見人生以後便已離氣不得與告子語意大别人生氣禀理有善惡然不是性中元有此兩物相對而生也朱子曰理字只作合字㸔猶言理當如此自承上文而言性既離氣不得則人之生也不能無善惡之殊矣然非性中本有此善惡二者相對而生見性本有善而無惡也有自幼而善有自幼而惡本註后稷之克岐克嶷子越椒始生人知其必㓕若敖氏之類是氣禀有然也善固性也然惡亦不可不謂之性也程子又云善惡皆天理謂之惡者非本惡但或過或不及便如此如楊墨之類子克岐克嶷見詩大雅生民篇楚司馬子良生子越椒文曰是子也熊虎之狀而豺狼之聲弗殺必滅若敖氏後果然事詳春秋左傳若敖即子文之祖也與欒武子所謂訓之以若敖蚡冐之若敖别盖彼乃楚武王之祖熊儀也承上文而言性既本無不善矣而有自㓜而善不善異者非其性之有不善也盖因氣稟昏濁性遂為所汩没以至於此耳要之雖為所汩没而其本善者固未嘗不在也朱子曰惻隠是善於不當惻隠者而惻隠便是惡剛㫁是善於不當剛㫁者而剛斷便是惡然其原却從天理上來只是為人欲翻轉故用之不善而為惡耳如放火殺人可謂至惡若把火去炊飯殺其所當殺之人豈不是天理又如溝渠至濁當初若無清底水縁何有此又曰如墨氏本是惻隠孟子推其弊至於無父豈不是惡然亦不可不謂之性也蓋生之謂性人生而靜以上不容説才説性時便已不是性也上上聲才本作纔宋徐鉉曰古亦用才為纔始字晋謝混傳才小富貴便豫人家事古通用財裁字後倣此以人生而靜天之性也見禮樂記篇朱子曰人生而靜上即是人物未生時只可謂之理未可名為性所謂在天曰命也才説性時便是人生以後此理已堕在形氣之中不全是性之本體矣所謂在人曰性也上朱子曰人生而靜生字已自雜氣質言之生而靜以便只是理才説性性字雜氣質與本然之性説便已不是性性字却是本然之性凡人説性只是説繼之者善也孟子言性善是也夫所謂繼之者善也者猶水流而就下也孟子言下遺書有人字夫音扶言繼之者善見易繫辭上傳此以上本然之性之朱子曰易所謂繼之者善在性之先此引來又在性後説盖易以天道之流行者言此以人性之發見者言天道流行如此所以人性發見亦如此盖此發見處便見本原之至善不待别求若可别求則是人生而靜以上却容説也陳北溪曰夫子所謂善是就人物未生之前造化源頭處説善乃重字為實物若孟子所謂性善則是就成之者性處説是人生以後事善乃輕字言此性之純粹至善耳其實由造化源頭處有是繼之者善然後成之者性時方能如是之善則孟子之所謂善實淵源於夫子之所謂善者而來而非有二本也皆水也有流而至海終無所汙此何煩人力之為也有流而未逺固已漸濁有出而甚逺方有所濁有濁之多者有濁之少者清濁雖不同然不可以濁者不為水也此又以水之清濁譬之見人之氣質不同有如此者清朱子曰水之清者性之善也流至海而不汙者氣質明自㓜而善聖人性之而自全其天者也流未逺而已濁者氣質偏駁之甚自㓜而惡者也流既逺而方濁者長而見異物而遷焉失其赤子之心者也濁有多少氣之昏明純駁有淺深也不可以濁者不為水是惡亦不可不謂之性也如此則人不可以不加澄治之功故用力敏勇則疾清用力緩怠則遲清及其清也則却只是元初水也不是將清來換却濁亦不是取出濁來置在一隅也水之清則性善之謂也故不是善與惡在性中為兩物相對各自出來却俗卻字性此一節言人能變化氣質則本然之可復也朱子曰人雖為氣所昏而性則未嘗不在其中故不可不加澄治之功惟能學以勝之則知此理渾然初未嘗損所謂元初水也雖濁而清者存故非將清來換濁既清則本無濁故非取濁置一隅也如此則其本善而已矣性中豈有兩物對立而並行也哉問水亦可以澄治曰舊有人嘗装惠山泉去京師或時臭了京師人㑹洗水將沙石在筧中上面傾水從筧中下去如此十數番便漸如故可見水亦可澄治但減些分數耳葉氏曰前以性之本然者言則曰相對而生此從性之發見處言則曰相對各自出來此理天命也順而循之則道也循此而修之各得其分則教也自天命以至於教我無加損焉此舜有天下而不與焉者也分音問與音預語類以此條為明道語夫此一節見學者所以求道與聖人所以為教皆一循天命之自然而不得有所加損於其間也朱子曰此理天命也該始終本末而言也修道雖以人事言然其所以修者莫非天命之本然非人私智所能為也然非聖人有不能盡故以舜事明之但非論語本文之意觀天地生物氣象本註周茂叔看此亦就物之初生時觀之説見下文朱子曰此即周子窻前草不除去云與自家意思一般是也但亦只是偶然如此便説出來示人不是有意專要去守看生物氣象也明道先生曰萬物之生意最可觀此元者善之長也斯所謂仁也長張丈反淳元者善之長見易文言傳朱子曰物之初生粹未散最好看及榦葉茂盛便不好看見孺子入井時怵愓惻隠之心只這些子便見得仁到他發政施仁其仁固廣然却難看又曰如元亨利貞皆是善而元則為善之長亨利貞皆從此中來仁義禮智亦皆善而仁則為萬善之首義禮智皆從此中出耳滿腔子是惻隠之心腔子猶言軀殻也洛中語朱子曰腔只是此身裏虚處此就人身上指出此理充塞處最是親切若於此見得即萬物一體更無内外之别又曰彌滿充實無空闕處如刀割著亦痛針刺著亦痛天地萬物之理無獨必有對皆自然而然非有安排也每中夜以思不知手之舞之足之蹈之也安排俗語猶言布置也然荘子大宗師篇已有之朱子曰程子謂無獨必有對要之獨中亦自有對如棊盤路两两相對末稍中間只空一路若無對者然却對那三百六十路所謂一對萬道對器也又如土亦似無對然却與金木水火相對盖金木水火是有方所土却無方所亦對得過胡敬齋曰一物之中各有两儀如天本屬陽而立天之道曰隂與陽地本屬隂而立地之道曰柔與剛豈不是一各含两之義水雖属隂亦有陽水隂水壬癸是也餘皆然中者天下之大本天地之間亭亭當當直上直下之正理出則不是惟敬而無失最盡當去聲在亭亭當當俗語也引以形容中之我其體段如此出則不是言發則不可謂之中也敬不是中但能敬而無失即所以全其未發之中也朱子曰中只是渾淪在此萬事萬物之理都從此中出故曰大本若昏昧放逸而或失之則不是所謂中矣以上並明道語伊川先生曰公則一私則萬殊人心不同如面只是私心此因左傳子産之言而論之如此公私以心言只是私心所以明人心不同如靣之故也公則一循夫義理之當然而不得意為豐約故一私則各随其義之所便安而不循上下之分故萬殊少按吕氏童蒙訓亦載此條語異凡物有本末不可分本末為兩段事灑掃應對是其然必有所以然灑上聲又去聲埽去聲禮齊氏曰洒埽如内則所謂雞初鳴洒埽室堂及庭曲所謂為長者糞加帚箕上以袂拘而退以箕自向而扱之之類是也應對如内則所謂在父母舅姑之所有命之應唯敬對曲禮所謂長者負劍辟咡詔之則揜口而對之類是也朱子曰治心修身是本洒婦應對是末皆其然之事也至於所以然則理也理無精粗本末又曰有本末者其然之事也不可分者以其所以然之理也揚子拔一毛不為墨子又摩頂放踵為之此皆是不得中至如子莫執中欲執此二者之中不知怎麽執得識得則事事物物上皆天然有箇中在那上不待人安排也安排著則不中矣怎津上聲事事物物葉本作凡事物子説見孟子怎麽俗語辭猶言那箇安排説見前朱曰聖人義精仁熟非有意於執中而自然無過不及故有執中之名而實未嘗有所執也若學未至理未明而徒欲求夫所謂中者而執之殆愈執而愈失矣既不識中乃慕夫時中者而欲隨時以為中吾恐其失之彌逺未必不流而為小人之無忌惮也問時中如何伊川先生曰中字最難識須是黙識心通須從彡俗誤從水作湏按説文湏古文沬字有妹誨二音與須臾之須别且試言一㕔則中央為中一家則㕔中非中而堂為中言一國則堂非中而國之中為中推此類可見矣如三過其門不入在禹稷之世為中若居陋巷則非中也居陋巷在顔子之時為中若三過其門不入則非中也過平聲此蘇季明問而程子答也問禹稷過門不入如家有父母豈可不入朱子曰固是然事亦須量緩急如洪水之患不甚為害未遂至傾國覆都自當過家見父母不然而君父危亡之災急於奔救雖不過見父母亦不妨也无妄之謂誠不欺其次矣无俗誤作旡旡音寄飲食氣逆不得息也與有无之无異誠朱子曰无妄是自然之不欺是著力去做底本註李邦直云不欺之謂誠便以不欺為誠徐仲車云不息之為誠中庸言至誠無息非以無息解誠也或以問先生先生曰云云李邦直名清臣魏人紹聖初為中書侍郎廷試發䇿首倡紹述之説國事遂變尋為曽布所陷出知大名府而卒徐仲車名積楚州山陽人以聾疾不仕後賜諡節孝處士陳北溪曰誠字後世都説差至伊川謂無妄之謂誠字義始明朱子又加以真實二字愈見分曉後世輒以至誠二字加人只成箇謙恭敬謹意不知至誠二字惟聖人可以當之豈可輕以加人冲漠無眹萬象森然已具未應不是先已應不是後沖沖通用眹從目直引切在軫韵與從月者音義俱别朕直稔切在寢韵我也從舟省沖漠澹靜貌眹幾微萌兆也森然參差布列貌言沖漠至靜之中萌兆尚未發動而萬事萬物之理已森然備具於吾性之中然則雖未應事接物而其所以出而應接者其理固已無弗具焉及其出而應接亦即其沖漠無眹中充然具足而初無待於外求者也又豈可以先後分乎朱子曰未應固是先却只是後來事已應固是後却只是未應時理又曰須㸔得只此當然之理沖漠無眹非此理之外别有一物沖漠無眹也若形而上下便有分别須分得此是體彼是用方説得一源分得此是象彼是理方説得無間若只是一物却不須更説一源無間也如百尺之木自根本至枝葉皆是一貫不可道上面一段事無形無兆却待人旋安排引入來教入塗轍安排見前轍車轍塗轍猶言規矩尺度盖古者車之轍迹有一定之度故云此以明上文之意不可道上靣無形無兆是未應不是先也不是待安排引入來教入塗轍是已應不是後也朱子曰天只是一元之氣流行不息此便是大本便是太極萬物從此流出去一一各足無有欠闕皆自然而然不是待人旋安排粧㸃也既是塗轍却只是一箇塗轍此以明上文一貫之意言事雖千頭萬緒而其理初無有二也近取諸身百理皆具屈伸往來之義只於鼻息之間見之屈伸往來只是理不必將既屈之氣復為方伸之氣生生之理自然不息復扶又反下復生之復同是百理指天地造化之理而言如下文屈伸往來皆首二句是統人之一身言之鼻息之間又其最易見者故特指以示人夫子逺取諸物而於川流此近取諸身而於鼻息其義一也學者能於此騐之而天地萬物之理可不必逺求而得矣朱子曰此為横渠形潰反源之説而發也問屈伸往來氣也而程子曰只是理何也曰其所以屈伸往來者是理必如此如一隂一陽之謂道隂陽氣也其所以一隂一陽循環而不已者乃道也如復卦言七日来復其間元不斷續陽已復生物極必返其理須如此有生便有死有始便有終日即月也猶詩言一之日二之日也以卦配月則自五月陽始消而為姤至十一月陽生而為復凡七月也程沙隨鄭亨仲陸庸成並云日陽象月隂象八少隂之數七少陽之數故言陽來之期曰七日言隂來之期曰八月朱子亦謂七日只取七義猶八月有凶只取八義王伯厚曰王介甫詩説云彼曰七月九月此言一之日二之日何也陽生矣則言日隂生矣則言月與易臨至於八月有凶復七日來復同意四月正陽也秀葽言月者以隂始生也又曰復所謂七日其説有三一謂卦氣起中孚六日七分之後為復一謂過坤六位至復為七日一謂自五月姤一隂生至十一月一陽生凡七月程朱並取自姤至復之説李子思曰復剛長以日云者幸其至之速臨陽消以月云者幸其消之遲朱子曰人只有許多氣須有盡時盡則魂氣歸於天形魄歸於地而死矣而人死雖終歸於散亦未便散盡故祭祀有感格之理然已散者不復聚釋氏却謂人死為鬼鬼復為人如此則天地間常只是許多人來來往往更不由造化生生必無此理天地之間只有一箇感與應而已更有甚事甚猶何也朱子曰感應二字有二義以感對應而言則彼感而此應專於感而言則感又兼應意如感恩感徳之類又曰物固有自内感者亦有自外感者如人語極須黙黙極須語以至一動一静一往一來自相為感便是内感如有人自外來喚自家便是外感如此看方周徧平正問仁伊川先生曰此在諸公自思之將聖賢所言仁處類聚觀之體認出來孟子曰惻隠之心仁也後人遂以愛為仁愛自是情仁自是性豈可專以愛為仁孟子言惻隠之心仁之端也既曰仁之端則不可便謂之仁退之言博愛之謂仁非也仁者固博愛然便以博愛為仁則不可退之韓氏名愈南陽人南陽今懷慶府修武縣後漢志所謂故南陽秦始皇更名修武者也唐貞元八年進士官至吏部侍郎諡曰文朱子曰自二程先生以來學者始知理會仁字不敢只作愛說然專務言仁而於操存涵養之功不免有所忽畧故無復優柔饜飫之味克巳復禮之實所以為說恍惚驚怪弊病百出殆反不若全不知有仁字而只作愛字㸔却之為愈也又曰類聚孔孟言仁處以求夫仁之說程子為人之意可謂深切然專如此用功却恐不免長欲速好徑之心滋入耳出口之弊亦不可不深察也問仁與心何異此劉安節問也伊川曰心譬如穀種生之性便是仁陽氣發處乃情也陳潜室曰以心為仁不可但人心中具此生理以穀種為仁不可但穀種中亦含此生理其陽處發動生出萌芽便是惻隱之情也又曰穀不過是穀實結成而榖之所以纔播種而便萌蘖者盖以其有生之性心不過是血氣做成而心之所以有運動惻隱處亦以其有生之性人心之與穀種惟其有生之性故謂之仁而仁則非牿於二者之形也孟子恐人懸空去討仁故即人心而言程子又恐人以人心為仁故即穀種而言義訓宜禮訓别智訓知仁當何訓説者謂訓覺訓人皆非也當合孔孟言仁處大概研窮之二三歲得之未晚也謝氏因程子有手足痿痹為不仁之說故以有知覺識痛癢者為仁覺則可以得其固有之仁而不可即以覺為仁也人則無不具此固有之仁而不可即以人為仁也以覺與人為仁與佛氏作用是性之旣相似朱子曰仁是愛之體覺是智之用仁統四端故仁則無不覺然便以覺為仁則不可仁者人之所以為人之理也人則只是形質而已故仁者人也仁不在人之外然便以人為仁則不可朱子曰學者實欲求仁莫若力行之近惟不學以明其理故其蔽愚若主敬致知交相為助則自無此患矣若欲曉仁之名義不若且将愛字推求如見得仁之所以為愛與愛之所以不能盡仁則仁之名義意思瞭然在目矣諸葛氏曰泥愛字則不知仁之體捨愛字則不知仁之用性即理也朱子曰在心謂之性在事謂之理蔡虚齋曰理指心中之理而言故為性天下之理原其所自來未有不善喜怒哀樂未發何嘗不善發而中節則無往而不善凡言善惡皆先善而後惡言吉凶皆先吉而後凶言是非皆先是而後非自下吕本無來字樂音洛中並去聲凡言上葉本有發不中節然後為不善故十字此唐棣問性如何而程子答之如此本註易傳曰成而後有敗敗非先成者也得而後有失非得何以有失也本註以下葉本無之今從諸本增易傳大有卦之彖傳也朱子曰未發之前氣不用事所以有善而無惡又曰性即理也一語攧撲不破自孔子後惟伊川説得盡者蔡虚齋曰程子先善後惡之説固好然亦有不盡然如邪正災祥曲直之類盖從語言所便久之遂為不易之成語耳愚按如晋六五爻辭失得勿恤繫辭上傳吉凶者言乎其失得也下傳以明失得之報之類皆先失後得則程子之言似不必盡拘也問心有善惡否此劉安節問也曰在天為命在義為理在人為性主於身為心其實一也心本善發於思慮則有善有不善若既發則可謂之情不可謂之心姚氏謂義當作物字今從之其實一也言其本無有不善也盖上三者之本善人知之而心則以為雜於形氣之私而不能無不善故程子特明其為一以見心之本無不善也本善指心之本體而言既發承發於思慮而言不可謂之心謂不可謂之心之本體也朱子曰謂既發不可謂之心亦記者之誤程子論心惟答吕與叔最後一篇為盡而張子所謂心統性情亦為切要若前所謂心指已發而言之説則與此正相反而胥失之矣譬如水只可謂之水至如流而為派或行於東或行於西却謂之流也此又以水明既發不可謂之心之意性出於天才出於氣氣清則才清氣濁則才濁才則有善有不善性則無不善陳北溪曰才是才質才能才質以體言才能以用言也孟子以其從性善大本處發來故以為無不善要説得全備須如程子之説方盡朱子曰氣禀之殊其類不一非但清濁二字而已人有聰明通逹事事理㑹者其氣清矣而所為未必皆中於理則是其氣之不醇也人有謹厚忠信事事正穏者其氣醇矣而所知未必能逹於理則是其氣之不清也推此類求之自見又曰性者心之理情者心之動才便是那情之會恁地者情與才絶相近情只是所發之路陌才是會恁地去做底且如惻隠有懇切者有不懇切者是則才之有不同也以上並伊川語性者自然完具信只是有此者也故四端不言信李果齊曰五常言信配五行而言也四端不言信配四時而言也盖土分旺於四時之季信已立於四端之中也心生道也有是心斯具是形以生惻隠之心人之生道也伊川語物心指仁而言盖仁乃天地生之心而人物之所得之以為心者故不曰仁而直曰心也觀下惻隠之心句可見但上三句統就天地萬物言之惻隠句只就人身上指其發見處言耳有惻隠之心故凡疾痛疴癢觸著便動自然生意周流無間故曰人之生道朱子曰心生道也句恐有闕文盖此條出張思叔附師説後中必是當時改作行文所以失其本意横渠先生曰氣坱然太虗升降飛揚未嘗止息此虗實動靜之機隂陽剛柔之始浮而上者陽之清降而下者隂之濁其感遇聚散為風雨為霜雪萬品之流形山川之融結糟粕煨燼無非教也坱于黨反聚散吕本作聚結形葉本作行誤粕匹各反荘子天道篇作糟魄流正䝉下同下坱然盛大氤氲之貌升降飛揚指氣之行者而言文所以虗實動靜隂陽剛柔者皆此氣之升降飛揚者為之也虗實動靜氣機所以發動者也故曰機是言其用隂陽剛柔萬物所從以出者也故曰始是言其體以上言其未成形者浮而上降而下則已成形矣感遇聚散言隂陽清濁之氣相感相遇或聚或散而後各得之以成形如下風雨霜雪之類是也糟酒滓也粕許慎云已漉麄糟也煨燼火餘也無非教也言無非天地所以為教者也聚朱子曰升降飛揚以下五句説隂陽之兩端其感遇散則是説㳺氣之紛擾也又曰無非教也教便是説理禮記中天道至教聖人至徳與孔子予欲無言天地與聖人都一般精底都從粗底上發見道理都從氣上流行雖至粗底物無非是道理發見天地與聖人皆然游氣紛擾合而成質者生人物之萬殊其隂陽兩端循環不已者立天地之大義朱子曰游流行之意紛擾參錯不齊也㳺氣紛擾合而成質是指隂陽交㑹言之盖氣之用也其下二句則就其分開處説是言氣之本又曰游氣紛擾當横㸔隂陽兩端當直看晝夜運行無息者便是隂陽之兩端其四邉散出分擾者便是㳺氣隂陽循環如磨㳺氣如磨中出者剛柔相摩八卦相盪鼓之以雷霆潤之以風雨日月運行一寒一暑此隂陽循環立天地之大義也乾道成男坤道成女此㳺氣紛擾生人物之萬殊也又曰循環不已者乾道變化也合而成質者各正性命也朱子曰張子説似稍支離當云隂陽循環升降往來所以生人物之萬殊立天地之大義天體物不遺猶仁體事而無不在也朱子曰體物言天為物之體盖物物皆具天理體事謂事事是仁做出來禮儀三百威儀三千無一物而非仁也此明仁體事而無不在之意髙氏曰三百三千無非肫肫之仁自然流出不然則皆虗文而已昊天曰明及爾出王昊天曰旦及爾游衍無一物之不體也王音往詩昊天四句見大雅板之篇出王出入往來也㳺衍㳺行衍溢也言天道無往不在以明上文體物不遺之意朱子曰此亦但言本體如此及行時須事事著實如禮樂刑政文為制度觸處皆是若於此有一毫之差便於本體有虧欠處也鬼神者二氣之良能也朱子曰二氣之屈伸往來乃理之自然非有安排布置故曰良能也問前載伊川説今復載此似乎重也曰造化之迹是日月星辰風雨之類良能是屈伸往來之理然此語尤精盖程説但只渾淪在這裏此則分明便見有箇隂陽在物之初生氣日至而滋息物生既盈氣日反而游散至之謂神以其伸也反之謂鬼以其歸也息生息也游者散之以漸之意伸是氣之方長者歸是氣之已退者病朱子曰人不得其死其氣未散故鬱結而成妖孽若死之人此氣消耗已盡豈更復能鬱結成妖孽然不得其死者久之亦散而子孫精神魂魄自有些小相屬故祭祀之禮盡其誠敬便可以致得祖考之魂魄此等處自是難説惟横渠説得好又極宻性者萬物之一源非有我之得私也惟大人為能盡其道是故立必俱立知必周知愛必兼愛成不獨成彼自蔽塞而不知順吾理者則亦末如之何矣性為萬物一源非有我得私言道本如是也但人隔於形氣之私而不能無彼此之間故惟大人為能盡之耳立必俱立四句正大人所以不私其性而能盡道之實也葉氏曰立者禮之幹也知者智之用也愛者仁之施也成者義之遂也自立於禮以至成於義學之始終也張子之教以禮為先故首曰立一故神譬之人身四體皆一物故觸之而無不覺不待心使至此而後覺也此所謂感而遂通不行而至不疾而速也易説之易繫辭上傳曰感而遂通天下之故非天下至神其孰能與於此惟神也故不疾而速不行而至朱子曰神化二字惟横渠推得極好但時以伯恭不肯全載後未及與他添得一故神横渠自註云兩在故不測如所謂隂陽屈伸往來上下以至行乎什伯千萬之中無非此一箇物事所以謂兩在故不測兩在者或在隂或在陽也兩故化自註云推行乎一凡天下事一不能化惟兩而後能化如一隂一陽始能化生萬物然雖是兩要之亦推行乎此一耳李先生云舊理會此段不得以身去裏靣體騐方見得平穏因知為學須如此下工夫直卿云一故神猶一動一静互為其根兩故化猶動極而静静極復動心統性情者也語録下同而統猶兼也朱子云如統兵之統隨寂然不動仁義禮智之理具焉是統性也感而應而惻隠羞惡辭譲是非之端見焉是統情也心朱子曰孟子言惻隠之心仁之端也是從情上見得又言仁義禮智根於心是從性上見得心盖心便是包得此性情故性情字皆從心凡物莫不有是性由通蔽開塞所以有人物之别由蔽有厚薄故有智愚之别塞者牢不可開厚者可以開而開之也難薄者開之也易開則達於天道與聖人一别並必列反易音異塞者牢不可開謂物也厚者開之難謂愚也薄者開之易謂智也逹於天道與聖人一所謂及其知之成功而一也惟聖人氣質清明徳性純粹固不待於開而自無所蔽其餘則不能無清濁厚薄之殊故特言此以見氣質不齊有如此者不可無矯揉變化之功也子愚按朱子謂通蔽開塞似欠了生知之聖恐未得張立言之意横以上並渠語近思録集註卷一欽定四庫全書近思録集註卷一婺源江永撰朱子曰此卷道體㢘溪先生曰無極而太極朱子曰上天之載無聲無臭而實造化之樞紐品彚之根柢也故曰無極而太極非太極之外復有無極也太極動而生陽動極而静静而生隂静極復動一動一静互為其根分隂分陽兩儀立焉朱子曰太極之有動静是天命之流行也所謂一隂一陽之謂道誠者聖人之本物之終始而命之道也其動也誠之通也繼之者善萬物之所資以始也其静也誠之復也成之者性萬物各正其性命也動極而静静極復動一動一静互為其根命之所以流行而不已也動而生陽静而生隂分隂分陽兩儀立焉分之所以一定而不移也蓋太極者本然之妙也動静者所乗之機也太極形而上之道也隂陽形而下之器也是以自其著者而觀之則動静不同時隂陽不同位而太極無不在焉自其微者而觀之則冲漠無朕而動静隂陽之理已悉具於其中矣雖然推之於前而不見其始之合引之於後而不見其終之離也故程子曰動静無端隂陽無始非知道者孰能識之陽變隂合而生水火木金土五氣順布四時行焉朱子曰有太極則一動一静而兩儀分有隂陽則一變一合而五行具然五行者質具於地而氣行於天者也以質而語其生之序則曰水火木金土而水木陽也火金隂也以氣而語其行之序則曰木火土金水而木火陽也金水隂也又統而言之則氣陽而質隂也又錯而言之則動陽而静隂也蓋五行之變至於不可窮然無適而非隂陽之道至其所以為隂陽者則又無適而非太極之本然也夫豈有所虧欠間隔哉五行一隂陽也隂陽一太極也太極本無極也五行之生也各一其性朱子曰五行具則造化發育之具無不備矣故又即此而推本之以明其渾然一體莫非無極之妙而無極之妙亦未嘗不各其於一物之中也蓋五行異質四時異氣而皆不能外乎隂陽隂陽異位動静異時而皆不能離乎太極至於所以為太極者又初無聲臭之可言是性之本體然也天下豈有性外之物哉然五行之生随其氣質而所禀不同所謂各一其性也各一其性則渾然太極之全體無不各具於一物之中而性之無所不在又可見矣無極之真二五之精妙合而凝乾道成男坤道成女二氣交感化生萬物萬物生生而變化無窮焉朱子曰夫天下無性外之物而性無不在此無極二五所以混融而無間者也所謂妙合者也真以理言無妄之謂也精以氣言不二之名也凝者聚也氣聚而成形也蓋性為之主而隂陽五行為之經緯錯綜又各以類凝聚而成形焉陽而健者成男則父之道也隂而順者成女則母之道也是人物之始以氣化而生者也氣聚成形則形交氣感遂以形化而人物生生變化無窮矣自男女而觀之則男女各一其性而男女一太極也自萬物而觀之則萬物各一其性而萬物一太極也蓋合而言之萬物統體一太極也分而言之一物各具一太極也所謂天下無性外之物而性無不在者於此尤可以見其全矣子思子曰君子語大天下莫能載焉語小天下莫能破焉此之謂也惟人也得其秀而最靈形既生矣神發知矣五性感動而善惡分萬事出矣朱子曰此言衆人具動静之理而常失之於動也蓋人物之生莫不有太極之道焉然隂陽五行氣質交運而人之所禀獨得其秀故以心為最靈而有以不失其性之全所謂天地之心而人之極也然形生於隂神發於陽五行之性感物而動而陽善隂惡又以類分而五性之殊散為萬事蓋二氣五行化生萬物其在人者又如此自非聖人全體太極有以定之則欲動情勝利害相攻人極不立而違禽獸不逺矣聖人定之以中正仁義本註聖人之道仁義中正而已矣而主静本註無欲故静立人極焉故聖人與天地合其徳日月合其明四時合其序鬼神合其吉凶朱子曰此言聖人全動静之徳而常本之於静也蓋人禀隂陽五行之秀氣以生而聖人之生又得其秀之秀者是以其行之也中其處之也正其發之也仁其裁之也義蓋一動一静莫不有以全夫太極之道而無所虧焉則嚮之所謂欲動情勝利害相攻者於此乎定矣然静者誠之復而性之真也苟非此心寂然無欲而静則又何以酬酢事物之變而一天下之動哉故聖人中正仁義動静周流而其動也必主乎静此其所以成位乎中而天地日月四時鬼神有所不能違也蓋必體立而後用有以行若程子論乾坤動静而曰不専一則不能直遂不翕聚則不能發散亦此意爾君子修之吉小人悖之凶朱子曰聖人太極之全體一動一静無適而非中正仁義之極蓋不假修為而自然也未至此而修之君子之所以吉也不知此而悖之卜人之所以凶也修之悖之亦在乎敬肆之間而已矣敬則欲寡而理明寡之又寡以至於無則静虚動直而聖可學矣故曰立天之道曰隂與陽立地之道曰柔與剛立人之道曰仁與義又曰原始反終故知死生之說朱子曰隂陽成象天道之所以立也剛柔成質地道之所以立也仁義成徳人道之所以立也道一而已随事著見故有三才之别而於其中又各有體用之分焉其實則一太極也陽也剛也仁也物之始也隂也柔也義也物之終也能原其始而知所以生則反其終而知所以死矣此天地之間綱紀造化流行古今不言之妙聖人作易其大意蓋不出此故引之以證其說大哉易也斯其至矣朱子曰易之為書廣大悉備然語其至極則此圖盡之其㫖豈不深哉誠無為朱子曰實理自然何為之有即太極也㡬善惡朱子曰㡬者動之微善惡之所由分也蓋動於人心之微則天理固當發見而人欲亦已萌乎其間矣此隂陽之象也徳愛曰仁宜曰義理曰禮通曰智守曰信朱子曰道之得於心者謂之徳其别有是五者之用而因以名其體焉即五行之性也性焉安焉之謂聖朱子曰性者獨得於天安者本全於已聖者大而化之之稱此不待學問勉强而誠無不立㡬無不明徳無不備者也復焉執焉之謂賢朱子曰復者反而至之執者保而持之賢者才徳過人之稱此思誠研㡬以成其徳而有以守之者也發微不可見充周不可窮之謂神朱子曰發之㣲妙而不可見充之周徧而不可窮則聖人之妙用而不可知者也通書伊川先生曰喜怒哀樂之未發謂之中中也者言寂然不動者也故曰天下之大本發而皆中節謂之和和也者言感而遂通者也故曰天下之達道朱子曰喜怒哀樂情也其未發則性也無所偏倚故謂之中發皆中節情之正也無所乖戾故謂之和大本者天命之性天下之理皆由此出道之體也達道者循性之謂天下古今之所共由道之用也中性也寂然不動言其體則然也和情也感而遂通言其事則然也觀中和以性情言寂感以心言中和蓋所以為寂感也言字者字可以見其㣲意矣是問伊川言喜怒哀樂未發謂之中中也者寂然不動也南軒言伊川此處有小差所謂喜怒哀樂之中言衆人之常性寂然不動者聖人之道心又南軒辯吕與叔論中書說亦如此今載近思録如何曰前輩多如此就不但欽夫自五峰發此論某自是曉不得今湖南學者徃徃守此說某看來寂然不動衆人皆有是心至感而遂通惟聖人能之衆人却不然蓋衆人雖具此心未發時已自汩亂了思慮紛擾夢寐顛倒曽無操存之道至感發處如何得如聖人中節皆天命之性純粹至善而具於人心者其體用之前本如此不以聖愚而有加損也然静而不知所以存之則天理昧而大本有所不立矣動而不知所以節之則人欲肆而達道有所不行矣文集下同心一也有指體而言者本註寂然不動是也有指用而言者本註感而遂通天下之故是也惟觀其所見何如耳朱子曰伊川此語甚渾圓無病問心本是箇動物不審未發之前全是寂然而静還是静中有動意曰不是静中有動意周子謂静無而動有静不是無以其未形而謂之無非因動而後有以其可見而謂之有横渠心統性情之說甚善性是静情是動心則兼動静而言或指體或指用随人所見方其静時動之理已在及動時又只是静底感伊川此語與横渠心統性情相似者寂然不動是性而遂通是情故横渠云心統性情也伊川此說最為穏當乾天也天者乾之形體乾者天之性情乾健也健而無息之謂乾夫天專言之則道也天且弗違是也分而言之則以形體謂之天以主宰謂之帝以功用謂之鬼神以妙用謂之神以性情謂之乾朱子曰程易單說道理處如此章天専言之則道也以下數句皆極精而乾者天之性情指理而言也謂之性情該體用動静言也火之性情是熱水之性情是寒天之性情則只是一箇健健故不息惟健乃能不息性情二字常相參情便是性之發非性何以有情健而不息非性何以能此性健之體便是天之性健之用便是天之情静專便是動直便是情天乾坤是性情天地是皮殻天天専言之則道也所謂命之謂性此是說道所謂之蒼蒼此是形體所謂惟皇上帝降衷于下民此之謂帝為天専言之則道也天且弗違是也此語某亦未敢以然天且弗違此只是上天曰知性則知天此天便是専言之則道者否曰是問以主宰謂之帝孰為主宰曰自有主宰蓋天是箇至剛至陽之物自然如此轉運不息所以如此必有為之主宰者這様處要人自見得非語言所能盡也曰問以功用謂之鬼神以妙用謂之神二神字不同否鬼神之神此神字說得粗如繫辭言神也者妙萬物而為言此所謂妙用謂之神也言知鬼神之情状此所謂功用謂之鬼神也功用兼精粗而言是說造化妙用以其精者言其妙不可測是功用言其氣也妙用言其理也功用是有迹底妙用無迹底鬼神者有屈伸徃來之迹如寒來暑徃日徃月來春生夏長秋斂冬藏皆鬼神之功用此皆可見也忽然而來忽然而徃方如此又如彼使人不可測知鬼神之妙用也鬼神是有箇漸次形迹神則忽然如此忽然不如此無一箇蹤由要之亦不離於鬼神只是無迹可見言勉齋黄氏曰合而言之言鬼神則神在其中矣析而之則鬼神者其粗致神者其妙用也易傳下同四徳之元猶五常之仁偏言則一事專言則包四者乾傳看朱子曰要理㑹得仁當就粗處如元亨利貞而元為四徳之首就初生處看便是仁如春夏秋冬春為一歲之首由是而為夏為秋為冬皆自此生出所以謂仁包四徳者只縁四箇是一箇只是三箇元却有元之元元之亨元之利元之貞又有亨之元利之元貞之元曉得此意則仁包四者尤明白了智問仁如何包四者曰易便說得好元者善之長義禮莫非善這箇却是善之長又曰義禮智無仁則死矣何處更討義禮智來何須是統看仁如何包得四者又却分看義禮智信如亦謂之仁大抵於仁上見得盡須知發於剛果處亦是仁發於辭遜是非亦是仁仁是箇温和底意思義是慘烈剛斷底意思禮是宣著發揮底意思智是收斂無痕迹底意思性中有此四者聖門却以求仁為急縁仁是四者之先若常存得温厚底意思到宣著發揮時便自然㑹宣著發揮到剛斷時便自然㑹剛斷到收斂時便自然㑹收斂若将别箇做主便都對副不著了此仁之所以包四者也且就氣上看如春夏秋冬看他四時界限又却看春如何包得三時四時之氣温涼寒熱涼與寒既不能生物夏既又熱亦非生物之時惟春氣温厚乃見天地生物之心到夏是生氣之長秋是生氣之斂冬是生氣之藏若春無生物之意後面三時都無了此仁所以包得義禮智也四問仁何以能包四者曰人只是一箇心就裏面分為者且以惻隠論之本只是箇惻隠遇當辭遜便為辭遜不安處便為羞惡分别處便為是非若無一箇動底醒底在裏面便也不知羞惡不知辭遜不知是非如天地只是一箇春氣發生之初為春氣發生得過便為夏收斂便為秋消縮便為冬明年又從春起渾然只是一箇發生之氣意問仁包四者就初意上看就生意上看曰統是箇生四時雖異生意則同劈頭是春生到夏長養是長養那生底秋成遂是成遂那生底冬堅實亦是堅實那生底草木未華實去摧折他生意便死了仁義禮智都只是箇生意當惻隠而不惻隠便無生意便死了當羞惡而無羞惡這生意亦死了以至當辭遜而失其辭遜當是非而失其是非心便死全無那活底意思仁是生底意思通貫周流於四者之中須得辭遜斷制是非三者方成得仁之事看問仁可以包義禮智惻隠如何可包羞惡三端曰但羞惡時自有一般惻怛底意思便可見心仁之包四徳猶冡宰之統六官仁乃天地生物之而在人者故特為衆善之長雖列於四者之目而四者不能外焉所謂専言之則包四者亦是指生物之心而言非别有包四者之仁而又别有主一事之仁也惟是即此一事便包四者此則仁之所以為妙也偏言則曰愛之理専言則曰心之德著偏言専言亦不是兩箇仁小處也只是大裏面說偏言底専言底便在裏面說著専言底則偏言底便在裏面雖是相闗又要看得界限分明如孝弟為仁之本就愛上說此是説偏言之仁至說克己復禮為仁居處恭執事敬與人忠仁人心也此是說専言之仁然雖說専言之仁所謂偏言之仁亦在裏面只偏言専言恰似有箇小底仁又有箇大底仁不知仁是一箇如知福州是這箇人此偏言也及専言之為九州安撫亦是這一箇人不是兩人也故明道謂義禮智皆仁也若見得此理則聖人言仁處或就人上說或就事上說皆是這一箇道理理葉氏曰元者天地之生理也亨者生理之達利者生之遂貞者生理之正也仁者人心之生理也禮者仁之節文義者仁之裁制智者仁之明辨信者仁之真實也天所賦為命物所受為性乾傳氣朱子曰天以隂陽五行化生萬物以成形而理亦賦焉猶命令也於是人物之生因各得其所賦之理以為健順五常之德所謂性也命猶誥勅性猶職任天以此理命於人人稟受此理則謂之性所理一也自天之所賦與萬物言之謂之命以人物之稟受於天言之謂之性其實所從言之地頭不同耳鬼神者造化之迹也乾文言傳之問鬼神者造化迹朱子曰風雨霜露四時代謝又問此是迹可得而見又曰視之不見聽之不聞何也曰說道無又有說道有又無物之生成非鬼神而何然又去那裏討鬼神氣如日月星辰風雷皆造化之迹天地之間只是此一耳來者為神徃者為鬼理問伯有為厲此豈亦造化之迹乎曰皆是也若論正則似樹上忽生出花葉此便是造化之迹又如空中忽有雷霆風雨皆是也但人所常見故不之怪造化之妙不可得而見於其氣之徃來屈伸者足以見之微鬼神則造化無迹矣剝之為卦諸陽消剝已盡獨有上九一爻尚存如碩大之果不見食将有復生之理上九亦變則純隂矣然陽無可盡之理變於上則生於下無間可容息也聖人發明此理以見陽與君子之道不可亡也或曰剝盡則為純坤豈復有陽乎曰以卦配月則坤當十月以氣消息言則陽剝為坤陽來為復陽未嘗盡也剝盡於上則復生於下矣故十月謂之陽月恐疑其無陽也隂亦然聖人不言耳爾雅十月為陽經問剝復相因畢竟須由坤坤卦純隂無陽如此陽有斷滅朱子曰凡隂陽之生一爻當一月須是滿三十日方滿得那腔子做得一畫成坤卦非是無陽陽始生甚微未滿那腔子做一畫未成然此亦不是甚深奥事但伊川當時不曽分明道與人故令人做一件大事看月陽無可盡之理伊川說得甚精且以卦配月則剝九坤十月復十一月剥一陽尚存後一陽已生坤純隂陽氣闕了三十日安得謂之無盡嘗細推之這一陽不是恁地生出纔立冬便萌芽上而剥一分下面便萌芽一分上面剥二分下面便萌芽二分積累到那復處方成一陽消時亦如此但伊川說欠㡬句漸漸消長之意問冬至子之半如何是一陽方生曰冬至方是結算那一陽冬至以後又漸生成二陽過一月却成臨卦月復之一陽不是頓然便生乃是自坤卦中積來且一三十日以復之一陽分作三十分從小雪後便一日生一分上面趲得一分下面便生一分到十一月半一陽始生也以此便見天地無休息處黄天運流行本無一息間斷豈解一月無陽且如木之落時萌芽已生了不特如此木之冬青者必先萌芽而後舊葉方落若論變時天地無時不變不惟月變日變而時亦有變但人不覺耳隂亦然以夬乾始推之亦可見但聖人所以不言者這便是一箇參贊裁成之道蓋抑隂而進陽長善而消惡用君子而退小人此理自是恁地雖堯舜之世豈無小人但有聖人壓在上面不容他出而有為耳一陽復於下乃天地生物之心也先儒皆以静為見天地之心蓋不知動之端乃天地之心也非知道者孰能識之朱子曰天地以生物為心者也雖氣有闔闢物有盈虚而天地之心則亙古亙今未始有毫釐之間㫁也故陽極於外而復生於内聖人以為於此可以見天地之心焉葢其復者氣也其所以復者則有自來矣向非天地之心生生不息則陽之極也一絶而不復續矣尚何以復生於内而為闔闢之無窮乎此則動之端者乃一陽之所以動非指夫一陽之已動者而言之也心問伊川以動之端為天地之心曰動亦不是天地之只是見天地之心如十月豈得無天地之心天地之心流行自若元亨利貞貞是結實歸宿處若無這歸宿處便也無這元了惟有這歸宿處元又從此起如此循環無窮十月萬物收斂寂無踪跡到一陽動處生物之心始可見十月陽氣收斂天地生物之心固未嘗息但無端倪可見惟一陽動則生意始發露出乃始可見端緒也言動之頭緒於此處起於此處方見天地之心也動不直下動字却云動之端雖動而物未生未到大段處凡發生萬物都從這裏起豈不是天地之心仁者天下之公善之本也復六二傳川朱子曰伊此說說得渾淪開闊無病曰此說固好然說得太渾淪只恐人理㑹不得葉氏仁者以天地萬物為一體故曰天下之公四端萬善皆統乎仁故曰善之本有感必有應凡有動皆為感感則必有應所應復為感所感復有應所以不已也感通之理知道者黙而觀之可也咸九四傳間朱子曰凡在天地無非感應之理造化與人事皆是如雨便感得暘來晹已是應又感得雨來寒暑晝夜無非此理如父慈則感得子孝子孝則感得父愈慈其理亦只一般事因這一件事又生出一件事便是感與應因第二件又生出第三件事第二件事又是感第三件事又是應在問感應之理於學者工夫有用處否曰此理無乎不如何學者用不得精義入神以致用也利用安身以崇徳也亦是這道理天下之理終而復始所以恆而不窮恆非一定之謂也一定則不能恆矣惟随時變易乃恆道也天地常久之道天下常久之理非知道者孰能識之恆彖傳夜朱子曰恆非一定之謂故晝則必夜而復晝寒則必暑暑而復寒若一定則不能常也其在人冬日則飲湯夏日則飲水可以仕則仕可以止則止今日道合則從明日不合則去皆随時變易故可以為常也分所謂不易者亦須有以變通乃能不窮如君尊臣卑固不易然上下不交也不得父子固是親親然所謂命士以上父子異宫則又有變焉惟其如此所以為恆論其體則終是恆然體之常所以為用之變用之變乃所以為體之常亦能常而後能變能常而不已所以能變及其變也常只在其中伊川却說變而後能常非是人性本善有不可革者何也曰語其性則皆善也語其才則有下愚之不移所謂下愚有二焉自暴也自棄也人苟以善自治則無不可移者雖昬愚之至皆可以漸磨而進惟自暴者拒之以不信自棄者絶之以不為雖聖人與居不能化而入也仲尼之所謂下愚也然天下自棄自暴者非必皆昬愚也徃徃强戾而才力有過人者商辛是也聖人以其自絶於善謂之下愚然考其歸則誠愚也既曰下愚其能革面何也曰心雖絶於善道其畏威而寡罪則與人同也惟其有與人同所以知其非性之罪也革上六傳下問語其才則有愚之不移孟子非天之降才爾殊語意不同朱子曰孟子之說自是與程子之說小異孟子只見得是性善便把才都做善看不知氣稟各不同如后稷岐嶷越椒知其必滅若敖是氣稟如此須說到氣稟方得程子說得較密身言非禮義以禮義為非而拒之以不信自賊害也吾不能居仁由義自謂不能而絶之以不為自棄絶也成自暴者剛惡之所為自棄者柔惡之所為本習與性而至於相逺則固有不可移之理然人性善雖至惡之人一日而能從善則為一日之善人夫豈有終不可移之理當從伊川之說所謂雖强戾如商辛亦有可移之理是也如孔子說不移便定是不移了人之氣質實有如此者何必說變得所以謂之下愚而其所以至此下愚者便是氣質之性伊川却只說得七分不說到底孟子却只說得性善其所言地頭各自不同如堯舜之不可為桀紂桀紂之不可為堯舜夫子說底只是如此伊川却又推其說須知異而不害其為同以聖人之言觀之則曰不移而已不曰不可移也以程子之言考之則以其不肯移而後不可移耳蓋聖人之言本皆以氣質之稟而言其品第未及乎不肯不可之辨也程子之言則以人責其不可移也而徐究其本焉則以其稟賦甚異而不肯移非以其稟賦之異而不能移也葉氏曰史記稱紂資辯㨗敏材力過人手格猛獸知足以拒諌言足以飾非則其人資固非昬愚者然其勇於為惡而自絶於善要其終真下愚耳在物為理處物為義艮彖傳物朱子曰凡物皆有理理不外乎事之間是非可否處之得宜所謂義也合理是在此物上便有此理義是於此物上自家處置如此便是義便有箇區處如這棹子於理可以安頓事物我便把他如此用便是義義揚雄言義以宜之韓愈言行而宜之之謂義若只以為宜則義有在外意須如程子言處物為義則是處物者在心而非外也事之宜雖若在外然所以制其宜則在心程子曰處物為義非此一句則後人恐未免有義外之見矣動静無端隂陽無始非知道者孰能識之朱子曰動静無端隂陽無始說道有有無底在前說道無有有底在前是箇循環物事而動之前有静静之前又有動推而上之其始無端推下之以至未來之際其卒無終如云太極動而生陽不成動以前便無静程子曰動静無端蓋此亦是且自那動處說起若論著動以前又有静静以前又有動長仁為四端之首而智則能成終成始猶元雖四德之然元不生於元而生於貞蓋天地之化不翕聚則不能發散理固然也仁智交際之間乃萬化之機軸此理循環不窮總合無間程子所謂動静無端隂陽無始者此也端動静無端隂陽無始看來只是一箇實理動静無隂陽無始天道也始於陽成於隂本於静流於動人道也然陽復本於隂静復根於動其動静亦無端其隂陽亦無始則人蓋未始離乎天而天亦未始離乎人也經說下同仁者天下之正理失正理則無序而不和朱子曰仁者天下之正理只是汎說不是以此說仁體此說太寛如義亦可謂天下之正理禮亦可謂天下之正理人程子說得自好只是太寛須是說仁者本心之全徳若本然天下之良心存而不失則所作為自有序而和若此心一放只是人欲私心做出來安得有序安得有和永按此釋人而不仁如禮何人而不仁如樂何也明道先生曰天地生物各無不足之理常思天下君臣父子兄弟夫婦有多少不盡分處葉氏曰分者天理當然之則天之生物理無虧欠而人之處物每不盡理如君臣父子兄弟夫婦一毫不盡其心不當乎理是為不盡分故君子貴精察而力行之也遺書下同忠信所以進德終日乾乾君子當終日對越在天也蓋上天之載無聲無臭其體則謂之易其理則謂之道其用則謂之神其命於人則謂之性率性則謂之道修道則謂之教孟子去其中又發揮出浩然之氣可謂盡矣故說神如在其上如在其左右大事小事而只曰誠之不可揜如此夫徹上徹下不過如此形而上為道形而下為器須著如此說器亦道道亦器但得道在不繫今與後已與人朱子曰此是因解乾字遂推言許多名字只是一理而各有分别雖各有分别又却只是一箇實理誠者實理之謂也此一段只是解箇終日乾乾在天之剛健者便是天之乾在人之剛健者便是人之乾其體則謂之易便是横渠所謂坱然太虚升降飛揚未嘗止息者自此而下雖有許多般要之形而上者謂之道形而下者謂之器皆是實理以時節分段言之便有古今以血氣支體言之便有人已却只是箇理也此段只是解終日乾乾忠信進德修辭立誠便無間斷便是終日乾乾不必更說終日對越在天下面說上天之載云云便是說許多事都只是一箇天雖此只是解終日乾乾故說此一段從上天之載說起是無聲無臭其闔闢變化之體則謂之易然所以能闔闢變化之理則謂之道其功用著見處則謂之神此皆就天上說及說到性道教是就人身上說上下說得如此子細都說了可謂盡矣故說神如在又皆是此理顯著之迹看甚事都離這箇事不得上而天地鬼神下而萬事萬物都不出此故曰徹上徹下不過如此形而上者無形無影是此理形而下者有情有狀是此器然有此器則有此理有此理則有此器未嘗相離却不是於形器之外别有所謂理亙古亙今萬事萬物皆只是這箇所以說但得道在不係今與後已與人易體是體質之體猶言骨子也易者隂陽錯綜交換代之謂如寒暑晝夜闔闢徃來天地之間隂陽交錯而實理流行蓋與道為體也寒暑晝夜闔闢徃來而實理流行其間非此則實理無所頓放故曰其體則謂之易言易為此理之體質也體字與實字相似是該體用而言如隂陽動静之類畢竟是隂為體陽為用静而動動而静是所以為易之體也就人身而言易猶心也道猶性也神猶情也易者變化錯綜如隂陽晝夜雷風水火反復流轉縱横經緯而不已也人心則語黙動静變化不測者是也言體則亦是形而下者其理則形而上者也闔易是隂陽屈伸随時變易大抵古今只是大闔闢小闢聖人便於六十四卦只以隂陽竒耦寫出來至於所以為隂陽為古今乃是此道理及至忽然生物如花木之類驀然而出花時都花實時都實生氣便發出來此便是神此一段皆是明道體無乎不在名雖不同只是一理發出是箇無始無終底意状北溪陳氏曰道不離乎器道只是器之理人事有形處都謂之器人事中之理便是道所以明道曰道亦器器亦道葉氏曰大小猶多少也不繫猶不拘也醫書言手足痿痺為不仁此言最善名狀仁者以天地萬物為一體莫非已也認得為已何所不至若不有諸已自不與已相干如手足不仁氣已不貫皆不屬已故博施濟衆乃聖之功用仁至難言故止曰已欲立而立人已欲達而達人能近取譬可謂仁之方也已欲令如是觀仁可以得仁之體問遺書中取醫家言仁又一段云醫家以不識痛癢為不仁又以不知覺不能義理為不仁又却從知覺上說朱子曰覺是覺於理問與上蔡說同異曰異上蔡說覺纔是此心耳問仁者以天地萬物為一體此即人物初生時騐之可見人物均受天地之氣而生所以同一體如人兄弟異形而皆出父母胞胎所以皆當愛曰不須問他從初時只今便是一體猶之水江河池沼皆是此水如以兩椀盛得水來不必尋討這一椀是那裏酌來那一椀是那裏酌來既都是水便是同體如說人與物均受此氣均受此理所以皆當愛便是不如此愛字不在同體上說他那物事自是愛不是同體了方愛惟其同體所以無所不愛所以愛者以其有此心也所以無所不愛者以其同體也仁者以天地萬物為一體說得太深無捉摸處易傳偏言專言又云仁者天下之公此兩處說得極平實學者當精看此等處認得為已何所不至認得箇什麽夫仁者已欲立便立人已欲達便達人此即仁之體也能近取譬則是推已之恕故曰可謂仁之方欲令如是觀仁可以得仁之體這處却好看仁程氣已不貫血脈都在這氣字上問博施濟衆一段子全做仁之體先生却分别箇體用便有用力處曰某說非破程子之說程子之說却兼得某說程說似渾淪一箇屋子某說如屋下分間架爾子問集註以上一截說仁之體下一截說仁之術而程乃合而言曰程子合而言之上下句似不相應不若分作兩截看然惟其仁者之心如此故求仁之術必如此也問於此可以得仁之體是此處見得人與已相闗甚切便是生意相貫處否曰亦是只無私意理便流通然此處也是已對人說便恁地若只就自己說此又使不得蓋此是仁之發出處若未發之前只一念之私便是不仁葉氏曰天地萬物與我同體心無私蔽則自然愛而公矣所謂仁也苟是理不明而為私意所隔截則形骸爾汝之分了無交涉譬如手足痿痺氣不相貫疾痛疴癢皆不相闗此四體之不仁也生之謂性性即氣氣即性生之謂也朱子曰天之付與萬物者謂之命物之禀受於天者謂之性然天命流行必二氣五行交感凝聚然後能生物也性命形而上者也氣則形而下者也形而上者一理渾然無有不善形而下者則紛紜雜揉善惡有所分矣故人物既生則即此所稟以生之氣而天命之性存焉此程子所以發明告子生之謂性之說而以性即氣氣即性者言之也原此章内性字有指其堕在氣質中者而言有指其本至善者而言須且分别此一宇令分明不差方可子細逐項消詳生之謂性一條難說須子細看此條程子說得亦未盡生之謂性是生下來喚做性底便有氣稟夾雜便不是理底性了問性即氣氣即性此言人生性與氣混合者曰有此氣為人即理具於身方可謂之性未性即氣氣即性這且是滚說性便是理氣便是氣是分别說其實理無氣亦無所附是問告子之言若果如程先生之說亦無害而渠意直指氣為性與程子之意不同曰程子之言亦是認告子語脈小差果如此說則孟子何必排之則知其發端固非矣人生氣稟理有善惡然不是性中元有此兩物相對而生也有自幼而善有自幼而惡本註后稷之克岐克嶷子越椒始生人知其必滅若敖氏之類是氣稟有然也善固性也然惡亦不可不謂之性也朱子曰所稟之氣所以必有善惡之殊者亦性之理也蓋氣之流行性為之主以其氣之或純或駁而善惡分焉故非性中本有二物相對也然氣之惡者其性亦無不善故惡亦不可不謂之性也先生又曰善惡皆天理謂之惡者本非惡但或過或不及便如此蓋天下無性外之物本皆善而流於惡耳人生氣裏理有善惡此理字不是說實理猶云理當如此只作合字看言不是兩物相對而生蓋言性善也問既言性善下却善固性也然惡亦不可不謂之性却是言氣稟之性似與上文不接曰不是言氣稟之性蓋言性本善而今乃惡亦是此性為惡所汨正如水為泥沙所混不成不喚做水性問惡專是氣稟不干性事如何說惡亦不可不謂之曰既是氣稟惡便也牽引得那性不好蓋性只是搭附在氣稟上所以謂濁亦不可不謂之水他原頭處都是善因氣稟偏這性便偏了如人渾身都是惻隠而無羞惡都羞惡而無惻隠這便是惡徳這喚做性邪不是如墨子之心本是惻隠孟子推其弊到無父處這便是惡亦不可不謂之性也問惡亦不可不謂之性疑與孟子牴牾曰這般處難說乍卒理㑹未得某初看亦自疑但看來看去自是分明今定是不錯只著工夫子細看蓋生之謂性人生而静以上不容說才說性時便已不是性也凡人說性只是說繼之者善也孟子言性善是也夫所謂繼之者善也者猶水流而就下也朱子曰性則理而已矣何言語之可形容哉故善言性者不過即其發見之端而言之而性之韞固可黙識矣如孟子之論四端是也觀水之流而必下則水之性下可知觀性之發而必善則性之韞善亦可知也周子言無極而太極程子又言人生而静以上不容說蓋聖賢論性無不因心而發若欲專言之則是所謂無極而不容言者亦無體段之可名矣真人生而静只是性之未發但於此可見天性之全非以静状性也人生而静是未發時以上即是人物未生之時不可謂性才謂之性便是人生以後此理堕在形氣之中不是性之本體矣然其本體又未嘗外此要人即此而見得其不雜於此者耳又静者固其性然只生字便帯却氣質了但生字以上不容說蓋此道理未有形見處故才說性便須帯著氣質無能懸空說得性者人生而静以上天命之本體也人物未生時只可謂之理說性未得子人生而静以上只說箇天道下性字未得所以云夫之言性與天道便是如此所謂天命之謂性者是說人身中指出這箇是天命之性不雜氣稟者而言爾人有此形氣此理始具於形氣之中而謂之性才是說性便已涉乎有生而兼乎氣質不得為性之本體然性之本體亦未嘗雜要人就此上面見得本體元未嘗離亦未嘗雜耳便程先生說性有本然之性有氣質之性人具此形體是氣質之性才說性此性字是雜氣質與本來性說便已不是性此性字是本然之性才說氣質底便不是本然底人生而静以下方有形體可說繼如說善即是有性了方說得善凡人說性只是說之者善也便兼氣質了問恐是兼了情曰情便兼質了明這繼字主於人之發用處言之易說天命流行處道却将來就人發處說孟子言性善亦是就發處說因其發處之善是以知其本無不善猶循流而知其源也易以天命言程子就人言蓋人便是一箇小天地耳之孟子說性便是從中間幹出好底說故謂之善性在人猶水之在山其清不可得而見流出而見其清然後知其本清也所以孟子只就見孺子入井皆有怵惕惻隠之心處指以示人使知性之本善也易謂繼之者善在性之先此所引在性之後天道流行如此所以人性發見亦如此彼問易與孟子就天人分上各以流出處言明道則假以明此耳曰然問繼之者善易與孟子之說異曰明道先生之言髙逺閎闊不拘本文正意如此處多若執其方而論則所不可通者不但此句而已不容說處即性之本體如水則只是水别著一字不得至謂之善則性之發如水之下矣皆水也有流而至海終無所汙此何煩人力之為也有流而未逺固已漸濁有出而甚逺方有所濁有濁之多者有濁之少者清濁雖不同然不可以濁者不為水也如此則人不可以不加澄治之功故用力敏勇則疾清用力緩怠則遲清及其清也則却只是元初水也不是将清來換却濁亦不是取出濁來置在一隅也水之清則性善之謂也故不是善與惡在性中為兩物相對各自出來朱子曰此又以水之清濁譬之水之清者性之善也流而至海不汚者氣稟清明自幼而善聖人性之而全其天者也流未逺而已濁者氣稟偏駁之甚自幼而惡者也流既逺而方濁者長而見異物而遷焉失其赤子之心者也濁有多少氣之昬明純駁有淺㴱也不可以濁者不為水惡亦不可不謂之性也然則人雖為氣所昬流於不善而性未嘗不在其中特謂之性則非其本然謂之非性則初不離是以其如此故人不可以不加澄治之功惟能學以勝氣則知此性渾然初未嘗壊所謂元初水也雖濁而清者存故非将清來換濁既清則本無濁故非取濁置一隅也如此則其本善而已矣性中豈有兩物對立而竝行也哉此段引譬喻亦叢雜如說水流而就下了又說從清濁去與就下不相續這處只認得大意可也其言水之下與水之清亦是兩意須細分别裏猶水流而就下也這下更欠言語須為他作文補這始得蓋水之就下是喻性之善如孟子所謂過顙在山雖不是順水之性然不謂之水不得這便是前面惡亦不可不謂之性之說到得說水之清却依舊是譬喻否問先生嘗云性不可以物譬明道以水喻性還有病曰若比來比去也終有病只是不以這箇比又不能得分曉定問水流就下以後是說氣稟否若說氣稟則生下已安得有逺近之别曰此是夾襍說問以水譬性天道純然一理便是水本來清隂陽五行交錯雜揉而有昬濁便是水被泥汚了昬濁可以復清者只因他母子清曰然那下愚不移底人却是那臭穢底水問也須可以澄治曰也減得些分數舊時人装惠山泉去京師或時臭了京師人㑹洗水将沙石在筧中上面傾水從筧中下去如此數十番便漸如故問下愚恐他自不肯去澄治曰那水雖臭想也未至汚穢問物更推不去却似那臭泥曰是如此問此一節是說人變化氣質然變了氣質復還本然之性亦不是在外面添得曰是如此生之謂性一段當作三節看有言天命者有言氣質者生之謂性是一節水流就下是一節清濁又是一節横渠云形而後有氣質之性善反之則天地之性存焉将此兩箇性字分别自生之謂性以下凡說性字者孰為天地之性孰為氣質之性則其理自明矣此理天命也順而循之則道也循此而修之各得其分則教也自天命以至於教我無加損焉此舜有天下而不與焉者也朱子曰此理天命也該始終本末而言也修道雖以人事而言然其所以修者莫非天命之本然非人私智所能為也然非聖人有不能故以舜明之問此理天命也這處方提起以此理說則是純指上面天理而言不雜氣說曰固是又曰理離氣不得而今講學用心著力却是用這氣去尋箇道理所引舜事非論語本文之意觀天地生物氣象本註周茂叔看生問程子觀天地物氣象朱子曰他也只是偶然見如此便說出來示人而今不成只管去守看生物氣象萬物之生意最可觀此元者善之長也斯所謂仁也朱子曰物之初生其本未逺固好看及幹成葉茂便不好看如赤子入井時怵惕惻隠之心只些子仁得見時却好看到得發政施仁其仁固廣便看不見得何處是仁夏仁是箇和柔底物事譬如物之初生自較和柔及至間長茂方始稍堅硬秋則收結成實冬則斂藏然四時生氣無不該貫如程子說生意處非是說以生物皆能發動死物則不能如穀種蒸殺則不能生也際萬物之生天命流行自始至終無非此理但初生之淳粹未散尤易見耳如元亨利貞皆是善而元則為善之長亨利貞皆是那裏來仁義禮智亦皆善也而仁則為萬善之首義禮智皆從這裏出爾滿腔子是惻隠之心朱子曰惻傷之切隠痛之深所謂不忍人之心也來腔子猶言軀殻是俗語滿腔子只是言充塞周徧本如此此就人身上指出此理充塞處最為親切若於此見得即萬物一體更無内外之分出滿這箇軀殻都是惻隠之心纔觸著便是這箇物事來大感則大應小感則小應恰似大段痛傷固是痛只如針子畧挑些血出也便痛故日用所當應接更無些子間隔癢疴疾痛莫不相闗纔是有些子不通便是被些私意隔了問心所發者不一便說惻隠如何曰惻隠之心渾身皆是無處不發如見赤子有惻隠之心見一蟻子亦豈無此心問此莫是人生惻隠之心具足否曰如今也恁地看事有箇不穏當處便自覺不穏這便是惻隠之心問處事物亦然否曰此心應物不窮若事事物物常是這箇心便是仁若有一事不如此便是不仁了遜不特是惻隠之心滿腔子是羞惡之心滿腔子是辭之心滿腔子是是非之心彌滿充實都無空闕處天地萬物之理無獨必有對皆自然而然非有安排也每中夜以思不知手之舞之足之蹈之也朱子曰東西上下寒暑晝夜生死皆是相反而相對天地間物未嘗無相對者看得來真箇好笑皆問對是物也理安得有對曰如髙下小大清濁之類是有髙必有下有大必有小皆是理必當如此如天之生物不能獨隂必有陽不能獨陽必有隂皆是對所以有對者是理合當恁地問太極便對甚底曰太極使與隂陽相對此是形而上者謂之道形而下者謂之器便對過却是横對了如土便與金木水火相對蓋金木水火是有方所土却無方所亦對得過四物皆資土故也湖南學者云善無對不知惡乃善之對惡者反乎善者也自一便對二形而上便對形而下然就一言之一中又有對且如眼前一物便有背面上下内外二又各自為對雖說無獨必有對然獨中又自有對如碁盤末梢中間只空一路若似無對然此一路對了三百六十路此所謂一對萬道對器也一程子謂道無對子嘗與人論此而問之曰棋局之中路者孰為對乎其人曰是所以對夫三百六十路者云爾其言深有㑹於予意如此則程子之意可以推之而無窮矣出天下之獨未嘗無對然又却只是一箇道理如人行處是這脚歸亦是這脚譬如口中之氣嘘則為温吸則為寒耳中者天下之大本天地之間亭亭當當直上直下之正理出則不是惟敬而無失最盡朱子曰亭亭當當此俗語也蓋不偏不倚直上直下之意也此亭亭當當直上直下皆是形容中之在我其體段如出則不是者出便是已發發而中節只可謂之和不可謂之中矣敬而無失只是常敬便是喜怒哀樂未發之中也伊川先生曰公則一私則萬殊人心不同如面只是私心永按義理之正人心所同故公則一凡物有本末不可分本末為兩段事灑埽應對是其然必有所以然問其然所以然之說朱子曰灑埽應對之事其然也形而下者也灑埽應對之理所以然也形而上者也自形而下者而言則灑埽應對之理精義入神本末精粗不可同日而語矣自夫形而上者言之則初未嘗以其事之不同而有餘於此不足於彼也曰物有本末而本末不可分者何也曰有本末者其然之事也不可分者以其悉具所以然之理也須是就事上理㑹道理非事何以識理灑埽應對末也精義入神本也不可說這箇是末不足理㑹只理㑹那本又不可說這末便是本但學其末則本便在此也治問所以然者是如何曰若無誠意如何灑埽應對心修身是本灑埽應對是末皆其然之事也至於所以然則理也理無精粗本末皆是一貫楊子拔一毛不為墨子又摩頂放踵為之此皆是不得中至如子莫執中欲執此二者之中不知怎麽執得識得則事事物物上皆天然有箇中在那上不待人安排也安排著便不中矣朱子曰子莫執中正是安排尋討問時中如何曰中字最難識須是黙識心通且試言一㕔則中央為中一家則㕔中非中而堂為中言一國則堂非中而國之中為中推此類可見矣如三過其門不入在禹稷之世為中若居陋巷則非中也居陋巷在顔子之時為中若三過其門不入則非中也朱子曰居陋巷則似楊氏三過其門不入則似墨氏要之禹稷似兼愛而非兼愛顔子似為我而非為我旡妄之謂誠不欺其次矣本註李邦直云不欺之謂誠便以不欺為誠徐仲車云不息之謂誠中庸言至誠無息非以無息解誠也或以問先生先生曰云云朱子曰无妄者聖人也謂聖人為旡妄則可謂聖人為不欺則不可問此所謂誠者天之道思誠者人之道曰然无妄是自然之誠不欺是著力去做底得非无妄故能誠无妄便是誠無妄是四方八面都去不欺猶是兩箇物事相對邉无妄兼天地萬物所同得底渾淪道理不欺是就一說問不欺是就人身說否曰然无妄自是我无妄故誠不欺者對物而言之故次之沖漠無朕萬象森然已具未應不是先已應不是後如百尺之木自根本至枝葉皆是一貫不可道上面一段事無形無兆却待人旋安排引入來教入塗轍既是塗轍却只是一箇塗轍朱子曰此一段只是說無極而太極君此言未有這事先有這理如未有君臣父子已先有臣父子之理不成元無此理直待有君臣父子却旋将道理入在裏面只未應是未應此事已應是已應此事未應固在先却是後來事已應固是後却只是未應時理塗未有事物之時此理已具少間應處只是此理所謂轍即是所由之路如父之慈子之孝只是一條路從源頭下來轍既是塗轍却只是一箇塗轍如既有君君臣臣底塗却只是元君臣之理也様是這一箇事便只是這一箇道理精粗一貫元無兩今人只見得前面一段事無形無兆将謂是空蕩蕩却不知道沖漠無朕萬象森然已具如釋氏便只說空老氏便只說無却不知道莫實於理既是塗轍却只是一箇塗轍恐是記者欠了字近取諸身百理皆具屈伸徃來之義只於鼻息之間見之屈伸徃來只是理不必将既屈之氣復為方伸之氣生生之理自然不息如復卦言七日來復其間元不㫁續陽已復生物極必返其理須如此有生便有死有始便有終問屈伸徃來氣也程子云只是理何也朱子曰其所以屈伸徃來者是理必如此一隂一陽之謂道隂陽氣也其所以一隂一陽循環而不已乃道也氣須有屈伸要之方伸之氣自非既屈之氣氣雖屈而物亦自一面生出此所謂生生之理自然不息也此段為横渠形潰反原之說而發也生果齋李氏曰徃而屈者其氣已散來而伸者其氣方生生之理自然不窮若以既屈之氣復為方伸之氣則是天地間只有許多氣來來去去造化之理不㡬於窮乎釋氏不明乎此所以有輪回之說間永按程子破張子形潰反原之說固為正論而人物有投生者又别有理理固有常有變也但學者不可以此溺其心爾明道先生曰天地之間只有一箇感與應而已更有甚事朱子曰隂陽之變化萬物之生成情偽之相通事為之終始一為感則一為應循環相代所以不已也則事事物物皆有感應寤寐語黙動静亦然譬如氣聚風止風止則氣復聚是問感只是内感曰不専内感固有自外感者問仁伊川先生曰此在諸公自思之将聖賢所言仁處類聚觀之體認出來孟子曰惻隠之心仁也後人遂以愛為仁愛自是情仁自是性豈可專以愛為仁孟子言惻隠之心仁之端也既曰仁之端則不可便謂之仁退之言博愛之謂仁非也仁者固博愛然便以博愛為仁則不可朱子曰不可便以愛為仁此正謂不可認情為性耳非謂仁之性不發於愛之情而愛之情不本於仁之性也仁便是愛之體愛便是仁之用仁離愛不得上蔡諸公不把愛做仁他見伊川言博愛非仁也伊川也不是道愛不是仁若當初有人㑹問必說道愛是仁之情仁是愛之性如此方分曉問仁與心何異曰心譬如榖種生之性便是仁陽氣發處乃情耳朱子曰心性以穀種論則包裏底是心有秋種有粳種随那種發出不同這便是性心是箇發出底他只㑹生又如服藥喫了㑹治病此是藥力或温或涼便是藥性至於喫了有温證涼證這便是情生以穀種譬之一粒穀春發生夏成苗秋結實冬收藏意依舊包在裏面每箇穀子裏有一箇生意種而後生穀種之喻甚善若有這種種在這裏何患生理不存問仁者生之理而動之機曰這自是難說若要見得分明只看程先生說心譬如穀種生之性便是仁便分明若更要真實識得仁之體只看夫子說克已復理克去已私如何便喚仁曰若如此看則程子所謂公字愈覺親切曰公也只是仁底殻子盡他未得在畢竟裏面是箇甚物事生之性也只是状得仁之體生之性便是愛之理義訓宜禮訓别智訓知仁當何訓說者謂訓覺訓人皆非也當合孔孟言仁處大槩研窮之二三歲得之未晩也問仁當何訓朱子曰不必須用一字訓但要識得大意通透覺決不可以言仁雖足以知仁自屬智了覺仁是愛之體覺自是智之用仁統四德故仁則無不然便以覺為仁則不可永按中庸以人訓仁猶之以宜訓義古人訓字多用諧聲苟識得大意則人字未嘗不可訓要之仁字之義朱子心之徳愛之理二言盡之矣性即理也天下之理原其所自未有不善喜怒哀樂未發何嘗不善發而中節則無徃而不善凡言善惡皆先善而後惡言吉凶皆先吉而後凶言是非皆先是而後非本註易傳曰成而後有敗敗非先成者也得而後有失非得何以有失也朱子曰性即理也在心喚做性在事喚做理如性即理也自孔孟後無人見得到此亦自古無人敢此道性即理也四字攧撲不破實自已身上見得出來一性即理也一語直是自孔子後惟是伊川說得盡這句便是千萬世說性根基之問所謂理者仁義禮智是也不知是否曰四者固性綱維然其中無所不包更詳味之所未發之前氣不用事以有善而無惡問心有善惡否曰在天為命在義為理在人為性主於身為心其實一也心本善發於思慮則有善有不善若既發則可謂之情不可謂之心譬如水只可謂之水至如流而為派或行於東或行於西却謂之流也朱子曰疑此段微有未穩處蓋凡事莫非心之所為雖放僻邪侈亦是心之為也善惡但如反覆手耳翻一轉便是惡只安頓不著也便是不善如當惻隱而羞惡便不是問心之用雖有不善亦不可謂之非心否曰然出問看來不善之發有二有自思慮上不知不覺自發來者有因外誘然後引動此思慮者曰謂發處有兩端固是然畢竟從思慮發者也只在外來底天理渾是一箇只不善便是不從天理出來便是出外底了交問思慮從心生心若善思慮因何有不善曰思慮以物而蔽故有不善問既發則可謂之情不可謂之心如何曰心是貫徹上下不可只於一處看既發則可謂之情不可謂之心此句亦未穩又曰是亦記者之誤之既發不可不謂之心但有不善則非心本體性出於天才出於氣氣清則才清氣濁則才濁才則有善有不善性則無不善朱子曰程子此說才字與孟子本文小異蓋孟子専指其發於性者言之故以為才無不善程氏專指其發於氣者言之則人之才固有昬明强弱之不同矣張子所謂氣質之性是也二說雖殊各有所當然以事理考之程氏為密蓋氣質所稟雖有不善而不害性之本善性雖本善而不可以無省察矯揉之功學者所當深玩也於孟子論才是本然者不如程子之備曰然則才亦禀天乎曰皆天所為但理與氣分為兩路又問程子謂才稟於氣如何曰氣亦天也問性之所以無不善者以其出於天也才之所以有善有不善以其出於氣也要之性出於天氣亦出於天何故便至於此曰性是形而上者氣是形而下者形而上者全是天理形而下者只是渣滓至於形又是渣滓至濁者也一般能為謂之才才之初亦無不善縁他氣稟有善惡故才亦有善惡孟子自其同者言之故以為出於性程子自其異者言之故以為稟於氣要之須兼是二者言之方備只縁孟子不曽說到氣上覺得此段說話無結殺故有後來荀揚韓許多議論氣質之性古人雖不曽說考之經典却有此意如書云惟人萬物之靈亶聰明作元后與夫天乃錫王勇知之說皆此意也孔子謂性相近習相逺孟子辯告子生之謂性亦是說氣質之性近世被濂溪拈綴出來横渠二程始有氣質之說此伊川論才所以云有善有不善者蓋主此而言也氣稟之殊其類不一非但清濁二字而已今人有聰明通達事事曉了者其氣清矣而所為或未必皆中於理則是其氣之不醇也人有謹厚忠信事事平穏者其氣醇矣而所知未必皆達於理則是其氣之不清也推此類以求之才自見矣性者自然完具信只是有此者也故四端不言信問四端不言信朱子曰如惻隠真箇惻隱羞惡真箇羞惡此便是信曰此却是已發時方有這信曰其中真箇有此理信是箇真實無妄底道理如仁義禮智皆真實而無妄故信字更不須說五信是誠實此四者實有是仁實有是義禮智皆然如行之有土非土不足以載四者又如土於四時各王十八日四端之信猶五行之土無定位無成名無専氣而水火金木無不待是以生者故土於四行無不在於四時則寄王焉其理亦猶是也五行非土不立而土無定位五常非信不有而信非一端故曰誠者物之終始不誠無物亦可以觀矣心生道也有是心斯具是形以生惻隠之心人之生道也朱子曰心生道也此句是張思叔所記疑有欠闕處問何故入在近思録中曰如何敢不載但只恐有闕文此四字說不盡心生道也謂天地以生物為心而人得之以為心者能天地生物之心是仁人之稟賦接得此天地之心方有生故惻隠之心在人亦為生道也得心生道也心乃生之道惻隱之心人之生道也乃是天之心以生生物便是天之心渾上而心生道也全然做天底也不得蓋理只是一箇然底人與天地混合無閒問生道者是本然也所以生者也曰是人為天地之心意天永按又有一條云有是心斯具是形以生是心乃屬地未屬在我疑非定說横渠先生曰氣坱然太虚升降飛揚未嘗止息此虚實動静之機隂陽剛柔之始浮而上者陽之清降而下者隂之濁其感遇聚結為風雨為霜雪萬品之流形山川之融結糟粕煨燼無非教也朱子曰氣坱然太虚升降飛揚未嘗止息此張子所謂虚空即氣也蓋天在四畔地居其中減得一尺地遂有一尺氣但人不見耳此是未成形者問虚實以隂陽言否曰以有無言及至浮而上降而下則已成形者若所謂山川之融結糟粕煨燼即是氣之渣滓要之皆是示人以理問升降飛揚所以生人物者未嘗止息但人不見耳言機言始莫是說理否曰此本只是說氣理自在其中一箇動一箇静便是機處無非教也教便是說理此等言語都是經鍛鍊底語須熟念細看如問氣坱然太虚此是言天地未判之時為復亘古今此曰只是統說只今便如此問升降者是隂陽之兩端飛揚者是游氣之紛擾否曰此只是說隂陽之兩端下文虚實動静二句此正是說隂陽之兩端到得為雨露霜雪流形融結却正是說游氣之紛擾者也問虚實動静兩句欲云虚實動静乘此氣以為機隂陽剛柔資此氣以為始可否曰此兩向只一般實與動便是陽虚與静便是隂但虚實動静是言其用隂陽剛柔是言其體而已問始字之義曰只是說如箇生物底母子相似萬物都從這裏生出去上文說升降飛揚便含這虚實動静兩句在裏而了所以虚實動静隂陽剛柔者便是這升降飛揚者為之非兩般也至浮而上者兩句便是例粗問無非教也都是道理在上面發見曰然精底都從底上發見道理都從氣上流行雖至粗底物無非是道理發見正蒙下同游氣紛擾合而成質者生人物之萬殊其隂陽兩端循環不已者立天地之大義問此段是說氣與理合朱子曰此段專是說氣未及言理生人物之萬殊言氣到此已是渣滓粗濁者去生人物立天地之大義此說氣之本上章亦是發明此意游游氣隂陽隂陽即氣也豈隂陽之外復有游氣所謂氣者指其所以賦與萬物一物各得一箇性命便有一箇形質此氣合而成之也雖是如此而所謂隂陽兩端成片段滚然出來者固自若也亦猶論太極物物皆有之而太極之體未嘗不存也晝夜運而無息者便是隂陽之兩端其散出紛擾者便是游氣以生人物之萬殊正如麵磨相似其四邉只管撒出正如天地之氣運轉無已只管生出人物其中有粗有細故人物有偏有正有精有粗循環不已者乾道變化也合而成質者各正性命也摩隂陽循環如磨游氣紛擾如磨中出者易曰隂陽相八卦相盪鼔之以雷霆潤之以風雨日月運行一寒一暑此隂陽之循環也乾道成男坤道成女此游氣之紛擾也游是散殊此如水車一上一下只管滚轉便是循環不已中間帯得水灌溉所在便是生人物之萬殊天地之間二氣只管渾轉不知不覺生出人物即他這箇幹轉便是生物時節扇游氣自裏而底如扇相似扇便是立天地之大義底出風來便是生人物底參游氣是氣之發散生物底氣游亦流行之意紛擾者錯不齊既生物便是游氣若是生物常運行而不息者二氣初無増損也指游氣隂陽固是一物横渠言游氣紛擾合而成質是隂陽交㑹言之隂陽兩端循環不已是指那分開底說徃横渠說得稍支離只合云隂陽五行循環錯綜升降來所以生人物之萬殊立天地之大義天體物不遺猶人體事而無不在也禮儀三百威儀三千無一物而非仁也昊天曰明及爾出王昊天曰旦及爾游衍無一物之不體也朱子曰此數句是從赤心片片說出來荀揚豈能到事體物猶言為物之體也蓋物物有箇天理體事謂事是仁做出來凡言體便是做他骨子本天體在物上仁體在事上猶言天體於物仁體於事是言物以天為體事以仁為體須著從上說故如此下語只體物猶言幹事事之幹也得問仁體事而無不在曰是未理㑹得仁字若理㑹這一字了則到處都理㑹得無禮儀三百威儀三千須得仁以為骨子徃來游衍非是理無一物之不體猶言無一物不将這箇做骨鬼神者二氣之良能也朱子曰徃來屈伸乃理之自然非有安排布置故曰良能能屈伸徃來是二氣自然能如此生問鬼神是功用良曰但以一屈一伸看一伸去便許多物事一屈來更無一物便是良能功用良伊川謂鬼神者造化之迹却不如横渠所謂二氣之能程子之說固好但渾淪在這衷張子之說分明便見有箇隂陽在物之初生氣日至而滋息物生既盈氣日反而游散至之謂神以其伸也反之謂鬼以其歸也朱子曰造化之妙不可得而見然其氣之徃來屈伸者足以見之微鬼神則造化無迹矣横渠物之初生一章尤說得分曉之問此息字是生息之息曰然横渠言至之謂神反謂鬼固是然雷風山澤亦有神今之廟貌亦謂之神亦以方伸之氣為言耳此處要錯綜周徧而觀之伸中有屈屈中有伸伸中有屈如人有魄是也屈中有伸如鬼而有靈是也天下萬事萬物只是箇隂陽消息屈伸横渠将屈伸說得貫通便人死便是鬼祖考來格是神性者萬物之一源非有我之得私也惟大人為能盡其道是故立必俱立知必周知愛必兼愛成不獨成彼自蔽塞而不知順吾性者則亦末如之何矣問性為萬物之一源朱子曰所謂性者人物之所同得非惟已有是而人亦有是非惟人有是而物亦有是也永按自蔽塞謂惟知有我之私一故神譬之人身四體皆一物故觸之而無不覺不待心使至此而後覺也此所謂感而遂通不行而至不疾而速也問一故神朱子曰一是一箇道理却有兩端用處不同譬如隂陽隂中有陽陽中有隂陽極生隂隂極又生陽所以神化無窮發於心達於氣天地與吾身共只是一團物事所謂鬼神者只是自家氣自家心下思慮才動這氣即敷於外自然有所感通當一故神横渠說得極好但近思録所載與本書不同時縁伯恭不肯全載故後來不曽與他添得一故神横渠親注云兩在故不測只是一物却周行乎事物之間如隂陽屈伸徃來上下以至於行乎什伯千萬之中無非這一箇物事所以謂兩在故不測兩故化注云推行乎一凡天下事一不能化惟兩而後能化雖是兩箇要之亦是推行乎此一耳說得極精須子細看横渠易說心統性情者也朱子曰心統性情語最精密語横渠此句乃不易之論孟子說心許多皆未有似此端的子細看便見其他諸子等書皆無依稀似此體心統性情二程却無一句似此切統猶兼也性是情是用性情皆出於心故心能統之統如統兵之統言有以主之也仁義禮智是性孟子曰仁義禮智根於心惻隠四端是情孟子曰惻隠之心云云以此見得心統性情一心之中自有動静静者性也動者情也性者心之理情者心之動心者性情之主許凡物有心而其中必虚人心亦然只這虚處便包藏多道理彌綸天地該括古今推廣得來蓋天蓋地莫不由此此所以為人心之妙與理在人心是之謂性性如心之田地充此中虚莫非是理而已心是神明之舍為一身之主宰性便是許多道理得之於天而具於心者發於智識念慮處皆是情故曰心統性情未先生取近思録心統性情之語示學者或問曰心之發則屬乎性既發則情也曰是此意舊看五峯說只将心對性說一箇情字都無下落後來看横渠心統性情之說乃知此話大有功始尋得箇情字着落與孟子說一般又曰古人制字亦先制得心字性與情皆從心凡物莫不有是性由通蔽開塞所以有人物之别由蔽有厚薄故有知愚之别塞者牢不可開厚者可以開而開之也難薄者開之也易開則達於天道與聖人一朱子曰此似欠了生知之聖此段不如吕與叔分别得分曉呂曰蔽有淺深故為昬明蔽有開塞故為人物問通蔽開塞横渠與呂芸閣說孰為親切曰與叔倒分明似横渠之說看來塞中也有通處如猿狙之性則靈猪則全然蠢了本乎天者親上本乎地者親下如人頭向上所以最靈草木頭向下所以最無知禽獸頭横所以無知猿狙稍靈為他頭有時也似人故稍向得上性問人物之性一源何以有異曰人之性論明暗物之只是偏塞暗者可使之明已偏塞者不可使之通横渠言凡物莫不有是性云云至薄者開之也易是也問人物皆稟天地之理以為性皆受天地之氣以為形若人品之不同固是氣有昬明厚薄之異若在物言之不知是所稟之理便有不全耶亦是縁氣稟之昬蔽故如此耶曰惟其所受之氣只有許多故其理亦只有許多又問物物具一太極則是理無不全曰謂之全亦可謂之偏亦可以理言之則無不全以氣言之則不能無偏故呂與叔謂物之性有近人之性者人之性有近物之性者全問氣質有不同則天命之性有偏全否曰亦非有偏謂如日月之光在露地盡見之若在蔀屋之下則有見有不見在人則蔽塞有可通之理至於禽獸亦是此性被他形體所拘蔽隔之甚無可通處至於虎狼之仁豺獺之祭蜂蟻之義却只通這些子譬如一隙之光至於獼猴形状類人便最靈於他物若昬愚之人便在人與禽獸之間所以終難改近思録集註卷一
